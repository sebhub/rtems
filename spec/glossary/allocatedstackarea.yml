term: allocated stack area
text: |
  The allocated stack area of a ${stack:/term} is the memory area which holds the
  ${stack:/term}. It is partitioned into the ${usedstackarea:/term}, the
  ${freestackarea:/term} and optionally the ${stackcheckerpatternarea:/term}.
type: glossary
