term: stack checker pattern area
text: |
  The stack checker pattern area of a ${stack:/term} is the end of the
  ${allocatedstackarea:/term} in the direction of stack growth. The stack checker
  writes a pattern to it. A stack checker pattern area which no longer holds the
  pattern indicates a stack overflow. The area exists only where the application
  configuration option ${/acfg/if/stack-checker-enabled:/name} is defined.
type: glossary
