term: proleptic Gregorian calendar
text: |
  The proleptic Gregorian calendar extends the Gregorian calendar to the dates
  before its introduction in 1582. A year divisible by four is a leap year,
  except a year divisible by 100 and not divisible by 400.
type: glossary
