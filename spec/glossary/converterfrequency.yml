term: converter frequency
text: |
  The frequency in Hz which the counter conversion directives assume for the
  ${/glossary/countertick:/plural}. The
  ${/rtems/counter/if/initialize-converter:/name} directive sets it. It can
  differ from the frequency of the ${/glossary/rtemscounter:/term}.
type: glossary
