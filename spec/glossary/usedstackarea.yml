term: used stack area
text: |
  The used stack area of a ${stack:/term} is the part of the
  ${allocatedstackarea:/term} from its begin to the current
  ${stackpointer:/term}. The begin is the end of the ${allocatedstackarea:/term}
  opposite to the direction of stack growth.
type: glossary
