term: free stack area
text: |
  The free stack area of a ${stack:/term} is the part of the
  ${allocatedstackarea:/term} from the current ${stackpointer:/term} to the end
  of the ${allocatedstackarea:/term} in the direction of stack growth. It
  excludes the ${stackcheckerpatternarea:/term}.
type: glossary
