links:
- role: requirement-refinement
  uid: validation
test-brief: |
  This validation test suite is used to validate the default value of application
  configuration options where all optional BSP provided settings are disabled.
  The maximum thread name size is one.
test-code: |
  const char rtems_test_name[] = "${.:/test-suite-name}";

  static void FatalExtension(
    rtems_fatal_source source,
    bool               always_set_to_false,
    rtems_fatal_code   code
  )
  {
    rtems_extensions_table bsp = BSP_INITIAL_EXTENSION;

    ( *bsp.fatal )( source, always_set_to_false, code );
  }

  static RTEMS_ALIGNED( RTEMS_TASK_STORAGE_ALIGNMENT ) char task_storage
    [ RTEMS_TASK_STORAGE_SIZE(
      TEST_MINIMUM_STACK_SIZE + 1024,
      RTEMS_FLOATING_POINT
    ) ];

  static bool task_storage_in_use;

  static void *AllocateTaskStack( size_t size )
  {
    if ( task_storage_in_use || size > sizeof( task_storage ) ) {
      return NULL;
    }

    task_storage_in_use = true;

    return task_storage;
  }

  static void FreeTaskStack( void *stack )
  {
    (void) stack;
    task_storage_in_use = false;
  }

  static void Init( rtems_task_argument arg )
  {
    (void) arg;
    RunTestSuite();
  }

  #define CONFIGURE_INITIAL_EXTENSIONS { .fatal = FatalExtension }

  #define CONFIGURE_DISABLE_BSP_SETTINGS

  #define CONFIGURE_IDLE_TASK_STORAGE_SIZE RTEMS_MINIMUM_STACK_SIZE

  #define CONFIGURE_MAXIMUM_TASKS 2

  #define CONFIGURE_TASK_STACK_ALLOCATOR_AVOIDS_WORK_SPACE

  #define CONFIGURE_TASK_STACK_ALLOCATOR AllocateTaskStack

  #define CONFIGURE_TASK_STACK_DEALLOCATOR FreeTaskStack

  #define CONFIGURE_MAXIMUM_SEMAPHORES 1

  #define CONFIGURE_MAXIMUM_THREAD_NAME_SIZE 1

  #define CONFIGURE_MAXIMUM_USER_EXTENSIONS 1

  #define CONFIGURE_RTEMS_INIT_TASKS_TABLE

  #define CONFIGURE_INIT_TASK_INITIAL_MODES RTEMS_DEFAULT_MODES

  #define CONFIGURE_INIT_TASK_CONSTRUCT_STORAGE_SIZE \
    RTEMS_TASK_STORAGE_SIZE( RTEMS_MINIMUM_STACK_SIZE, RTEMS_DEFAULT_ATTRIBUTES )

  #define CONFIGURE_INIT

  #include <rtems/confdefs.h>
test-description: null
test-includes:
- bsp.h
- rtems/test-support.h
test-local-includes:
- ts-acfg.h
test-target: testsuites/validation/ts-validation-acfg-1.c
type: test-suite
