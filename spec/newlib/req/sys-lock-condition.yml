rationale: |
  The system lock condition variables are used by the C++ standard library
  provided by ${/glossary/gcc:/term}, the C11 threads support, and the
  self-contained objects ${/glossary/api:/term} provided by RTEMS.
requirement-type: non-functional
text: |
  The super core shall have a component containing the system lock condition
  variable implementation those interfaces are defined by Newlib.
