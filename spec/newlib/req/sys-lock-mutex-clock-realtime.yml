requirement-type: functional
text: |
  While the timeout parameter specifies a valid absolute
  ${/glossary/clock-realtime:/term} time point, while the mutex is not available,
  if the ${/glossary/clock-realtime:/term} was at or past the specified time
  point during a ${/glossary/clock-tick:/term}, then the directive shall return
  with a ${/glossary/statuscode:/term} of ${/c/errno/if/etimedout:/name}.
type: requirement
