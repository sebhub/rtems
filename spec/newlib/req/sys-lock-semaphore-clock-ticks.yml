requirement-type: functional
text: |
  While the timeout parameter is a non-zero value, while the semaphore is not
  available, if exactly the count of ${/glossary/clock-tick:/plural} which the
  timeout parameter specifies occurred, then the directive shall return with a
  ${/glossary/statuscode:/term} of ${/c/errno/if/etimedout:/name}.
type: requirement
