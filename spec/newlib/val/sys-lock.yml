- action-brief: |
    Create a semaphore and validate the semaphore directives.
  action-code: |
    struct _Semaphore_Control sem;

    _Semaphore_Initialize( &sem, 0 );

    ctx->tq_sem_ctx.base.thread_queue_object = &sem;
    ctx->tq_sem_ctx.base.enqueue = SemaphoreEnqueue;
    ctx->tq_sem_ctx.get_count = SemaphoreGetCount;
    ctx->tq_sem_ctx.set_count = SemaphoreSetCount;
  checks:
  - brief: |
      Validate the ${../if/sys-lock-semaphore-try-wait:/name} directive.
    code: |
      ctx->tq_sem_ctx.base.surrender = SemaphorePostBinary;
      ctx->tq_sem_ctx.base.wait = TQ_NO_WAIT;
      ctx->tq_sem_ctx.variant = TQ_SEM_BINARY;
      SemaphoreSetCount( &ctx->tq_sem_ctx, 1 );
      ${/score/sem/req/seize-try:/test-run}( &ctx->tq_sem_ctx );
    links:
    - role: validation
      uid: ../req/sys-lock-semaphore-try-wait
  - brief: |
      Validate the ${../if/sys-lock-semaphore-wait-timed-ticks:/name} directive for
      valid timeout parameters.
    code: |
      ctx->tq_sem_ctx.base.surrender = SemaphorePostBinary;
      ctx->tq_sem_ctx.base.wait = TQ_WAIT_TIMED;
      ctx->tq_sem_ctx.variant = TQ_SEM_BINARY;
      SemaphoreSetCount( &ctx->tq_sem_ctx, 1 );
      ${/score/sem/req/seize-wait:/test-run}( &ctx->tq_sem_ctx );
    links:
    - role: validation
      uid: ../req/sys-lock-semaphore-wait-timed-ticks
  - brief: |
      Validate the ${../if/sys-lock-semaphore-wait-timed-ticks:/name} timeout
      behaviour.
    code: |
      ctx->tq_sem_ctx.base.surrender = SemaphorePostBinary;
      ctx->tq_sem_ctx.base.wait = TQ_WAIT_TIMED;
      ctx->tq_sem_ctx.variant = TQ_SEM_BINARY;
      SemaphoreSetCount( &ctx->tq_sem_ctx, 1 );
      ${/score/tq/req/timeout:/test-run}( &ctx->tq_sem_ctx.base );
    links:
    - role: validation
      uid: ../req/sys-lock-semaphore-wait-timed-ticks
    - role: validation
      uid: ../req/sys-lock-semaphore-clock-ticks
  - brief: |
      Validate the ${../if/sys-lock-semaphore-wait-timed-ticks:/name} directive for a
      timeout parameter of zero.
    code: |
      ctx->tq_sem_ctx.base.enqueue = SemaphoreEnqueueZeroTicks;
      ctx->tq_sem_ctx.base.surrender = SemaphorePostBinary;
      ctx->tq_sem_ctx.base.wait = TQ_WAIT_FOREVER;
      ctx->tq_sem_ctx.variant = TQ_SEM_BINARY;
      SemaphoreSetCount( &ctx->tq_sem_ctx, 1 );
      ${/score/sem/req/seize-wait:/test-run}( &ctx->tq_sem_ctx );
      ctx->tq_sem_ctx.base.enqueue = SemaphoreEnqueue;
