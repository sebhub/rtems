enabled-by: RTEMS_SMP
links: []
test-actions:
- action-brief: |
    Let the timeout of a period expire on the first processor while the
    ${../glossary/ownertask:/term} cancels the period on the second processor.
  action-code: |
    ArmOnFirstProcessor( ctx );
    SetFlag( &ctx->mode, MODE_CANCEL );
    SetFlag( &ctx->cancelled, 0 );
    SetFlag( &ctx->window_reached, 0 );
    SetFlag( &ctx->window_timed_out, 0 );
    SetFlag( &ctx->arm, 1 );

    WaitForWindow( ctx );
  checks:
  - brief: |
      Check that the timeout reached the window of the test.
    code: |
      T_true( GetFlag( &ctx->window_reached ) != 0 );
    links: []
  - brief: |
      Check that no wait of the test reached its bound.
    code: |
      T_false( GetFlag( &ctx->window_timed_out ) != 0 );
    links: []
  - brief: |
      Check that the timeout of the ${../glossary/interval:/term} which ended leaves
      the ${../glossary/state:/term} of the period alone.
    code: |
      rtems_status_code                  sc;
      rtems_rate_monotonic_period_status status;

      sc = rtems_rate_monotonic_get_status( ctx->period_id, &status );
      T_rsc_success( sc );
      T_eq_int( status.state, RATE_MONOTONIC_INACTIVE );
      T_eq_u32( status.postponed_jobs_count, 0 );
    links:
    - role: validation
      uid: ../req/stale-timeout-state
  links: []
- action-brief: |
    Let the timeout of a period expire on the first processor while the
    ${../glossary/ownertask:/term} begins a new ${../glossary/interval:/term} on
    the second processor.
  action-code: |
    ArmOnFirstProcessor( ctx );
    SetFlag( &ctx->mode, MODE_WAIT );
    SetFlag( &ctx->window_reached, 0 );
    SetFlag( &ctx->window_timed_out, 0 );
    SetFlag( &ctx->arm, 1 );

    WaitForWindow( ctx );
  checks:
  - brief: |
      Check that the timeout reached the window of the test.
    code: |
      T_true( GetFlag( &ctx->window_reached ) != 0 );
    links: []
  - brief: |
      Check that no wait of the test reached its bound.
    code: |
      T_false( GetFlag( &ctx->window_timed_out ) != 0 );
    links: []
  - brief: |
      Check that the timeout of the ${../glossary/interval:/term} which ended does
      not end the wait of the ${../glossary/ownertask:/term} which began after it.
    code: |
      T_true( WaitsForPeriod( ctx ) );
    links:
    - role: validation
      uid: ../req/stale-timeout
  links: []
test-brief: |
  Tests that a timeout of a period which the ${../glossary/ownertask:/term} ended
  changes neither the ${../glossary/state:/term} of the period nor a wait which
  began after it.
