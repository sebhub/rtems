test-actions:
- action-brief: |
    Create a rate-monotonic object. Reset all rate-monotonic statistics. Get the
    statistics of the rate-monotonic object.
  action-code: |
    rtems_id                               id;
    rtems_rate_monotonic_period_statistics stats;
    rtems_status_code                      sc;

    id = CreatePeriod( OBJECT_NAME, 2 );
    InitializePeriod( id );
    rtems_rate_monotonic_reset_all_statistics();

    sc = rtems_rate_monotonic_get_statistics( id, &stats );
    T_rsc_success( sc );
  checks:
  - brief: |
      Check that the statistics are in the reset state.
    code: |
      T_eq_u32( stats.count, 0 );
      T_eq_u32( stats.missed_count, 0 );
      TimespecMax( &stats.min_cpu_time );
      TimespecZero( &stats.max_cpu_time );
      TimespecZero( &stats.total_cpu_time );
      TimespecMax( &stats.min_wall_time );
      TimespecZero( &stats.max_wall_time );
      TimespecZero( &stats.total_wall_time );
    links:
    - role: validation
      uid: ../req/reset-all-statistics
  - brief: |
      Delete the rate-monotonic object.
    code: |
      sc = rtems_rate_monotonic_delete( id );
      T_rsc_success( sc );
    links: []
  links: []
- action-brief: |
    Reset the rate-monotonic statistics. Create an active period object. Create an
    inactive period object. Build the expected report from the statistics of both
    periods.
  action-code: |
    rtems_id          active;
    rtems_id          inactive;
    rtems_status_code sc;
    rtems_printer     printer;

    rtems_rate_monotonic_reset_all_statistics();
    active = CreatePeriod( rtems_build_name( 'A', 'C', 'T', 'V' ), 2 );
    InitializePeriod( active );
    inactive = CreatePeriod( rtems_build_name( 'I', 'A', 'C', 'T' ), 3 );
    ResetOutput( &expected );
    Append( &expected, "%s", HEADER );
    AppendPeriodLine( &expected, active );
    AppendPeriodLine( &expected, inactive );
  checks:
  - brief: |
      Call ${../if/report-statistics-with-plugin:/name} with a printer which captures
      the output. Check that the output starts with the header lines.
    code: |
      ResetOutput( &output );
      printer.context = &output;
      printer.printer = Capture;
      rtems_rate_monotonic_report_statistics_with_plugin( &printer );
      T_eq_nstr( output.buffer, HEADER, sizeof( HEADER ) - 1 );
    links:
    - role: validation
      uid: ../req/report-statistics-with-plugin-printer
    - role: validation
      uid: ../req/report-statistics-with-plugin-structure
    - role: validation
      uid: ../req/report-statistics-with-plugin-title
    - role: validation
      uid: ../req/report-statistics-with-plugin-cpu-unit
    - role: validation
      uid: ../req/report-statistics-with-plugin-wall-unit
    - role: validation
      uid: ../req/report-statistics-with-plugin-column-1
    - role: validation
      uid: ../req/report-statistics-with-plugin-column-2
    - role: validation
      uid: ../req/report-statistics-with-plugin-line-end
  - brief: |
      Check that the period lines follow the header lines.
    code: |
      T_eq_str( output.buffer, expected.buffer );
    links:
    - role: validation
      uid: ../req/report-statistics-with-plugin-structure
    - role: validation
      uid: ../req/report-statistics-with-plugin-periods
    - role: validation
      uid: ../req/report-statistics-with-plugin-fields
    - role: validation
      uid: ../req/report-statistics-with-plugin-fields-no-time
    - role: validation
      uid: ../req/report-statistics-with-plugin-id
    - role: validation
      uid: ../req/report-statistics-with-plugin-owner
    - role: validation
      uid: ../req/report-statistics-with-plugin-count
    - role: validation
      uid: ../req/report-statistics-with-plugin-missed
    - role: validation
      uid: ../req/report-statistics-with-plugin-cpu-time
    - role: validation
      uid: ../req/report-statistics-with-plugin-wall-time
    - role: validation
      uid: ../req/report-statistics-with-plugin-time
    - role: validation
      uid: ../req/report-statistics-with-plugin-line-end
  - brief: |
      Call ${../if/report-statistics:/name}. Check that it prints the output of
      ${../if/report-statistics-with-plugin:/name} through the printk printer.
    code: |
      ResetOutput( &printk_output );
      output_char = BSP_output_char;
      BSP_output_char = OutputChar;
      rtems_rate_monotonic_report_statistics();
      BSP_output_char = output_char;
      T_eq_str( printk_output.buffer, expected.buffer );
    links:
    - role: validation
      uid: ../req/report-statistics-printer
    - role: validation
      uid: ../req/report-statistics-output
  - brief: |
      Delete the rate-monotonic objects.
    code: |
      sc = rtems_rate_monotonic_delete( active );
      T_rsc_success( sc );
      sc = rtems_rate_monotonic_delete( inactive );
      T_rsc_success( sc );
    links: []
  links: []
