      While the ${../if/reset-statistics:/params[0]/name} parameter is not associated
      with a period.
  - name: Period
    test-code: |
      ctx->id = CreatePeriod();
    text: |
      While the ${../if/reset-statistics:/params[0]/name} parameter is associated
      with a period.
  test-epilogue: null
  test-prologue: null
rationale: |
  The directive sets the minimum times to the largest time value, so that the
  first period after the reset sets them.
references: []
requirement-type: functional
skip-reasons: {}
test-action: |
  ctx->status = rtems_rate_monotonic_reset_statistics( ctx->id );
  memset( &ctx->stats, 0xff, sizeof( ctx->stats ) );
  (void) rtems_rate_monotonic_get_statistics( ctx->id, &ctx->stats );
test-brief: null
test-cleanup: |
  if ( ctx->id != 0xffffffff ) {
    rtems_status_code sc;

    sc = rtems_rate_monotonic_delete( ctx->id );
    T_rsc_success( sc );
  }
