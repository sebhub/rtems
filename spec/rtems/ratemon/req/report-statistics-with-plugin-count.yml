requirement-type: functional
text: |
  The format of the COUNT field of a period line of the
  ${../if/report-statistics-with-plugin:/name} directive shall be the
  ${../if/period-statistics:/definition[0]/default/name} member of the statistics
  which ${../if/get-statistics:/name} returns for the period in decimal digits,
  padded on the left with space characters to five characters.
