  uid: ../if/report-statistics-with-plugin
rationale: null
references: []
requirement-type: functional
text: |
  The format of the CPU TIME field of a period line of the
  ${../if/report-statistics-with-plugin:/name} directive shall be the
  ${../if/period-statistics:/definition[2]/default/name} member, the
  ${../if/period-statistics:/definition[3]/default/name} member and the
  ${../if/period-statistics:/definition[4]/default/name} member divided by the
  ${../if/period-statistics:/definition[0]/default/name} member of the statistics
  which ${../if/get-statistics:/name} returns for the period, each in the time
  format of the report and separated by `/`.
type: requirement
