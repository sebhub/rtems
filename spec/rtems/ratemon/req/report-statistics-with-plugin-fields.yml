requirement-type: functional
text: |
  While the ${../if/period-statistics:/definition[0]/default/name} member of the
  statistics which ${../if/get-statistics:/name} returns for the period is not
  zero, the format of a period line of the
  ${../if/report-statistics-with-plugin:/name} directive shall be the ID, OWNER,
  COUNT, MISSED, CPU TIME and WALL TIME fields in this order, each separated by
  one space character.
type: requirement
