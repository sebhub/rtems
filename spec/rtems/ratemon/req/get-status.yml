test-header: null
test-includes:
- rtems.h
- string.h
test-local-includes:
- tx-support.h
test-prepare: |
  ctx->expected_since_last_period = 0;
  ctx->expected_executed_since_last_period = 0;
  ctx->expected_postponed_jobs_count = 0;
  memset( &ctx->status_obj, 0xff, sizeof( ctx->status_obj ) );
test-setup:
  brief: null
  code: |
    ctx->previous_get_timecount = SetGetTimecountHandler( FreezeTime );
    ctx->worker_id = CreateTask( "WORK", GetSelfPriority() + 1 );
    StartTask( ctx->worker_id, TickWorker, NULL );
    TimecounterTick();
  description: null
test-stop: null
test-support: |
  static uint32_t FreezeTime( void )
  {
    return GetTimecountCounter() - 1;
  }

  static void TickWorker( rtems_task_argument arg )
  {
    (void) arg;

    while ( true ) {
      TimecounterTick();
    }
  }

  static void TimespecZero( const struct timespec *ts )
  {
    T_eq_ll( ts->tv_sec, 0 );
    T_eq_long( ts->tv_nsec, 0 );
  }

  static void TimespecEq( const struct timespec *ts, rtems_interval ticks )
  {
    T_eq_ll( ts->tv_sec, 0 );
    T_eq_long(
      ( ts->tv_nsec + 499999L ) / 1000000L,
      ticks * rtems_configuration_get_milliseconds_per_tick()
    );
  }

  static void TimespecNop( const struct timespec *ts )
  {
    T_eq_ll( ts->tv_sec, -1LL );
    T_eq_long( ts->tv_nsec, -1L );
  }

  static rtems_id CreatePeriod( void )
  {
    rtems_id          id;
    rtems_status_code sc;

    sc = rtems_rate_monotonic_create( OBJECT_NAME, &id );
    T_rsc_success( sc );

    return id;
  }
test-target: testsuites/validation/tc-ratemon-get-status.c
test-teardown:
  brief: null
  code: |
    DeleteTask( ctx->worker_id );
    SetGetTimecountHandler( ctx->previous_get_timecount );
  description: null
text: |
  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Status: 'Null'
      then: InvAddr
    - if:
        pre-conditions:
          Id: NoObj
      then: InvId
    - else: Ok
    Owner:
    - if:
        pre-conditions:
          Status: 'Null'
      then: N/A
    - if:
        pre-conditions:
          Id: NoObj
      then: Nop
    - else: OwnerTask
    State:
    - if:
        pre-conditions:
          Status: 'Null'
      then: N/A
    - if:
        pre-conditions:
          Id: NoObj
      then: Nop
    - specified-by: State
    SinceLastPeriod:
    - if:
        pre-conditions:
          Status: 'Null'
      then: N/A
    - if:
        pre-conditions:
          Id: NoObj
      then: Nop
    - if:
        pre-conditions:
          State: Inactive
      then: Zero
    - else: Elapsed
    ExecutedSinceLastPeriod:
    - if:
        pre-conditions:
          Status: 'Null'
      then: N/A
    - if:
        pre-conditions:
          Id: NoObj
      then: Nop
    - if:
        pre-conditions:
          State: Inactive
      then: Zero
    - else: Executed
    PostponedJobs:
    - if:
        pre-conditions:
          Status: 'Null'
      then: N/A
    - if:
        pre-conditions:
          Id: NoObj
      then: Nop
    - if:
        pre-conditions:
          State: Inactive
      then: Zero
    - else: Count
  pre-conditions:
    Status: all
    Id: all
    PostponedJobs:
      applicable:
        pre-conditions:
          Id: Period
          State:
          - Active
          - Expired
    State:
      applicable:
        pre-conditions:
          Id: Period
type: requirement
