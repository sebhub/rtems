enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/get-status
post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_rsc_success( ctx->status );
    text: |
      The return status of ${../if/get-status:/name} shall be
      ${../../status/if/successful:/name}.
  - name: InvAddr
    test-code: |
      T_rsc( ctx->status, RTEMS_INVALID_ADDRESS );
    text: |
      The return status of ${../if/get-status:/name} shall be
      ${../../status/if/invalid-address:/name}.
  - name: InvId
    test-code: |
      T_rsc( ctx->status, RTEMS_INVALID_ID );
    text: |
      The return status of ${../if/get-status:/name} shall be
      ${../../status/if/invalid-id:/name}.
  test-epilogue: null
  test-prologue: null
- name: Owner
  states:
  - name: OwnerTask
    test-code: |
      T_eq_u32( ctx->status_obj.owner, rtems_task_self() );
    text: |
      The value of the member ${../if/period-status:/definition[0]/default/name} of
      the object referenced by the ${../if/get-status:/params[1]/name} parameter
      shall be set to the object identifier of the ${../glossary/ownertask:/term} of
      the period associated with the object identifier specified by the
      ${../if/get-status:/params[0]/name} parameter.
  - name: Nop
    test-code: |
      T_eq_u32( ctx->status_obj.owner, 0xffffffff );
    text: |
      The value of the member ${../if/period-status:/definition[0]/default/name} of
      the object referenced by the ${../if/get-status:/params[1]/name} parameter
      shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: State
  states:
  - name: Inactive
    test-code: |
      T_eq_int( ctx->status_obj.state, RATE_MONOTONIC_INACTIVE );
    text: |
      The value of the member ${../if/period-status:/definition[1]/default/name} of
      the object referenced by the ${../if/get-status:/params[1]/name} parameter
      shall be set to ${../if/inactive:/name}.
  - name: Active
    test-code: |
      T_eq_int( ctx->status_obj.state, RATE_MONOTONIC_ACTIVE );
    text: |
      The value of the member ${../if/period-status:/definition[1]/default/name} of
      the object referenced by the ${../if/get-status:/params[1]/name} parameter
      shall be set to ${../if/active:/name}.
  - name: Expired
    test-code: |
      T_eq_int( ctx->status_obj.state, RATE_MONOTONIC_EXPIRED );
    text: |
      The value of the member ${../if/period-status:/definition[1]/default/name} of
      the object referenced by the ${../if/get-status:/params[1]/name} parameter
      shall be set to ${../if/expired:/name}.
  - name: Nop
    test-code: |
      T_eq_int( ctx->status_obj.state, -1 );
    text: |
      The value of the member ${../if/period-status:/definition[1]/default/name} of
      the object referenced by the ${../if/get-status:/params[1]/name} parameter
      shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: SinceLastPeriod
  states:
  - name: Zero
    test-code: |
      TimespecZero( &ctx->status_obj.since_last_period );
    text: |
      The value of the member ${../if/period-status:/definition[2]/default/name} of
      the object referenced by the ${../if/get-status:/params[1]/name} parameter
      shall be set to zero.
  - name: Elapsed
    test-code: |
      TimespecEq(
        &ctx->status_obj.since_last_period,
        ctx->expected_since_last_period
      );
    text: |
      The value of the member ${../if/period-status:/definition[2]/default/name} of
      the object referenced by the ${../if/get-status:/params[1]/name} parameter
      shall be set to the ${/glossary/clock-monotonic:/term} time elapsed since the
      last invocation of ${../if/period:/name} for the period associated with the
      object identifier specified by the ${../if/get-status:/params[0]/name}
      parameter.
  - name: Nop
    test-code: |
      TimespecNop( &ctx->status_obj.since_last_period );
    text: |
      The value of the member ${../if/period-status:/definition[2]/default/name} of
      the object referenced by the ${../if/get-status:/params[1]/name} parameter
      shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: ExecutedSinceLastPeriod
  states:
  - name: Zero
    test-code: |
      TimespecZero( &ctx->status_obj.executed_since_last_period );
    text: |
      The value of the member ${../if/period-status:/definition[3]/default/name} of
      the object referenced by the ${../if/get-status:/params[1]/name} parameter
      shall be set to zero.
  - name: Executed
    test-code: |
      TimespecEq(
        &ctx->status_obj.executed_since_last_period,
        ctx->expected_executed_since_last_period
      );
    text: |
      The value of the member ${../if/period-status:/definition[3]/default/name} of
      the object referenced by the ${../if/get-status:/params[1]/name} parameter
      shall be set to the processor time consumed by the
      ${../glossary/ownertask:/term} since the last invocation of
      ${../if/period:/name} for the period associated with the object identifier
      specified by the ${../if/get-status:/params[0]/name} parameter.
  - name: Nop
    test-code: |
      TimespecNop( &ctx->status_obj.executed_since_last_period );
    text: |
      The value of the member ${../if/period-status:/definition[3]/default/name} of
      the object referenced by the ${../if/get-status:/params[1]/name} parameter
      shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: PostponedJobs
  states:
  - name: Zero
    test-code: |
      T_eq_u32( ctx->status_obj.postponed_jobs_count, 0 );
    text: |
      The value of the member ${../if/period-status:/definition[4]/default/name} of
      the object referenced by the ${../if/get-status:/params[1]/name} parameter
      shall be set to zero.
  - name: Count
    test-code: |
      T_eq_u32(
        ctx->status_obj.postponed_jobs_count,
        ctx->expected_postponed_jobs_count
      );
    text: |
      The value of the member ${../if/period-status:/definition[4]/default/name} of
      the object referenced by the ${../if/get-status:/params[1]/name} parameter
      shall be set to the count of ${../glossary/postponedjob:/plural} of the period
      associated with the object identifier specified by the
      ${../if/get-status:/params[0]/name} parameter.
  - name: Nop
    test-code: |
      T_eq_u32( ctx->status_obj.postponed_jobs_count, 0xffffffff );
    text: |
      The value of the member ${../if/period-status:/definition[4]/default/name} of
      the object referenced by the ${../if/get-status:/params[1]/name} parameter
      shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Status
  states:
  - name: Valid
    test-code: |
      ctx->period_status = &ctx->status_obj;
    text: |
      While the ${../if/get-status:/params[1]/name} parameter references an object of
      type ${../if/period-status:/name}.
  - name: 'Null'
    test-code: |
      ctx->period_status = NULL;
    text: |
      While the ${../if/get-status:/params[1]/name} parameter is equal to
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Id
  states:
  - name: NoObj
    test-code: |
      ctx->id = 0xffffffff;
    text: |
      While the ${../if/get-status:/params[0]/name} parameter is not associated with
      a period.
  - name: Period
    test-code: |
      ctx->id = CreatePeriod();
    text: |
      While the ${../if/get-status:/params[0]/name} parameter is associated with a
      period.
  test-epilogue: null
  test-prologue: null
- name: PostponedJobs
  states:
  - name: Zero
    test-code: |
      /* Nothing to prepare */
    text: |
      While the count of ${../glossary/postponedjob:/plural} of the period associated
      with the object identifier specified by the ${../if/get-status:/params[0]/name}
      parameter is zero.
  - name: Positive
    test-code: |
      sc = rtems_rate_monotonic_period( ctx->id, 3 );
      T_rsc_success( sc );

      TimecounterTick();
      TimecounterTick();
      TimecounterTick();

      sc = rtems_task_wake_after( 1 );
      T_rsc_success( sc );

      TimecounterTick();
      TimecounterTick();

      ctx->expected_postponed_jobs_count = 2;
    text: |
      While the count of ${../glossary/postponedjob:/plural} of the period associated
      with the object identifier specified by the ${../if/get-status:/params[0]/name}
      parameter is greater than zero.
  test-epilogue: null
  test-prologue: |
    rtems_status_code sc;
- name: State
  states:
  - name: Inactive
    test-code: |
      /* Nothing to prepare */
    text: |
      While the ${../glossary/state:/term} of the period associated with the object
      identifier specified by the ${../if/get-status:/params[0]/name} parameter is
      ${../glossary/inactive:/term}.
  - name: Active
    test-code: |
      sc = rtems_rate_monotonic_period( ctx->id, 3 );

      if ( ctx->expected_postponed_jobs_count > 0 ) {
        T_rsc( sc, RTEMS_TIMEOUT );
      } else {
        T_rsc_success( sc );
      }

      sc = rtems_task_wake_after( 1 );
      T_rsc_success( sc );

      TimecounterTick();

      if ( ctx->expected_postponed_jobs_count > 0 ) {
        --ctx->expected_postponed_jobs_count;
      }

      ctx->expected_since_last_period = 2;
      ctx->expected_executed_since_last_period = 1;
    text: |
      While the ${../glossary/state:/term} of the period associated with the object
      identifier specified by the ${../if/get-status:/params[0]/name} parameter is
      ${../glossary/active:/term}.
  - name: Expired
    test-code: |
      if ( ctx->expected_postponed_jobs_count == 0 ) {
        sc = rtems_rate_monotonic_period( ctx->id, 3 );
        T_rsc_success( sc );

        sc = rtems_task_wake_after( 1 );
        T_rsc_success( sc );

        TimecounterTick();
        TimecounterTick();

        ctx->expected_since_last_period = 3;
        ctx->expected_executed_since_last_period = 2;
        ctx->expected_postponed_jobs_count = 1;
      } else {
        ctx->expected_since_last_period = 6;
        ctx->expected_executed_since_last_period = 5;
      }
    text: |
      While the ${../glossary/state:/term} of the period associated with the object
      identifier specified by the ${../if/get-status:/params[0]/name} parameter is
      ${../glossary/expired:/term}.
  test-epilogue: null
  test-prologue: |
    rtems_status_code sc;
rationale: |
  The directive checks the pointer before the identifier, so a
  ${/c/if/null:/name} pointer gives the invalid address status for each
  identifier.
references: []
requirement-type: functional
skip-reasons: {}
test-action: |
  ctx->status = rtems_rate_monotonic_get_status( ctx->id, ctx->period_status );
test-brief: null
test-cleanup: |
  if ( ctx->id != 0xffffffff ) {
    rtems_status_code sc;

    sc = rtems_rate_monotonic_delete( ctx->id );
    T_rsc_success( sc );
  }
