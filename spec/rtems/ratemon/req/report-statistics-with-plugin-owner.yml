text: |
  The format of the OWNER field of a period line of the
  ${../if/report-statistics-with-plugin:/name} directive shall be the name of the
  owner task of the period which ${/rtems/object/if/get-name:/name} returns for a
  buffer of five characters, padded on the left with space characters to four
  characters.
