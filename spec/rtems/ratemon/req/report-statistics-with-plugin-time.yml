text: |
  The time format of the report of the
  ${../if/report-statistics-with-plugin:/name} directive shall be the seconds in
  decimal digits, followed by `.`, followed by the nanoseconds divided by 1000 in
  decimal digits, padded on the left with zeros to six digits.
