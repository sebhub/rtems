enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/get-statistics
post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_rsc_success( ctx->status );
    text: |
      The return status of ${../if/get-statistics:/name} shall be
      ${../../status/if/successful:/name}.
  - name: InvAddr
    test-code: |
      T_rsc( ctx->status, RTEMS_INVALID_ADDRESS );
    text: |
      The return status of ${../if/get-statistics:/name} shall be
      ${../../status/if/invalid-address:/name}.
  - name: InvId
    test-code: |
      T_rsc( ctx->status, RTEMS_INVALID_ID );
    text: |
      The return status of ${../if/get-statistics:/name} shall be
      ${../../status/if/invalid-id:/name}.
  test-epilogue: null
  test-prologue: null
- name: Count
  states:
  - name: Value
    test-code: |
      T_eq_u32( ctx->stats_obj.count, 3 );
    text: |
      The value of the member ${../if/period-statistics:/definition[0]/default/name}
      of the object referenced by the ${../if/get-statistics:/params[1]/name}
      parameter shall be set to the count of executed periods since the last reset
      recorded for the period associated with the object identifier specified by the
      ${../if/get-statistics:/params[0]/name} parameter.
  - name: Nop
    test-code: |
      T_eq_u32( ctx->stats_obj.count, 0xffffffff );
    text: |
      The value of the member ${../if/period-statistics:/definition[0]/default/name}
      of the object referenced by the ${../if/get-statistics:/params[1]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: MissedCount
  states:
  - name: Value
    test-code: |
      T_eq_u32( ctx->stats_obj.missed_count, 1 );
    text: |
      The value of the member ${../if/period-statistics:/definition[1]/default/name}
      of the object referenced by the ${../if/get-statistics:/params[1]/name}
      parameter shall be set to the count of missed periods since the last reset
      recorded for the period associated with the object identifier specified by the
      ${../if/get-statistics:/params[0]/name} parameter.
  - name: Nop
    test-code: |
      T_eq_u32( ctx->stats_obj.missed_count, 0xffffffff );
    text: |
      The value of the member ${../if/period-statistics:/definition[1]/default/name}
      of the object referenced by the ${../if/get-statistics:/params[1]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: MinCPUTime
  states:
  - name: Value
    test-code: |
      TimespecEq( &ctx->stats_obj.min_cpu_time, 1 );
    text: |
      The value of the member ${../if/period-statistics:/definition[2]/default/name}
      of the object referenced by the ${../if/get-statistics:/params[1]/name}
      parameter shall be set to the least amount of processor time used in a period
      since the last reset recorded for the period associated with the object
      identifier specified by the ${../if/get-statistics:/params[0]/name} parameter.
  - name: Nop
    test-code: |
      TimespecNop( &ctx->stats_obj.min_cpu_time );
    text: |
      The value of the member ${../if/period-statistics:/definition[2]/default/name}
      of the object referenced by the ${../if/get-statistics:/params[1]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: MaxCPUTime
  states:
  - name: Value
    test-code: |
      TimespecEq( &ctx->stats_obj.max_cpu_time, 4 );
    text: |
      The value of the member ${../if/period-statistics:/definition[3]/default/name}
      of the object referenced by the ${../if/get-statistics:/params[1]/name}
      parameter shall be set to the highest amount of processor time used in a period
      since the last reset recorded for the period associated with the object
      identifier specified by the ${../if/get-statistics:/params[0]/name} parameter.
  - name: Nop
    test-code: |
      TimespecNop( &ctx->stats_obj.max_cpu_time );
    text: |
      The value of the member ${../if/period-statistics:/definition[3]/default/name}
      of the object referenced by the ${../if/get-statistics:/params[1]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: TotalCPUTime
  states:
  - name: Value
    test-code: |
      TimespecEq( &ctx->stats_obj.total_cpu_time, 6 );
    text: |
      The value of the member ${../if/period-statistics:/definition[4]/default/name}
      of the object referenced by the ${../if/get-statistics:/params[1]/name}
      parameter shall be set to the total amount of processor time used in all
      periods since the last reset recorded for the period associated with the object
      identifier specified by the ${../if/get-statistics:/params[0]/name} parameter.
  - name: Nop
    test-code: |
      TimespecNop( &ctx->stats_obj.total_cpu_time );
    text: |
      The value of the member ${../if/period-statistics:/definition[4]/default/name}
      of the object referenced by the ${../if/get-statistics:/params[1]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: MinMonotonicTime
  states:
  - name: Value
    test-code: |
      TimespecEq( &ctx->stats_obj.min_wall_time, 1 );
    text: |
      The value of the member ${../if/period-statistics:/definition[5]/default/name}
      of the object referenced by the ${../if/get-statistics:/params[1]/name}
      parameter shall be set to the least amount of
      ${/glossary/clock-monotonic:/term} time used in a period since the last reset
      recorded for the period associated with the object identifier specified by the
      ${../if/get-statistics:/params[0]/name} parameter.
  - name: Nop
    test-code: |
      TimespecNop( &ctx->stats_obj.min_wall_time );
    text: |
      The value of the member ${../if/period-statistics:/definition[5]/default/name}
      of the object referenced by the ${../if/get-statistics:/params[1]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: MaxMonotonicTime
  states:
  - name: Value
    test-code: |
      TimespecEq( &ctx->stats_obj.max_wall_time, 4 );
    text: |
      The value of the member ${../if/period-statistics:/definition[6]/default/name}
      of the object referenced by the ${../if/get-statistics:/params[1]/name}
      parameter shall be set to the highest amount of
      ${/glossary/clock-monotonic:/term} time used in a period since the last reset
      recorded for the period associated with the object identifier specified by the
      ${../if/get-statistics:/params[0]/name} parameter.
  - name: Nop
    test-code: |
      TimespecNop( &ctx->stats_obj.max_wall_time );
    text: |
      The value of the member ${../if/period-statistics:/definition[6]/default/name}
      of the object referenced by the ${../if/get-statistics:/params[1]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: TotalMonotonicTime
  states:
  - name: Value
    test-code: |
      TimespecEq( &ctx->stats_obj.total_wall_time, 7 );
    text: |
      The value of the member ${../if/period-statistics:/definition[7]/default/name}
      of the object referenced by the ${../if/get-statistics:/params[1]/name}
      parameter shall be set to the total amount of
      ${/glossary/clock-monotonic:/term} time used in a period since the last reset
      recorded for the period associated with the object identifier specified by the
      ${../if/get-statistics:/params[0]/name} parameter.
  - name: Nop
    test-code: |
      TimespecNop( &ctx->stats_obj.total_wall_time );
    text: |
      The value of the member ${../if/period-statistics:/definition[7]/default/name}
      of the object referenced by the ${../if/get-statistics:/params[1]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Stats
  states:
  - name: Valid
    test-code: |
      ctx->stats = &ctx->stats_obj;
    text: |
      While the ${../if/get-statistics:/params[1]/name} parameter references an
      object of type ${../if/period-statistics:/name}.
  - name: 'Null'
    test-code: |
      ctx->stats = NULL;
    text: |
      While the ${../if/get-statistics:/params[1]/name} parameter is equal to
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Id
  states:
  - name: NoObj
    test-code: |
      ctx->id = 0xffffffff;
    text: |
      While the ${../if/get-statistics:/params[0]/name} parameter is not associated
      with a period.
  - name: Period
    test-code: |
      ctx->id = CreatePeriod();
    text: |
      While the ${../if/get-statistics:/params[0]/name} parameter is associated with
      a period.
  test-epilogue: null
  test-prologue: null
rationale: |
  The directive checks the pointer before the identifier, so a
  ${/c/if/null:/name} pointer gives the invalid address status for each
  identifier.
references: []
requirement-type: functional
skip-reasons: {}
test-action: |
  ctx->status = rtems_rate_monotonic_get_statistics( ctx->id, ctx->stats );
test-brief: null
test-cleanup: |
  if ( ctx->id != 0xffffffff ) {
    rtems_status_code sc;

    sc = rtems_rate_monotonic_delete( ctx->id );
    T_rsc_success( sc );
  }
