enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/iterate
post-conditions:
- name: ThreadStacks
  states:
  - name: Each
    test-code: |
      T_eq_u32( ctx->record.thread_visits, ctx->record.thread_count );
      T_eq_u32( ctx->record.thread_visits_twice, 0 );
    text: |
      The ${../if/iterate:/name} call shall invoke the visitor routine specified by
      the ${../if/iterate:/params[0]/name} parameter exactly once for the stack of
      each thread.
  test-epilogue: null
  test-prologue: null
- name: InterruptStack
  states:
  - name: Once
    test-code: |
      T_eq_u32( ctx->record.interrupt_visits_by_index[ ctx->cpu_index ], 1 );
    text: |
      The ${../if/iterate:/name} call shall invoke the visitor routine specified by
      the ${../if/iterate:/params[0]/name} parameter exactly once for the
      ${/glossary/interruptstack:/term} of the processor.
  - name: Never
    test-code: |
      T_eq_u32( ctx->record.interrupt_visits_by_index[ ctx->cpu_index ], 0 );
    text: |
      The ${../if/iterate:/name} call shall invoke the visitor routine specified by
      the ${../if/iterate:/params[0]/name} parameter for no
      ${/glossary/interruptstack:/term} of the processor.
  test-epilogue: null
  test-prologue: null
- name: Order
  states:
  - name: ThreadsFirst
    test-code: |
      T_eq_u32( ctx->record.thread_after_interrupt, 0 );
    text: |
      The ${../if/iterate:/name} call shall invoke the visitor routine specified by
      the ${../if/iterate:/params[0]/name} parameter for the stacks of the threads
      before it invokes this visitor routine for the
      ${/glossary/interruptstack:/term} of a processor.
  test-epilogue: null
  test-prologue: null
- name: Argument
  states:
  - name: Arg
    test-code: |
      T_eq_u32( ctx->record.bad_arg, 0 );
    text: |
      The second parameter of each invocation of the visitor routine specified by the
      ${../if/iterate:/params[0]/name} parameter shall be the
      ${../if/iterate:/params[1]/name} parameter of the ${../if/iterate:/name} call.
  test-epilogue: null
  test-prologue: null
- name: Lock
  states:
  - name: ThreadsLocked
    test-code: |
      T_eq_u32( ctx->record.thread_visits_unlocked, 0 );
    text: |
      The ${../if/iterate:/name} call shall invoke the visitor routine specified by
      the ${../if/iterate:/params[0]/name} parameter for the stack of a thread as the
      owner of the object allocator lock.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Enabled
  states:
  - name: 'Yes'
    test-code: |
      if ( !IsStackCheckerEnabled() ) {
        ${.:skip}
      }
    text: |
      Where the application configuration enables the stack checker.
  - name: 'No'
    test-code: |
      if ( IsStackCheckerEnabled() ) {
        ${.:skip}
      }
    text: |
      Where the application configuration does not enable the stack checker.
  test-epilogue: null
  test-prologue: null
- name: Phase
  states:
  - name: DeviceDriverInit
    test-code: |
      ctx->multitasking = false;
    text: |
      While the ${../if/iterate:/name} directive is called from within device driver
      initialization context.
  - name: Task
    test-code: |
      ctx->multitasking = true;
    text: |
      While the ${../if/iterate:/name} directive is called from within task context.
  test-epilogue: null
  test-prologue: null
- name: Started
  states:
  - name: 'Yes'
    test-code: |
      ctx->thread_began = true;
    text: |
      While a thread began on the processor.
  - name: 'No'
    test-code: |
      ctx->thread_began = false;
    text: |
      While no thread began on the processor.
  test-epilogue: null
  test-prologue: null
- name: Owned
  states:
  - name: 'Yes'
    test-code: |
      ctx->cpu_index = 0;
    text: |
      While the processor is owned by a scheduler.
  - name: 'No'
    test-code: |
      if ( ctx->thread_began ) {
        if ( !RemoveAnyProcessor( ctx ) ) {
          ${.:skip}
        }
      } else if ( !FindProcessorWithoutScheduler( ctx ) ) {
        ${.:skip}
      }
    text: |
      While the processor is not owned by a scheduler.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension Enabled covers whether the application configuration enables the
  stack checker, 2 states. Only the begin extension of the stack checker gives an
  interrupt stack its allocated stack area.

  Dimension Phase covers the contexts from which the directive may be called, 2
  states. The constraints of ${../if/iterate:/name} allow device driver
  initialization context and task context. Both contexts follow the creation of
  the idle threads.

  Dimension Started covers whether a thread began on the processor, 2 states. The
  begin extension of the first thread of a processor gives the interrupt stack of
  that processor its allocated stack area. The area stays when the processor
  leaves its scheduler.

  Dimension Owned covers whether a scheduler owns the processor, 2 states. The
  ${/rtems/scheduler/if/remove-processor:/name} directive removes a processor
  from its scheduler. The application configuration may assign a processor to no
  scheduler.

  The interface item of ${../if/iterate:/name} states the visits, their order and
  the object allocator lock.
references: []
requirement-type: functional
skip-reasons:
  NoThreadBeforeMultitasking: |
    No thread begins on a processor before the start of the multitasking. The
    device driver initialization precedes the start of the multitasking.
  NotOnline: |
    A processor on which no thread began is not online after the start of the
    multitasking. The ${/rtems/scheduler/if/add-processor:/name} directive adds no
    processor which is not online to a scheduler.
test-action: |
  if ( ctx->multitasking ) {
    Iterate( &ctx->record );
  } else {
    ctx->record = initialization_record;
  }
test-brief: null
test-cleanup: |
  if ( ctx->removed_from != 0 ) {
    rtems_status_code sc;

    sc = rtems_scheduler_add_processor( ctx->removed_from, ctx->cpu_index );
    T_rsc_success( sc );
  }
test-context:
- brief: |
    This member is true, if the directive shall be called from within task context.
  description: null
  member: |
    bool multitasking
- brief: |
    This member contains the record of the visits.
  description: null
  member: |
    Record record
- brief: |
    This member is true, if a thread began on the processor.
  description: null
  member: |
    bool thread_began
- brief: |
    This member contains the index of the processor.
  description: null
  member: |
    uint32_t cpu_index
- brief: |
    This member contains the identifier of the scheduler which owned the removed
    processor, otherwise it is zero.
  description: null
  member: |
    rtems_id removed_from
test-context-support: |
  typedef struct {
    uint32_t thread_count;
    uint32_t thread_visits;
    uint32_t thread_visits_twice;
    uint32_t thread_visits_unlocked;
    uint32_t interrupt_visits;
    uint32_t interrupt_visits_by_index[ CPU_MAXIMUM_PROCESSORS ];
    uint32_t thread_after_interrupt;
    uint32_t bad_arg;
    rtems_id last_thread_id;
  } Record;
test-description: |
  The configuration of the test suite decides whether it enables the stack
  checker, so the test skips the variants of the other state. A handler of the
  system initialization calls the directive in the device driver initialization
  step. The variants in device driver initialization context check the record of
  this call. The processor owned by a scheduler is processor 0. A processor on
  which a thread began leaves its scheduler through
  ${/rtems/scheduler/if/remove-processor:/name}. A processor on which no thread
  began is a processor which the application configuration assigns to no
  scheduler. The test skips a variant where no such processor exists.
