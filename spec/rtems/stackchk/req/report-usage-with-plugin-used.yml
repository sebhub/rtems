text: |
  While the ${../if/info:/definition[5]/default/name} member of the stack
  information is not ${/c/if/uintptr_max:/name}, the format of the USED field of
  a stack usage line of the ${../if/report-usage-with-plugin:/name} directive
  shall be the ${../if/info:/definition[5]/default/name} member in decimal
  digits, padded on the left with space characters to six characters.
