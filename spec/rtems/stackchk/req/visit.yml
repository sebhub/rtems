enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/iterate
post-conditions:
- name: Id
  states:
  - name: Thread
    test-code: |
      T_eq_u32( ctx->info.id, ctx->task_id );
    text: |
      The ${../if/info:/definition[0]/default/name} member of the stack information
      shall be the object identifier of the thread.
  - name: Processor
    test-code: |
      T_eq_u32( ctx->info.id, 0 );
    text: |
      The ${../if/info:/definition[0]/default/name} member of the stack information
      shall be the index of the processor of the ${/glossary/interruptstack:/term}.
  test-epilogue: null
  test-prologue: null
- name: Name
  states:
  - name: Thread
    test-code: |
      T_eq_str( ctx->name, "STCK" );
    text: |
      The ${../if/info:/definition[1]/default/name} member of the stack information
      shall reference the name of the thread.
  - name: Interrupt
    test-code: |
      T_eq_str( ctx->name, "Interrupt Stack" );
    text: |
      The ${../if/info:/definition[1]/default/name} member of the stack information
      shall reference the string `Interrupt Stack`.
  test-epilogue: null
  test-prologue: null
- name: Area
  states:
  - name: Allocated
    test-code: |
      uintptr_t begin;
      uintptr_t end;

      begin = (uintptr_t) ctx->info.begin;
      end = begin + ctx->info.size;
      #if CPU_STACK_GROWS_UP == TRUE
      T_eq_uptr( begin, ctx->area_begin );
      T_lt_uptr( end, ctx->area_end );
      #else
      T_gt_uptr( begin, ctx->area_begin );
      T_eq_uptr( end, ctx->area_end );
      #endif
    text: |
      The ${../if/info:/definition[2]/default/name} and
      ${../if/info:/definition[3]/default/name} members of the stack information
      shall reference the ${/glossary/allocatedstackarea:/term} of the stack without
      the ${/glossary/stackcheckerpatternarea:/term}.
  test-epilogue: null
  test-prologue: null
- name: StackPointer
  states:
  - name: Context
    test-code: |
      T_eq_uptr( (uintptr_t) ctx->info.current, ctx->stack_pointer );
    text: |
      The ${../if/info:/definition[4]/default/name} member of the stack information
      shall be the ${/glossary/stackpointer:/term} of the saved context of the
      thread.
  - name: 'Null'
    test-code: |
      T_null( ctx->info.current );
    text: |
      The ${../if/info:/definition[4]/default/name} member of the stack information
      shall be ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Used
  states:
  - name: Zero
    test-code: |
      T_eq_uptr( ctx->info.used, 0 );
    text: |
      The ${../if/info:/definition[5]/default/name} member of the stack information
      shall be zero.
  - name: InRange
    test-code: |
      T_gt_uptr( ctx->info.used, 0 );
      T_le_uptr( ctx->info.used, ctx->info.size );
    text: |
      The ${../if/info:/definition[5]/default/name} member of the stack information
      shall be greater than zero and less than or equal to the
      ${../if/info:/definition[3]/default/name} member.
  - name: Unknown
    test-code: |
      T_eq_uptr( ctx->info.used, UINTPTR_MAX );
    text: |
      The ${../if/info:/definition[5]/default/name} member of the stack information
      shall be ${/c/if/uintptr_max:/name}.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Enabled
  states:
  - name: 'Yes'
    test-code: |
      if ( !IsStackCheckerEnabled() ) {
        ${.:skip}
      }
    text: |
      Where the application configuration enables the stack checker.
  - name: 'No'
    test-code: |
      if ( IsStackCheckerEnabled() ) {
        ${.:skip}
      }
    text: |
      Where the application configuration does not enable the stack checker.
  test-epilogue: null
  test-prologue: null
- name: Kind
  states:
  - name: Thread
    test-code: |
      ctx->kind = KIND_THREAD;
    text: |
      While the stack is the stack of a thread.
  - name: ISR
    test-code: |
      ctx->kind = KIND_ISR;
    text: |
      While the stack is the ${/glossary/interruptstack:/term} of a processor.
  test-epilogue: null
  test-prologue: null
- name: HasExecuted
  states:
  - name: 'Yes'
    test-code: |
      ctx->execute = true;
    text: |
      While the owner of the stack executed on the stack.
  - name: 'No'
    test-code: |
      ctx->execute = false;
    text: |
      While the owner of the stack never executed on the stack.
  test-epilogue: null
  test-prologue: null
- name: StackPointer
  states:
  - name: Below
    test-code: |
      ctx->position = POSITION_BELOW;
    text: |
      While the ${/glossary/stackpointer:/term} of the saved context of the thread is
      below the begin address of the ${/glossary/allocatedstackarea:/term} of the
      thread.
  - name: Inside
    test-code: |
      ctx->position = POSITION_INSIDE;
    text: |
      While the ${/glossary/stackpointer:/term} of the saved context of the thread is
      inside the ${/glossary/allocatedstackarea:/term} of the thread.
  - name: Above
    test-code: |
      ctx->position = POSITION_ABOVE;
    text: |
      While the ${/glossary/stackpointer:/term} of the saved context of the thread is
      above the end address of the ${/glossary/allocatedstackarea:/term} of the
      thread.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension Enabled covers whether the application configuration enables the
  stack checker, 2 states. The interface item of the stack information states the
  used member of a stack checker which is not initialized. Only the create
  extension of the stack checker initializes it.

  Dimension Kind covers the kinds of stacks which the stack checker visits, 2
  states. Dimension HasExecuted covers the execution history of the owner of the
  stack, 2 states. The owner of the stack of a thread is the thread. The owner of
  an interrupt stack is the interrupt processing of its processor.

  Dimension StackPointer covers the position of the stack pointer of the saved
  context of a thread relative to its allocated stack area, 3 states. The
  directive reports this stack pointer and does not check it. On SMP
  configurations a thread which overran its stack and blocked keeps a saved stack
  pointer outside its allocated stack area. The dimension does not apply to an
  interrupt stack.

  The interface item of the stack information states its members.
references: []
requirement-type: functional
skip-reasons:
  InterruptStackNotVisited: |
    Where the application configuration does not enable the stack checker, no begin
    extension gives an ${/glossary/interruptstack:/term} its
    ${/glossary/allocatedstackarea:/term}. The stack checker therefore visits no
    ${/glossary/interruptstack:/term}.
  InterruptStackUnused: |
    The stack checker visits the interrupt stack of a processor after the start of
    the multitasking. At that time the processor served interrupts on its interrupt
    stack.
test-action: |
  ctx->executed = false;
  ctx->task_id = CreateTask( "STCK", PRIO_HIGH );

  if ( ctx->kind == KIND_THREAD ) {
    const Stack_Control *stack;

    stack = &GetThread( ctx->task_id )->Start.Initial_stack;
    ctx->area_begin = (uintptr_t) stack->area;
    ctx->area_end = ctx->area_begin + stack->size;

    if ( ctx->execute ) {
      StartTask( ctx->task_id, Worker, ctx );

      while ( !ctx->executed ) {
        /* Wait */
      }
    }

    ArrangeStackPointer( ctx );
  } else {
    const Per_CPU_Control *cpu;

    cpu = _Per_CPU_Get_by_index( 0 );
    ctx->area_begin = (uintptr_t) cpu->interrupt_stack_low;
    ctx->area_end = (uintptr_t) cpu->interrupt_stack_high;

    if ( ctx->execute ) {
      ArrangeInterruptStackUse();
    }
  }

  ctx->visits = 0;
  rtems_stack_checker_iterate( Visit, ctx );
  T_eq_u32( ctx->visits, 1 );

  if ( ctx->kind == KIND_THREAD ) {
    SetSavedStackPointer( ctx, ctx->saved_stack_pointer );
  }
test-brief: null
test-cleanup: |
  DeleteTask( ctx->task_id );
