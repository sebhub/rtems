requirement-type: functional
text: |
  The format of the HIGH field of a stack usage line of the
  ${../if/report-usage-with-plugin:/name} directive shall be `0x` followed by the
  address of the last byte of the area which the
  ${../if/info:/definition[2]/default/name} and
  ${../if/info:/definition[3]/default/name} members of the stack information
  describe, in hexadecimal digits, padded on the left with zeros to eight digits.
type: requirement
