test-context-support: |
  typedef enum { POSITION_BELOW, POSITION_INSIDE, POSITION_ABOVE } Position;
test-description: |
  State Below of a stack which grows down uses a buffer in the stack frame of the
  action. State Above of a stack which grows up uses the same buffer. The action
  passes the buffer to a function which it calls. A local variable of that
  function is therefore beyond the buffer in the direction of stack growth. The
  case takes the address of this variable as the stack pointer of the caller.
