test-support: |
  static void CallFlushMultipleDataLines( void )
  {
    uint8_t buf[ 256 ];
    uintptr_t data;
    uintptr_t n;
    uintptr_t i;

    rtems_cache_flush_multiple_data_lines( NULL, 0 );
    data = RTEMS_ALIGN_UP( (uintptr_t) &buf[ 1 ], 128 );

    for ( n = 16; n <= 128 ; n *= 2 ) {
      for ( i = 0; i < 3; ++i ) {
        uintptr_t j;

        for ( j = 0; j < 3; ++j ) {
          rtems_cache_flush_multiple_data_lines(
            (const void *) ( data + 1 - i ),
            n + 1 - j
          );
        }
      }
    }
  }

  static void CallInvalidateMultipleDataLines( void )
  {
    uint8_t buf[ 384 ];
    uintptr_t data;
    uintptr_t n;
    uintptr_t i;

    rtems_cache_invalidate_multiple_data_lines( NULL, 0 );
    data = RTEMS_ALIGN_UP( (uintptr_t) &buf[ 128 ], 128 );

    for ( n = 16; n <= 128 ; n *= 2 ) {
      for ( i = 0; i < 3; ++i ) {
        uintptr_t j;

        for ( j = 0; j < 3; ++j ) {
          rtems_cache_invalidate_multiple_data_lines(
            (const void *) ( data + 1 - i ),
            n + 1 - j
          );
        }
      }
    }
  }

  static void CallInvalidateMultipleInstructionLines( void )
  {
    uintptr_t data;
    uintptr_t n;
    uintptr_t i;

    rtems_cache_invalidate_multiple_instruction_lines( NULL, 0 );
    data = (uintptr_t) rtems_cache_invalidate_multiple_instruction_lines;

    for ( n = 16; n <= 128 ; n *= 2 ) {
      for ( i = 0; i < 3; ++i ) {
        uintptr_t j;

        for ( j = 0; j < 3; ++j ) {
          rtems_cache_invalidate_multiple_instruction_lines(
            (const void *) ( data + 1 - i ),
            n + 1 - j
          );
        }
      }
    }
  }

  static void CallInstructionSyncAfterCodeChange( void )
  {
    uintptr_t data;
    uintptr_t n;
    uintptr_t i;

    rtems_cache_instruction_sync_after_code_change( NULL, 0 );
    data = (uintptr_t) rtems_cache_instruction_sync_after_code_change;

    for ( n = 16; n <= 128 ; n *= 2 ) {
      for ( i = 0; i < 3; ++i ) {
        uintptr_t j;

        for ( j = 0; j < 3; ++j ) {
          rtems_cache_instruction_sync_after_code_change(
            (const void *) ( data + 1 - i ),
            n + 1 - j
          );
        }
      }
    }
  }

  #define CACHE_LEVEL_COUNT 8

  static size_t data_sizes[ CACHE_LEVEL_COUNT ];

  static size_t instruction_sizes[ CACHE_LEVEL_COUNT ];

  static void CallGetDataSize( void )
  {
    uint32_t level;

    for ( level = 0; level < CACHE_LEVEL_COUNT; ++level ) {
      data_sizes[ level ] = rtems_cache_get_data_cache_size( level );

      if ( data_sizes[ level ] == 0 ) {
        break;
      }
    }
  }

  static void CallGetInstructionSize( void )
  {
    uint32_t level;

    for ( level = 0; level < CACHE_LEVEL_COUNT; ++level ) {
      instruction_sizes[ level ] =
        rtems_cache_get_instruction_cache_size( level );

      if ( instruction_sizes[ level ] == 0 ) {
        break;
      }
    }
  }

  static bool CheckLevelZero( const size_t *sizes )
  {
    uint32_t level;
    bool     ok;

    ok = true;

    for ( level = 1; level < CACHE_LEVEL_COUNT; ++level ) {
      if ( sizes[ level ] == 0 ) {
        break;
      }

      if ( sizes[ 0 ] < sizes[ level ] ) {
        T_log(
          T_NORMAL,
          "level 0 size %zu < level %" PRIu32 " size %zu",
          sizes[ 0 ],
          level,
          sizes[ level ]
        );
        ok = false;
      }
    }

    return ok;
  }

  #if defined( __aarch64__ )
  static size_t GetRegisterSize( uint32_t level, bool instruction )
  {
    rtems_interrupt_level isr_level;
    uint64_t              clidr;
    uint64_t              loc;
    uint64_t              ctype;
    uint64_t              csselr;
    uint64_t              ccsidr;

    __asm__ volatile ( "mrs %0, CLIDR_EL1" : "=r" ( clidr ) );
    loc = ( clidr >> 24 ) & 0x7;

    if ( level == 0 ) {
      level = (uint32_t) loc;
    }

    if ( level == 0 || level > loc ) {
      return 0;
    }

    ctype = ( clidr >> ( 3 * ( level - 1 ) ) ) & 0x7;

    if ( ctype == 4 ) {
      instruction = false;
    } else if ( ( ctype & ( instruction ? 1 : 2 ) ) == 0 ) {
      return 0;
    }

    csselr = ( (uint64_t) ( level - 1 ) << 1 ) | ( instruction ? 1 : 0 );
    rtems_interrupt_local_disable( isr_level );
    __asm__ volatile (
      "msr CSSELR_EL1, %1\n"
      "isb\n"
      "mrs %0, CCSIDR_EL1"
      : "=r" ( ccsidr )
      : "r" ( csselr )
    );
    rtems_interrupt_local_enable( isr_level );

    return ( (size_t) 1 << ( ( ccsidr & 0x7 ) + 4 ) ) *
      (size_t) ( ( ( ccsidr >> 3 ) & 0x3ff ) + 1 ) *
      (size_t) ( ( ( ccsidr >> 13 ) & 0x7fff ) + 1 );
  }
  #endif

  static bool CheckRegisterSizes( const size_t *sizes, bool instruction )
  {
  #if defined( __aarch64__ )
    uint32_t level;
    bool     ok;

    ok = true;

    for ( level = 0; level < CACHE_LEVEL_COUNT; ++level ) {
      size_t expected;

      expected = GetRegisterSize( level, instruction );

      if ( sizes[ level ] != expected ) {
        T_log(
          T_NORMAL,
          "level %" PRIu32 " size %zu != register size %zu",
          level,
          sizes[ level ],
          expected
        );
        ok = false;
      }

      if ( sizes[ level ] == 0 ) {
        break;
      }
    }

    return ok;
  #else
    (void) sizes;
    (void) instruction;

    return true;
  #endif
  }
