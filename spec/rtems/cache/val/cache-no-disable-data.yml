test-actions:
- action-brief: |
    Call the ${../if/disable-data:/name} directive.
  action-code: |
    SetFatalHandler( FatalRecordAndJump, NULL );

    if ( setjmp( fatal_before ) == 0 ) {
      rtems_cache_disable_data();
    }

    SetFatalHandler( NULL, NULL );
  checks:
  - brief: |
      Check that the right fatal error occurred.
    code: |
      T_eq_uint(
        _Atomic_Load_uint( &fatal_counter, ATOMIC_ORDER_RELAXED ),
        1
      );
      T_eq_int( fatal_source, INTERNAL_ERROR_CORE );
      T_eq_ulong(
        fatal_code,
        INTERNAL_ERROR_CANNOT_DISABLE_DATA_CACHE
      );
    links:
    - role: validation
      uid: ../req/no-disable-data
  links: []
- action-brief: |
    Call the ${../if/invalidate-entire-data:/name} directive.
  action-code: |
    rtems_cache_invalidate_entire_data();
  checks: []
  links:
  - role: validation
    uid: ../req/invalidate-entire-data
- action-brief: |
    Call the ${../if/invalidate-entire-data:/name} directive with maskable
    interrupts disabled.
  action-code: |
    rtems_interrupt_level level;

    rtems_interrupt_local_disable(level);
    rtems_cache_invalidate_entire_data();
    rtems_interrupt_local_enable(level);
  checks: []
  links:
  - role: validation
    uid: ../req/invalidate-entire-data
