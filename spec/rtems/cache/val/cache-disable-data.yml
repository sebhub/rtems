links: []
test-actions:
- action-brief: |
    Call the ${../if/disable-data:/name} and ${../if/enable-data:/name}
    directives.
  action-code: |
    T_step( ${.:/step} );
    rtems_cache_disable_data();
    T_step( ${.:/step} );
    rtems_cache_enable_data();
    T_step( ${.:/step} );
  checks: []
  links:
  - role: validation
    uid: ../req/disable-data
  - role: validation
    uid: ../req/enable-data
- action-brief: |
    Call the ${../if/disable-data:/name} and ${../if/enable-data:/name}
    directives with maskable interrupts disabled.
  action-code: |
    rtems_interrupt_level level;

    rtems_interrupt_local_disable(level);
    T_step( ${.:/step} );
    rtems_cache_disable_data();
    T_step( ${.:/step} );
    rtems_cache_enable_data();
    T_step( ${.:/step} );
    rtems_interrupt_local_enable(level);
  checks: []
  links:
  - role: validation
    uid: ../req/disable-data
  - role: validation
    uid: ../req/enable-data
- action-brief: |
    Call the ${../if/invalidate-entire-data:/name} directive with maskable
    interrupts disabled.
  action-code: |
    rtems_interrupt_level level;

    rtems_interrupt_local_disable(level);
    T_step( ${.:/step} );
    rtems_cache_disable_data();
    T_step( ${.:/step} );
    rtems_cache_invalidate_entire_data();
    T_step( ${.:/step} );
    rtems_cache_enable_data();
    T_step( ${.:/step} );
    rtems_interrupt_local_enable(level);
  checks: []
  links:
  - role: validation
    uid: ../req/invalidate-entire-data
test-brief: |
  Tests some ${../if/group:/name} directives.
