notes: |
  On some ${/glossary/target:/plural} or configurations, calling this directive
  may cause a fatal error with a fatal source of
  ${/score/interr/if/internal-error-core:/name} and fatal code of
  ${/score/interr/if/cannot-disable-data-cache:/name}.   The data cache may be
  necessary to provide ${/glossary/atomicoperations:/term}. In SMP
  configurations, the data cache may be required to ensure data coherency.  See
  the BSP documentation in the *RTEMS User Manual* for more information.
