post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      ctx->timer_id = 0;
      T_rsc_success( ctx->status );
    text: |
      The return status of ${../if/delete:/name} shall be
      ${../../status/if/successful:/name}.
  - name: InvId
    test-code: |
      T_rsc( ctx->status, RTEMS_INVALID_ID );
    text: |
      The return status of ${../if/delete:/name} shall be
      ${../../status/if/invalid-id:/name}.
  test-epilogue: null
  test-prologue: null
- name: Name
  states:
  - name: None
    test-code: |
      sc = rtems_timer_ident( NAME, &id );
      T_rsc( sc, RTEMS_INVALID_NAME );
    text: |
      The object name shall identify no timer.
  - name: Other
    test-code: |
      id = 0;
      sc = rtems_timer_ident( NAME, &id );
      T_rsc_success( sc );
      T_eq_u32( id, ctx->other_id );
    text: |
      The object name shall identify the other timer.
  test-epilogue: null
  test-prologue: |
    rtems_status_code sc;
    rtems_id          id;
- name: WaitForServer
  states:
  - name: 'Yes'
    test-code: |
      T_true( GetFlag( &ctx->waited ) != 0 );
    text: |
      The directive shall wait for the Timer Server task.
  - name: 'No'
    test-code: |
      T_false( GetFlag( &ctx->waited ) != 0 );
    text: |
      The directive shall wait for no ${/glossary/task:/term}.
  test-epilogue: null
  test-prologue: null
- name: YieldAllocMtx
  states:
  - name: 'Yes'
    test-code: |
      T_eq_uint( CallCounterGet( &AllocatorLockCounter ), 2 );
    text: |
      The directive shall release the object allocator mutex before it waits.
  - name: 'No'
    test-code: |
      T_eq_uint( CallCounterGet( &AllocatorLockCounter ), 1 );
    text: |
      The directive shall release the object allocator mutex when it ends and at no
      other time.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Id
  states:
  - name: NoObj
    test-code: |
      SetFlag( &ctx->valid_id, 0 );
    text: |
      While the ${../if/delete:/params[0]/name} parameter is not associated with a
      timer.
  - name: Timer
    test-code: |
      SetFlag( &ctx->valid_id, 1 );
    text: |
      While the ${../if/delete:/params[0]/name} parameter is associated with a timer.
  test-epilogue: null
  test-prologue: null
- name: Name
  states:
  - name: Unique
    test-code: |
      DropOther( ctx );
    text: |
      While no other timer carries the object name of the timer.
  - name: Found
    test-code: |
      NameDuplicate( ctx, true );
    text: |
      While another timer carries the object name of the timer, while a lookup of
      that name returns the timer.
  - name: Shadowed
    test-code: |
      NameDuplicate( ctx, false );
    text: |
      While another timer carries the object name of the timer, while a lookup of
      that name returns the other timer.
  test-epilogue: null
  test-prologue: null
- name: Server
  states:
  - name: None
    test-code: |
      FreshTimer( ctx );
      UseServer( ctx, false );
      SetFlag( &ctx->tickle, 0 );
    text: |
      While the system has no Timer Server task.
  - name: Idle
    test-code: |
      UseServer( ctx, true );
      SetFlag( &ctx->tickle, 0 );
    text: |
      While the Timer Server task runs no ${../glossary/timerserviceroutine:/term}.
  - name: Tickle
    test-code: |
      UseServer( ctx, true );
      SetFlag( &ctx->tickle, 1 );
    text: |
      While the Timer Server task runs a ${../glossary/timerserviceroutine:/term}.
  test-epilogue: null
  test-prologue: null
- name: Caller
  states:
  - name: Other
    test-code: |
      SetFlag( &ctx->self_delete, 0 );
    text: |
      While a ${/glossary/task:/term} other than the Timer Server task calls the
      directive.
  - name: Server
    test-code: |
      SetFlag( &ctx->self_delete, 1 );
    text: |
      While the Timer Server task calls the directive.
  test-epilogue: null
  test-prologue: null
rationale: |
  The directive waits for the ${../glossary/timerserviceroutine:/term} of a timer
  in ${../glossary/servercontext:/term}, because the Timer Server task calls that
  routine outside the lock of the server. A routine which calls the directive
  itself would wait for itself, so the directive tells the two callers apart. The
  dimension Server therefore carries one state per caller and one state for a
  timer whose routine does not run. A system which has no Timer Server task takes
  a state of its own. The directive returns for that system before it reads the
  state of any routine. A ${../if/delete:/params[0]/name} parameter which is
  associated with no timer leaves the Timer Server nothing to run, so the
  dimension does not apply to that case.
requirement-type: functional
skip-reasons:
  ServerIdle: |
    A caller which is the Timer Server task runs a
    ${../glossary/timerserviceroutine:/term}, so that task tickles.
test-action: |
  if ( GetFlag( &ctx->valid_id ) != 0 ) {
    ctx->id = ctx->timer_id;
  } else {
    ctx->id = 0;
  }

  if ( GetFlag( &ctx->tickle ) == 0 ) {
    ctx->caller_id = rtems_task_self();
    CallCounterObserve( &AllocatorLockCounter, ctx->caller_id );
    ctx->status = rtems_timer_delete( ctx->id );
  } else {
    rtems_status_code sc;

    if ( GetFlag( &ctx->self_delete ) != 0 ) {
      ctx->caller_id = ctx->server_id;
    } else {
      ctx->caller_id = ctx->worker_id;
    }

    CallCounterObserve( &AllocatorLockCounter, ctx->caller_id );

    sc = rtems_timer_server_fire_after( ctx->timer_id, 1, Routine, ctx );
    T_rsc_success( sc );

    /*
     * The tickle hands the timer to the Timer Server task.  That task has a
     * priority above every other task, so it runs the routine before this
     * directive returns.
     */
    ClockTick();

    if ( GetFlag( &ctx->self_delete ) == 0 ) {
      bool blocked;

      /* The condition variable of the Timer Server task blocks the delete. */
      blocked = WaitForBlockedState(
        ctx->worker_id,
        STATES_WAITING_FOR_CONDITION_VARIABLE,
        &ctx->delete_returned
      );
      SetFlag( &ctx->window_timed_out, !blocked );

      /*
       * The routine holds the window open, so a caller which waits is still
       * in the wait while this read happens.
       */
      SetFlag(
        &ctx->waited,
        ( GetThread( ctx->worker_id )->current_state &
          STATES_WAITING_FOR_CONDITION_VARIABLE ) != 0
      );

      /* Let the routine of the Timer Server task return. */
      SendEvents( ctx->server_id, RTEMS_EVENT_0 );
    }

    (void) WaitForFlag( &ctx->deleted );
  }
