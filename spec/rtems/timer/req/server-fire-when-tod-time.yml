  The item ${server-fire-when:/spec} states the return status of the directive
  for a valid and an invalid time of day.
requirement-type: functional
text: |
  The ${../if/server-fire-when:/name} directive shall validate and convert the
  time of the day of the time of day referenced by the
  ${../if/server-fire-when:/params[1]/name} parameter as specified by
  ${/score/tod/req/convert-time:/spec} where the directive validates the ticks of
  the time of day.
