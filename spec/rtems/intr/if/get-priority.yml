brief: |
  Gets the priority of the interrupt vector.
copyrights:
- Copyright (C) 2024 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - ${vector-number:/name} ${.:/params[0]/name}
    - ${/c/if/uint32_t:/name} *${.:/params[1]/name}
    return: ${../../status/if/code:/name}
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- role: constraint
  uid: /constraint/directive-ctx-isr
- role: constraint
  uid: /constraint/directive-ctx-devinit
- role: constraint
  uid: /constraint/directive-ctx-task
- role: constraint
  uid: /constraint/directive-no-preempt
name: rtems_interrupt_get_priority
notes: |
  The ${set-priority:/name} directive may be used to set the priority
  associated with an interrupt vector.
params:
- description: |
    is the interrupt vector number.
  dir: null
  name: vector
- description: |
    is the pointer to an ${/c/if/uint32_t:/name} object.  When the directive
    call is successful, the priority of the interrupt vector will
    be stored in this object.
  dir: out
  name: priority
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: ${../../status/if/successful:/name}
  - description: |
      The ${.:/params[1]/name} parameter was ${/c/if/null:/name}.
    value: ${../../status/if/invalid-address:/name}
  - description: |
      There was no interrupt vector associated with the number specified by
      ${.:/params[0]/name}.
    value: ${../../status/if/invalid-id:/name}
  - description: |
      There is no priority associated with the interrupt vector.
    value: ${../../status/if/unsatisfied:/name}
type: interface
