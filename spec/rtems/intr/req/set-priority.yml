enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/set-priority
post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_rsc_success( ctx->status );
    text: |
      The return status of ${../if/set-priority:/name} shall be
      ${../../status/if/successful:/name}.
  - name: InvId
    test-code: |
      T_rsc( ctx->status, RTEMS_INVALID_ID );
    text: |
      The return status of ${../if/set-priority:/name} shall be
      ${../../status/if/invalid-id:/name}.
  - name: InvPrio
    test-code: |
      T_rsc( ctx->status, RTEMS_INVALID_PRIORITY );
    text: |
      The return status of ${../if/set-priority:/name} shall be
      ${../../status/if/invalid-priority:/name}.
  - name: Unsat
    test-code: |
      T_rsc( ctx->status, RTEMS_UNSATISFIED );
    text: |
      The return status of ${../if/set-priority:/name} shall be
      ${../../status/if/unsatisfied:/name}.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Vector
  states:
  - name: Valid
    test-code: |
      ctx->vector = ctx->valid_vector;
    text: |
      While the ${../if/set-priority:/params[0]/name} parameter is
      associated with an interrupt vector.
  - name: Invalid
    test-code: |
      ctx->vector = BSP_INTERRUPT_VECTOR_COUNT;
    text: |
      While the ${../if/set-priority:/params[0]/name} parameter is not
      associated with an interrupt vector.
  test-epilogue: null
  test-prologue: null
- name: Priority
  states:
  - name: Valid
    test-code: |
      ctx->priority = ctx->current_priority;
    text: |
      While the ${../if/set-priority:/params[1]/name} parameter is a valid
      priority value.
  - name: Invalid
    test-code: |
      if ( ctx->maximum_priority < UINT32_MAX ) {
        ctx->priority = UINT32_MAX;
      } else {
        ${.:skip}
      }
    text: |
      While the ${../if/set-priority:/params[1]/name} parameter is an invalid
      priority value.
  test-epilogue: null
  test-prologue: null
- name: CanSetPriority
  states:
  - name: 'Yes'
    test-code: |
      if ( !ctx->can_set_priority ) {
        ${.:skip}
      }
    text: |
      While setting the priority for the interrupt vector specified by
      ${../if/set-priority:/params[0]/name} parameter is supported.
  - name: 'No'
    test-code: |
      if ( ctx->can_set_priority ) {
        ${.:skip}
      }
    text: |
      While setting the priority for the interrupt vector specified by
      ${../if/set-priority:/params[0]/name} parameter is not supported.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
requirement-type: functional
skip-reasons: {}
test-action: |
  ctx->status = rtems_interrupt_set_priority( ctx->vector, ctx->priority );
test-brief: null
test-cleanup: |
  (void) rtems_interrupt_set_priority( ctx->valid_vector, ctx->current_priority );
test-context:
- brief: |
    This member contains the current priority value.
  description: null
  member: |
    uint32_t current_priority
- brief: |
    This member specifies the ${../if/set-priority:/params[0]/name} parameter
    value.
  description: null
  member: |
    rtems_vector_number vector
- brief: |
    This member specifies the ${../if/set-priority:/params[1]/name} parameter
    value.
  description: null
  member: |
    uint32_t priority
- brief: |
    This member contains the return status.
  description: null
  member: |
    rtems_status_code status
test-context-support: null
test-description: null
test-header:
  code: null
  freestanding: false
  includes: []
  local-includes: []
  run-params:
  - description: |
      is a valid interrupt vector number.
    dir: in
    name: valid_vector
    specifier: ${../if/vector-number:/name} ${.:name}
  - description: |
      is the maximum supported priority value.
    dir: in
    name: maximum_priority
    specifier: uint32_t ${.:name}
  - description: |
      is true, if setting the priority is supported.
    dir: in
    name: can_set_priority
    specifier: bool ${.:name}
  target: testsuites/validation/tr-intr-set-priority.h
test-includes:
- rtems.h
- bsp/irq-generic.h
test-local-includes:
- tr-intr-set-priority.h
test-prepare: |
  ctx->current_priority = 0;
  (void) rtems_interrupt_get_priority(
    ctx->valid_vector,
    &ctx->current_priority
  );
test-setup: null
test-stop: null
test-support: null
test-target: testsuites/validation/tr-intr-set-priority.c
test-teardown: null
