    rtems_status_code expected_status
test-context-support: null
test-description: null
test-header: null
test-includes:
- rtems.h
- bsp/irq-generic.h
test-local-includes:
- tx-support.h
test-prepare: null
test-setup: null
test-stop: null
test-support: |
  typedef ${.:/test-context-type} Context;

  static void CheckSetPriority( Context *ctx, rtems_vector_number vector )
  {
    rtems_status_code sc;
    uint32_t          priority;

    if ( ctx->valid_priority ) {
      (void) rtems_interrupt_get_priority( vector, &priority );
    } else {
      priority = UINT32_MAX;
    }

    sc = rtems_interrupt_set_priority( vector, priority );
    T_rsc( sc, ctx->expected_status );
  }
test-target: testsuites/validation/tc-intr-set-priority.c
test-teardown: null
