post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      ctx->expected_status = RTEMS_SUCCESSFUL;
    text: |
      The return status of ${../if/set-priority:/name} shall be
      ${../../status/if/successful:/name}.
  - name: InvId
    test-code: |
      ctx->expected_status = RTEMS_INVALID_ID;
    text: |
      The return status of ${../if/set-priority:/name} shall be
      ${../../status/if/invalid-id:/name}.
  - name: InvPrio
    test-code: |
      ctx->expected_status = RTEMS_INVALID_PRIORITY;
    text: |
      The return status of ${../if/set-priority:/name} shall be
      ${../../status/if/invalid-priority:/name}.
  - name: Unsat
    test-code: |
      ctx->expected_status = RTEMS_UNSATISFIED;
    text: |
      The return status of ${../if/set-priority:/name} shall be
      ${../../status/if/unsatisfied:/name}.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Vector
  states:
  - name: Valid
    test-code: |
      ctx->valid_vector = true;
    text: |
      While the ${../if/set-priority:/params[0]/name} parameter is
      associated with an interrupt vector.
  - name: Invalid
    test-code: |
      ctx->valid_vector = false;
    text: |
      While the ${../if/set-priority:/params[0]/name} parameter is not
      associated with an interrupt vector.
  test-epilogue: null
  test-prologue: null
- name: Priority
  states:
  - name: Valid
    test-code: |
      ctx->valid_priority = true;
    text: |
      While the ${../if/set-priority:/params[1]/name} parameter is a valid
      priority value.
  - name: Invalid
    test-code: |
      ctx->valid_priority = false;
    text: |
      While the ${../if/set-priority:/params[1]/name} parameter is an invalid
      priority value.
  test-epilogue: null
  test-prologue: null
- name: CanSetPriority
  states:
  - name: 'Yes'
    test-code: |
      ctx->can_set_priority = true;
    text: |
      While setting the priority for the interrupt vector specified by
      ${../if/set-priority:/params[0]/name} parameter is supported.
  - name: 'No'
    test-code: |
      ctx->can_set_priority = false;
    text: |
      While setting the priority for the interrupt vector specified by
      ${../if/set-priority:/params[0]/name} parameter is not supported.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
requirement-type: functional
skip-reasons: {}
test-action: |
  /* Action carried out by CheckSetPriority() */
test-brief: null
test-cleanup: |
  if ( ctx->valid_vector ) {
    rtems_vector_number vector;

    for (
      vector = 0;
      vector < BSP_INTERRUPT_VECTOR_COUNT;
      ++vector
    ) {
      rtems_interrupt_attributes attr;
      rtems_status_code          sc;

      memset( &attr, 0, sizeof( attr ) );
      sc = rtems_interrupt_get_attributes( vector, &attr );

      if ( sc == RTEMS_INVALID_ID ) {
        continue;
      }

      T_rsc_success( sc );

      if ( attr.can_set_priority != ctx->can_set_priority ) {
        continue;
      }

      CheckSetPriority( ctx, vector );
    }
  } else {
    CheckSetPriority( ctx, BSP_INTERRUPT_VECTOR_COUNT );
  }
test-context:
- brief: |
    If this member is true, then the ${../if/set-priority:/params[0]/name}
    parameter shall be valid.
  description: null
