enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/get-priority
post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_rsc_success( ctx->status );
    text: |
      The return status of ${../if/get-priority:/name} shall be
      ${../../status/if/successful:/name}.
  - name: InvAddr
    test-code: |
      T_rsc( ctx->status, RTEMS_INVALID_ADDRESS );
    text: |
      The return status of ${../if/get-priority:/name} shall be
      ${../../status/if/invalid-address:/name}.
  - name: InvId
    test-code: |
      T_rsc( ctx->status, RTEMS_INVALID_ID );
    text: |
      The return status of ${../if/get-priority:/name} shall be
      ${../../status/if/invalid-id:/name}.
  - name: Unsat
    test-code: |
      T_rsc( ctx->status, RTEMS_UNSATISFIED );
    text: |
      The return status of ${../if/get-priority:/name} shall be
      ${../../status/if/unsatisfied:/name}.
  test-epilogue: null
  test-prologue: null
- name: PriorityObj
  states:
  - name: Set
    test-code: |
      T_ne_u32( ctx->priority_obj, PRIORITY_UNSET );
    text: |
      The value of the object referenced by the
      ${../if/get-priority:/params[1]/name} parameter shall be set by the
      directive call to a priority which the interrupt specified by the
      ${../if/get-priority:/params[0]/name} parameter had at some time point
      during the directive call.
  - name: Nop
    test-code: |
      T_eq_u32( ctx->priority_obj, PRIORITY_UNSET );
    text: |
      The value of the object referenced by the
      ${../if/get-priority:/params[1]/name} parameter shall not be changed by
      the directive call.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Vector
  states:
  - name: Valid
    test-code: |
      ctx->vector = ctx->valid_vector;
    text: |
      While the ${../if/get-priority:/params[0]/name} parameter is
      associated with an interrupt vector.
  - name: Invalid
    test-code: |
      ctx->vector = BSP_INTERRUPT_VECTOR_COUNT;
    text: |
      While the ${../if/get-priority:/params[0]/name} parameter is not
      associated with an interrupt vector.
  test-epilogue: null
  test-prologue: null
- name: Priority
  states:
  - name: Valid
    test-code: |
      ctx->priority = &ctx->priority_obj;
    text: |
      While the ${../if/get-priority:/params[1]/name} parameter references an
      object of type ${/c/if/uint32_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->priority = NULL;
    text: |
      While the ${../if/get-priority:/params[1]/name} parameter is equal to
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: CanGetPriority
  states:
  - name: 'Yes'
    test-code: |
      if ( !ctx->can_get_priority ) {
        ${.:skip}
      }
    text: |
      While getting the priority for the interrupt vector specified by
      ${../if/get-priority:/params[0]/name} parameter is supported.
  - name: 'No'
    test-code: |
      if ( ctx->can_get_priority ) {
        ${.:skip}
      }
    text: |
      While getting the priority for the interrupt vector specified by
      ${../if/get-priority:/params[0]/name} parameter is not supported.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
requirement-type: functional
skip-reasons: {}
test-action: |
  ctx->priority_obj = PRIORITY_UNSET;
  ctx->status = rtems_interrupt_get_priority( ctx->vector, ctx->priority );
test-brief: null
test-cleanup: null
