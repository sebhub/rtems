links:
- role: interface-function
  uid: ../if/get-priority
post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      ctx->expected_status = RTEMS_SUCCESSFUL;
    text: |
      The return status of ${../if/get-priority:/name} shall be
      ${../../status/if/successful:/name}.
  - name: InvAddr
    test-code: |
      ctx->expected_status = RTEMS_INVALID_ADDRESS;
    text: |
      The return status of ${../if/get-priority:/name} shall be
      ${../../status/if/invalid-address:/name}.
  - name: InvId
    test-code: |
      ctx->expected_status = RTEMS_INVALID_ID;
    text: |
      The return status of ${../if/get-priority:/name} shall be
      ${../../status/if/invalid-id:/name}.
  - name: Unsat
    test-code: |
      ctx->expected_status = RTEMS_UNSATISFIED;
    text: |
      The return status of ${../if/get-priority:/name} shall be
      ${../../status/if/unsatisfied:/name}.
  test-epilogue: null
  test-prologue: null
- name: PriorityObj
  states:
  - name: Set
    test-code: |
      ctx->expected_priority = PriorityIsSet;
    text: |
      The value of the object referenced by the
      ${../if/get-priority:/params[1]/name} parameter shall be set by the
      directive call to a priority which the interrupt specified by the
      ${../if/get-priority:/params[0]/name} parameter had at some time point
      during the directive call.
  - name: Nop
    test-code: |
      ctx->expected_priority = PriorityIsNotSet;
    text: |
      The value of the object referenced by the
      ${../if/get-priority:/params[1]/name} parameter shall not be changed by
      the directive call.
  test-epilogue: null
  test-prologue: |
    ctx->expected_priority = PriorityIsNotSet;
pre-conditions:
- name: Vector
  states:
  - name: Valid
    test-code: |
      ctx->valid_vector = true;
    text: |
      While the ${../if/get-priority:/params[0]/name} parameter is
      associated with an interrupt vector.
  - name: Invalid
    test-code: |
      ctx->valid_vector = false;
    text: |
      While the ${../if/get-priority:/params[0]/name} parameter is not
      associated with an interrupt vector.
  test-epilogue: null
  test-prologue: null
- name: Priority
  states:
  - name: Valid
    test-code: |
      ctx->priority = &ctx->priority_obj;
    text: |
      While the ${../if/get-priority:/params[1]/name} parameter references an
      object of type ${/c/if/uint32_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->priority = NULL;
    text: |
      While the ${../if/get-priority:/params[1]/name} parameter is equal to
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: CanGetPriority
  states:
  - name: 'Yes'
    test-code: |
      ctx->can_get_priority = true;
    text: |
      While getting the priority for the interrupt vector specified by
      ${../if/get-priority:/params[0]/name} parameter is supported.
  - name: 'No'
    test-code: |
      ctx->can_get_priority = false;
    text: |
      While getting the priority for the interrupt vector specified by
      ${../if/get-priority:/params[0]/name} parameter is not supported.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
requirement-type: functional
skip-reasons: {}
test-action: |
  /* Action carried out by CheckGetPriority() */
test-brief: null
test-cleanup: |
  if ( ctx->valid_vector ) {
    rtems_vector_number vector;

    for (
      vector = 0;
      vector < BSP_INTERRUPT_VECTOR_COUNT;
      ++vector
    ) {
      rtems_interrupt_attributes attr;
      rtems_status_code          sc;

      memset( &attr, 0, sizeof( attr ) );
      sc = rtems_interrupt_get_attributes( vector, &attr );

      if ( sc == RTEMS_INVALID_ID ) {
        continue;
      }

      T_rsc_success( sc );

      if ( attr.can_get_priority != ctx->can_get_priority ) {
        continue;
      }

      CheckGetPriority( ctx, vector );
    }
  } else {
    CheckGetPriority( ctx, BSP_INTERRUPT_VECTOR_COUNT );
  }
