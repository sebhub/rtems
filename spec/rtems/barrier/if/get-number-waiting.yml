brief: |
  Gets the number of tasks waiting at the barrier.
copyrights:
- Copyright (C) 2025 Mazen Adel Elmessady
definition:
  default:
    attributes: null
    body: null
    params:
    - ${../../type/if/id:/name} ${.:/params[0]/name}
    - ${/c/if/uint32_t:/name} *${.:/params[1]/name}
    return: ${../../status/if/code:/name}
  variants: []
description: |
  This directive gets the number of tasks waiting at the barrier specified by
  ${.:/params[0]/name}. The number of waiting tasks will be returned in
  ${.:/params[1]/name}.
enabled-by: true
index-entries:
- get number of tasks waiting at a barrier
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- role: constraint
  uid: /constraint/directive-not-pre-qualified
- role: constraint
  uid: /constraint/directive-ctx-isr
- role: constraint
  uid: /constraint/directive-ctx-task
name: rtems_barrier_get_number_waiting
notes: null
params:
- description: |
    is the barrier identifier.
  dir: null
  name: id
- description: |
    is the pointer to an ${/c/if/uint32_t:/name} object. When the directive
    call is successful, the number of waiting tasks will be stored in this
    object.
  dir: out
  name: waiting
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: ${../../status/if/successful:/name}
  - description: |
      The ${.:/params[1]/name} parameter was ${/c/if/null:/name}.
    value: ${../../status/if/invalid-address:/name}
  - description: |
      There was no barrier associated with the identifier specified by
      ${.:/params[0]/name}.
    value: ${../../status/if/invalid-id:/name}
type: interface
