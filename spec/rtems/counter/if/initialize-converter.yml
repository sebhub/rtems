brief: |
  Initializes the counter ticks to and from nanoseconds and signed binary time
  converter functions.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/uint32_t:/name} ${.:/params[0]/name}
    return: void
  variants: []
description: |
  Where the frequency is greater than zero, the function sets the
  ${/glossary/converterfrequency:/term} to the frequency. Where the frequency is
  zero, the function returns and leaves the ${/glossary/converterfrequency:/term}
  unchanged. The ${ticks-to-nanoseconds:/name}, ${nanoseconds-to-ticks:/name},
  ${ticks-to-sbintime:/name} and ${sbintime-to-ticks:/name} functions convert at
  the ${/glossary/converterfrequency:/term}.
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- role: constraint
  uid: /constraint/directive-ctx-any
- role: constraint
  uid: /constraint/directive-no-preempt
- role: constraint
  uid: ../constraint/converter-exclusive
name: rtems_counter_initialize_converter
notes: |
  The system initialization calls the function with the value which
  ${frequency:/name} returns. Before the first call, the
  ${/glossary/converterfrequency:/term} is 100000000 Hz.
params:
- description: |
    is the current counter frequency in Hz.
  dir: null
  name: frequency
return: null
type: interface
