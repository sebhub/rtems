name: rtems_counter_delay_nanoseconds
notes: |
  This function does not disable interrupts. Task switches and interrupts can
  prolong the delay. This function converts the nanoseconds into counter ticks
  with ${nanoseconds-to-ticks:/name}. The conversion rounds down or rounds up, so
  the busy wait time can be up to one counter tick shorter than the specified
  time. The overhead of the function can make the delay longer.
params:
- description: |
    is the busy wait time in nanoseconds.
