name: rtems_counter_delay_ticks
notes: |
  This function does not disable interrupts. Task switches and interrupts can
  prolong the delay. The function returns after the counter value changed by at
  least the count of ticks. The first counter read can occur just before a change
  of the counter. The busy wait can therefore be up to one counter period shorter
  than the count of ticks times the counter period. The overhead of the function
  can make the delay longer.
params:
- description: |
    is the minimum count of counter ticks which elapse during the busy wait.
