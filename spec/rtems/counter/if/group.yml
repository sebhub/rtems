description: |
  The ${/glossary/rtemscounter:/term} is a free-running counter. It usually ticks
  with a frequency close to the processor or system bus clock. A read of the
  counter has a low overhead. The conversion of ${/glossary/countertick:/plural}
  to and from time is a separate step. The ticks in the names of this group are
  ${/glossary/countertick:/plural}, not ${/glossary/clock-tick:/plural}. The
  counter works without a clock driver and during the system initialization.
  Applications can use the counter to profile low-level operations such as SMP
  locks or critical sections with interrupts disabled. The counter can also act
  as an entropy source for a random number generator. The period of the counter
  depends on the hardware.
enabled-by: true
