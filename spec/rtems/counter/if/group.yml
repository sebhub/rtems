description: |
  The RTEMS counter is some free-running counter. It ticks usually with a
  frequency close to the processor or system bus clock. The counter can be used
  in case the overhead of the ${../../clock/if/get-uptime-nanoseconds:/name} is
  too high. The step from counter ticks to/from nanoseconds is explicit in this
  API unlike to ${../../clock/if/get-uptime-nanoseconds:/name} which performs the
  conversion on each invocation. This counter works without a clock driver and
  during system initialization. The counter can be used to profile low-level
  operations like SMP locks or interrupt disabled critical sections. The counter
  can act also as an entropy source for a random number generator. The period of
  the counter depends on the actual hardware.
enabled-by: true
