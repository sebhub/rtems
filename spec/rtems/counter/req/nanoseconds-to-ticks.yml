enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/nanoseconds-to-ticks
post-conditions:
- name: Result
  states:
  - name: Bounded
    test-code: |
      exact = (uint64_t) ctx->nanoseconds * ctx->frequency;
      T_ge_u64( ctx->result, exact / UINT64_C( 1000000000 ) );
      T_le_u64(
        ctx->result,
        ( exact + UINT64_C( 999999999 ) ) / UINT64_C( 1000000000 )
      );
    text: |
      The ${../if/nanoseconds-to-ticks:/name} directive shall return the count of
      ${/glossary/countertick:/plural} in the time which the
      ${../if/nanoseconds-to-ticks:/params[0]/name} parameter specifies in
      nanoseconds at the ${/glossary/converterfrequency:/term}, rounded down or
      rounded up.
  - name: Saturated
    test-code: |
      T_eq_u32( ctx->result, UINT32_MAX );
    text: |
      The ${../if/nanoseconds-to-ticks:/name} directive shall return
      ${/c/if/uint32_max:/name}.
  test-epilogue: null
  test-prologue: |
    uint64_t exact;
pre-conditions:
- name: ConverterFrequency
  states:
  - name: Min
    test-code: |
      ctx->frequency = 1;
      rtems_counter_initialize_converter( ctx->frequency );
    text: |
      While the ${/glossary/converterfrequency:/term} is equal to one.
  - name: Low
    test-code: |
      ctx->frequency = UINT32_C( 123456789 );
      rtems_counter_initialize_converter( ctx->frequency );
    text: |
      While the ${/glossary/converterfrequency:/term} is greater than one, while the
      ${/glossary/converterfrequency:/term} is less than or equal to 1000000000.
  - name: High
    test-code: |
      ctx->frequency = UINT32_C( 2000000000 );
      rtems_counter_initialize_converter( ctx->frequency );
    text: |
      While the ${/glossary/converterfrequency:/term} is greater than 1000000000,
      while the ${/glossary/converterfrequency:/term} is less than the maximum value
      of ${/c/if/uint32_t:/name}.
  - name: Max
    test-code: |
      ctx->frequency = UINT32_MAX;
      rtems_counter_initialize_converter( ctx->frequency );
    text: |
      While the ${/glossary/converterfrequency:/term} is equal to the maximum value
      of ${/c/if/uint32_t:/name}.
  test-epilogue: null
  test-prologue: null
- name: Nanoseconds
  states:
  - name: Integral
    test-code: |
      ctx->nanoseconds = Limit( ctx->frequency ) > UINT32_C( 1000000000 )
                           ? UINT32_C( 1000000000 )
                           : 0;
    text: |
      While the ${../if/nanoseconds-to-ticks:/params[0]/name} parameter is less than
      the largest value of ${/c/if/uint32_t:/name} which specifies a time shorter
      than 4294967296 ${/glossary/countertick:/plural} at the
      ${/glossary/converterfrequency:/term}, while the
      ${../if/nanoseconds-to-ticks:/params[0]/name} parameter specifies the time of a
      whole number of ${/glossary/countertick:/plural} at the
      ${/glossary/converterfrequency:/term}.
  - name: Fraction
    test-code: |
      ctx->nanoseconds = 1;
    text: |
      While the ${../if/nanoseconds-to-ticks:/params[0]/name} parameter is less than
      the largest value of ${/c/if/uint32_t:/name} which specifies a time shorter
      than 4294967296 ${/glossary/countertick:/plural} at the
      ${/glossary/converterfrequency:/term}, while the
      ${../if/nanoseconds-to-ticks:/params[0]/name} parameter specifies no time of a
      whole number of ${/glossary/countertick:/plural} at the
      ${/glossary/converterfrequency:/term}.
  - name: Limit
    test-code: |
      ctx->nanoseconds = Limit( ctx->frequency );
    text: |
      While the ${../if/nanoseconds-to-ticks:/params[0]/name} parameter is equal to
      the largest value of ${/c/if/uint32_t:/name} which specifies a time shorter
      than 4294967296 ${/glossary/countertick:/plural} at the
      ${/glossary/converterfrequency:/term}.
  - name: Beyond
    test-code: |
      ctx->nanoseconds = Limit( ctx->frequency ) + 1;
    text: |
      While the ${../if/nanoseconds-to-ticks:/params[0]/name} parameter is greater
      than the largest value of ${/c/if/uint32_t:/name} which specifies a time
      shorter than 4294967296 ${/glossary/countertick:/plural} at the
      ${/glossary/converterfrequency:/term}.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension ConverterFrequency covers the converter frequencies in Hz, 4 states.
  The ${../if/initialize-converter:/name} directive keeps the converter frequency
  for a frequency of zero, so the states partition the range from one to the
  maximum value of ${/c/if/uint32_t:/name}. At a converter frequency greater than
  1000000000 Hz, the limit is less than the maximum value of
  ${/c/if/uint32_t:/name}, so values beyond the limit exist. The pre-condition
  ConverterFrequency comes first, because the arrangement of the other dimension
  depends on it.

  Dimension Nanoseconds covers the nanoseconds values, 4 states. A counter ticks
  value holds fewer than 4294967296 ticks.

  The states Integral and Fraction cover the values below the limit of the return
  type. They tell apart whether the exact value needs a rounding. The state Limit
  holds the largest value whose result fits the return type. The state Beyond
  holds the values above it.
requirement-type: functional
skip-reasons:
  NoBeyond: |
    At the converter frequency of the variant, the limit is the maximum value of
    the type of the parameter, so no value lies beyond it.
test-action: |
  ctx->result = rtems_counter_nanoseconds_to_ticks( ctx->nanoseconds );
test-brief: null
test-cleanup: |
  rtems_counter_initialize_converter( rtems_counter_frequency() );
test-context:
- brief: |
    This member contains the converter frequency.
  description: null
  member: uint32_t frequency
- brief: |
    This member contains the nanoseconds parameter value.
  description: null
  member: uint32_t nanoseconds
- brief: |
    This member contains the return value.
  description: null
  member: rtems_counter_ticks result
test-context-support: null
test-description: |
  The test initializes the converter with the frequency of the variant. It
  computes the limit of the variant from the frequency, independent of the
  converter. It converts the nanoseconds value of the variant and compares the
  result with the count rounded down and rounded up.
test-header: null
test-includes:
- rtems.h
- rtems/counter.h
test-local-includes: []
test-prepare: null
test-setup: null
test-stop: null
test-support: |
  static uint32_t Limit( uint32_t frequency )
  {
    uint64_t limit;

    limit = ( UINT64_C( 4294967296 ) * UINT64_C( 1000000000 ) - 1 ) / frequency;

    if ( limit > UINT32_MAX ) {
      limit = UINT32_MAX;
    }

    return (uint32_t) limit;
  }
test-target: testsuites/validation/tc-counter-nanoseconds-to-ticks.c
test-teardown: null
text: |
  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Result:
    - if:
        pre-conditions:
          Nanoseconds: Beyond
      then: Saturated
    - else: Bounded
  pre-conditions:
    ConverterFrequency:
    - High
    - Max
    Nanoseconds: all
- enabled-by: true
  post-conditions:
    Result: Bounded
  pre-conditions:
    ConverterFrequency:
    - Min
    - Low
    Nanoseconds:
    - Integral
    - Fraction
    - Limit
- enabled-by: true
  post-conditions: NoBeyond
  pre-conditions:
    ConverterFrequency:
    - Min
    - Low
    Nanoseconds:
    - Beyond
type: requirement
