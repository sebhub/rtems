enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/delay-nanoseconds
post-conditions:
- name: Elapsed
  states:
  - name: AtLeast
    test-code: |
      minimum = (uint64_t) ctx->nanoseconds * rtems_counter_frequency();
      minimum = ( minimum + UINT64_C( 999999999 ) ) / UINT64_C( 1000000000 );
      T_ge_u64(
        rtems_counter_difference( ctx->counter_after, ctx->counter_before ),
        minimum + 1
      );
    text: |
      The ${../if/delay-nanoseconds:/name} directive shall return after the
      ${/glossary/countertick:/plural} which elapse during the call span at least the
      time which the ${../if/delay-nanoseconds:/params[0]/name} parameter specifies
      in nanoseconds at the ${/glossary/converterfrequency:/term}.
  test-epilogue: null
  test-prologue: |
    uint64_t minimum;
pre-conditions:
- name: Nanoseconds
  states:
  - name: Zero
    test-code: |
      ctx->nanoseconds = 0;
    text: |
      While the ${../if/delay-nanoseconds:/params[0]/name} parameter is equal to
      zero.
  - name: Positive
    test-code: |
      ctx->nanoseconds = UINT32_C( 100000001 );
    text: |
      While the ${../if/delay-nanoseconds:/params[0]/name} parameter is greater than
      zero.
  test-epilogue: null
  test-prologue: null
rationale: |
  The implementation busy waits in steps of at most 100000000 nanoseconds. The
  state Positive arranges 100000001 nanoseconds, so the call busy waits in more
  than one step.
requirement-type: functional
skip-reasons: {}
test-action: |
  ctx->counter_before = rtems_counter_read();
  rtems_counter_delay_nanoseconds( ctx->nanoseconds );
  ctx->counter_after = rtems_counter_read();
test-brief: null
test-cleanup: null
test-context:
- brief: |
    This member contains the nanoseconds parameter value.
  description: null
  member: uint32_t nanoseconds
- brief: |
    This member contains the counter value before the call.
  description: null
  member: rtems_counter_ticks counter_before
- brief: |
    This member contains the counter value after the call.
  description: null
  member: rtems_counter_ticks counter_after
test-context-support: null
test-description: |
  The test reads the RTEMS counter before and after the call. The difference of
  the two values is the count of counter ticks which elapsed during the call,
  plus the time of one counter read. The time between the first and the last of
  these counter ticks is greater than the difference minus one counter period.
  The test checks that this lower bound covers the specified time. During the
  test, the converter frequency is the counter frequency. The measured interval
  includes the overhead of the call. The test therefore detects a shortfall of
  the busy wait only where the shortfall exceeds this overhead.
test-header: null
test-includes:
- rtems.h
- rtems/counter.h
test-local-includes: []
test-prepare: null
test-setup: null
test-stop: null
test-support: null
test-target: testsuites/validation/tc-counter-delay-nanoseconds.c
test-teardown: null
