- tx-support.h
test-prepare: |
  ctx->id = 0;
  memset( ctx->name_buf, 0xff, sizeof( ctx->name_buf ) );
test-setup:
  brief: null
  code: |
    ctx->information = _Objects_Information_table[ OBJECTS_CLASSIC_API ]
                                                 [ OBJECTS_RTEMS_TASKS ];
    ctx->maximum_id = ctx->information->maximum_id;
    ctx->object = &GetExecuting()->Object;
  description: null
test-stop: null
test-support: |
  static const char printable_name[] = "1234";

  static const char non_printable_name[] = "\x01\x1f\x7f\xff";

  static const char converted_name[] = "****";
test-target: testsuites/validation/tc-object-get-name.c
test-teardown:
  brief: null
  code: |
    ctx->information->maximum_id = ctx->maximum_id;
    ctx->information->name_length = 0;
    ctx->object->name.name_u32 = TEST_RUNNER_NAME;
  description: null
text: |
  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Result:
    - if:
      - pre-conditions:
          API: Zero
          Class: Zero
          Index: Zero
          LengthName: Valid
          Node: Zero
      - pre-conditions:
          API: Valid
          Class: ValidMaybeObjects
          Index: Valid
          LengthName: Valid
          Node: Valid
      then: Buffer
    - else: 'Null'
    Length:
    - if:
      - pre-conditions:
          API: Zero
          Class: Zero
          Index: Zero
          LengthName: Valid
          NameProperties: 'Null'
          Node: Zero
      - pre-conditions:
          API: Valid
          Class: ValidMaybeObjects
          Index: Valid
          LengthName: Valid
          NameProperties: 'Null'
          Node: Valid
      then: Empty
    - if:
      - pre-conditions:
          API: Zero
          Class: Zero
          Index: Zero
          LengthName: Valid
          Node: Zero
          ObjectNameLength: TooLong
      - pre-conditions:
          API: Valid
          Class: ValidMaybeObjects
          Index: Valid
          LengthName: Valid
          Node: Valid
          ObjectNameLength: TooLong
      then: Truncated
    - if:
      - pre-conditions:
          API: Zero
          Class: Zero
          Index: Zero
          LengthName: Valid
          Node: Zero
      - pre-conditions:
          API: Valid
          Class: ValidMaybeObjects
          Index: Valid
          LengthName: Valid
          Node: Valid
      then: Full
    - else: N/A
    Characters:
    - if:
      - pre-conditions:
          API: Zero
          Class: Zero
          Index: Zero
          LengthName: Valid
          NameProperties: Printable
          Node: Zero
      - pre-conditions:
          API: Valid
          Class: ValidMaybeObjects
          Index: Valid
          LengthName: Valid
          NameProperties: Printable
          Node: Valid
      then: Copied
    - if:
      - pre-conditions:
          API: Zero
          Class: Zero
          Index: Zero
          LengthName: Valid
          NameProperties: NonPrintable
          Node: Zero
      - pre-conditions:
          API: Valid
          Class: ValidMaybeObjects
          Index: Valid
          LengthName: Valid
          NameProperties: NonPrintable
          Node: Valid
      then: Replaced
    - else: N/A
  pre-conditions:
    API: all
    Class:
      applicable:
      - pre-conditions:
          API: Valid
      - pre-conditions:
          Class:
          - Zero
          - Invalid
      skip:
        condition:
        - pre-conditions:
            API:
            - Zero
            - Invalid
            Class:
            - ValidNoObjects
            - ValidMaybeObjects
        reason: NeedsAPI
    NameType:
      applicable:
      - pre-conditions:
          API: Valid
          Class:
          - ValidNoObjects
          - ValidMaybeObjects
      skip:
        condition:
          pre-conditions:
            API: Zero
            Class: Zero
            Index: Zero
            NameType: String
            Node: Zero
        reason: TasksHaveIntegerNames
    Node: all
    Index:
      applicable:
      - pre-conditions:
          API: Valid
          Class: ValidMaybeObjects
          Node: Valid
      - pre-conditions:
          Index:
          - Zero
          - Invalid
      skip:
        condition:
        - pre-conditions:
            API:
            - Zero
            - Invalid
            Index: Valid
        - pre-conditions:
            Class:
            - Zero
            - Invalid
            Index: Valid
        - pre-conditions:
            Index: Valid
            Node:
            - Zero
            - Invalid
        reason: NeedsAPIClassNode
    NameProperties:
      applicable:
      - pre-conditions:
          API: Zero
          Class: Zero
          Index: Zero
          Node: Zero
      - pre-conditions:
          API: Valid
          Class: ValidMaybeObjects
          Index: Valid
          Node: Valid
      skip:
        condition:
          pre-conditions:
            NameProperties: 'Null'
            NameType: Integer
        reason: NeedsStringName
    LengthName: all
    ObjectNameLength:
      applicable:
      - pre-conditions:
          API: Zero
          Class: Zero
          Index: Zero
          LengthName: Valid
          Node: Zero
      - pre-conditions:
          API: Valid
          Class: ValidMaybeObjects
          Index: Valid
          LengthName: Valid
          Node: Valid
      skip:
        condition:
          pre-conditions:
            NameProperties: 'Null'
            ObjectNameLength: TooLong
        reason: NullNameAlwaysFits
type: requirement
