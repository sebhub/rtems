requirement-type: functional
text: |
  While a ${../glossary/kernel-printflike:/term} directive processes a
  ${../glossary/conversion-specification:/term}, while no '.' character was
  consumed in the current conversion, when the directive consumes a leading '0'
  character from the ${../glossary/format-string:/term}, the directive shall set
  the padding character of the current conversion to '0'.
type: requirement
