  uid: kernel-printflike-width
rationale: null
references: []
requirement-type: functional
text: |
  While a ${../glossary/kernel-printflike:/term} directive processes a
  ${../glossary/conversion-specification:/term}, while no '.' character was
  consumed in the current conversion, while the integer value of the next
  argument is negative, when the directive consumes a '\*' character from the
  ${../glossary/format-string:/term}, the directive shall set the width of the
  current conversion to the negated integer value of the next argument.
type: requirement
