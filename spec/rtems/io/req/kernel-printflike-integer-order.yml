text: |
  The order from the highest priority to the lowest priority of the integer modes
  of a conversion of a ${../glossary/kernel-printflike:/term} directive shall be
  the maximum integer mode, the long integer mode, the short integer mode, the
  character integer mode, and the integer mode.
