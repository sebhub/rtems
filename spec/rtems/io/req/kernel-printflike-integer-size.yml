text: |
  While a ${../glossary/kernel-printflike:/term} directive processes a
  ${../glossary/conversion-specification:/term}, when the directive consumes a
  't' or 'z' character from the ${../glossary/format-string:/term}, the directive
  shall request the long integer mode for the current conversion.
