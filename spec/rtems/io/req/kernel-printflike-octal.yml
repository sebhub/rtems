requirement-type: functional
text: |
  While a ${../glossary/kernel-printflike:/term} directive processes a
  ${../glossary/conversion-specification:/term}, when the directive consumes an
  'o' character from the ${../glossary/format-string:/term}, the directive shall
  print the next argument as an unsigned integer in octal notation.
