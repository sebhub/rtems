requirement-type: functional
text: |
  While a ${../glossary/kernel-printflike:/term} directive processes a
  ${../glossary/conversion-specification:/term}, while the short integer mode is
  requested for the current conversion, when the directive consumes an 'h'
  character from the ${../glossary/format-string:/term}, the directive shall
  request the character integer mode instead of the short integer mode for the
  current conversion.
type: requirement
