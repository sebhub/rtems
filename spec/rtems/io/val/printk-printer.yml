test-actions:
- action-brief: |
    Call ${../if/printk-printer:/name} and ${../if/vprintk:/name} with the same
    format string and the same arguments. Capture the output of each call.
  action-code: |
    Output printer_output;
    Output vprintk_output;
    int    printer_rv;
    int    vprintk_rv;

    printer_rv = CallPrintkPrinter( &printer_output, FORMAT, 12, "ab" );
    vprintk_rv = CallVprintk( &vprintk_output, FORMAT, 12, "ab" );
  checks:
  - brief: |
      Check that ${../if/printk-printer:/name} printed the characters which
      ${../if/vprintk:/name} printed.
    code: |
      T_gt_sz( vprintk_output.size, 0 );
      T_eq_sz( printer_output.size, vprintk_output.size );
      T_eq_mem( printer_output.buf, vprintk_output.buf, vprintk_output.size );
    links:
    - role: validation
      uid: ../req/printk-printer-output
  - brief: |
      Check that ${../if/printk-printer:/name} returned the value which
      ${../if/vprintk:/name} returned.
    code: |
      T_eq_int( printer_rv, vprintk_rv );
    links:
    - role: validation
      uid: ../req/printk-printer-return
  links: []
- action-brief: |
    Call ${../if/print-printer-printk:/name} for a printer with a handler which is
    not ${../if/printk-printer:/name}.
  action-code: |
    rtems_printer printer;

    rtems_print_printer_empty( &printer );
    printer.printer = Unused;
    rtems_print_printer_printk( &printer );
  checks:
  - brief: |
      Check that the handler of the printer is ${../if/printk-printer:/name}.
    code: |
      T_eq_ptr( printer.printer, rtems_printk_printer );
    links:
    - role: validation
      uid: ../req/print-printer-printk
  links: []
test-brief: |
  Tests the ${../if/printk-printer:/name} and ${../if/print-printer-printk:/name}
  directives.
