test-actions:
- action-brief: |
    Call ${../if/printk:/name} with a format string which outputs a newline to
    notice the ${../if/putc:/name} newline translation.
  action-code: |
    KernelPrintflikeControl      *control;
    BSP_output_char_function_type output_char;
    int                           rv;

    control = &kernel_printflike_control;
    memset( control->buf, '\0', sizeof( control->buf ) );
    control->buf_index = 0;
    output_char = BSP_output_char;
    BSP_output_char = Putc;
    rv = printk( "\n" );
    BSP_output_char = output_char;
  checks:
  - brief: |
      Check that ${../if/printk:/name} used ${../if/putc:/name} for output.
    code: |
      T_eq_int( rv, 1 );
      T_eq_str( control->buf, "\r\n" );
    links:
    - role: validation
      uid: ../req/printk-putc
  links: []
- action-brief: |
    Call ${../if/vprintk:/name} with a format string which outputs a newline to
    notice the ${../if/putc:/name} newline translation.
  action-code: |
    KernelPrintflikeControl      *control;
    BSP_output_char_function_type output_char;
    int                           rv;

    control = &kernel_printflike_control;
    memset( control->buf, '\0', sizeof( control->buf ) );
    control->buf_index = 0;
    output_char = BSP_output_char;
    BSP_output_char = Putc;
    rv = CallVprintk( "\n" );
    BSP_output_char = output_char;
  checks:
  - brief: |
      Check that ${../if/vprintk:/name} used ${../if/putc:/name} for output.
    code: |
      T_eq_int( rv, 1 );
      T_eq_str( control->buf, "\r\n" );
    links:
    - role: validation
      uid: ../req/vprintk-putc
  links: []
- action-brief: |
    Check that ${../if/printk:/name} is a ${../glossary/kernel-printflike:/term}
    function.
  action-code: |
    KernelPrintflikeControl *control;

    control = &kernel_printflike_control;
    control->print_no_arg = PrintkNoArg;
    control->print_int = PrintkInt;
    control->print_int_int = PrintkIntInt;
    control->print_long = PrintkLong;
    control->print_intmax = PrintkIntmax;
    control->print_string = PrintkString;
    control->print_binary = PrintkBinary;
    ${kernel-printflike:/test-run}( control );
  checks: []
  links:
  - role: validation
    uid: ../req/printk
- action-brief: |
    Check that ${../if/vprintk:/name} is a ${../glossary/kernel-printflike:/term}
    function.
  action-code: |
    KernelPrintflikeControl *control;

    control = &kernel_printflike_control;
    control->print_no_arg = VprintkNoArg;
    control->print_int = VprintkInt;
    control->print_int_int = VprintkIntInt;
    control->print_long = VprintkLong;
    control->print_intmax = VprintkIntmax;
    control->print_string = VprintkString;
    control->print_binary = VprintkBinary;
    ${kernel-printflike:/test-run}( control );
  checks: []
  links:
  - role: validation
    uid: ../req/vprintk
test-brief: |
  Tests the ${../glossary/kernel-printflike:/term} directives.
