term: conversion specification
text: |
  A *conversion specification* contained in a ${format-string:/term} of a
  ${kernel-printflike:/term} directive starts with a '%' character followed by
  optional width, sign, precision, and alternate form elements and ends with a
  conversion specifier. They define how associated arguments are printed.
type: glossary
