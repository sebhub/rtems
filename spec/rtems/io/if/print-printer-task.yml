brief: |
  Creates a printer task.
copyrights:
- Copyright (C) 2016, 2026 embedded brains GmbH & Co. KG
- Copyright (C) 2016 Chris Johns
definition:
  default:
    attributes: null
    body: null
    params:
    - ${printer-type:/name} *${.:/params[0]/name}
    - ${printer-task-context:/name} *${.:/params[1]/name}
    return: int
  variants: []
description: |
  Print requests through ${printf:/name} or ${vprintf:/name} with a printer task
  printer output to a buffer. The directive places the buffer on a work queue in
  FIFO order. The printer task empties the work queue. It writes the content of
  each buffer to the file descriptor of the context. The buffers come from the
  pool of buffers which the context specifies.
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header-5
- role: interface-ingroup
  uid: group-print-support-rtems
- role: constraint
  uid: /constraint/directive-not-pre-qualified
- role: constraint
  uid: /constraint/directive-ctx-task
name: rtems_print_printer_task
notes: null
params:
- description: |
    is the printer to initialize.
  dir: out
  name: printer
- description: |
    is the initialized printer task context.
  dir: in
  name: context
return:
  return: |
    Returns 0 for a successful operation, EINVAL for invalid context parameters and
    ENOMEM for missing resources.
  return-values: []
type: interface
