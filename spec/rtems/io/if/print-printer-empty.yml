definition:
  default:
    attributes: null
    body: |
      ${.:/params[0]/name}->${printer:/definition[0]/default/name} =
        ${/c/if/null:/name};
      ${.:/params[0]/name}->${printer:/definition[1]/default/name} =
        ${/c/if/null:/name};
    params:
    - ${printer-type:/name} *${.:/params[0]/name}
    return: void
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header-5
- role: interface-ingroup
  uid: group-print-support-rtems
- role: constraint
  uid: /constraint/directive-not-pre-qualified
- role: constraint
  uid: /constraint/directive-ctx-any
- role: constraint
  uid: /constraint/directive-no-preempt
name: rtems_print_printer_empty
notes: |
  An empty printer prints nothing. It can be used to enable and disable the
  output of a print implementation.
params:
- description: |
    is the printer to initialize.
  dir: out
  name: printer
return:
  return: null
  return-values: []
type: interface
