enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/get-tod
post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_rsc_success( ctx->status );
    text: |
      The return status of ${../if/get-tod:/name} shall be
      ${../../status/if/successful:/name}.
  - name: InvAddr
    test-code: |
      T_rsc( ctx->status, RTEMS_INVALID_ADDRESS );
    text: |
      The return status of ${../if/get-tod:/name} shall be
      ${../../status/if/invalid-address:/name}.
  - name: NotDef
    test-code: |
      T_rsc( ctx->status, RTEMS_NOT_DEFINED );
    text: |
      The return status of ${../if/get-tod:/name} shall be
      ${../../status/if/not-defined:/name}.
  test-epilogue: null
  test-prologue: null
- name: Value
  states:
  - name: TimeOfDay
    test-code: |
      T_eq_u32( ctx->tod.year, ctx->expected.year );
      T_eq_u32( ctx->tod.month, ctx->expected.month );
      T_eq_u32( ctx->tod.day, ctx->expected.day );
      T_eq_u32( ctx->tod.hour, ctx->expected.hour );
      T_eq_u32( ctx->tod.minute, ctx->expected.minute );
      T_eq_u32( ctx->tod.second, ctx->expected.second );
      T_eq_u32( ctx->tod.ticks, ctx->expected.ticks );
    text: |
      The object referenced by the ${../if/get-tod:/params[0]/name} parameter shall
      be set to the time of day of the ${/glossary/clock-realtime:/term} at a point
      in time during the ${../if/get-tod:/name} call.
  - name: Unchanged
    test-code: |
      T_eq_u32( ctx->tod.year, 1 );
      T_eq_u32( ctx->tod.month, 1 );
      T_eq_u32( ctx->tod.day, 1 );
      T_eq_u32( ctx->tod.hour, 1 );
      T_eq_u32( ctx->tod.minute, 1 );
      T_eq_u32( ctx->tod.second, 1 );
      T_eq_u32( ctx->tod.ticks, 1 );
    text: |
      The object referenced by the ${../if/get-tod:/params[0]/name} parameter shall
      not be modified by the ${../if/get-tod:/name} call.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Set
  states:
  - name: 'Yes'
    test-code: |
      ctx->set = true;
    text: |
      While the ${/glossary/clock-realtime:/term} was set at least once.
  - name: 'No'
    test-code: |
      ctx->set = false;
    text: |
      While the ${/glossary/clock-realtime:/term} was never set.
  test-epilogue: null
  test-prologue: null
- name: Year
  states:
  - name: Earliest
    test-code: |
      ctx->year = YEAR_EARLIEST;
    text: |
      While the year of the ${/glossary/clock-realtime:/term} is 1988.
  - name: Valid
    test-code: |
      ctx->year = YEAR_VALID;
    text: |
      While the year of the ${/glossary/clock-realtime:/term} is greater than 1988
      and less than 2514.
  - name: Latest
    test-code: |
      ctx->year = YEAR_LATEST;
    text: |
      While the year of the ${/glossary/clock-realtime:/term} is 2514, while the
      ${/glossary/clock-realtime:/term} is before the ${/glossary/clock-tick:/term}
      which ends at its latest time point.
  - name: End
    test-code: |
      ctx->year = YEAR_END;
    text: |
      While the ${/glossary/clock-realtime:/term} is in the
      ${/glossary/clock-tick:/term} which ends at its latest time point.
  test-epilogue: null
  test-prologue: null
- name: LeapYear
  states:
  - name: Common
    test-code: |
      ctx->leap_year = LEAP_YEAR_COMMON;
    text: |
      While the year of the ${/glossary/clock-realtime:/term} is not divisible by
      four.
  - name: Leap4
    test-code: |
      ctx->leap_year = LEAP_YEAR_4;
    text: |
      While the year of the ${/glossary/clock-realtime:/term} is divisible by four
      and not divisible by 100.
  - name: Century
    test-code: |
      ctx->leap_year = LEAP_YEAR_CENTURY;
    text: |
      While the year of the ${/glossary/clock-realtime:/term} is divisible by 100 and
      not divisible by 400.
  - name: Leap400
    test-code: |
      ctx->leap_year = LEAP_YEAR_400;
    text: |
      While the year of the ${/glossary/clock-realtime:/term} is divisible by 400.
  test-epilogue: null
  test-prologue: null
- name: Month
  states:
  - name: January
    test-code: |
      ctx->month = 1;
    text: |
      While the month of the ${/glossary/clock-realtime:/term} is January.
  - name: February
    test-code: |
      ctx->month = 2;
    text: |
      While the month of the ${/glossary/clock-realtime:/term} is February.
  - name: Between
    test-code: |
      ctx->month = 4;
    text: |
      While the month of the ${/glossary/clock-realtime:/term} is after February and
      before December.
  - name: December
    test-code: |
      ctx->month = 12;
    text: |
      While the month of the ${/glossary/clock-realtime:/term} is December.
  test-epilogue: null
  test-prologue: null
- name: Day
  states:
  - name: First
    test-code: |
      ctx->day = DAY_FIRST;
    text: |
      While the day of the ${/glossary/clock-realtime:/term} is the first day of the
      month.
  - name: Between
    test-code: |
      ctx->day = DAY_BETWEEN;
    text: |
      While the day of the ${/glossary/clock-realtime:/term} is after the first day
      and before the last day of the month.
  - name: Last
    test-code: |
      ctx->day = DAY_LAST;
    text: |
      While the day of the ${/glossary/clock-realtime:/term} is the last day of the
      month.
  test-epilogue: null
  test-prologue: null
- name: DayPart
  states:
  - name: Begin
    test-code: |
      ctx->day_part = DAY_PART_BEGIN;
    text: |
      While the ${/glossary/clock-realtime:/term} is in the first
      ${/glossary/clock-tick:/term} of a day.
  - name: Between
    test-code: |
      ctx->day_part = DAY_PART_BETWEEN;
    text: |
      While the ${/glossary/clock-realtime:/term} is after the first
      ${/glossary/clock-tick:/term} and before the last ${/glossary/clock-tick:/term}
      of a day.
  - name: End
    test-code: |
      ctx->day_part = DAY_PART_END;
    text: |
      While the ${/glossary/clock-realtime:/term} is in the last
      ${/glossary/clock-tick:/term} of a day.
  test-epilogue: null
  test-prologue: null
- name: Param
  states:
  - name: Valid
    test-code: |
      ctx->tod_ref = &ctx->tod;
    text: |
      While the ${../if/get-tod:/params[0]/name} parameter references an object of
      type ${../../type/if/time-of-day:/name}.
  - name: 'Null'
    test-code: |
      ctx->tod_ref = NULL;
    text: |
      While the ${../if/get-tod:/params[0]/name} parameter is equal to
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension Set covers the state of the ${/glossary/clock-realtime:/term}, 2
  states. Dimension Year covers the year, 4 states. Dimension LeapYear covers the
  class of the year, 4 states. Dimension Month covers the month, 4 states.
  Dimension Day covers the day of the month, 3 states. Dimension DayPart covers
  the time of the day, 3 states. Dimension Param covers the parameter
  time_of_day, 2 states.

  The documentation of rtems_clock_set() gives the range of the
  ${/glossary/clock-realtime:/term} from 1988-01-01T00:00:00.000000000Z to
  2514-05-30T01:53:03.999999999Z. The state End arranges the start of the clock
  tick which ends at this latest time point. It fixes every other pre-condition,
  so the item skips their other combinations. The year 2514 ends early, so the
  item skips December of 2514. Some years fix the leap year class, so the item
  skips the other classes of these years.

  The test sets the ${/glossary/clock-realtime:/term} with
  \_Timecounter_Set_clock() to the seconds which DaysFromCivil() derives. This
  avoids the conversion of rtems_clock_set() and its latest year 2400, so the
  conversion of the directive is checked against an independent algorithm. The
  state Between of the month arranges April. The state End of the day part
  arranges the start of the last clock tick of the day. The check allows the
  progress of the clock during the call.
requirement-type: functional
skip-reasons:
  AfterRange: |
    The time of the state is after the latest time point of the
    ${/glossary/clock-realtime:/term}.
  FixedTime: |
    The latest time point fixes the other pre-conditions.
  YearClass: |
    The year of the state is a year of another class.
test-action: |
  if ( ctx->set ) {
    SetClock( ctx );
  } else {
    UnsetClock();
  }

  ctx->status = rtems_clock_get_tod( ctx->tod_ref );
test-brief: null
test-cleanup: |
  ISR_lock_Context lock_context;
  Status_Control   status;

  _Objects_Allocator_lock();
  _TOD_Acquire( &lock_context );
  status = _TOD_Set( &ts_earliest, &lock_context );
  _Objects_Allocator_unlock();
  T_eq_int( status, STATUS_SUCCESSFUL );
  UnsetClock();
