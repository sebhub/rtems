test-context-support: |
  typedef enum { YEAR_EARLIEST, YEAR_VALID, YEAR_LATEST, YEAR_END } Year;

  typedef enum {
    LEAP_YEAR_COMMON,
    LEAP_YEAR_4,
    LEAP_YEAR_CENTURY,
    LEAP_YEAR_400
  } LeapYear;

  typedef enum { DAY_FIRST, DAY_BETWEEN, DAY_LAST } Day;

  typedef enum { DAY_PART_BEGIN, DAY_PART_BETWEEN, DAY_PART_END } DayPart;
