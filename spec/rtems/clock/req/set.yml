enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/set
post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_rsc_success( ctx->status );
    text: |
      The return status of ${../if/set:/name} shall be
      ${../../status/if/successful:/name}.
  - name: InvAddr
    test-code: |
      T_rsc( ctx->status, RTEMS_INVALID_ADDRESS );
    text: |
      The return status of ${../if/set:/name} shall be
      ${../../status/if/invalid-address:/name}.
  - name: InvClock
    test-code: |
      T_rsc( ctx->status, RTEMS_INVALID_CLOCK );
    text: |
      The return status of ${../if/set:/name} shall be
      ${../../status/if/invalid-clock:/name}.
  - name: Unsatisfied
    test-code: |
      T_rsc( ctx->status, RTEMS_UNSATISFIED );
    text: |
      The return status of ${../if/set:/name} shall be
      ${../../status/if/unsatisfied:/name}.
  test-epilogue: null
  test-prologue: null
- name: Clock
  states:
  - name: Set
    test-code: |
      CheckClockSet( ctx );
    text: |
      The ${/glossary/clock-realtime:/term} shall be set to the time of day
      referenced by the ${../if/set:/params[0]/name} parameter.
  - name: Nop
    test-code: |
      CheckClockNop( ctx );
    text: |
      The ${/glossary/clock-realtime:/term} shall not be changed by the
      ${../if/set:/name} call.
  test-epilogue: null
  test-prologue: null
- name: Timer
  states:
  - name: Triggered
    test-code: |
      T_eq_int( ctx->timer_routine_counter, 1 );
      T_eq_i64( ctx->timer_routine_seconds, ctx->expected_seconds );
    text: |
      The timer routine shall be executed once after the
      ${/glossary/clock-realtime:/term} is set and before the ${../if/set:/name} call
      returns.
  - name: Nop
    test-code: |
      T_eq_int( ctx->timer_routine_counter, 0 );
    text: |
      The timer routine shall not be executed during the ${../if/set:/name} call.
  test-epilogue: null
  test-prologue: null
- name: HookCall
  states:
  - name: Once
    test-code: |
      T_eq_int( ctx->hook_calls, 1 );
      T_eq_int( ctx->hook_action, TOD_ACTION_SET_CLOCK );
      T_eq_i64( ctx->hook_tod.tv_sec, ctx->expected_seconds );
      T_eq_long(
        ctx->hook_tod.tv_nsec,
        (long) ( ctx->target_tod_value.ticks *
                 rtems_configuration_get_nanoseconds_per_tick() )
      );
    text: |
      The TOD hook shall be called once with the action to set the clock and the time
      of day referenced by the ${../if/set:/params[0]/name} parameter.
  - name: Nop
    test-code: |
      T_eq_int( ctx->hook_calls, 0 );
    text: |
      The TOD hook shall not be called by the ${../if/set:/name} call.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Timer
  states:
  - name: None
    test-code: |
      ctx->target_tod_value = (rtems_time_of_day) {
        2021,
        3,
        11,
        11,
        10,
        59,
        rtems_clock_get_ticks_per_second() / 2
      };
    text: |
      While no timer of the ${/glossary/clock-realtime:/term} is scheduled.
  - name: Future
    test-code: |
      ctx->target_tod_value = (rtems_time_of_day) { 1988, 12, 31, 23, 59, 59, 0 };
      PrepareTimer( ctx );
    text: |
      While exactly one timer of the ${/glossary/clock-realtime:/term} is scheduled
      to fire at a time point after the time of day which the
      ${../if/set:/params[0]/name} parameter specifies.
  - name: Now
    test-code: |
      ctx->target_tod_value = (rtems_time_of_day) { 1989, 1, 1, 0, 0, 0, 0 };
      PrepareTimer( ctx );
    text: |
      While exactly one timer of the ${/glossary/clock-realtime:/term} is scheduled
      to fire at the time of day which the ${../if/set:/params[0]/name} parameter
      specifies.
  - name: Past
    test-code: |
      ctx->target_tod_value = (rtems_time_of_day) { 1989, 1, 1, 1, 0, 0, 0 };
      PrepareTimer( ctx );
    text: |
      While exactly one timer of the ${/glossary/clock-realtime:/term} is scheduled
      to fire at a time point before the time of day which the
      ${../if/set:/params[0]/name} parameter specifies.
  test-epilogue: null
  test-prologue: null
- name: Hook
  states:
  - name: None
    test-code: |
      ctx->register_hook = false;
    text: |
      While no TOD hook is registered.
  - name: Success
    test-code: |
      ctx->register_hook = true;
      ctx->hook_status = STATUS_SUCCESSFUL;
    text: |
      While exactly one TOD hook is registered, while the hook returns a
      ${/glossary/statuscode:/term} equal to ${/score/status/if/successful:/name}.
  - name: Failure
    test-code: |
      ctx->register_hook = true;
      ctx->hook_status = STATUS_UNAVAILABLE;
    text: |
      While exactly one TOD hook is registered, while the hook returns a
      ${/glossary/statuscode:/term} equal to ${/score/status/if/unavailable:/name}.
  test-epilogue: null
  test-prologue: null
- name: ToD
  states:
  - name: Valid
    test-code: |
      ctx->target_tod = &ctx->target_tod_value;
    text: |
      While the ${../if/set:/params[0]/name} parameter references an object of type
      ${../../type/if/time-of-day:/name}, while the object holds a valid time of day.
  - name: Invalid
    test-code: |
      ctx->target_tod = &ctx->target_tod_value;
      ctx->target_tod_value.month = 13;
    text: |
      While the ${../if/set:/params[0]/name} parameter references an object of type
      ${../../type/if/time-of-day:/name}, while the object holds an invalid time of
      day.
  - name: 'Null'
    test-code: |
      ctx->target_tod = NULL;
    text: |
      While the ${../if/set:/params[0]/name} parameter is equal to
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension Timer covers the timers of the realtime clock relative to the new
  time of day, 4 states. Dimension Hook covers the TOD hooks and their status, 3
  states. Dimension ToD covers the parameter tod, 3 states.

  The dimensions Timer and Hook hold at most one timer and at most one TOD hook.
  The watchdog items state the order in which several timers fire.

  The Timer states relate a timer to the time of day of the parameter. A null
  pointer and an invalid time of day specify no time of day, so the item skips
  the Timer states which need one. The state Invalid arranges an invalid month.

  The items ${set-tod-date:/spec} and ${set-tod-time:/spec} state the validation
  and the conversion of the time of day in detail.

  The check of the ${/glossary/clock-realtime:/term} accepts a progress of less
  than one ${/glossary/clock-tick:/term} during the call.
requirement-type: functional
skip-reasons:
  NoTime: |
    The parameter specifies no time of day.
test-action: |
  TOD_Hook hook = {
    .handler = TODHook
  };

  if ( ctx->register_hook ) {
    _TOD_Hook_Register( &hook );
  }

  ctx->expected_seconds = GetSeconds( &ctx->target_tod_value );
  rtems_clock_get_realtime( &ctx->realtime_before );
  ctx->status = rtems_clock_set( ctx->target_tod );
  rtems_clock_get_realtime( &ctx->realtime_after );

  if ( ctx->register_hook ) {
    _TOD_Hook_Unregister( &hook );
  }
