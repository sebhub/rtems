enabled-by: true
functional-type: action
links:
- role: requirement-refinement
  uid: group
- role: interface-function
  uid: ../object/if/search-all-nodes
- role: interface-function
  uid: ../object/if/search-local-node
- role: interface-function
  uid: ../object/if/search-other-nodes
post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_rsc( ctx->status, RTEMS_SUCCESSFUL );
    text: |
      The return status shall be ${../status/if/successful:/name}.
  - name: InvAddr
    test-code: |
      T_rsc( ctx->status, RTEMS_INVALID_ADDRESS );
    text: |
      The return status shall be ${../status/if/invalid-address:/name}.
  - name: InvName
    test-code: |
      T_rsc( ctx->status, RTEMS_INVALID_NAME );
    text: |
      The return status shall be ${../status/if/invalid-name:/name}.
  - name: InvNode
    test-code: |
      T_rsc( ctx->status, RTEMS_INVALID_NODE );
    text: |
      The return status shall be ${../status/if/invalid-node:/name}.
  test-epilogue: null
  test-prologue: null
- name: Id
  states:
  - name: Nop
    test-code: |
      T_eq_ptr( ctx->id, &ctx->id_value );
      T_eq_u32( ctx->id_value, 0xffffffff );
    text: |
      The value of the object identifier referenced by the id parameter shall be the
      value before the action.
  - name: 'Null'
    test-code: |
      T_null( ctx->id )
    text: |
      The `id` parameter shall be ${/c/if/null:/name}.
  - name: LocalObj
    test-code: |
      T_eq_ptr( ctx->id, &ctx->id_value );
      T_eq_u32( ctx->id_value, ctx->id_local_object );
    text: |
      The value of the object identifier referenced by the `id` parameter shall be
      the identifier of the object with the lowest object index of the active objects
      of the specified class on the local node with a name equal to the `name`
      parameter.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Name
  states:
  - name: Invalid
    test-code: |
      ctx->name = 1;
    text: |
      While the `name` parameter is not equal to the name of an active object of the
      specified class on the local node.
  - name: Valid
    test-code: |
      ctx->name = ctx->name_local_object;
    text: |
      While the `name` parameter is equal to the name of an active object of the
      specified class on the local node.
  test-epilogue: null
  test-prologue: null
- name: Node
  states:
  - name: Local
    test-code: |
      ctx->node = rtems_object_get_local_node();
    text: |
      While the `node` parameter is the local node number.
  - name: Remote
    test-code: |
      /* Not constructible on one node */
    text: |
      While the `node` parameter is a valid node number other than the local node
      number.
  - name: Invalid
    test-code: |
      ctx->node = (uint32_t) _Objects_Maximum_nodes + 1;
    text: |
      While the `node` parameter is greater than the maximum node count of the
      system.
  - name: SearchAll
    test-code: |
      ctx->node = RTEMS_SEARCH_ALL_NODES;
    text: |
      While the `node` parameter is ${../object/if/search-all-nodes:/name}.
  - name: SearchOther
    test-code: |
      ctx->node = RTEMS_SEARCH_OTHER_NODES;
    text: |
      While the `node` parameter is ${../object/if/search-other-nodes:/name}.
  - name: SearchLocal
    test-code: |
      ctx->node = RTEMS_SEARCH_LOCAL_NODE;
    text: |
      While the `node` parameter is ${../object/if/search-local-node:/name}.
  test-epilogue: null
  test-prologue: null
- name: RemoteObj
  states:
  - name: Absent
    test-code: |
      /* The system has one node */
    text: |
      While no object of the specified class with a name equal to the `name`
      parameter exists on a node other than the local node.
  - name: Exists
    test-code: |
      /* Not constructible on one node */
    text: |
      While an object of the specified class with a name equal to the `name`
      parameter exists on a node other than the local node.
  test-epilogue: null
  test-prologue: null
- name: Id
  states:
  - name: Valid
    test-code: |
      ctx->id_value = 0xffffffff;
      ctx->id = &ctx->id_value;
    text: |
      While the `id` parameter references an object of type ${../type/if/id:/name}.
  - name: 'Null'
    test-code: |
      ctx->id = NULL;
    text: |
      While the `id` parameter is ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
rationale: |
  The interface item of each object identification directive states the values of
  the `node` parameter. It is a valid node number,
  ${../object/if/search-all-nodes:/name}, ${../object/if/search-local-node:/name}
  or ${../object/if/search-other-nodes:/name}. The notes of the interface item
  state the search order. The interface item states
  ${../status/if/invalid-node:/name} for an invalid node only in multiprocessing
  configurations.

  The MPCI configuration defines the valid node numbers as one up to the maximum
  node count. A system without a multiprocessing application has one node with
  the node number one.

  Dimension Name covers whether the `name` parameter names an active object of
  the class on the local node, 2 states.

  Dimension Node covers three node number sets and the three search constants, 6
  states. The node number sets are the local node number, the other valid node
  numbers and the numbers above the maximum node count.

  Dimension RemoteObj covers whether an object of the class with the name exists
  on a node other than the local node, 2 states.

  Dimension Id covers whether the `id` parameter is ${/c/if/null:/name}, 2
  states.

  Without multiprocessing, the maximum node count is the constant one. The Node
  state Remote and the RemoteObj state Exists are then empty.

  With multiprocessing, a system with two or more nodes has both states. The test
  runs on a system with one node, which is a limit of the vehicle. It constructs
  neither state.
requirement-type: functional
skip-reasons:
  NotExist: |
    Without multiprocessing, the maximum node count is the constant one. The system
    has no node other than the local node, so the pre-condition combination cannot
    be produced and does therefore not exist.
  OneNode: |
    The test runs on a system with one node. Such a system has no node other than
    the local node and no object on such a node.
test-action: |
  ctx->status = ( *ctx->action )( ctx->name, ctx->node, ctx->id );
