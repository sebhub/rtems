brief: |
  Gets the processor time used by the task.
copyrights:
- Copyright (C) 2026 Abdullah Wasiq
definition:
  default:
    attributes: null
    body: null
    params:
    - ${../../type/if/id:/name} ${.:/params[0]/name}
    - ${/c/if/timespec:/name} *${.:/params[1]/name}
    return: ${../../status/if/code:/name}
  variants: []
description: |
  This directive returns the processor time which the task specified by
  ${.:/params[0]/name} used throughout its lifetime.
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- role: constraint
  uid: /constraint/directive-ctx-isr
- role: constraint
  uid: /constraint/directive-ctx-devinit
- role: constraint
  uid: /constraint/directive-ctx-task
- role: constraint
  uid: /constraint/directive-no-preempt
name: rtems_task_get_cpu_usage
notes: |
  The ${../../cpuuse/if/reset:/name} directive does not change the processor
  time which this directive returns.
params:
- description: |
    is the task identifier. The constant ${self-define:/name} may be used to
    specify the calling task.
  dir: null
  name: id
- description: |
    is the pointer to a ${/c/if/timespec:/name} object. When the directive call is
    successful, the processor time used by the task will be stored in this object.
  dir: out
  name: ts
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: ${../../status/if/successful:/name}
  - description: |
      The ${.:/params[1]/name} parameter was ${/c/if/null:/name}.
    value: ${../../status/if/invalid-address:/name}
  - description: |
      There was no task associated with the identifier specified by
      ${.:/params[0]/name}.
    value: ${../../status/if/invalid-id:/name}
type: interface
