test-includes:
- rtems.h
- rtems/cpuuse.h
- rtems/score/threadimpl.h
- rtems/score/timestampimpl.h
test-local-includes:
- tx-support.h
test-prepare: |
  ctx->worker_id = RTEMS_ID_NONE;
  SetFlag( &ctx->worker_busy, 0 );
  ctx->executing = false;
  ctx->ts_obj.tv_sec = -1;
  ctx->ts_obj.tv_nsec = -1;
test-setup:
  brief: null
  code: |
    SetSelfPriority( PRIO_NORMAL );
    ctx->mutex_id = CreateMutex();
  description: null
test-stop: null
test-support: |
  typedef ${.:/test-context-type} Context;

  static int64_t GetNanoseconds( const struct timespec *ts )
  {
    return (int64_t) ts->tv_sec * 1000000000 + ts->tv_nsec;
  }

  static void WorkerReady( rtems_task_argument arg )
  {
    (void) arg;
    (void) SetSelfPriority( PRIO_LOW );
    SuspendSelf();
  }

  static void WorkerBlocked( rtems_task_argument arg )
  {
    (void) arg;
    SuspendSelf();
  }

  static void WorkerBusy( rtems_task_argument arg )
  {
    Context *ctx;

    ctx = (Context *) arg;
    SetFlag( &ctx->worker_busy, 1 );
    (void) _CPU_Thread_Idle_body( 0 );
  }
test-target: testsuites/validation/tc-task-get-cpu-usage.c
test-teardown:
  brief: null
  code: |
    DeleteMutex( ctx->mutex_id );
    RestoreRunnerPriority();
  description: null
