  The item ${wake-when:/spec} states the return status of the directive for a
  valid and an invalid time of day.
requirement-type: functional
text: |
  The ${../if/wake-when:/name} directive shall validate and convert the time of
  the day of the time of day referenced by the ${../if/wake-when:/params[0]/name}
  parameter as specified by ${/score/tod/req/convert-time:/spec} where the
  directive ignores the ticks of the time of day.
