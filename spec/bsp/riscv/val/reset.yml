test-actions:
- action-brief: |
    Find the semihosting trap sequence in the ${../../if/reset:/name} function.
    Replace its first two instructions with a jump to a function which records the
    operation and the parameter block of the semihosting exit and which leaves the
    reset function. Call the reset function with a fatal code. Restore the
    instructions.
  action-code: |
    uint16_t             *at;
    uint32_t              jump[ 2 ];
    uint32_t              original[ 2 ];
    rtems_interrupt_level level;

    at = FindSemihostingTrap();
    T_step_assert_not_null( ${.:/step}, at );

    original[ 0 ] = ReadWord( &at[ 0 ] );
    original[ 1 ] = ReadWord( &at[ 2 ] );
    EncodeJump( at, (uintptr_t) ResetLeave, jump );

    rtems_interrupt_local_disable( level );
    Patch( at, jump );

    if ( setjmp( reset_context.leave ) == 0 ) {
      BSP_RESET( RTEMS_FATAL_SOURCE_APPLICATION, FATAL_CODE );
    }

    Patch( at, original );
    rtems_interrupt_local_enable( level );
  checks:
  - brief: |
      Check that the reset function issued the semihosting exit.
    code: |
      T_step_eq_uptr( ${.:/step}, reset_context.op, TARGET_SYS_EXIT_EXTENDED );
    links:
    - role: validation
      uid: ../req/reset
  - brief: |
      Check that the stop reason is ADP_Stopped_ApplicationExit.
    code: |
      T_step_eq_uptr(
        ${.:/step},
        reset_context.block[ 0 ],
        ADP_Stopped_ApplicationExit
      );
    links:
    - role: validation
      uid: ../req/reset
  - brief: |
      Check that the exit code is the fatal code.
    code: |
      T_step_eq_uptr( ${.:/step}, reset_context.block[ 1 ], FATAL_CODE );
    links:
    - role: validation
      uid: ../req/reset
  - brief: |
      Check that the trap instruction is restored.
    code: |
      T_step_eq_u32( ${.:/step}, ReadWord( &at[ 2 ] ), SEMIHOSTING_EBREAK );
    links: []
  links: []
test-brief: |
  Tests the ${../../if/reset:/name} function of the BSP.
