enabled-by: bsps/riscv/noel
links: []
test-actions:
- action-brief: |
    Get the end of the memory area of the BSP.
  action-code: |
    const void *end;

    end = _Memory_Get_end( _Memory_Get_area( _Memory_Get(), 0 ) );
  checks:
  - brief: |
      Check that the stack pointer of the boot processor at the start entry is not
      zero.
    code: |
      T_step_ne_uptr( ${.:/step}, riscv_start_stack_pointer, 0 );
    links: []
  - brief: |
      Check that the memory area ends at this stack pointer.
    code: |
      T_step_eq_ptr( ${.:/step}, end, (void *) riscv_start_stack_pointer );
    links:
    - role: validation
      uid: ../req/memory-end-stack-pointer
  links: []
test-brief: |
  Tests the memory area of the BSP.
