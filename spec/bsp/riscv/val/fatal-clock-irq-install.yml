test-actions:
- action-brief: |
    The test action is carried out by the OccupyClockInterrupt() system
    initialization handler.
  action-code: |
    /* Nothing to do */
  checks:
  - brief: |
      Check that the expected fatal source is present.
    code: |
      T_step_eq_int( ${.:/step}, ctx->source, RTEMS_FATAL_SOURCE_BSP );
    links:
    - role: validation
      uid: ../req/fatal-clock-irq-install
  - brief: |
      Check that the expected fatal code is present.
    code: |
      T_step_eq_ulong( ${.:/step}, ctx->code, RISCV_FATAL_CLOCK_IRQ_INSTALL );
    links:
    - role: validation
      uid: ../req/fatal-clock-irq-install
  links: []
test-brief: |
  Tests the fatal error of the ${/score/interr/if/source-bsp:/name} fatal source
  with the ${/bsp/if/fatal-riscv-clock-irq-install:/name} fatal code.
test-context: []
test-context-support: null
test-description: null
test-header:
  code: null
  freestanding: true
  includes:
  - rtems.h
  local-includes: []
  run-params:
  - description: |
      is fatal source.
    dir: null
    name: source
    specifier: ${/rtems/userext/if/fatal-source:/name} ${.:name}
  - description: |
      is fatal code.
    dir: null
    name: code
    specifier: ${/rtems/userext/if/fatal-code:/name} ${.:name}
  target: testsuites/validation/bsps/tr-fatal-riscv-clock-irq-install.h
test-includes:
- rtems.h
- rtems/sysinit.h
- bsp.h
- bsp/fatal.h
- bsp/irq.h
test-local-includes:
- tr-fatal-riscv-clock-irq-install.h
test-setup: null
test-stop: null
test-support: |
  static void ClockInterrupt( void *arg )
  {
    (void) arg;
  }

  static rtems_interrupt_entry interrupt_entry = RTEMS_INTERRUPT_ENTRY_INITIALIZER(
    ClockInterrupt,
    NULL,
    "Clock"
  );

  static void OccupyClockInterrupt( void )
  {
    (void) rtems_interrupt_entry_install(
      RISCV_INTERRUPT_VECTOR_TIMER,
      RTEMS_INTERRUPT_UNIQUE,
      &interrupt_entry
    );
  }

  RTEMS_SYSINIT_ITEM(
    OccupyClockInterrupt,
    RTEMS_SYSINIT_DEVICE_DRIVERS,
    RTEMS_SYSINIT_ORDER_FIRST
  );
test-target: testsuites/validation/bsps/tr-fatal-riscv-clock-irq-install.c
test-teardown: null
type: test-case
