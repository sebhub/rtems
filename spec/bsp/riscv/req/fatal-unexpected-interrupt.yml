requirement-type: functional
text: |
  If the interrupt dispatch receives an interrupt cause other than the timer, the
  external and the software interrupt of the processor mode of the BSP, then the
  system shall terminate with the ${/score/interr/if/source-bsp:/name} fatal
  source and the ${/bsp/if/fatal-riscv-unexpected-interrupt:/name} fatal code.
type: requirement
