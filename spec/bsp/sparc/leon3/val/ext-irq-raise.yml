  description: null
  member: |
    rtems_vector_number saved_controller_line
test-context-support: |
  #define _RTEMS_TMTEST27
  #include <tm27.h>
test-description: |
  The test raises an extended controller line through a read-modify-write of the
  pending register. This is safe only in the test, since no peripheral drives the
  tested bus lines.
test-header: null
test-includes:
- bsp.h
- bsp/irq-generic.h
- bsp/irq.h
- bsp/leon3.h
- grlib/io.h
- rtems/irq-extension.h
test-local-includes:
- tx-support.h
test-setup: null
test-stop: null
test-support: |
  typedef ${.:/test-context-type} Context;

  static void Handler( void *arg )
  {
    Context *ctx;

    ctx = arg;
    ctx->handled_vector = ctx->expected_vector;
    ++ctx->call_count;
  }

  static void UnsafeRaiseExtendedInterrupt(
    rtems_vector_number controller_line
  )
  {
    rtems_interrupt_lock_context lock_context;
    uint32_t                     ipend;
    irqamp                      *regs;

    regs = LEON3_IrqCtrl_Regs;
    LEON3_IRQCTRL_ACQUIRE( &lock_context );
    ipend = grlib_load_32( &regs->ipend );
    ipend |= 1U << controller_line;
    grlib_store_32( &regs->ipend, ipend );
    LEON3_IRQCTRL_RELEASE( &lock_context );
  }
test-target: testsuites/validation/bsps/tc-sparc-leon3-ext-irq-raise.c
test-teardown: null
type: test-case
