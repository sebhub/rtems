links: []
test-actions:
- action-brief: |
    Iterate through each interrupt vector whose bus line maps to an extended
    controller line and which has no interrupt handler installed. Get the
    attributes of the vector and try to raise it through the directive. Install an
    interrupt handler, enable the vector, raise the extended controller line
    through the pending register and wait for the handler. Clear and disable the
    vector and remove the handler.
  action-code: |
    rtems_vector_number vector;

    for ( vector = 0; vector < BSP_INTERRUPT_VECTOR_COUNT; ++vector ) {
      rtems_vector_number        controller_line;
      rtems_status_code          sc;
      rtems_interrupt_attributes attr;
      bool                       pending_before;
      bool                       pending_after;
      rtems_interrupt_entry      entry;

      if ( !bsp_interrupt_is_valid_vector( vector ) ) {
        continue;
      }

      controller_line = leon3_irqmap_get_unchecked( vector );

      if ( controller_line <= BSP_INTERRUPT_VECTOR_MAX_STD ) {
        continue;
      }

      if ( HasInterruptVectorEntriesInstalled( vector ) ) {
        continue;
      }

      ++ctx->tested_vectors;
      ctx->tested_controller_lines |= 1U << controller_line;

      attr = (rtems_interrupt_attributes) { 0 };
      sc = rtems_interrupt_get_attributes( vector, &attr );
      T_rsc_success( sc );

      if (
        !attr.can_raise && !attr.can_raise_on && attr.can_enable &&
        attr.can_disable && attr.can_clear
      ) {
        ++ctx->not_raisable;
      }

      pending_before = true;
      sc = rtems_interrupt_is_pending( vector, &pending_before );
      T_rsc_success( sc );

      sc = rtems_interrupt_raise( vector );

      pending_after = !pending_before;
      (void) rtems_interrupt_is_pending( vector, &pending_after );

      if ( sc == RTEMS_UNSATISFIED && pending_after == pending_before ) {
        ++ctx->raise_rejected;
      }

      ctx->call_count = 0;
      ctx->handled_vector = UINT32_MAX;
      ctx->expected_vector = vector;

      rtems_interrupt_entry_initialize( &entry, Handler, ctx, "Extended IRQ" );
      sc = rtems_interrupt_entry_install(
        vector,
        RTEMS_INTERRUPT_UNIQUE,
        &entry
      );
      T_rsc_success( sc );

      sc = rtems_interrupt_vector_enable( vector );
      T_rsc_success( sc );

      UnsafeRaiseExtendedInterrupt( controller_line );

      while ( ctx->call_count == 0 ) {
        /* Wait */
      }

      if ( ctx->call_count == 1 && ctx->handled_vector == vector ) {
        ++ctx->dispatched;
      }

      sc = rtems_interrupt_clear( vector );
      T_rsc_success( sc );

      sc = rtems_interrupt_vector_disable( vector );
      T_rsc_success( sc );

      sc = rtems_interrupt_entry_remove( vector, &entry );
      T_rsc_success( sc );
    }
  checks:
  - brief: |
      Check that the test exercised each extended controller line.
    code: |
      T_eq_u32( ctx->tested_controller_lines, 0xffff0000 );
    links: []
  - brief: |
      Check that the attributes of each tested interrupt vector state that the vector
      can be enabled, disabled and cleared, and that it can neither be raised nor be
      raised on a processor.
    code: |
      T_eq_u32( ctx->not_raisable, ctx->tested_vectors );
    links:
    - role: validation
      uid: ../req/ext-irq-raise
  - brief: |
      Check that the directive rejected the raise of each tested interrupt vector and
      that the pending state stayed unchanged.
    code: |
      T_eq_u32( ctx->raise_rejected, ctx->tested_vectors );
    links:
    - role: validation
      uid: ../req/ext-irq-raise
  - brief: |
      Check that the pending extended controller line called the interrupt handler of
      each tested interrupt vector exactly once.
    code: |
      T_eq_u32( ctx->dispatched, ctx->tested_vectors );
    links:
    - role: validation
      uid: ../req/ext-irq-dispatch
  links: []
- action-brief: |
    Get the interrupt vector of a ${../glossary/bus-line:/term} which maps to the
    ${../glossary/controller-line:/term} of the extended interrupt. Where the BSP
    uses an interrupt map, map the ${../glossary/bus-line:/term}
    `TM27_IRQMAP_BUS_LINE` to this ${../glossary/controller-line:/term}. Install an
    interrupt handler, enable the vector, raise it and wait for the handler. Clear
    and disable the vector, remove the handler and restore the interrupt map.
  action-code: |
    rtems_vector_number   vector;
    rtems_status_code     sc;
    rtems_interrupt_entry entry;

    #if defined( TM27_IRQMAP_BUS_LINE )
    vector = TM27_IRQMAP_BUS_LINE;
    sc = leon3_irqmap_get( vector, &ctx->saved_controller_line );
    T_rsc_success( sc );
    sc = leon3_irqmap_set( vector, LEON3_IrqCtrl_EIrq );
    T_rsc_success( sc );
    #else
    vector = LEON3_IrqCtrl_EIrq;
    #endif

    ctx->call_count = 0;
    ctx->expected_vector = vector;

    rtems_interrupt_entry_initialize(
      &entry,
      Handler,
      ctx,
      "Extended Interrupt"
    );
    sc = rtems_interrupt_entry_install( vector, RTEMS_INTERRUPT_UNIQUE, &entry );
    T_rsc_success( sc );

    sc = rtems_interrupt_vector_enable( vector );
    T_rsc_success( sc );

    sc = rtems_interrupt_raise( vector );
    T_rsc_success( sc );

    while ( ctx->call_count == 0 ) {
      /* Wait */
    }

    sc = rtems_interrupt_clear( vector );
    T_rsc_success( sc );

    sc = rtems_interrupt_vector_disable( vector );
    T_rsc_success( sc );

    sc = rtems_interrupt_entry_remove( vector, &entry );
    T_rsc_success( sc );

    #if defined( TM27_IRQMAP_BUS_LINE )
    sc = leon3_irqmap_set( vector, ctx->saved_controller_line );
    T_rsc_success( sc );
    #endif
  checks:
  - brief: |
      Check that the pending ${../glossary/controller-line:/term} of the extended
      interrupt called the interrupt handler exactly once.
    code: |
      T_eq_u32( ctx->call_count, 1 );
    links:
    - role: validation
      uid: ../req/ext-irq-line-dispatch
  links: []
test-brief: |
  This test case validates the extended interrupt raise path for LEON3 BSPs.
test-context:
- brief: |
    This member contains the count of tested interrupt vectors.
  description: null
  member: |
    uint32_t tested_vectors
- brief: |
    This member contains the set of the tested controller lines.
  description: null
  member: |
    uint32_t tested_controller_lines
- brief: |
    This member contains the count of tested interrupt vectors which the BSP
    reported as not raisable.
  description: null
  member: |
    uint32_t not_raisable
- brief: |
    This member contains the count of tested interrupt vectors whose raise the
    directive rejected.
  description: null
  member: |
    uint32_t raise_rejected
- brief: |
    This member contains the count of tested interrupt vectors whose interrupt
    handler the BSP dispatched.
  description: null
  member: |
    uint32_t dispatched
- brief: |
    This member contains the call count of the interrupt handler.
  description: null
  member: |
    volatile uint32_t call_count
- brief: |
    This member contains the interrupt vector which the test expects.
  description: null
  member: |
    rtems_vector_number expected_vector
- brief: |
    This member contains the interrupt vector which the handler saw.
  description: null
  member: |
    rtems_vector_number handled_vector
- brief: |
    This member contains the ${../glossary/controller-line:/term} to which the
    interrupt map maps the ${../glossary/bus-line:/term} `TM27_IRQMAP_BUS_LINE`
