test-actions:
- action-brief: |
    Read the value of ${../if/mp-irq:/name}. The test program defines no
    ${../if/mp-irq:/name} constant.
  action-code: |
    unsigned char bus_line;

    bus_line = LEON3_mp_irq;
  checks:
  - brief: |
      Check that the value is the value of the BSP option LEON3_IPI_BUS_LINE.
    code: |
      T_eq_uint( bus_line, LEON3_IPI_BUS_LINE );
    links:
    - role: validation
      uid: ../req/mp-irq
  links: []
test-brief: |
  Tests the default value of ${../if/mp-irq:/name}.
