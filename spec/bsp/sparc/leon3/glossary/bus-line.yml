term: bus line
text: |
  A bus line is an interrupt line of the AMBA bus. A peripheral asserts the bus
  line to request an interrupt. The ${interrupt-map:/term} connects each bus line
  to a ${controller-line:/term}. Where the BSP uses the ${interrupt-map:/term},
  an interrupt vector is a bus line.
type: glossary
