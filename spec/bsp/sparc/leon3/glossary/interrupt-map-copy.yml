term: interrupt map copy
text: |
  The interrupt map copy is the copy of the ${interrupt-map:/term} which the BSP
  reads during the initialization of the interrupt support. It holds one
  ${interrupt-map-entry:/term} for each ${bus-line:/term}.
type: glossary
