post-conditions:
- name: ProcessorMask
  states:
  - name: Zero
    test-code: |
      T_eq_u32( ctx->regs.pimask[ LEON3_Cpu_Index ], 0 );
    text: |
      The processor interrupt mask of the boot processor shall be zero.
  test-epilogue: null
  test-prologue: null
- name: ProcessorForce
  states:
  - name: Zero
    test-code: |
      T_eq_u32( ctx->regs.piforce[ LEON3_Cpu_Index ], 0 );
    text: |
      The processor interrupt force register of the boot processor shall be zero.
  test-epilogue: null
  test-prologue: null
- name: InterruptClear
  states:
  - name: All
    test-code: |
      T_eq_u32( ctx->regs.iclear, 0xffffffff );
    text: |
      The function shall write all ones to the interrupt clear register.
  test-epilogue: null
  test-prologue: null
- name: OtherRegisters
  states:
  - name: Nop
    test-code: |
      CheckOtherRegisters( ctx );
    text: |
      The registers of the IRQ(A)MP other than the processor interrupt mask and the
      processor interrupt force register of the boot processor and the interrupt
      clear register shall not be modified by the function call.
  test-epilogue: null
  test-prologue: null
- name: InRangeEntries
  states:
  - name: Field
    test-code: |
      CheckInRangeEntries( ctx );
    text: |
      The ${../glossary/interrupt-map-entry:/term} of the
      ${../glossary/interrupt-map-copy:/term} of each ${../glossary/bus-line:/term}
      whose ${../glossary/interrupt-map-entry:/term} selects a
      ${../glossary/controller-line:/term} shall be set to that
      ${../glossary/interrupt-map-entry:/term}, except for the
      ${../glossary/bus-line:/term} of the inter-processor interrupt.
  test-epilogue: null
  test-prologue: null
- name: OutOfRangeEntries
  states:
  - name: Masked
    test-code: |
      CheckOutOfRangeEntries( ctx );
    text: |
      The ${../glossary/interrupt-map-entry:/term} of the
      ${../glossary/interrupt-map-copy:/term} of each ${../glossary/bus-line:/term}
      whose ${../glossary/interrupt-map-entry:/term} selects no
      ${../glossary/controller-line:/term} shall be set to that
      ${../glossary/interrupt-map-entry:/term} masked by the count of
      ${../glossary/controller-line:/plural} minus one, except for the
      ${../glossary/bus-line:/term} of the inter-processor interrupt.
  test-epilogue: null
  test-prologue: null
- name: IpiEntry
  states:
  - name: IpiLine
    test-code: |
      #if LEON3_IRQMAP_BUS_LINE_COUNT != 0
        T_eq_u32( LEON3_IrqCtrl_Mapping[ 0 ], LEON3_IPI_CONTROLLER_LINE );
      #endif
    text: |
      The ${../glossary/interrupt-map-entry:/term} of the
      ${../glossary/interrupt-map-copy:/term} of the first
      ${../glossary/bus-line:/term} shall be set to the
      ${../glossary/controller-line:/term} defined by the BSP option
      LEON3_IPI_CONTROLLER_LINE.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: InterruptMap
  states:
  - name: 'Yes'
    test-code: |
      #if LEON3_IRQMAP_BUS_LINE_COUNT == 0
        ${.:skip}
      #endif
    text: |
      Where the BSP uses the ${../glossary/interrupt-map:/term}.
  - name: 'No'
    test-code: |
      #if LEON3_IRQMAP_BUS_LINE_COUNT != 0
        ${.:skip}
      #endif
    text: |
      Where the BSP does not use the ${../glossary/interrupt-map:/term}.
  test-epilogue: null
  test-prologue: null
- name: ExtendedInterrupt
  states:
  - name: Fixed
    test-code: |
      #if !defined( LEON3_IRQAMP_EXTENDED_INTERRUPT )
        ${.:skip}
      #endif
    text: |
      Where the BSP configuration fixes the extended
      ${../glossary/controller-line:/term}.
  - name: Detected
    test-code: |
      #if defined( LEON3_IRQAMP_EXTENDED_INTERRUPT )
        ${.:skip}
      #endif
    text: |
      Where the BSP determines the extended ${../glossary/controller-line:/term} at
      run time.
  test-epilogue: null
  test-prologue: null
- name: Ipi
  states:
  - name: 'Yes'
    test-code: |
      #if !defined( RTEMS_SMP ) && !defined( RTEMS_MULTIPROCESSING )
        ${.:skip}
      #endif
    text: |
      Where the system is configured with SMP or multiprocessing support.
  - name: 'No'
    test-code: |
      #if defined( RTEMS_SMP ) || defined( RTEMS_MULTIPROCESSING )
        ${.:skip}
      #endif
    text: |
      Where the system is configured without SMP and multiprocessing support.
  test-epilogue: null
  test-prologue: null
- name: MapFields
  states:
  - name: None
    test-code: |
      ctx->map_fields = MAP_FIELDS_NONE;
    text: |
      While the ${../glossary/interrupt-map-entry:/term} of no
      ${../glossary/bus-line:/term} selects a ${../glossary/controller-line:/term}.
  - name: Some
    test-code: |
      ctx->map_fields = MAP_FIELDS_SOME;
    text: |
      While the ${../glossary/interrupt-map-entry:/term} of some but not all
      ${../glossary/bus-line:/plural} selects a ${../glossary/controller-line:/term}.
  - name: All
    test-code: |
      ctx->map_fields = MAP_FIELDS_ALL;
    text: |
      While the ${../glossary/interrupt-map-entry:/term} of each
      ${../glossary/bus-line:/term} selects a ${../glossary/controller-line:/term}.
  test-epilogue: null
  test-prologue: null
- name: ProcessorMask
  states:
  - name: None
    test-code: |
      ctx->mask_before = 0;
    text: |
      While the processor interrupt mask of the boot processor enables no
      ${../glossary/controller-line:/term}.
  - name: Some
    test-code: |
      ctx->mask_before = 0x5554;
    text: |
      While the processor interrupt mask of the boot processor enables some but not
      all ${../glossary/controller-line:/plural}.
  - name: All
    test-code: |
      ctx->mask_before = 0xfffe;
    text: |
      While the processor interrupt mask of the boot processor enables all
      ${../glossary/controller-line:/plural}.
  test-epilogue: null
  test-prologue: null
- name: ProcessorForce
  states:
  - name: None
    test-code: |
      ctx->force_before = 0;
    text: |
      While the processor interrupt force register of the boot processor forces no
      ${../glossary/controller-line:/term}.
  - name: Some
    test-code: |
      ctx->force_before = 0xaaa8;
    text: |
      While the processor interrupt force register of the boot processor forces some
      but not all ${../glossary/controller-line:/plural}.
  - name: All
    test-code: |
      ctx->force_before = 0xfffe;
    text: |
      While the processor interrupt force register of the boot processor forces all
      ${../glossary/controller-line:/plural}.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension InterruptMap covers the use of the interrupt map by the BSP, 2
  states. The GR740 and the GR765 have the interrupt map, and the GR712RC has
  none. Dimension ExtendedInterrupt covers how the BSP gets the extended
  controller line, 2 states. The configurations of the GR712RC, the GR740 and the
  GR765 fix the controller line, so no qualified BSP builds the state Detected.
  Dimension Ipi covers whether the configuration has an inter-processor
  interrupt, 2 states.

  Dimension MapFields covers the fields of the interrupt map as a group of one
  meaning, 3 states. A field of the
  ${/ref/soc/gaisler/gr740/gr740-um-ds-2-10/irqmap:/name}, and of the
  ${/ref/soc/gaisler/gr765/gr765-dsum-0-11/irqmap:/name}, holds eight bits. The
  values 0 to 31 select a controller line. A value of 32 to 255 is a hardware
  fault, and the BSP masks it to keep the dispatch table index defined. Each
  state arranges a distinct value in each field. The fields which select a
  controller line hold the first and the last controller line. The fields which
  select none hold 32, 255 and values between. A field which the function reads
  from a wrong position then yields a wrong entry.

  In SMP and multiprocessing configurations, the BSP maps bus line 0 to the
  controller line of the inter-processor interrupt in the copy. No peripheral
  drives bus line 0, see the GR765 datasheet, Table 5. The GR765 keeps the
  controller lines 13 and 14 free after reset, see the GR765 datasheet, section
  14.2.3.

  Dimension ProcessorMask covers the processor interrupt mask of the boot
  processor before the call, 3 states. Its bits 1 to 15 enable the standard
  controller lines as a group of one meaning. Dimension ProcessorForce covers the
  processor interrupt force register of the boot processor before the call in the
  same way, 3 states.

  The interrupt clear register is write to clear, so no pre-condition covers it.
  The register block in memory keeps the value which the function writes, and the
  background content differs from all ones.

  The test passes a register block in memory, so the call changes no register of
  the interrupt controller. The test restores the interrupt map copy in the
  cleanup.
requirement-type: functional
skip-reasons:
  ExtendedInterruptDetected: |
    No qualified BSP determines the extended controller line at run time.
test-action: |
