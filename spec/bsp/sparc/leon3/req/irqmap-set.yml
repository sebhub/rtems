        ${.:skip}
      #endif
    text: |
      Where the BSP uses the ${../glossary/interrupt-map:/term}.
  - name: 'No'
    test-code: |
      #if LEON3_IRQMAP_BUS_LINE_COUNT != 0
        ${.:skip}
      #endif
    text: |
      Where the BSP uses no ${../glossary/interrupt-map:/term}.
  test-epilogue: null
  test-prologue: null
- name: BusLine
  states:
  - name: Zero
    test-code: |
      ctx->bus_line = 0;
    text: |
      While the `bus_line` parameter is zero.
  - name: Valid
    test-code: |
      ctx->bus_line = BUS_LINE_VALID;
    text: |
      While the `bus_line` parameter is greater than zero and less than the count of
      ${../glossary/bus-line:/plural}.
  - name: Invalid
    test-code: |
      ctx->bus_line = BUS_LINE_COUNT;
    text: |
      While the `bus_line` parameter is greater than or equal to the count of
      ${../glossary/bus-line:/plural}.
  test-epilogue: null
  test-prologue: null
- name: Change
  states:
  - name: Same
    test-code: |
      ctx->change = false;
    text: |
      While the `controller_line` parameter is equal to the
      ${../glossary/controller-line:/term} of the ${../glossary/bus-line:/term}.
  - name: Other
    test-code: |
      ctx->change = true;
    text: |
      While the `controller_line` parameter is not equal to the
      ${../glossary/controller-line:/term} of the ${../glossary/bus-line:/term}.
  test-epilogue: null
  test-prologue: null
- name: ControllerLine
  states:
  - name: Zero
    test-code: |
      ctx->other_line = 0;
    text: |
      While the `controller_line` parameter is zero.
  - name: Last
    test-code: |
      ctx->other_line = CONTROLLER_LINE_COUNT - 1;
    text: |
      While the `controller_line` parameter is the last
      ${../glossary/controller-line:/term}.
  - name: Invalid
    test-code: |
      ctx->other_line = CONTROLLER_LINE_COUNT;
    text: |
      While the `controller_line` parameter is greater than the last
      ${../glossary/controller-line:/term}.
  test-epilogue: null
  test-prologue: null
- name: Handler
  states:
  - name: 'Yes'
    test-code: |
      ctx->handler = true;
    text: |
      While an interrupt handler is installed on the
      ${../glossary/controller-line:/term} of the ${../glossary/bus-line:/term}.
  - name: 'No'
    test-code: |
      ctx->handler = false;
    text: |
      While no interrupt handler is installed on the
      ${../glossary/controller-line:/term} of the ${../glossary/bus-line:/term}.
  test-epilogue: null
  test-prologue: null
- name: Init
  states:
  - name: 'Yes'
    test-code: |
      ctx->initialized = true;
    text: |
      While the interrupt support is initialized.
  - name: 'No'
    test-code: |
      ctx->initialized = false;
    text: |
      While the interrupt support is not initialized.
  test-epilogue: null
  test-prologue: null
- name: ISR
  states:
  - name: 'Yes'
    test-code: |
      ctx->isr = true;
    text: |
      While ${../if/irqmap-set:/name} is called from within interrupt context.
  - name: 'No'
    test-code: |
      ctx->isr = false;
    text: |
      While ${../if/irqmap-set:/name} is not called from within interrupt context.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension InterruptMap covers whether the BSP uses the interrupt map, 2 states.

  Dimension BusLine covers the parameter bus_line, 3 states. The directive
  accepts the bus lines from 1 up to the count minus 1. The states Zero and
  Invalid lie at the two bounds. The state Valid uses the bus line of
  TM27_IRQMAP_BUS_LINE, which no driver uses. The first and the last valid bus
  line carry peripherals. On the GR740, bus line 1 carries the clock timer. The
  test therefore changes no map entry of them.

  Dimension Change covers whether the controller_line parameter equals the
  current controller line of the bus line, 2 states. Dimension ControllerLine
  covers the parameter controller_line where it differs from the current
  controller line, 3 states. The directive accepts the controller lines 0 to 31.
  A controller line of zero disconnects the bus line.

  Dimension Handler covers whether an interrupt handler is installed on the
  current controller line of the bus line, 2 states. Dimension Init covers the
  initialization of the interrupt support, 2 states. Dimension ISR covers the
  calling context, 2 states.

  The test writes the interrupt map register and the interrupt map copy of the
  bus line directly. The arrangement then does not depend on the directive. The
  test restores both in the cleanup.
requirement-type: functional
skip-reasons: {}
test-action: |
  Arrange( ctx );
  SaveState( ctx );

  bsp_interrupt_set_handler_unique(
    BSP_INTERRUPT_DISPATCH_TABLE_SIZE,
    ctx->initialized
  );

  if ( ctx->isr ) {
    CallWithinISR( Action, ctx );
  } else {
    Action( ctx );
  }

  bsp_interrupt_set_handler_unique(
    BSP_INTERRUPT_DISPATCH_TABLE_SIZE,
    ctx->initialized_during_setup
  );
test-brief: null
test-cleanup: |
  Restore( ctx );
