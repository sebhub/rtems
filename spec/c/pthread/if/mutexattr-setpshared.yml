brief: |
  Set the ${../glossary/process-shared:/term} of the ${../glossary/mutex:/term}
  attributes object referenced by ${.:/params[0]/name} to the value specified by
  ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 OHB System AG
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pthread_mutexattr_t:/name} *${.:/params[0]/name}
    - int ${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    The ${.:/params[0]/name} parameter is ${/c/if/null:/name}.
  role: errno
  uid: /c/errno/if/einval
- description: |
    The ${../glossary/mutex:/term} attributes object referenced by the
    ${.:/params[0]/name} parameter is not initialized.
  role: errno
  uid: /c/errno/if/einval
- description: |
    The value specified by ${.:/params[1]/name} is neither
    ${../if/process-private:/name} nor ${../if/process-shared:/name}.
  role: errno
  uid: /c/errno/if/einval
- role: reference
  uid: /ref/std/posix-2024/pthread-mutexattr-getpshared
name: pthread_mutexattr_setpshared
notes: |
  See ${/ref/std/posix-2024/pthread-mutexattr-getpshared:/name}.

  RTEMS stores the value of the process-shared attribute without further effect.
params:
- description: |
    is the mutex attributes object to set the ${../glossary/process-shared:/term}
    for.
  dir: inout
  name: attr
- description: |
    is the new ${../glossary/process-shared:/term}.
  dir: null
  name: pshared
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: 0
  - description: |
      The ${.:/params[0]/name} parameter was ${/c/if/null:/name}, the
      ${../glossary/mutex:/term} attributes object referenced by the
      ${.:/params[0]/name} parameter was not initialized, or the value specified by
      ${.:/params[1]/name} was neither ${../if/process-private:/name} nor
      ${../if/process-shared:/name}.
    value: ${/c/errno/if/einval:/name}
type: interface
