brief: |
  Unlock the ${../glossary/mutex:/term} object referenced by
  ${.:/params[0]/name}.
copyrights:
- Copyright (C) 2026 OHB System AG
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pthread_mutex_t:/name} *${.:/params[0]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    The ${.:/params[0]/name} parameter is ${/c/if/null:/name}.
  role: errno
  uid: /c/errno/if/einval
- description: |
    The object referenced by the ${.:/params[0]/name} parameter is not an
    initialized ${../glossary/mutex:/term}.
  role: errno
  uid: /c/errno/if/einval
- description: |
    The calling thread does not own the ${../glossary/mutex:/term} referenced by
    the ${.:/params[0]/name} parameter.
  role: errno
  uid: /c/errno/if/eperm
- role: reference
  uid: /ref/std/posix-2024/pthread-mutex-lock
name: pthread_mutex_unlock
notes: |
  See ${/ref/std/posix-2024/pthread-mutex-lock:/name}.

  POSIX.1-2024 specifies ${/c/errno/if/eperm:/name} for a
  ${../glossary/mutex:/term} of the type ${../if/mutex-errorcheck:/name} or
  ${../if/mutex-recursive:/name} and for a robust mutex. RTEMS checks the owner
  for every ${../glossary/mutex-type:/term}.
params:
- description: |
    is the mutex to unlock.
  dir: inout
  name: mutex
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: 0
  - description: |
      The ${.:/params[0]/name} parameter was ${/c/if/null:/name}, or the object
      referenced by the ${.:/params[0]/name} parameter was not an initialized
      ${../glossary/mutex:/term}.
    value: ${/c/errno/if/einval:/name}
  - description: |
      The calling thread did not own the ${../glossary/mutex:/term} referenced by the
      ${.:/params[0]/name} parameter.
    value: ${/c/errno/if/eperm:/name}
type: interface
