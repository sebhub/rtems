term: thread cancel state attribute
text: |
  An attribute of a ${thread:/term} that specifies its cancelability state. See
  ${/ref/std/posix-2024/pthread-setcancelstate:/name}. This attribute can be set
  to ${../if/cancel-enable:/name} or ${../if/cancel-disable:/name}.
