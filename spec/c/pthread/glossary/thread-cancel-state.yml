term: thread cancel state attribute
text: |
  An attribute of a ${thread:/term} which decides whether the thread holds each
  ${thread-cancel-request:/term} pending. The attribute is
  ${../if/cancel-enable:/name} or ${../if/cancel-disable:/name}. See
  ${/ref/std/posix-2024/pthread-setcancelstate:/name}.
