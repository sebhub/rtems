term: thread cancel type attribute
text: |
  An attribute of a ${thread:/term} that specifies its cancelability type. See
  ${/ref/std/posix-2024/pthread-setcanceltype:/name}. This attribute can be set
  to ${../if/cancel-deferred:/name} or ${../if/cancel-asynchronous:/name}.
