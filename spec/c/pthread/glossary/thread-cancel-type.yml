term: thread cancel type attribute
text: |
  An attribute of a ${thread:/term} which decides whether the thread acts upon a
  ${thread-cancel-request:/term} only at a ${cancellation-point:/term}. The
  attribute is ${../if/cancel-deferred:/name} or
  ${../if/cancel-asynchronous:/name}. See
  ${/ref/std/posix-2024/pthread-setcanceltype:/name}.
type: glossary
