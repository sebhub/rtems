term: mutex priority ceiling attribute
text: |
  An attribute of a ${mutex:/term} that specifies its priority ceiling as a
  thread priority, used when the priority protect protocol is in effect. See
  ${/ref/std/posix-2024/pthread-mutexattr-getprioceiling:/name}.
