term: cancellation point
text: |
  A point in the execution of a ${thread:/term} at which the thread acts upon a
  pending ${thread-cancel-request:/term} while its ${thread-cancel-type:/term} is
  ${../if/cancel-deferred:/name}. RTEMS implements no cancellation point.
  ${../if/testcancel:/name} acts upon a pending request instead. See
  ${/ref/std/posix-2024/pthread-testcancel:/name}.
