post-conditions:
- name: FatalError
  states:
  - name: 'Yes'
    test-code: |
      T_eq_u32( ctx->fatal_extension_calls, 1 );
    text: |
      The fatal error with a fatal source of
      ${/score/interr/if/internal-error-core:/name} and a fatal code of
      ${/score/interr/if/bad-thread-dispatch-disable-level:/name} shall occur by the
      ${../if/exit:/name} call.
  - name: Nop
    test-code: |
      T_eq_u32( ctx->fatal_extension_calls, 0 );
    text: |
      The ${../if/exit:/name} call shall not cause a fatal error.
  test-epilogue: null
  test-prologue: null
- name: TerminateExtensions
  states:
  - name: 'Yes'
    test-code: |
      T_eq_u32( ctx->terminate_extension_calls, 1 );
    text: |
      The thread terminate ${/glossary/userextensions:/term} shall be invoked by the
      ${../if/exit:/name} call.
  - name: Nop
    test-code: |
      T_eq_u32( ctx->terminate_extension_calls, 0 );
    text: |
      The thread terminate ${/glossary/userextensions:/term} shall not be invoked by
      the ${../if/exit:/name} call.
  test-epilogue: null
  test-prologue: null
- name: Restart
  states:
  - name: Nop
    test-code: |
      T_eq_u32( ctx->restarts, 0 );
    text: |
      The ${/glossary/executingtask:/term} shall not be restarted by the
      ${../if/exit:/name} call.
  test-epilogue: null
  test-prologue: null
- name: Thread
  states:
  - name: Joinable
    test-code: |
      T_eq_int( pthread_join( ctx->worker_thread, &ctx->exit_value ), 0 );
      ctx->worker_reclaimed = true;
    text: |
      The ${/glossary/executingtask:/term} shall be a terminated
      ${../glossary/joinable-thread:/term}.
  - name: Reclaimed
    test-code: |
      T_eq_int( pthread_join( ctx->worker_thread, NULL ), ESRCH );
      ctx->worker_reclaimed = true;
    text: |
      The thread identifier of the ${/glossary/executingtask:/term} shall be
      associated with no thread.
  - name: Nop
    test-code: |
      T_true( IsTaskSuspended( ctx->worker_id ) );
    text: |
      The ${/glossary/executingtask:/term} shall not be terminated by the
      ${../if/exit:/name} call.
  test-epilogue: null
  test-prologue: null
- name: Joiner
  states:
  - name: Joined
    test-code: |
      T_true( ctx->join_returned );
      T_eq_int( ctx->join_status, 0 );
      ctx->exit_value = ctx->join_value;
    text: |
      The thread which waits to join the ${/glossary/executingtask:/term} shall be
      joined with that task.
  - name: Nop
    test-code: |
      T_false( ctx->join_returned );
    text: |
      The thread which waits to join the ${/glossary/executingtask:/term} shall not
      be joined with that task.
  test-epilogue: null
  test-prologue: null
- name: ExitValue
  states:
  - name: Value
    test-code: |
      T_eq_ptr( ctx->exit_value, ctx->value );
    text: |
      The ${../glossary/thread-exit-value:/term} of the
      ${/glossary/executingtask:/term} shall be the value of the
      ${../if/exit:/params[0]/name} parameter.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Value
  states:
  - name: 'Null'
    test-code: |
      ctx->value = NULL;
    text: |
      While the ${../if/exit:/params[0]/name} parameter is equal to
      ${/c/if/null:/name}.
  - name: Other
    test-code: |
      ctx->value = &exit_object;
    text: |
      While the ${../if/exit:/params[0]/name} parameter is not equal to
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Joinable
  states:
  - name: 'Yes'
    test-code: |
      ctx->joinable = true;
    text: |
      While the ${/glossary/executingtask:/term} is a
      ${../glossary/joinable-thread:/term}.
  - name: 'No'
    test-code: |
      ctx->joinable = false;
    text: |
      While the ${/glossary/executingtask:/term} is a
      ${../glossary/detached-thread:/term}.
  test-epilogue: null
  test-prologue: null
- name: Joined
  states:
  - name: 'Yes'
    test-code: |
      ctx->joined = true;
    text: |
      While a thread waits to join the ${/glossary/executingtask:/term}.
  - name: 'No'
    test-code: |
      ctx->joined = false;
    text: |
      While no thread waits to join the ${/glossary/executingtask:/term}.
  test-epilogue: null
  test-prologue: null
- name: CancelState
  states:
  - name: Enable
    test-code: |
      ctx->cancel_state = PTHREAD_CANCEL_ENABLE;
    text: |
      While the ${../glossary/thread-cancel-state:/term} of the
      ${/glossary/executingtask:/term} is ${../if/cancel-enable:/name}.
  - name: Disable
    test-code: |
      ctx->cancel_state = PTHREAD_CANCEL_DISABLE;
    text: |
      While the ${../glossary/thread-cancel-state:/term} of the
      ${/glossary/executingtask:/term} is ${../if/cancel-disable:/name}.
  test-epilogue: null
  test-prologue: null
- name: CancelType
  states:
  - name: Deferred
    test-code: |
      ctx->cancel_type = PTHREAD_CANCEL_DEFERRED;
    text: |
      While the ${../glossary/thread-cancel-type:/term} of the
      ${/glossary/executingtask:/term} is ${../if/cancel-deferred:/name}.
  - name: Asynchronous
    test-code: |
      ctx->cancel_type = PTHREAD_CANCEL_ASYNCHRONOUS;
    text: |
      While the ${../glossary/thread-cancel-type:/term} of the
      ${/glossary/executingtask:/term} is ${../if/cancel-asynchronous:/name}.
  test-epilogue: null
  test-prologue: null
- name: CancelPending
  states:
  - name: 'Yes'
    test-code: |
      ctx->cancel_pending = true;
    text: |
      While a ${../glossary/thread-cancel-request:/term} is pending for the
      ${/glossary/executingtask:/term}.
  - name: 'No'
    test-code: |
      ctx->cancel_pending = false;
    text: |
      While no ${../glossary/thread-cancel-request:/term} is pending for the
      ${/glossary/executingtask:/term}.
  test-epilogue: null
  test-prologue: null
- name: RestartPending
  states:
  - name: 'Yes'
    test-code: |
      ctx->restart_pending = true;
    text: |
      While a restart of the ${/glossary/executingtask:/term} by
      ${/rtems/task/if/restart:/name} is pending.
  - name: 'No'
    test-code: |
      ctx->restart_pending = false;
    text: |
      While no restart of the ${/glossary/executingtask:/term} is pending.
  test-epilogue: null
  test-prologue: null
- name: ThreadDispatch
  states:
  - name: Enabled
    test-code: |
      ctx->dispatch_disabled = false;
    text: |
      While thread dispatching is enabled for the ${/glossary/executingtask:/term}.
  - name: Disabled
    test-code: |
      ctx->dispatch_disabled = true;
    text: |
      While thread dispatching is disabled for the ${/glossary/executingtask:/term}.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension Value covers the ${../if/exit:/params[0]/name} parameter, 2 states.
  ${/ref/std/posix-2024/pthread-exit:/name} makes the value available to a
  successful join. It names no value which the call rejects.

  Dimension Joinable covers whether the executing task is a
  ${../glossary/joinable-thread:/term}, 2 states. The section
  ${/ref/rtems/c-user/task-life-states:/name} of the RTEMS Classic API Guide
  states that a Classic API task is created not detached. It states that
  ${../if/detach:/name} detaches the calling task and that ${../if/exit:/name}
  does not change the detached state.

  Dimension Joined covers a thread which waits to join the executing task, 2
  states. The section ${/ref/rtems/posix-users/pthread-exit:/name} of the RTEMS
  POSIX API Guide states that the call makes the value available to any
  successful join. The notes of ${../if/detach:/name} in the section
  ${/ref/rtems/posix-users/pthread-detach:/name} state that a thread which waits
  stays joined after a detach.

  Dimension CancelState covers the ${../glossary/thread-cancel-state:/term} of
  the executing task, 2 states. Dimension CancelType covers its
  ${../glossary/thread-cancel-type:/term}, 2 states.
  ${/ref/std/posix-2024/cancelability-states:/name} defines both sets of states.
  The section ${/ref/rtems/c-user/task-life-states:/name} of the RTEMS Classic
  API Guide states that a task with a protected life may still terminate itself.

  Dimension CancelPending covers a pending
  ${../glossary/thread-cancel-request:/term} of the executing task, 2 states.
  ${/ref/std/posix-2024/cancellation-points:/name} does not list
  ${../if/exit:/name} as a ${../glossary/cancellation-point:/term}. The call
  therefore does not act upon the request, and the
  ${../glossary/thread-exit-value:/term} is the value of the
  ${../if/exit:/params[0]/name} parameter.

  Dimension RestartPending covers a pending restart of the executing task, 2
  states. The item /rtems/task/req/restart states that a terminating task which
  restarts terminates.

  Dimension ThreadDispatch covers thread dispatching for the executing task, 2
  states. The call does not return, so it performs a thread dispatch. The
  interface constraints of the call then give the fatal error.

  The section ${/ref/rtems/c-user/thread-termination-extension:/name} of the
  RTEMS Classic API Guide states that a call of ${../if/exit:/name} invokes the
  thread terminate user extensions.

  The pre-qualified library contains no function which creates a POSIX thread.
  The calling task is therefore a Classic API task. The library contains no
  function which installs a cancellation cleanup handler or a thread-specific
  data destructor, so the call runs neither.

  A task with the enabled state and the asynchronous type acted upon each request
  when the request was made. The request is then never pending, so the map skips
  these variants.
requirement-type: functional
skip-reasons:
  ActedUpon: |
    A task with the ${../if/cancel-enable:/name} state and the
    ${../if/cancel-asynchronous:/name} type acts upon a request when the request is
    made, so no request is pending.
test-action: |
  ctx->worker_id = CreateTask( "WORK", PRIO_HIGH );
  StartTask( ctx->worker_id, Worker, ctx );

  if ( ctx->joined ) {
    ctx->joiner_id = CreateTask( "JOIN", PRIO_HIGH );
    StartTask( ctx->joiner_id, Joiner, ctx );
  }

  ResumeTask( ctx->worker_id );
test-brief: null
test-cleanup: |
  if ( ctx->joined ) {
    DeleteTask( ctx->joiner_id );
  }

  if ( !ctx->worker_reclaimed ) {
    DeleteTask( ctx->worker_id );
  }
