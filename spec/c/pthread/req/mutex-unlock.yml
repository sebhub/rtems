post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/mutex-unlock:/name} shall be
      zero.
  - name: Inval
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/mutex-unlock:/name} shall be
      ${/c/errno/if/einval:/name}.
  - name: Perm
    test-code: |
      T_eq_int( ctx->status, EPERM );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/mutex-unlock:/name} shall be
      ${/c/errno/if/eperm:/name}.
  test-epilogue: null
  test-prologue: null
- name: Action
  states:
  - name: MtxNone
    test-code: |
      ctx->tq_mtx_ctx.base.thread_queue_object = ctx->mutex;
      ${/score/mtx/req/surrender:/test-run}( &ctx->tq_mtx_ctx );
    text: |
      The calling thread shall surrender the mutex referenced by the
      ${../if/mutex-unlock:/params[0]/name} parameter as specified by
      ${/score/mtx/req/surrender:/spec} where the mutex does not use a locking
      protocol, the thread queue of the mutex uses the FIFO discipline, a recursive
      seize of the mutex is not allowed, and the surrender checks that the mutex
      owner is the calling thread.
  - name: MtxNoneRecursive
    test-code: |
      ctx->tq_mtx_ctx.base.thread_queue_object = ctx->mutex;
      ${/score/mtx/req/surrender:/test-run}( &ctx->tq_mtx_ctx );
    text: |
      The calling thread shall surrender the mutex referenced by the
      ${../if/mutex-unlock:/params[0]/name} parameter as specified by
      ${/score/mtx/req/surrender:/spec} where the mutex does not use a locking
      protocol, the thread queue of the mutex uses the FIFO discipline, a recursive
      seize of the mutex is allowed, and the surrender checks that the mutex owner is
      the calling thread.
  - name: MtxInherit
    test-code: |
      ctx->tq_mtx_ctx.base.thread_queue_object = ctx->mutex;
      ${/score/mtx/req/surrender:/test-run}( &ctx->tq_mtx_ctx );
    text: |
      The calling thread shall surrender the mutex referenced by the
      ${../if/mutex-unlock:/params[0]/name} parameter as specified by
      ${/score/mtx/req/surrender:/spec} where the mutex uses the priority inheritance
      locking protocol, the thread queue of the mutex uses the priority discipline, a
      recursive seize of the mutex is not allowed, and the surrender checks that the
      mutex owner is the calling thread.
  - name: MtxInheritRecursive
    test-code: |
      ctx->tq_mtx_ctx.base.thread_queue_object = ctx->mutex;
      ${/score/mtx/req/surrender:/test-run}( &ctx->tq_mtx_ctx );
    text: |
      The calling thread shall surrender the mutex referenced by the
      ${../if/mutex-unlock:/params[0]/name} parameter as specified by
      ${/score/mtx/req/surrender:/spec} where the mutex uses the priority inheritance
      locking protocol, the thread queue of the mutex uses the priority discipline, a
      recursive seize of the mutex is allowed, and the surrender checks that the
      mutex owner is the calling thread.
  - name: MtxCeiling
    test-code: |
      ctx->tq_mtx_ctx.base.thread_queue_object = ctx->mutex;
      ${/score/mtx/req/surrender:/test-run}( &ctx->tq_mtx_ctx );
    text: |
      The calling thread shall surrender the mutex referenced by the
      ${../if/mutex-unlock:/params[0]/name} parameter as specified by
      ${/score/mtx/req/surrender:/spec} where the mutex uses the priority ceiling
      locking protocol, the thread queue of the mutex uses the priority discipline, a
      recursive seize of the mutex is not allowed, and the surrender checks that the
      mutex owner is the calling thread.
  - name: MtxCeilingRecursive
    test-code: |
      ctx->tq_mtx_ctx.base.thread_queue_object = ctx->mutex;
      ${/score/mtx/req/surrender:/test-run}( &ctx->tq_mtx_ctx );
    text: |
      The calling thread shall surrender the mutex referenced by the
      ${../if/mutex-unlock:/params[0]/name} parameter as specified by
      ${/score/mtx/req/surrender:/spec} where the mutex uses the priority ceiling
      locking protocol, the thread queue of the mutex uses the priority discipline, a
      recursive seize of the mutex is allowed, and the surrender checks that the
      mutex owner is the calling thread.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Protocol
  states:
  - name: None
    test-code: |
      ctx->protocol = PTHREAD_PRIO_NONE;
      ctx->tq_mtx_ctx.protocol = TQ_MTX_NO_PROTOCOL;
      ctx->tq_mtx_ctx.priority_ceiling = PRIO_INVALID;
      ctx->tq_mtx_ctx.base.discipline = TQ_FIFO;
    text: |
      While the mutex uses no locking protocol.
  - name: Inherit
    test-code: |
      ctx->protocol = PTHREAD_PRIO_INHERIT;
      ctx->tq_mtx_ctx.protocol = TQ_MTX_PRIORITY_INHERIT;
      ctx->tq_mtx_ctx.priority_ceiling = PRIO_INVALID;
      ctx->tq_mtx_ctx.base.discipline = TQ_PRIORITY;
    text: |
      While the mutex uses the priority inheritance locking protocol.
  - name: Ceiling
    test-code: |
      {
        const Scheduler_Control *scheduler;

        scheduler = _Thread_Scheduler_get_home( _Thread_Get_executing() );
        ctx->prio_ceiling = _POSIX_Priority_From_core(
          scheduler,
          _Scheduler_Map_priority( scheduler, PRIO_VERY_HIGH )
        );
      }

      ctx->protocol = PTHREAD_PRIO_PROTECT;
      ctx->tq_mtx_ctx.protocol = TQ_MTX_PRIORITY_CEILING;
      ctx->tq_mtx_ctx.priority_ceiling = PRIO_VERY_HIGH;
      ctx->tq_mtx_ctx.base.discipline = TQ_PRIORITY;
    text: |
      While the mutex uses the priority ceiling locking protocol.
  test-epilogue: null
  test-prologue: null
- name: Owner
  states:
  - name: Caller
    test-code: |
      ctx->owner_caller = true;
      ctx->owner_other = false;
    text: |
      While the owner of the mutex is the calling thread.
  - name: Other
    test-code: |
      ctx->owner_caller = false;
      ctx->owner_other = true;
    text: |
      While the owner of the mutex is a thread other than the calling thread.
  - name: None
    test-code: |
      ctx->owner_caller = false;
      ctx->owner_other = false;
    text: |
      While the mutex has no owner.
  test-epilogue: null
  test-prologue: null
- name: Type
  states:
  - name: Normal
    test-code: |
      ctx->type = PTHREAD_MUTEX_DEFAULT;
      ctx->tq_mtx_ctx.recursive = TQ_MTX_RECURSIVE_DEADLOCK;
    text: |
      While the type of the mutex is not recursive.
  - name: Recursive
    test-code: |
      ctx->type = PTHREAD_MUTEX_RECURSIVE;
      ctx->tq_mtx_ctx.recursive = TQ_MTX_RECURSIVE_ALLOWED;
    text: |
      While the type of the mutex is recursive.
  test-epilogue: null
  test-prologue: null
- name: Mutex
  states:
  - name: 'Null'
    test-code: |
      ctx->mutex = NULL;
      ctx->mutex_initialized = false;
    text: |
      While the ${../if/mutex-unlock:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  - name: Invalid
    test-code: |
      T_eq_int( pthread_mutex_init( &ctx->mutex_storage, NULL ), 0 );
      T_eq_int( pthread_mutex_destroy( &ctx->mutex_storage ), 0 );
      ctx->mutex = &ctx->mutex_storage;
      ctx->mutex_initialized = false;
    text: |
      While the mutex referenced by the ${../if/mutex-unlock:/params[0]/name}
      parameter is invalid.
  - name: Static
    test-code: |
      ctx->mutex_storage = (pthread_mutex_t) PTHREAD_MUTEX_INITIALIZER;
      ctx->mutex = &ctx->mutex_storage;
      ctx->mutex_initialized = true;
      ctx->owner_caller = false;
      ctx->owner_other = false;

      ctx->tq_mtx_ctx.protocol = TQ_MTX_NO_PROTOCOL;
      ctx->tq_mtx_ctx.recursive = TQ_MTX_RECURSIVE_DEADLOCK;
      ctx->tq_mtx_ctx.owner_check = TQ_MTX_CHECKS_OWNER;
      ctx->tq_mtx_ctx.priority_ceiling = PRIO_INVALID;
      ctx->tq_mtx_ctx.base.discipline = TQ_FIFO;
    text: |
      While the object referenced by the ${../if/mutex-unlock:/params[0]/name}
      parameter is a statically initialized mutex.
  - name: Init
    test-code: |
      pthread_mutexattr_t attr;

      T_eq_int( pthread_mutexattr_init( &attr ), 0 );
      T_eq_int( pthread_mutexattr_settype( &attr, ctx->type ), 0 );
      T_eq_int( pthread_mutexattr_setprotocol( &attr, ctx->protocol ), 0 );

      if ( ctx->protocol == PTHREAD_PRIO_PROTECT ) {
        T_eq_int(
          pthread_mutexattr_setprioceiling( &attr, ctx->prio_ceiling ),
          0
        );
      }

      T_eq_int( pthread_mutex_init( &ctx->mutex_storage, &attr ), 0 );
      T_eq_int( pthread_mutexattr_destroy( &attr ), 0 );

      ctx->mutex = &ctx->mutex_storage;
      ctx->mutex_initialized = true;

      ctx->tq_mtx_ctx.owner_check = TQ_MTX_CHECKS_OWNER;
      ctx->tq_mtx_ctx.base.thread_queue_object = ctx->mutex;
      ctx->tq_mtx_ctx.base.wait = TQ_WAIT_FOREVER;

      if ( ctx->owner_caller ) {
        T_eq_int( pthread_mutex_lock( ctx->mutex ), 0 );
      } else if ( ctx->owner_other ) {
        TQSend( &ctx->tq_mtx_ctx.base, TQ_BLOCKER_B, TQ_EVENT_ENQUEUE );
      }
    text: |
      While the object referenced by the ${../if/mutex-unlock:/params[0]/name}
      parameter is an initialized mutex.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/pthread-mutex-lock:/name} requires
  ${/c/errno/if/eperm:/name} for a mutex of the type PTHREAD_MUTEX_ERRORCHECK or
  PTHREAD_MUTEX_RECURSIVE where the calling ${../glossary/thread:/term} does not
  own the mutex. RTEMS checks the owner for every type. The states Other and None
  of pre-condition Owner specify this error. The states of pre-condition Protocol
  cover the protocols whose handling differs on release, and the states of
  pre-condition Type cover a mutex whose recursive seize is allowed and one whose
  recursive seize is not allowed. Pre-condition Type applies to an initialized
  mutex only, because a statically initialized mutex is not recursive.

  The standard leaves the behaviour undefined for a mutex which is not
  initialized and for a ${../if/mutex-unlock:/params[0]/name} parameter which is
  equal to ${/c/if/null:/name}. The states Invalid and Null of pre-condition
  Mutex specify that RTEMS returns ${/c/errno/if/einval:/name}. A statically
  initialized mutex (state Static) is initialized by the call.

  All other effects of a successful call are specified by the thread queue
  requirement /score/mtx/req/surrender through post-condition Action. Each state
  of the post-condition names one state of every pre-condition of the thread
  queue requirement which selects a variant of the mutex: the locking protocol,
  the discipline of the thread queue, the recursive seize and the check of the
  owner. RTEMS checks the owner on every release and does not use the MrsP
  protocol for a POSIX mutex.
requirement-type: functional
skip-reasons: {}
test-action: ctx->status = pthread_mutex_unlock( ctx->mutex );
test-brief: null
test-cleanup: |
  if ( ctx->mutex_initialized ) {
    if ( ctx->owner_other ) {
      TQSend( &ctx->tq_mtx_ctx.base, TQ_BLOCKER_B, TQ_EVENT_SURRENDER );
    }

    T_eq_int( pthread_mutex_destroy( &ctx->mutex_storage ), 0 );
  }
