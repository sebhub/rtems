transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Mutex:
          - 'Null'
          - Invalid
      then: Inval
    - if:
        pre-conditions:
          Mutex: Static
      then: Perm
    - else: N/A
    Action:
    - if:
        pre-conditions:
          Mutex:
          - 'Null'
          - Invalid
          - Static
      then: N/A
    - else: MtxSurrender
  pre-conditions:
    Protocol:
      applicable:
        pre-conditions:
          Mutex: Init
    Type:
      applicable:
        pre-conditions:
          Mutex: Init
    Mutex: all
