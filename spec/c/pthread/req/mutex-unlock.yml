enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/mutex-unlock
- role: requirement-refinement
  uid: ../../req/group-posix-api
- role: function-implementation
  uid: /score/mtx/req/surrender
- role: reference
  uid: /ref/std/posix-2024/pthread-mutex-lock
post-conditions:
- name: Status
  states:
  - name: Inval
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/mutex-unlock:/name} shall be
      ${/c/errno/if/einval:/name}.
  - name: Perm
    test-code: |
      T_eq_int( ctx->status, EPERM );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/mutex-unlock:/name} shall be
      ${/c/errno/if/eperm:/name}.
  test-epilogue: null
  test-prologue: null
- name: Action
  states:
  - name: MtxSurrender
    test-code: |
      /*
       * The function call released the mutex which the preparation locked.
       * The delegated test starts with an unowned mutex.
       */
      T_eq_int( ctx->status, 0 );
      T_null( TQGetOwnerPOSIXMutex( &ctx->tq_mtx_ctx.base ) );
      ${/score/mtx/req/surrender:/test-run}( &ctx->tq_mtx_ctx );
    text: |
      The calling thread shall surrender the mutex as specified by
      ${/score/mtx/req/surrender:/spec}.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Protocol
  states:
  - name: None
    test-code: |
      ctx->protocol = PTHREAD_PRIO_NONE;
      ctx->tq_mtx_ctx.protocol = TQ_MTX_NO_PROTOCOL;
      ctx->tq_mtx_ctx.priority_ceiling = PRIO_INVALID;
      ctx->tq_mtx_ctx.base.discipline = TQ_FIFO;
    text: |
      While the ${../glossary/mutex-protocol:/term} of the mutex is
      ${../if/prio-none:/name}.
  - name: Inherit
    test-code: |
      ctx->protocol = PTHREAD_PRIO_INHERIT;
      ctx->tq_mtx_ctx.protocol = TQ_MTX_PRIORITY_INHERIT;
      ctx->tq_mtx_ctx.priority_ceiling = PRIO_INVALID;
      ctx->tq_mtx_ctx.base.discipline = TQ_PRIORITY;
    text: |
      While the ${../glossary/mutex-protocol:/term} of the mutex is
      ${../if/prio-inherit:/name}.
  - name: Protect
    test-code: |
      ctx->protocol = PTHREAD_PRIO_PROTECT;
      ctx->tq_mtx_ctx.protocol = TQ_MTX_PRIORITY_CEILING;
      ctx->tq_mtx_ctx.priority_ceiling = PRIO_VERY_HIGH;
      ctx->tq_mtx_ctx.base.discipline = TQ_PRIORITY;
    text: |
      While the ${../glossary/mutex-protocol:/term} of the mutex is
      ${../if/prio-protect:/name}.
  test-epilogue: null
  test-prologue: null
- name: Type
  states:
  - name: Normal
    test-code: |
      ctx->type = PTHREAD_MUTEX_NORMAL;
      ctx->tq_mtx_ctx.recursive = TQ_MTX_RECURSIVE_DEADLOCK;
    text: |
      While the ${../glossary/mutex-type:/term} of the mutex is
      ${../if/mutex-normal:/name}.
  - name: Recursive
    test-code: |
      ctx->type = PTHREAD_MUTEX_RECURSIVE;
      ctx->tq_mtx_ctx.recursive = TQ_MTX_RECURSIVE_ALLOWED;
    text: |
      While the ${../glossary/mutex-type:/term} of the mutex is
      ${../if/mutex-recursive:/name}.
  - name: Errorcheck
    test-code: |
      ctx->type = PTHREAD_MUTEX_ERRORCHECK;
      ctx->tq_mtx_ctx.recursive = TQ_MTX_RECURSIVE_DEADLOCK;
    text: |
      While the ${../glossary/mutex-type:/term} of the mutex is
      ${../if/mutex-errorcheck:/name}.
  - name: Default
    test-code: |
      ctx->type = PTHREAD_MUTEX_DEFAULT;
      ctx->tq_mtx_ctx.recursive = TQ_MTX_RECURSIVE_DEADLOCK;
    text: |
      While the ${../glossary/mutex-type:/term} of the mutex is
      ${../if/mutex-default:/name}.
  test-epilogue: null
  test-prologue: null
- name: Mutex
  states:
  - name: 'Null'
    test-code: |
      ctx->mutex = NULL;
    text: |
      While the ${../if/mutex-unlock:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  - name: Invalid
    test-code: |
      T_eq_int( pthread_mutex_init( &ctx->mutex_obj, NULL ), 0 );
      T_eq_int( pthread_mutex_destroy( &ctx->mutex_obj ), 0 );
      ctx->mutex = &ctx->mutex_obj;
    text: |
      While the object referenced by the ${../if/mutex-unlock:/params[0]/name}
      parameter is not a valid mutex.
  - name: Static
    test-code: |
      static const pthread_mutex_t initializer = PTHREAD_MUTEX_INITIALIZER;

      ctx->mutex_obj = initializer;
      ctx->mutex = &ctx->mutex_obj;
      ctx->mutex_initialized = true;
    text: |
      While the object referenced by the ${../if/mutex-unlock:/params[0]/name}
      parameter is equal to ${../if/mutex-initializer:/name}.
  - name: Init
    test-code: |
      pthread_mutexattr_t attr;

      T_eq_int( pthread_mutexattr_init( &attr ), 0 );
      T_eq_int( pthread_mutexattr_settype( &attr, ctx->type ), 0 );
      T_eq_int( pthread_mutexattr_setprotocol( &attr, ctx->protocol ), 0 );
      T_eq_int(
        pthread_mutexattr_setprioceiling(
          &attr,
          ToPOSIXPriority( PRIO_VERY_HIGH )
        ),
        0
      );
      T_eq_int( pthread_mutex_init( &ctx->mutex_obj, &attr ), 0 );
      T_eq_int( pthread_mutexattr_destroy( &attr ), 0 );
      ctx->mutex = &ctx->mutex_obj;
      ctx->mutex_initialized = true;
      ctx->tq_mtx_ctx.base.thread_queue_object = ctx->mutex;
      T_eq_int( pthread_mutex_lock( ctx->mutex ), 0 );
    text: |
      While the object referenced by the ${../if/mutex-unlock:/params[0]/name}
      parameter is an initialized mutex.
  test-epilogue: null
  test-prologue: null
rationale: |
  The validation of the ${../if/mutex-unlock:/params[0]/name} parameter is not
  covered by ${/score/mtx/req/surrender:/spec}, which has no pre-condition for
  the validity of the object. States Null and Invalid of pre-condition Mutex are
  therefore specified by post-condition Status. The standard leaves the behaviour
  undefined for these states, and RTEMS returns ${/c/errno/if/einval:/name}.

  For an initialized mutex, the result depends on the owner of the mutex, on the
  nesting level and on the threads which wait for the mutex. These are
  pre-conditions of ${/score/mtx/req/surrender:/spec}, so post-condition Action
  alone specifies the surrender of an initialized mutex. The preparation of state
  Init of pre-condition Mutex locks the mutex, so that the call of the action
  succeeds. ${/ref/std/posix-2024/pthread-mutex-lock:/name} requires
  ${/c/errno/if/eperm:/name} for a mutex with the ${../if/mutex-errorcheck:/name}
  or the ${../if/mutex-recursive:/name} ${../glossary/mutex-type:/term} which the
  calling thread does not own. RTEMS checks the owner for every
  ${../glossary/mutex-type:/term}, which the state Yes of pre-condition
  OwnerCheck of ${/score/mtx/req/surrender:/spec} specifies.

  A statically initialized mutex has no owner until a thread locks it. The
  function initializes such a mutex and returns ${/c/errno/if/eperm:/name},
  because the calling thread does not own it. The state Static of pre-condition
  Mutex therefore leads to post-condition Status and not to the surrender. The
  ${../glossary/mutex-type:/term} and the ${../glossary/mutex-protocol:/term} of
  an initialized mutex are pre-conditions of their own. Each
  ${../glossary/mutex-type:/term} is a state of its own, so that every
  ${../glossary/mutex-type:/term} which the interface defines has a requirement.
requirement-type: functional
skip-reasons: {}
test-action: |
  ctx->status = pthread_mutex_unlock( ctx->mutex );
test-brief: null
test-cleanup: |
  if ( ctx->mutex_initialized ) {
    ctx->mutex_initialized = false;

    while ( pthread_mutex_unlock( ctx->mutex ) == 0 ) {
      /* Release the mutex including all recursive locks */
    }

    T_eq_int( pthread_mutex_destroy( &ctx->mutex_obj ), 0 );
  }
