transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Mutex:
          - 'Null'
          - Invalid
      then: Inval
    - if:
        pre-conditions:
          Mutex: Static
      then: Perm
    - if:
        pre-conditions:
          Mutex: Init
          Owner:
          - Other
          - None
      then: Perm
    - else: Ok
    Action:
    - if:
        and:
        - post-conditions:
            Status: Ok
        - pre-conditions:
            Protocol:
            - None
            Type:
            - Normal
      then: MtxNone
    - if:
        and:
        - post-conditions:
            Status: Ok
        - pre-conditions:
            Protocol:
            - None
            Type:
            - Recursive
      then: MtxNoneRecursive
    - if:
        and:
        - post-conditions:
            Status: Ok
        - pre-conditions:
            Protocol:
            - Inherit
            Type:
            - Normal
      then: MtxInherit
    - if:
        and:
        - post-conditions:
            Status: Ok
        - pre-conditions:
            Protocol:
            - Inherit
            Type:
            - Recursive
      then: MtxInheritRecursive
    - if:
        and:
        - post-conditions:
            Status: Ok
        - pre-conditions:
            Protocol:
            - Ceiling
            Type:
            - Normal
      then: MtxCeiling
    - if:
        and:
        - post-conditions:
            Status: Ok
        - pre-conditions:
            Protocol:
            - Ceiling
            Type:
            - Recursive
      then: MtxCeilingRecursive
    - else: N/A
  pre-conditions:
    Protocol: all
    Owner: all
    Type:
      applicable:
        pre-conditions:
          Mutex:
          - Init
    Mutex: all
