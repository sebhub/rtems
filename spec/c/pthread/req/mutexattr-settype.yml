enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/mutexattr-settype
- role: requirement-refinement
  uid: ../../req/group-posix-api
- role: reference
  uid: /ref/std/posix-2024/pthread-mutexattr-settype
post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/mutexattr-settype:/name} shall be
      zero.
  - name: Inval
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/mutexattr-settype:/name} shall be
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: Type
  states:
  - name: Normal
    test-code: |
      T_eq_int( ctx->attr_obj.type, PTHREAD_MUTEX_NORMAL );
    text: |
      The ${../glossary/mutex-type:/term} of the ${../glossary/mutex:/term}
      attributes object referenced by the ${../if/mutexattr-settype:/params[0]/name}
      parameter shall be ${../if/mutex-normal:/name}.
  - name: Recursive
    test-code: |
      T_eq_int( ctx->attr_obj.type, PTHREAD_MUTEX_RECURSIVE );
    text: |
      The ${../glossary/mutex-type:/term} of the ${../glossary/mutex:/term}
      attributes object referenced by the ${../if/mutexattr-settype:/params[0]/name}
      parameter shall be ${../if/mutex-recursive:/name}.
  - name: Errorcheck
    test-code: |
      T_eq_int( ctx->attr_obj.type, PTHREAD_MUTEX_ERRORCHECK );
    text: |
      The ${../glossary/mutex-type:/term} of the ${../glossary/mutex:/term}
      attributes object referenced by the ${../if/mutexattr-settype:/params[0]/name}
      parameter shall be ${../if/mutex-errorcheck:/name}.
  - name: Default
    test-code: |
      T_eq_int( ctx->attr_obj.type, PTHREAD_MUTEX_DEFAULT );
    text: |
      The ${../glossary/mutex-type:/term} of the ${../glossary/mutex:/term}
      attributes object referenced by the ${../if/mutexattr-settype:/params[0]/name}
      parameter shall be ${../if/mutex-default:/name}.
  - name: Nop
    test-code: |
      T_eq_int( ctx->attr_obj.type, ctx->attr_before.type );
    text: |
      The ${../glossary/mutex-type:/term} of the ${../glossary/mutex:/term}
      attributes object referenced by the ${../if/mutexattr-settype:/params[0]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: Other
  states:
  - name: Nop
    test-code: |
      pthread_mutexattr_t expected;

      memcpy( &expected, &ctx->attr_before, sizeof( expected ) );
      expected.type = ctx->attr_obj.type;
      T_eq_mem( &ctx->attr_obj, &expected, sizeof( expected ) );
    text: |
      The content of the ${../glossary/mutex:/term} attributes object referenced by
      the ${../if/mutexattr-settype:/params[0]/name} parameter, other than its
      ${../glossary/mutex-type:/term}, shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Obj
    test-code: |
      ctx->attr = &ctx->attr_obj;
    text: |
      While the ${../if/mutexattr-settype:/params[0]/name} parameter references an
      object of type ${/c/if/pthread_mutexattr_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/mutexattr-settype:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Initialized
  states:
  - name: 'Yes'
    test-code: |
      T_eno_success( pthread_mutexattr_init( &ctx->attr_obj ) );
      ctx->attr_obj.type = -1;
    text: |
      While the object referenced by the ${../if/mutexattr-settype:/params[0]/name}
      parameter is an initialized ${../glossary/mutex:/term} attributes object.
  - name: 'No'
    test-code: |
      memset( &ctx->attr_obj, 0, sizeof( ctx->attr_obj ) );
      ctx->attr_obj.type = -1;
    text: |
      While the object referenced by the ${../if/mutexattr-settype:/params[0]/name}
      parameter is not an initialized ${../glossary/mutex:/term} attributes object.
  test-epilogue: null
  test-prologue: null
- name: Type
  states:
  - name: Normal
    test-code: |
      ctx->type = PTHREAD_MUTEX_NORMAL;
    text: |
      While the ${../if/mutexattr-settype:/params[1]/name} parameter is equal to
      ${../if/mutex-normal:/name}.
  - name: Recursive
    test-code: |
      ctx->type = PTHREAD_MUTEX_RECURSIVE;
    text: |
      While the ${../if/mutexattr-settype:/params[1]/name} parameter is equal to
      ${../if/mutex-recursive:/name}.
  - name: Errorcheck
    test-code: |
      ctx->type = PTHREAD_MUTEX_ERRORCHECK;
    text: |
      While the ${../if/mutexattr-settype:/params[1]/name} parameter is equal to
      ${../if/mutex-errorcheck:/name}.
  - name: Default
    test-code: |
      ctx->type = PTHREAD_MUTEX_DEFAULT;
    text: |
      While the ${../if/mutexattr-settype:/params[1]/name} parameter is equal to
      ${../if/mutex-default:/name}.
  - name: Invalid
    test-code: |
      ctx->type = TYPE_INVALID;
    text: |
      While the ${../if/mutexattr-settype:/params[1]/name} parameter is not a valid
      ${../glossary/mutex-type:/term}.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/pthread-mutexattr-settype:/name} names
  ${/c/errno/if/einval:/name} for an invalid value of the
  ${../if/mutexattr-settype:/params[1]/name} parameter. The valid values are the
  four mutex types of the standard, which give the states of pre-condition Type
  besides state Invalid.

  The standard leaves the behaviour undefined where the
  ${../if/mutexattr-settype:/params[0]/name} parameter references no initialized
  ${../glossary/mutex:/term} attributes object. It recommends
  ${/c/errno/if/einval:/name} for that case. State Null of pre-condition Attr and
  state No of pre-condition Initialized specify the behaviour of RTEMS which
  follows that recommendation.

  ${../if/mutexattr-settype:/name} writes no other member of the object, which
  post-condition Other specifies.
requirement-type: functional
skip-reasons: {}
test-action: |
  memcpy( &ctx->attr_before, &ctx->attr_obj, sizeof( ctx->attr_before ) );
  ctx->status = pthread_mutexattr_settype( ctx->attr, ctx->type );
