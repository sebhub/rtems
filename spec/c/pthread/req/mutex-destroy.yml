  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Mutex: 'Null'
      then: Inval
    - if:
        pre-conditions:
          Kind:
          - Destroyed
          - Corrupted
      then: Inval
    - if:
        pre-conditions:
          Kind: Init
          Locked: 'Yes'
      then: Busy
    - else: Ok
    Object:
    - if:
        pre-conditions:
          Mutex: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Ok
      then: Destroyed
    - else: Nop
  pre-conditions:
    Mutex: all
    Kind:
      applicable:
        pre-conditions:
          Mutex: Obj
    Locked:
      applicable:
        pre-conditions:
          Kind: Init
