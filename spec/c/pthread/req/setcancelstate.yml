- name: CancelState
  states:
  - name: Enable
    test-code: |
      ctx->cancel_state = PTHREAD_CANCEL_ENABLE;
    text: |
      While the ${../glossary/thread-cancel-state:/term} of the
      ${/glossary/executingtask:/term} is ${../if/cancel-enable:/name}.
  - name: Disable
    test-code: |
      ctx->cancel_state = PTHREAD_CANCEL_DISABLE;
    text: |
      While the ${../glossary/thread-cancel-state:/term} of the
      ${/glossary/executingtask:/term} is ${../if/cancel-disable:/name}.
  test-epilogue: null
  test-prologue: null
- name: CancelType
  states:
  - name: Deferred
    test-code: |
      ctx->cancel_type = PTHREAD_CANCEL_DEFERRED;
    text: |
      While the ${../glossary/thread-cancel-type:/term} of the
      ${/glossary/executingtask:/term} is ${../if/cancel-deferred:/name}.
  - name: Asynchronous
    test-code: |
      ctx->cancel_type = PTHREAD_CANCEL_ASYNCHRONOUS;
    text: |
      While the ${../glossary/thread-cancel-type:/term} of the
      ${/glossary/executingtask:/term} is ${../if/cancel-asynchronous:/name}.
  test-epilogue: null
  test-prologue: null
- name: CancelPending
