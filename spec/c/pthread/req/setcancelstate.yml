test-prepare: |
  ctx->phase = PHASE_ACTION;
  ctx->worker_started = false;
  ctx->joined = false;
  ctx->restarts = 0;
  ctx->returned = false;
  ctx->late_returned = false;
  ctx->exit_value = NULL;
  ctx->status = -1;
  ctx->oldstate_obj = -1;
  ctx->state_after = -1;
  ctx->type_after = -1;
