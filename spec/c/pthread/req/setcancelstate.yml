post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/setcancelstate:/name} shall be
      zero.
  - name: Inval
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/setcancelstate:/name} shall be
      ${/c/errno/if/einval:/name}.
  - name: Proto
    test-code: |
      T_eq_int( ctx->status, EPROTO );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/setcancelstate:/name} shall be
      ${/c/errno/if/eproto:/name}.
  test-epilogue: null
  test-prologue: null
- name: CancelState
  states:
  - name: Enable
    test-code: |
      T_eq_int( ctx->state_after, PTHREAD_CANCEL_ENABLE );
    text: |
      The ${../glossary/thread-cancel-state:/term} of the
      ${/glossary/executingtask:/term} shall be ${../if/cancel-enable:/name}.
  - name: Disable
    test-code: |
      T_eq_int( ctx->state_after, PTHREAD_CANCEL_DISABLE );
    text: |
      The ${../glossary/thread-cancel-state:/term} of the
      ${/glossary/executingtask:/term} shall be ${../if/cancel-disable:/name}.
  - name: Nop
    test-code: |
      T_eq_int( ctx->state_after, ctx->cancel_state );
    text: |
      The ${../glossary/thread-cancel-state:/term} of the
      ${/glossary/executingtask:/term} shall not be modified by the
      ${../if/setcancelstate:/name} call.
  test-epilogue: null
  test-prologue: null
- name: OldState
  states:
  - name: Set
    test-code: |
      T_eq_int( ctx->oldstate_obj, ctx->cancel_state );
    text: |
      The value of the object referenced by the
      ${../if/setcancelstate:/params[1]/name} parameter shall be set to the
      ${../glossary/thread-cancel-state:/term} of the
      ${/glossary/executingtask:/term} before the call.
  - name: Nop
    test-code: |
      T_eq_int( ctx->oldstate_obj, -1 );
    text: |
      The object referenced by the ${../if/setcancelstate:/params[1]/name} parameter
      shall not be modified by the ${../if/setcancelstate:/name} call.
  test-epilogue: null
  test-prologue: null
- name: CancelType
  states:
  - name: Nop
    test-code: |
      T_eq_int( ctx->type_after, ctx->cancel_type );
    text: |
      The ${../glossary/thread-cancel-type:/term} of the
      ${/glossary/executingtask:/term} shall not be modified by the
      ${../if/setcancelstate:/name} call.
  test-epilogue: null
  test-prologue: null
- name: Life
  states:
  - name: Nop
    test-code: |
      T_true( IsTaskSuspended( ctx->worker_id ) );
      T_eq_u32( ctx->restarts, 0 );
    text: |
      The ${/glossary/executingtask:/term} shall be neither terminated nor restarted
      by the ${../if/setcancelstate:/name} call.
  - name: Terminate
    test-code: |
      JoinWorker( ctx );
      T_eq_u32( ctx->restarts, 0 );
    text: |
      The ${/glossary/executingtask:/term} shall be terminated by a
      ${../glossary/thread-cancellation:/term}.
  - name: Restart
    test-code: |
      JoinWorker( ctx );
      T_eq_ptr( ctx->exit_value, &exit_object );
      T_eq_u32( ctx->restarts, 1 );
    text: |
      The ${/glossary/executingtask:/term} shall be restarted.
  test-epilogue: null
  test-prologue: null
- name: Return
  states:
  - name: 'Yes'
    test-code: |
      T_true( ctx->returned );
    text: |
      The ${../if/setcancelstate:/name} call shall return to the caller.
  - name: 'No'
    test-code: |
      T_false( ctx->returned );
    text: |
      The ${../if/setcancelstate:/name} call shall not return to the caller.
  test-epilogue: null
  test-prologue: null
- name: ExitValue
  states:
  - name: Canceled
    test-code: |
      T_eq_ptr( ctx->exit_value, PTHREAD_CANCELED );
    text: |
      The ${../glossary/thread-exit-value:/term} of the
      ${/glossary/executingtask:/term} shall be ${../if/canceled:/name}.
  test-epilogue: null
  test-prologue: null
- name: Requests
  states:
  - name: Nop
    test-code: |
      ctx->phase = PHASE_LATER;
      ResumeTask( ctx->worker_id );
      T_eq_int( pthread_join( ctx->worker_thread, &ctx->exit_value ), 0 );
      ctx->joined = true;

      if ( ctx->cancel_pending ) {
        T_eq_ptr( ctx->exit_value, PTHREAD_CANCELED );
        T_false( ctx->late_returned );
        T_eq_u32( ctx->restarts, 0 );
      } else if ( ctx->restart_pending ) {
        T_eq_ptr( ctx->exit_value, &exit_object );
        T_eq_u32( ctx->restarts, 1 );
      } else {
        T_eq_ptr( ctx->exit_value, &exit_object );
        T_true( ctx->late_returned );
        T_eq_u32( ctx->restarts, 0 );
      }
    text: |
      The pending ${../glossary/thread-cancel-request:/term} and the pending restart
      by ${/rtems/task/if/restart:/name} of the ${/glossary/executingtask:/term}
      shall not be modified by the ${../if/setcancelstate:/name} call.
  test-epilogue: null
  test-prologue: null
