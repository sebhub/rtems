  test-prologue: null
rationale: |
  Dimension Context covers the context of the call, 2 states. The interface item
  states the ${/c/errno/if/eproto:/name} status for interrupt context. The
  executing task of that context is the interrupted task.

  Dimension CancelState covers the ${../glossary/thread-cancel-state:/term} of
  the executing task before the call, 2 states. Dimension CancelType covers its
  ${../glossary/thread-cancel-type:/term}, 2 states.
  ${/ref/std/posix-2024/cancelability-states:/name} defines both sets of states.

  Dimension CancelPending covers the pending
  ${../glossary/thread-cancel-request:/term} of the executing task, 2 states.
  Dimension RestartPending covers the pending restart request of the executing
  task, 2 states. The section ${/ref/rtems/c-user/task-life-states:/name} of the
  RTEMS Classic API Guide states that the task life protection and the deferred
  life changes block both requests.

  ${/ref/std/posix-2024/cancellation-points:/name} does not list
  ${../if/setcancelstate:/name} as a ${../glossary/cancellation-point:/term}. The
  call therefore acts upon no request while the type is deferred. With the
  asynchronous type, the enabled state ends the block of the Task Life States
  section. The notes of ${/rtems/task/if/delete:/name} state that a terminating
  task with a protected task life executes normally until it disables the
  protection. The item /rtems/task/req/restart states that a terminating task
  which restarts terminates.

  A call during the termination of the executing task is no state of a dimension.
  ${/ref/std/posix-2024/thread-cancellation-cleanup-handlers:/name} leaves a
  change to the enabled state undefined there.

  A task with the enabled state and the asynchronous type acted upon each request
  when the request was made. The request is then never pending, so the map skips
  these variants.
requirement-type: functional
skip-reasons:
  ActedUpon: |
    A task with the ${../if/cancel-enable:/name} state and the
    ${../if/cancel-asynchronous:/name} type acts upon a request when the request is
    made, so no request is pending.
test-action: |
  ctx->worker_id = CreateTask( "WORK", PRIO_HIGH );
  StartTask( ctx->worker_id, Worker, ctx );
test-brief: null
test-cleanup: |
  if ( !ctx->joined ) {
    ctx->phase = PHASE_CLEANUP;
    ResumeTask( ctx->worker_id );
    T_eq_int( pthread_join( ctx->worker_thread, NULL ), 0 );
  }
