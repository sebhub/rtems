transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Out: 'Null'
      then: Inval
    - if:
        pre-conditions:
          Mutex:
          - Static
          - Corrupted
          - 'Null'
      then: Inval
    - if:
        pre-conditions:
          Protocol:
          - None
          - Inherit
      then: Inval
    - else: Ok
    Result:
    - if:
        pre-conditions:
          Out: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Ok
      then-specified-by: Ceiling
    - else: Zero
    MutexObj:
    - if:
        pre-conditions:
          Mutex: 'Null'
      then: N/A
    - if:
        pre-conditions:
          Mutex: Static
          Out: Obj
      then: N/A
    - else: Nop
  pre-conditions:
    Mutex: all
    Protocol:
      applicable:
        pre-conditions:
          Mutex: Init
    Ceiling:
      applicable:
        pre-conditions:
          Mutex: Init
          Protocol: Protect
    Out: all
