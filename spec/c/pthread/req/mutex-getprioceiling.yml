post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/mutex-getprioceiling:/name} shall
      be zero.
  - name: Inval
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/mutex-getprioceiling:/name} shall
      be ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: Result
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->out_obj, 0 );
    text: |
      The value of the object referenced by the
      ${../if/mutex-getprioceiling:/params[1]/name} parameter shall be zero.
  - name: Valid
    test-code: |
      T_eq_int( ctx->out_obj, CeilingValue() );
    text: |
      The value of the object referenced by the
      ${../if/mutex-getprioceiling:/params[1]/name} parameter shall be the priority
      ceiling of the mutex.
  - name: Maximum
    test-code: |
      T_eq_int( ctx->out_obj, GetPOSIXPriorityMaximum() );
    text: |
      The value of the object referenced by the
      ${../if/mutex-getprioceiling:/params[1]/name} parameter shall be the maximum
      priority.
  - name: Nop
    test-code: |
      T_eq_int( ctx->out_obj, -1 );
    text: |
      The value of the object referenced by the
      ${../if/mutex-getprioceiling:/params[1]/name} parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: MutexObj
  states:
  - name: Nop
    test-code: |
      pthread_mutex_t expected;

      memcpy( &expected, &ctx->mutex_before, sizeof( expected ) );
      #if defined( RTEMS_SMP )
      memcpy(
        &_POSIX_Mutex_Get( &expected )->Recursive.Mutex.Queue.Queue.Lock,
        &MutexOf( ctx )->Recursive.Mutex.Queue.Queue.Lock,
        sizeof( MutexOf( ctx )->Recursive.Mutex.Queue.Queue.Lock )
      );
      #endif
      T_eq_mem( &ctx->mutex_obj, &expected, sizeof( expected ) );
    text: |
      The object referenced by the ${../if/mutex-getprioceiling:/params[0]/name}
      parameter, other than its SMP lock, shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: Lock
  states:
  - name: Released
    test-code: |
      #if defined( RTEMS_SMP )
        T_true( TicketLockIsAvailable( MutexTicketLock( ctx ) ) );
      #else
        (void) ctx;
      #endif
    text: |
      The SMP lock of the mutex referenced by the
      ${../if/mutex-getprioceiling:/params[0]/name} parameter shall be released.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Mutex
  states:
  - name: Init
    test-code: |
      ctx->mutex = &ctx->mutex_obj;
      ctx->init = true;
    text: |
      While the ${../if/mutex-getprioceiling:/params[0]/name} parameter references an
      initialized mutex.
  - name: Static
    test-code: |
      memset( &ctx->mutex_obj, 0, sizeof( ctx->mutex_obj ) );
      ctx->mutex = &ctx->mutex_obj;
    text: |
      While the ${../if/mutex-getprioceiling:/params[0]/name} parameter references a
      statically initialized mutex.
  - name: Corrupted
    test-code: |
      memset( &ctx->mutex_obj, 0xff, sizeof( ctx->mutex_obj ) );
      ctx->mutex = &ctx->mutex_obj;
    text: |
      While the ${../if/mutex-getprioceiling:/params[0]/name} parameter references an
      object which is not a mutex.
  - name: 'Null'
    test-code: |
      ctx->mutex = NULL;
    text: |
      While the ${../if/mutex-getprioceiling:/params[0]/name} parameter is equal to
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Protocol
  states:
  - name: None
    test-code: |
      ctx->attr_obj.protocol = PTHREAD_PRIO_NONE;
    text: |
      While the mutex uses no priority protocol.
  - name: Inherit
    test-code: |
      ctx->attr_obj.protocol = PTHREAD_PRIO_INHERIT;
    text: |
      While the mutex uses the priority inheritance protocol.
  - name: Protect
    test-code: |
      ctx->attr_obj.protocol = PTHREAD_PRIO_PROTECT;
    text: |
      While the mutex uses the priority ceiling protocol.
  test-epilogue: null
  test-prologue: null
- name: Ceiling
  states:
  - name: Valid
    test-code: |
      ctx->attr_obj.prio_ceiling = CeilingValue();
    text: |
      While the priority ceiling of the mutex is a valid priority which is not the
      maximum priority.
  - name: Maximum
    test-code: |
      ctx->attr_obj.prio_ceiling = INT_MAX;
    text: |
      While the priority ceiling of the mutex is the maximum priority.
  test-epilogue: null
  test-prologue: null
- name: Out
  states:
  - name: Obj
    test-code: |
      ctx->out = &ctx->out_obj;
    text: |
      While the ${../if/mutex-getprioceiling:/params[1]/name} parameter references an
      object of type int.
  - name: 'Null'
    test-code: |
      ctx->out = NULL;
    text: |
      While the ${../if/mutex-getprioceiling:/params[1]/name} parameter is equal to
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/pthread-mutex-getprioceiling:/name} requires
  ${/c/errno/if/eperm:/name} only if the implementation requires privileges to
  perform the operation. RTEMS requires none and
  ${../if/mutex-getprioceiling:/name} contains no privilege check, so it cannot
  return this value and no state is specified for it.

  The standard requires ${/c/errno/if/einval:/name} if the
  ${../glossary/mutex-protocol:/term} of the mutex is ${../if/prio-none:/name}.
  RTEMS returns zero for such a mutex, which state None of pre-condition Protocol
  specifies. This is the only deviation of ${../if/mutex-getprioceiling:/name}
  from the standard. The same holds for state Inherit, for which the standard
  specifies no error.

  A mutex which does not use the priority ceiling protocol has no priority
  ceiling. ${../if/mutex-getprioceiling:/name} stores zero in the object
  referenced by the ${../if/mutex-getprioceiling:/params[1]/name} parameter for
  such a mutex. The states of pre-conditions Protocol and Ceiling arrange the
  mutex, and pre-condition Ceiling applies only to state Protect of pre-condition
  Protocol.

  The standard leaves the behaviour undefined where the
  ${../if/mutex-getprioceiling:/params[0]/name} parameter references no
  initialized mutex or is ${/c/if/null:/name}. States Corrupted and Null of
  pre-condition Mutex specify that RTEMS returns ${/c/errno/if/einval:/name}. A
  statically initialized mutex is initialized by the call, so its object is not
  specified as unmodified.

  ${../if/mutex-getprioceiling:/name} validates the
  ${../if/mutex-getprioceiling:/params[1]/name} parameter before the
  ${../if/mutex-getprioceiling:/params[0]/name} parameter, so the mutex is not
  examined for state Null of pre-condition Out.

  Post-condition Lock specifies that the call releases the SMP lock of the mutex.
