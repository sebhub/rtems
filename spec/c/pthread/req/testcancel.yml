post-conditions:
- name: Return
  states:
  - name: 'Yes'
    test-code: |
      T_true( ctx->returned );
    text: |
      The ${../if/testcancel:/name} call shall return to the caller.
  - name: 'No'
    test-code: |
      T_false( ctx->returned );
    text: |
      The ${../if/testcancel:/name} call shall not return to the caller.
  test-epilogue: null
  test-prologue: null
- name: Life
  states:
  - name: Terminate
    test-code: |
      JoinWorker( ctx );
      T_eq_u32( ctx->restarts, 0 );
    text: |
      The ${/glossary/executingtask:/term} shall be terminated by a
      ${../glossary/thread-cancellation:/term}.
  - name: Restart
    test-code: |
      JoinWorker( ctx );
      T_eq_ptr( ctx->exit_value, &exit_object );
      T_eq_u32( ctx->restarts, 1 );
    text: |
      The ${/glossary/executingtask:/term} shall be restarted.
  - name: Nop
    test-code: |
      T_true( IsTaskSuspended( ctx->worker_id ) );
      T_eq_u32( ctx->restarts, 0 );
    text: |
      The ${/glossary/executingtask:/term} shall be neither terminated nor restarted
      by the ${../if/testcancel:/name} call.
  test-epilogue: null
  test-prologue: null
- name: ExitValue
  states:
  - name: Canceled
    test-code: |
      T_eq_ptr( ctx->exit_value, PTHREAD_CANCELED );
    text: |
      The ${../glossary/thread-exit-value:/term} of the
      ${/glossary/executingtask:/term} shall be ${../if/canceled:/name}.
  test-epilogue: null
  test-prologue: null
- name: CancelState
  states:
  - name: Nop
    test-code: |
      T_eq_int( ctx->state_after, ctx->cancel_state );
    text: |
      The ${../glossary/thread-cancel-state:/term} of the
      ${/glossary/executingtask:/term} shall not be modified by the
      ${../if/testcancel:/name} call.
  test-epilogue: null
  test-prologue: null
- name: CancelType
  states:
  - name: Nop
    test-code: |
      T_eq_int( ctx->type_after, ctx->cancel_type );
    text: |
      The ${../glossary/thread-cancel-type:/term} of the
      ${/glossary/executingtask:/term} shall not be modified by the
      ${../if/testcancel:/name} call.
  test-epilogue: null
  test-prologue: null
- name: Requests
  states:
  - name: Nop
    test-code: |
      ctx->phase = PHASE_LATER;
      ResumeTask( ctx->worker_id );
      T_eq_int( pthread_join( ctx->worker_thread, &ctx->exit_value ), 0 );
      ctx->joined = true;

      if ( ctx->cancel_pending ) {
        T_eq_ptr( ctx->exit_value, PTHREAD_CANCELED );
        T_false( ctx->late_returned );
        T_eq_u32( ctx->restarts, 0 );
      } else if ( ctx->restart_pending ) {
        T_eq_ptr( ctx->exit_value, &exit_object );
        T_eq_u32( ctx->restarts, 1 );
      } else {
        T_eq_ptr( ctx->exit_value, &exit_object );
        T_true( ctx->late_returned );
        T_eq_u32( ctx->restarts, 0 );
      }
    text: |
      The pending ${../glossary/thread-cancel-request:/term} and the pending restart
      by ${/rtems/task/if/restart:/name} of the ${/glossary/executingtask:/term}
      shall not be modified by the ${../if/testcancel:/name} call.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Context
  states:
  - name: Task
    test-code: |
      ctx->in_interrupt = false;
    text: |
      While ${../if/testcancel:/name} is called from within task context.
  - name: Interrupt
    test-code: |
      ctx->in_interrupt = true;
    text: |
      While ${../if/testcancel:/name} is called from within interrupt context.
  test-epilogue: null
  test-prologue: null
- name: CancelState
  states:
  - name: Enable
    test-code: |
      ctx->cancel_state = PTHREAD_CANCEL_ENABLE;
    text: |
      While the ${../glossary/thread-cancel-state:/term} of the
      ${/glossary/executingtask:/term} is ${../if/cancel-enable:/name}.
  - name: Disable
    test-code: |
      ctx->cancel_state = PTHREAD_CANCEL_DISABLE;
    text: |
      While the ${../glossary/thread-cancel-state:/term} of the
      ${/glossary/executingtask:/term} is ${../if/cancel-disable:/name}.
  test-epilogue: null
  test-prologue: null
- name: CancelType
  states:
  - name: Deferred
    test-code: |
      ctx->cancel_type = PTHREAD_CANCEL_DEFERRED;
    text: |
      While the ${../glossary/thread-cancel-type:/term} of the
      ${/glossary/executingtask:/term} is ${../if/cancel-deferred:/name}.
  - name: Asynchronous
    test-code: |
      ctx->cancel_type = PTHREAD_CANCEL_ASYNCHRONOUS;
    text: |
      While the ${../glossary/thread-cancel-type:/term} of the
      ${/glossary/executingtask:/term} is ${../if/cancel-asynchronous:/name}.
  test-epilogue: null
  test-prologue: null
- name: CancelPending
  states:
  - name: 'Yes'
    test-code: |
      ctx->cancel_pending = true;
    text: |
      While a ${../glossary/thread-cancel-request:/term} is pending for the
      ${/glossary/executingtask:/term}.
  - name: 'No'
    test-code: |
      ctx->cancel_pending = false;
    text: |
      While no ${../glossary/thread-cancel-request:/term} is pending for the
      ${/glossary/executingtask:/term}.
  test-epilogue: null
  test-prologue: null
- name: RestartPending
  states:
  - name: 'Yes'
    test-code: |
      ctx->restart_pending = true;
    text: |
      While a restart of the ${/glossary/executingtask:/term} by
      ${/rtems/task/if/restart:/name} is pending.
  - name: 'No'
    test-code: |
      ctx->restart_pending = false;
    text: |
      While no restart of the ${/glossary/executingtask:/term} is pending.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension Context covers the context of the call, 2 states. The executing task
  of interrupt context is the interrupted task. The cancel state and the cancel
  type functions reject a call from within interrupt context.
  ${../if/testcancel:/name} returns no status, so the call acts upon no request
  there.

  Dimension CancelState covers the ${../glossary/thread-cancel-state:/term} of
  the executing task, 2 states. Dimension CancelType covers its
  ${../glossary/thread-cancel-type:/term}, 2 states.
  ${/ref/std/posix-2024/cancelability-states:/name} defines both sets of states.
  ${/ref/std/posix-2024/pthread-testcancel:/name} states that the call has no
  effect while the cancelability is disabled.

  Dimension CancelPending covers a pending
  ${../glossary/thread-cancel-request:/term} of the executing task, 2 states.
  ${/ref/std/posix-2024/cancellation-points:/name} states that a
  ${../glossary/cancellation-point:/term} acts upon a pending request before the
  function returns, while the cancelability is enabled. The section
  ${/ref/rtems/c-user/task-life-states:/name} of the RTEMS Classic API Guide
  states that RTEMS implements no cancellation point. It states that
  ${../if/testcancel:/name} ends the delay of the requests.

  Dimension RestartPending covers a pending restart of the executing task, 2
  states. The section ${/ref/rtems/c-user/task-life-states:/name} of the RTEMS
  Classic API Guide states that the deferred life changes delay a restart until
  the task calls ${../if/testcancel:/name}. The item /rtems/task/req/restart
  states that a terminating task which restarts terminates.

  A task with the enabled state and the asynchronous type acted upon each request
  when the request was made. The request is then never pending, so the map skips
  these variants.
requirement-type: functional
skip-reasons:
  ActedUpon: |
    A task with the ${../if/cancel-enable:/name} state and the
    ${../if/cancel-asynchronous:/name} type acts upon a request when the request is
    made, so no request is pending.
test-action: |
  ctx->worker_id = CreateTask( "WORK", PRIO_HIGH );
  StartTask( ctx->worker_id, Worker, ctx );
test-brief: null
test-cleanup: |
  if ( !ctx->joined ) {
    ctx->phase = PHASE_CLEANUP;
    ResumeTask( ctx->worker_id );
    T_eq_int( pthread_join( ctx->worker_thread, NULL ), 0 );
  }
