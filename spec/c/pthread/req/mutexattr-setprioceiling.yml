enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/mutexattr-setprioceiling
- role: requirement-refinement
  uid: ../../req/group-posix-api
- role: reference
  uid: /ref/std/posix-2024/pthread-mutexattr-setprioceiling
post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/mutexattr-setprioceiling:/name}
      shall be zero.
  - name: Inval
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/mutexattr-setprioceiling:/name}
      shall be ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: Prioceiling
  states:
  - name: Minimum
    test-code: |
      T_eq_int( ctx->attr_obj.prio_ceiling, GetPOSIXPriorityMinimum() );
    text: |
      The ${../glossary/mutex-priority-ceiling:/term} of the
      ${../glossary/mutex:/term} attributes object referenced by the
      ${../if/mutexattr-setprioceiling:/params[0]/name} parameter shall be the
      minimum ${../glossary/thread-priority:/term} of the ${/c/sched/if/fifo:/name}
      ${/c/sched/glossary/policy:/term}.
  - name: Maximum
    test-code: |
      T_eq_int( ctx->attr_obj.prio_ceiling, GetPOSIXPriorityMaximum() );
    text: |
      The ${../glossary/mutex-priority-ceiling:/term} of the
      ${../glossary/mutex:/term} attributes object referenced by the
      ${../if/mutexattr-setprioceiling:/params[0]/name} parameter shall be the
      maximum ${../glossary/thread-priority:/term} of the ${/c/sched/if/fifo:/name}
      ${/c/sched/glossary/policy:/term}.
  - name: OutOfRange
    test-code: |
      T_eq_int( ctx->attr_obj.prio_ceiling, GetPOSIXPriorityMaximum() + 1 );
    text: |
      The ${../glossary/mutex-priority-ceiling:/term} of the
      ${../glossary/mutex:/term} attributes object referenced by the
      ${../if/mutexattr-setprioceiling:/params[0]/name} parameter shall be the
      maximum ${../glossary/thread-priority:/term} of the ${/c/sched/if/fifo:/name}
      ${/c/sched/glossary/policy:/term} plus one.
  - name: Nop
    test-code: |
      T_eq_int( ctx->attr_obj.prio_ceiling, ctx->attr_before.prio_ceiling );
    text: |
      The ${../glossary/mutex-priority-ceiling:/term} of the
      ${../glossary/mutex:/term} attributes object referenced by the
      ${../if/mutexattr-setprioceiling:/params[0]/name} parameter shall not be
      modified.
  test-epilogue: null
  test-prologue: null
- name: Other
  states:
  - name: Nop
    test-code: |
      pthread_mutexattr_t expected;

      memcpy( &expected, &ctx->attr_before, sizeof( expected ) );
      expected.prio_ceiling = ctx->attr_obj.prio_ceiling;
      T_eq_mem( &ctx->attr_obj, &expected, sizeof( expected ) );
    text: |
      The content of the ${../glossary/mutex:/term} attributes object referenced by
      the ${../if/mutexattr-setprioceiling:/params[0]/name} parameter, other than its
      ${../glossary/mutex-priority-ceiling:/term}, shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Obj
    test-code: |
      ctx->attr = &ctx->attr_obj;
    text: |
      While the ${../if/mutexattr-setprioceiling:/params[0]/name} parameter
      references an object of type ${/c/if/pthread_mutexattr_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/mutexattr-setprioceiling:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Initialized
  states:
  - name: 'Yes'
    test-code: |
      T_eno_success( pthread_mutexattr_init( &ctx->attr_obj ) );
      ctx->attr_obj.prio_ceiling = INT_MIN;
    text: |
      While the object referenced by the
      ${../if/mutexattr-setprioceiling:/params[0]/name} parameter is an initialized
      ${../glossary/mutex:/term} attributes object.
  - name: 'No'
    test-code: |
      memset( &ctx->attr_obj, 0, sizeof( ctx->attr_obj ) );
      ctx->attr_obj.prio_ceiling = INT_MIN;
    text: |
      While the object referenced by the
      ${../if/mutexattr-setprioceiling:/params[0]/name} parameter is not an
      initialized ${../glossary/mutex:/term} attributes object.
  test-epilogue: null
  test-prologue: null
- name: Prioceiling
  states:
  - name: Minimum
    test-code: |
      ctx->prio_ceiling = GetPOSIXPriorityMinimum();
    text: |
      While the ${../if/mutexattr-setprioceiling:/params[1]/name} parameter is equal
      to the minimum ${../glossary/thread-priority:/term} of the
      ${/c/sched/if/fifo:/name} ${/c/sched/glossary/policy:/term}.
  - name: Maximum
    test-code: |
      ctx->prio_ceiling = GetPOSIXPriorityMaximum();
    text: |
      While the ${../if/mutexattr-setprioceiling:/params[1]/name} parameter is equal
      to the maximum ${../glossary/thread-priority:/term} of the
      ${/c/sched/if/fifo:/name} ${/c/sched/glossary/policy:/term}.
  - name: OutOfRange
    test-code: |
      ctx->prio_ceiling = GetPOSIXPriorityMaximum() + 1;
    text: |
      While the ${../if/mutexattr-setprioceiling:/params[1]/name} parameter is equal
      to the maximum ${../glossary/thread-priority:/term} of the
      ${/c/sched/if/fifo:/name} ${/c/sched/glossary/policy:/term} plus one.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/pthread-mutexattr-setprioceiling:/name} permits
  ${/c/errno/if/einval:/name} for an invalid value of the
  ${../if/mutexattr-setprioceiling:/params[1]/name} parameter. RTEMS performs no
  range check in this function and stores each value.
  ${/c/pthread/if/mutex-init:/name} validates the
  ${../glossary/mutex-priority-ceiling:/term} when it uses the attributes object.
  States Minimum and Maximum of pre-condition Prioceiling are the bounds of the
  valid thread priorities. State OutOfRange shows that a value outside them is
  stored unmodified.

  The standard leaves the behaviour undefined where the
  ${../if/mutexattr-setprioceiling:/params[0]/name} parameter references no
  initialized ${../glossary/mutex:/term} attributes object. It recommends
  ${/c/errno/if/einval:/name} for that case. State Null of pre-condition Attr and
  state No of pre-condition Initialized specify the behaviour of RTEMS which
  follows that recommendation.

  ${../if/mutexattr-setprioceiling:/name} writes no other member of the object,
  which post-condition Other specifies.
requirement-type: functional
skip-reasons: {}
