enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/mutexattr-setpshared
- role: requirement-refinement
  uid: ../../req/group-posix-api
- role: reference
  uid: /ref/std/posix-2024/pthread-mutexattr-getpshared
post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/mutexattr-setpshared:/name} shall
      be zero.
  - name: Inval
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/mutexattr-setpshared:/name} shall
      be ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: Value
  states:
  - name: Private
    test-code: |
      T_eq_int( ctx->attr_obj.process_shared, PTHREAD_PROCESS_PRIVATE );
    text: |
      The ${../glossary/process-shared:/term} of the ${../glossary/mutex:/term}
      attributes object referenced by the
      ${../if/mutexattr-setpshared:/params[0]/name} parameter shall be
      ${../if/process-private:/name}.
  - name: Shared
    test-code: |
      T_eq_int( ctx->attr_obj.process_shared, PTHREAD_PROCESS_SHARED );
    text: |
      The ${../glossary/process-shared:/term} of the ${../glossary/mutex:/term}
      attributes object referenced by the
      ${../if/mutexattr-setpshared:/params[0]/name} parameter shall be
      ${../if/process-shared:/name}.
  - name: Nop
    test-code: |
      T_eq_int( ctx->attr_obj.process_shared, ctx->attr_before.process_shared );
    text: |
      The ${../glossary/process-shared:/term} of the ${../glossary/mutex:/term}
      attributes object referenced by the
      ${../if/mutexattr-setpshared:/params[0]/name} parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: Other
  states:
  - name: Nop
    test-code: |
      pthread_mutexattr_t expected;

      memcpy( &expected, &ctx->attr_before, sizeof( expected ) );
      expected.process_shared = ctx->attr_obj.process_shared;
      T_eq_mem( &ctx->attr_obj, &expected, sizeof( expected ) );
    text: |
      The content of the ${../glossary/mutex:/term} attributes object referenced by
      the ${../if/mutexattr-setpshared:/params[0]/name} parameter, other than its
      ${../glossary/process-shared:/term}, shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Obj
    test-code: |
      ctx->attr = &ctx->attr_obj;
    text: |
      While the ${../if/mutexattr-setpshared:/params[0]/name} parameter references an
      object of type ${/c/if/pthread_mutexattr_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/mutexattr-setpshared:/params[0]/name} parameter is equal to
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Initialized
  states:
  - name: 'Yes'
    test-code: |
      T_eq_int( pthread_mutexattr_init( &ctx->attr_obj ), 0 );
      ctx->attr_obj.process_shared = -1;
    text: |
      While the object referenced by the
      ${../if/mutexattr-setpshared:/params[0]/name} parameter is an initialized mutex
      attributes object.
  - name: 'No'
    test-code: |
      memset( &ctx->attr_obj, 0xff, sizeof( ctx->attr_obj ) );
      ctx->attr_obj.is_initialized = 0;
      ctx->attr_obj.process_shared = -1;
    text: |
      While the object referenced by the
      ${../if/mutexattr-setpshared:/params[0]/name} parameter is not an initialized
      ${../glossary/mutex:/term} attributes object.
  test-epilogue: null
  test-prologue: null
- name: Value
  states:
  - name: Private
    test-code: |
      ctx->value = PTHREAD_PROCESS_PRIVATE;
    text: |
      While the ${../if/mutexattr-setpshared:/params[1]/name} parameter is equal to
      ${../if/process-private:/name}.
  - name: Shared
    test-code: |
      ctx->value = PTHREAD_PROCESS_SHARED;
    text: |
      While the ${../if/mutexattr-setpshared:/params[1]/name} parameter is equal to
      ${../if/process-shared:/name}.
  - name: Invalid
    test-code: |
      ctx->value = 0x7fffffff;
    text: |
      While the ${../if/mutexattr-setpshared:/params[1]/name} parameter is not a
      valid ${../glossary/process-shared:/term} value.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/pthread-mutexattr-getpshared:/name} allows
  ${/c/errno/if/einval:/name} for a process-shared value which is neither of the
  two values of the standard. This gives the states of pre-condition Value.

  The standard leaves the behaviour undefined where the
  ${../if/mutexattr-setpshared:/params[0]/name} parameter references no
  initialized ${../glossary/mutex:/term} attributes object or is
  ${/c/if/null:/name}. State Null of pre-condition Attr and state No of
  pre-condition Initialized specify the behaviour of RTEMS, which returns
  ${/c/errno/if/einval:/name}.
requirement-type: functional
skip-reasons: {}
test-action: |
  memcpy( &ctx->attr_before, &ctx->attr_obj, sizeof( ctx->attr_before ) );
  ctx->status = pthread_mutexattr_setpshared( ctx->attr, ctx->value );
