transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Attr: 'Null'
      then: Inval
    - if:
        pre-conditions:
          Initialized: 'No'
      then: Inval
    - else: Ok
    Initialized:
    - if:
        pre-conditions:
          Attr: 'Null'
      then: N/A
    - if:
        pre-conditions:
          Initialized: 'No'
      then: Nop
    - else: Cleared
    Other:
    - if:
        pre-conditions:
          Attr: 'Null'
      then: N/A
    - else: Nop
  pre-conditions:
    Attr: all
    Initialized: all
