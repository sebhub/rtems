test-context-support: null
test-description: null
test-header: null
test-includes:
- errno.h
- limits.h
- pthread.h
- rtems.h
- rtems/posix/muteximpl.h
- rtems/score/schedulerimpl.h
- rtems/score/threadimpl.h
- string.h
test-local-includes:
- tx-support.h
test-prepare: |
  /*
   * The object is filled with a non-zero pattern.  A mutex object which
   * consists of zero bytes only would be automatically initialized by the
   * functions which use a mutex.
   */
  memset( &ctx->mutex_obj, 0xa5, sizeof( ctx->mutex_obj ) );
  memset( &ctx->mutex_prefill, 0xa5, sizeof( ctx->mutex_prefill ) );

  ctx->attr_valid = false;
  ctx->pshared = PTHREAD_PROCESS_PRIVATE;
  ctx->protocol = PTHREAD_PRIO_NONE;
  ctx->type = PTHREAD_MUTEX_DEFAULT;
  ctx->prio_ceiling = INT_MAX;
test-setup:
  brief: null
  code: |
    /*
     * The priority of the runner task must not be higher than the priority
     * ceiling of the mutexes under test, otherwise the mutexes could not be
     * locked by the runner task.
     */
    SetSelfPriority( PRIO_NORMAL );
    ctx->scheduler = _Thread_Scheduler_get_home( _Thread_Get_executing() );
  description: null
test-stop: null
test-support: null
test-target: testsuites/validation/tc-pthread-mutex-init.c
test-teardown:
  brief: null
  code: |
    RestoreRunnerPriority();
  description: null
text: |
  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
      - pre-conditions:
          Mutex: 'Null'
      - pre-conditions:
          Attr: Uninit
      - pre-conditions:
          Pshared: Invalid
      - pre-conditions:
          Protocol: Invalid
      - pre-conditions:
          Type: Invalid
      - pre-conditions:
          Ceiling:
          - TooLow
          - TooHigh
          Protocol: Protect
      then: Inval
    - else: Ok
    MutexObj:
    - if:
        pre-conditions:
          Mutex: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Ok
      then: Initialized
    - else: Nop
    Protocol:
    - if:
        and:
        - post-conditions:
            Status: Ok
        - pre-conditions:
            Attr: Default
      then: None
    - if:
        post-conditions:
          Status: Ok
      then-specified-by: Protocol
    - else: N/A
    Recursive:
    - if:
        and:
        - post-conditions:
            Status: Ok
        - pre-conditions:
            Type: Recursive
      then: 'Yes'
    - if:
        post-conditions:
          Status: Ok
      then: 'No'
    - else: N/A
    Owner:
    - if:
        post-conditions:
          Status: Ok
      then: None
    - else: N/A
    Ceiling:
    - if:
        and:
        - post-conditions:
            Status: Ok
        - pre-conditions:
            Ceiling: Default
            Protocol: Protect
      then: Maximum
    - if:
        and:
        - post-conditions:
            Status: Ok
        - pre-conditions:
            Ceiling: Valid
            Protocol: Protect
      then: Valid
    - else: N/A
    Scheduler:
    - if:
        and:
        - post-conditions:
            Status: Ok
        - pre-conditions:
            Protocol: Protect
      then: Home
    - else: N/A
    AttrObj:
    - if:
        pre-conditions:
          Attr: Default
      then: N/A
    - else: Nop
  pre-conditions:
    Pshared:
      applicable:
        pre-conditions:
          Attr: Init
    Protocol:
      applicable:
        pre-conditions:
          Attr: Init
    Type:
      applicable:
        pre-conditions:
          Attr: Init
    Ceiling:
      applicable:
        pre-conditions:
          Attr: Init
          Protocol:
          - None
          - Inherit
          - Protect
    Attr: all
    Mutex: all
type: requirement
