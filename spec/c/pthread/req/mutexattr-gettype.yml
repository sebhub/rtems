    test-code: |
      ctx->attr_obj.type = PTHREAD_MUTEX_NORMAL;
    text: |
      While the ${../glossary/mutex-type:/term} of the object referenced by the
      ${../if/mutexattr-gettype:/params[0]/name} parameter is
