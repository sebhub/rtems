  - name: Recursive
    test-code: |
      ctx->attr_obj.type = PTHREAD_MUTEX_RECURSIVE;
    text: |
      While the ${../glossary/mutex-type:/term} of the object referenced by the
      ${../if/mutexattr-gettype:/params[0]/name} parameter is
      ${../if/mutex-recursive:/name}.
  - name: Errorcheck
    test-code: |
      ctx->attr_obj.type = PTHREAD_MUTEX_ERRORCHECK;
    text: |
      While the ${../glossary/mutex-type:/term} of the object referenced by the
      ${../if/mutexattr-gettype:/params[0]/name} parameter is
      ${../if/mutex-errorcheck:/name}.
  - name: Default
    test-code: |
      ctx->attr_obj.type = PTHREAD_MUTEX_DEFAULT;
    text: |
      While the ${../glossary/mutex-type:/term} of the object referenced by the
      ${../if/mutexattr-gettype:/params[0]/name} parameter is
      ${../if/mutex-default:/name}.
  test-epilogue: null
  test-prologue: null
- name: Type
  states:
  - name: Obj
    test-code: |
      ctx->type_obj = POISON;
      ctx->type = &ctx->type_obj;
    text: |
