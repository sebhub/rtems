      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/mutexattr-gettype:/name} shall be
      zero.
  - name: Inval
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/mutexattr-gettype:/name} shall be
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: Type
  states:
  - name: Normal
    test-code: |
      T_eq_int( ctx->type_obj, PTHREAD_MUTEX_NORMAL );
    text: |
      The object referenced by the ${../if/mutexattr-gettype:/params[1]/name}
      parameter shall be ${../if/mutex-normal:/name}.
  - name: Recursive
    test-code: |
      T_eq_int( ctx->type_obj, PTHREAD_MUTEX_RECURSIVE );
    text: |
      The object referenced by the ${../if/mutexattr-gettype:/params[1]/name}
      parameter shall be ${../if/mutex-recursive:/name}.
  - name: Errorcheck
    test-code: |
      T_eq_int( ctx->type_obj, PTHREAD_MUTEX_ERRORCHECK );
    text: |
      The object referenced by the ${../if/mutexattr-gettype:/params[1]/name}
      parameter shall be ${../if/mutex-errorcheck:/name}.
  - name: Default
    test-code: |
      T_eq_int( ctx->type_obj, PTHREAD_MUTEX_DEFAULT );
    text: |
      The object referenced by the ${../if/mutexattr-gettype:/params[1]/name}
      parameter shall be ${../if/mutex-default:/name}.
  - name: Nop
    test-code: |
      T_eq_int( ctx->type_obj, POISON );
    text: |
      The object referenced by the ${../if/mutexattr-gettype:/params[1]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: Attr
  states:
  - name: Nop
    test-code: |
      T_eq_mem( &ctx->attr_obj, &ctx->attr_before, sizeof( ctx->attr_obj ) );
    text: |
      The object referenced by the ${../if/mutexattr-gettype:/params[0]/name}
