    test-code: |
      T_eno_success( pthread_mutexattr_init( &ctx->attr_obj ) );
    text: |
      While the object referenced by the ${../if/mutexattr-gettype:/params[0]/name}
      parameter is an initialized ${../glossary/mutex:/term} attributes object.
  - name: 'No'
    test-code: |
      memset( &ctx->attr_obj, 0, sizeof( ctx->attr_obj ) );
    text: |
      While the object referenced by the ${../if/mutexattr-gettype:/params[0]/name}
      parameter is not an initialized ${../glossary/mutex:/term} attributes object.
  test-epilogue: null
  test-prologue: null
- name: StoredType
