enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/mutex-timedlock
- role: requirement-refinement
  uid: ../../req/group-posix-api
- role: function-implementation
  uid: /score/tq/req/timeout
- role: function-implementation
  uid: /score/tq/req/timeout-priority-inherit
- role: reference
  uid: /ref/std/posix-2024/pthread-mutex-timedlock
post-conditions:
- name: Action
  states:
  - name: Timeout
    test-code: |
      ctx->tq_ctx.wait = TQ_WAIT_TIMED;
      ${/score/tq/req/timeout:/test-run}( &ctx->tq_ctx );
    text: |
      The timeout actions shall be done as specified by
      ${/score/tq/req/timeout:/spec}.
  - name: TimeoutPriorityInherit
    test-code: |
      ctx->tq_ctx.wait = TQ_WAIT_FOREVER;
      ${/score/tq/req/timeout-priority-inherit:/test-run}( &ctx->tq_ctx );
    text: |
      The timeout actions shall be done as specified by
      ${/score/tq/req/timeout-priority-inherit:/spec}.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Protocol
  states:
  - name: None
    test-code: |
      ctx->protocol = PTHREAD_PRIO_NONE;
      ctx->tq_ctx.discipline = TQ_FIFO;
    text: |
      While the ${../glossary/mutex-protocol:/term} of the mutex is
      ${../if/prio-none:/name}.
  - name: Inherit
    test-code: |
      ctx->protocol = PTHREAD_PRIO_INHERIT;
      ctx->tq_ctx.discipline = TQ_PRIORITY;
    text: |
      While the ${../glossary/mutex-protocol:/term} of the mutex is
      ${../if/prio-inherit:/name}.
  - name: Protect
    test-code: |
      ctx->protocol = PTHREAD_PRIO_PROTECT;
      ctx->tq_ctx.discipline = TQ_PRIORITY;
    text: |
      While the ${../glossary/mutex-protocol:/term} of the mutex is
      ${../if/prio-protect:/name}.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/pthread-mutex-timedlock:/name} requires
  ${/c/errno/if/etimedout:/name} when the time point passes before the mutex can
  be locked. The ${../glossary/mutex-protocol:/term} selects the thread queue
  operations, so each protocol is a state. The ${../if/prio-none:/name}
  ${../glossary/mutex-protocol:/term} uses the FIFO discipline and the other
  protocols use the priority discipline. The
  ${../glossary/mutex-priority-ceiling:/term} corresponds to the task priority
  PRIO_HIGH of the test support, which is the priority of the worker which waits.
  A higher ceiling would raise the owner above the worker, so the worker could
  not wait. The delegated tests trigger the timeout of the waiting thread
  directly, so the time point lies in the far future.
requirement-type: functional
skip-reasons: {}
test-action: |
  pthread_mutexattr_t attr;

  T_eq_int( pthread_mutexattr_init( &attr ), 0 );
  T_eq_int( pthread_mutexattr_setprotocol( &attr, ctx->protocol ), 0 );
  T_eq_int(
    pthread_mutexattr_setprioceiling( &attr, ToPOSIXPriority( PRIO_HIGH ) ),
    0
  );
  T_eq_int( pthread_mutex_init( &ctx->mutex, &attr ), 0 );
  T_eq_int( pthread_mutexattr_destroy( &attr ), 0 );
  ctx->tq_ctx.thread_queue_object = &ctx->mutex;
test-brief: null
test-cleanup: |
  T_eq_int( pthread_mutex_destroy( &ctx->mutex ), 0 );
test-context:
- brief: |
    This member contains the thread queue test context.
  description: null
  member: |
    TQContext tq_ctx
- brief: |
