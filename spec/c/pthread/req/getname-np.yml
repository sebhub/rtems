transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Thread:
          - NoObj
          - OtherClass
      then: ESRCH
    - if:
        pre-conditions:
          NameLen: Valid
          ThreadNameLength: Fits
      then: Zero
    - else: ERANGE
    Name:
    - if:
        pre-conditions:
          NameLen: ValidZero
      then: Unchanged
    - if:
        pre-conditions:
          NameLen: Valid
          Thread:
          - NoObj
          - OtherClass
      then: Empty
    - if:
        pre-conditions:
          NameLen: Valid
          NameStorage: String
          ThreadName: NonEmpty
          ThreadNameLength: TooLong
      then: PartialString
    - if:
        pre-conditions:
          NameLen: Valid
          ThreadNameLength: TooLong
      then: PartialObject
    - if:
        pre-conditions:
          NameStorage: String
          ThreadName: NonEmpty
          ThreadNameLength: Fits
      then: FullString
    - if:
        pre-conditions:
          ThreadNameLength: Fits
      then: FullObject
    - else: N/A
    AllocatorLock: Once
  pre-conditions:
    NameStorage: all
    Thread: all
    ThreadName:
      applicable:
      - pre-conditions:
          NameStorage:
          - TerminatorOnly
          - String
          Thread: Valid
    NameLen: all
    ThreadNameLength:
      applicable:
      - pre-conditions:
          Thread: Valid
          ThreadNameLength: TooLong
      - pre-conditions:
          NameLen: Valid
          Thread: Valid
- enabled-by: true
  post-conditions: NoNonEmptyName
  pre-conditions:
    NameStorage:
    - TerminatorOnly
    Thread:
    - Valid
    ThreadName:
    - NonEmpty
    NameLen: all
    ThreadNameLength: all
