    CallCounterObserve( &AllocatorLockCounter, 0 );
    DeleteMutex( ctx->mutex_id );
    (void) pthread_setname_np( pthread_self(), "" );
  description: null
text: |
  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Thread:
          - NoObj
          - OtherClass
      then: ESRCH
    - if:
        pre-conditions:
          Length: Fits
      then: Zero
    - else: ERANGE
    Name:
    - if:
        pre-conditions:
          Thread:
          - NoObj
          - OtherClass
      then: N/A
    - if:
        pre-conditions:
          Length: Fits
          NameStorage: String
      then: Full
    - if:
        pre-conditions:
          Length: TooLong
          NameStorage: String
      then: Partial
    - else: Empty
    ObjectName: Unchanged
    AllocatorLock: Once
  pre-conditions:
    NameStorage: all
    Thread: all
    Length:
      applicable:
        pre-conditions:
          Thread: Valid
- enabled-by: true
  post-conditions: NoFittingName
  pre-conditions:
    NameStorage:
    - None
    Thread:
    - Valid
    Length:
    - Fits
type: requirement
