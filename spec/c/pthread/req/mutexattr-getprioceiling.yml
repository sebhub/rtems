enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/mutexattr-getprioceiling
- role: requirement-refinement
  uid: ../../req/group-posix-api
- role: reference
  uid: /ref/std/posix-2024/pthread-mutexattr-getprioceiling
post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/mutexattr-getprioceiling:/name}
      shall be zero.
  - name: Inval
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/mutexattr-getprioceiling:/name}
      shall be ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: Result
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->out_obj, 0 );
    text: |
      The value of the object referenced by the
      ${../if/mutexattr-getprioceiling:/params[1]/name} parameter shall be zero.
  - name: Positive
    test-code: |
      T_gt_int( ctx->out_obj, 0 );
    text: |
      The value of the object referenced by the
      ${../if/mutexattr-getprioceiling:/params[1]/name} parameter shall be greater
      than zero.
  - name: Max
    test-code: |
      T_eq_int( ctx->out_obj, INT_MAX );
    text: |
      The value of the object referenced by the
      ${../if/mutexattr-getprioceiling:/params[1]/name} parameter shall be the
      maximum of the type int.
  - name: Nop
    test-code: |
      T_eq_int( ctx->out_obj, -1 );
    text: |
      The value of the object referenced by the
      ${../if/mutexattr-getprioceiling:/params[1]/name} parameter shall not be
      modified.
  test-epilogue: null
  test-prologue: null
- name: Other
  states:
  - name: Nop
    test-code: |
      T_eq_mem( &ctx->attr_obj, &ctx->attr_before, sizeof( ctx->attr_obj ) );
    text: |
      The content of the mutex attributes object referenced by the
      ${../if/mutexattr-getprioceiling:/params[0]/name} parameter shall not be
      modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Obj
    test-code: |
      ctx->attr = &ctx->attr_obj;
    text: |
      While the ${../if/mutexattr-getprioceiling:/params[0]/name} parameter
      references an object of type ${/c/if/pthread_mutexattr_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/mutexattr-getprioceiling:/params[0]/name} parameter is equal
      to ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Initialized
  states:
  - name: 'Yes'
    test-code: |
      T_eq_int( pthread_mutexattr_init( &ctx->attr_obj ), 0 );
    text: |
      While the object referenced by the
      ${../if/mutexattr-getprioceiling:/params[0]/name} parameter is an initialized
      mutex attributes object.
  - name: 'No'
    test-code: |
      memset( &ctx->attr_obj, 0xff, sizeof( ctx->attr_obj ) );
      ctx->attr_obj.is_initialized = 0;
    text: |
      While the object referenced by the
      ${../if/mutexattr-getprioceiling:/params[0]/name} parameter is not an
      initialized mutex attributes object.
  test-epilogue: null
  test-prologue: null
- name: Stored
  states:
  - name: Zero
    test-code: |
      ctx->attr_obj.prio_ceiling = 0;
    text: |
      While the priority ceiling attribute of the object referenced by the
      ${../if/mutexattr-getprioceiling:/params[0]/name} parameter is equal to zero.
  - name: Positive
    test-code: |
      ctx->attr_obj.prio_ceiling = 5;
    text: |
      While the priority ceiling attribute of the object referenced by the
      ${../if/mutexattr-getprioceiling:/params[0]/name} parameter is greater than
      zero.
  - name: Max
    test-code: |
      ctx->attr_obj.prio_ceiling = INT_MAX;
    text: |
      While the priority ceiling attribute of the object referenced by the
      ${../if/mutexattr-getprioceiling:/params[0]/name} parameter is equal to the
      maximum of the type int.
  test-epilogue: null
  test-prologue: null
- name: Out
  states:
  - name: Obj
    test-code: |
      ctx->out = &ctx->out_obj;
    text: |
      While the ${../if/mutexattr-getprioceiling:/params[1]/name} parameter
      references an object of type int.
  - name: 'Null'
    test-code: |
      ctx->out = NULL;
    text: |
      While the ${../if/mutexattr-getprioceiling:/params[1]/name} parameter is equal
      to ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
rationale: |
  The states of pre-condition Stored cover the values which the priority ceiling
  attribute can have in an initialized mutex attributes object.

  The standard leaves the behaviour undefined where the
  ${../if/mutexattr-getprioceiling:/params[0]/name} parameter references no
  initialized mutex attributes object or is ${/c/if/null:/name}. State Null of
  pre-condition Attr and state No of pre-condition Initialized specify the
  behaviour of RTEMS, which returns ${/c/errno/if/einval:/name}. The same applies
  to a ${../if/mutexattr-getprioceiling:/params[1]/name} parameter which is equal
  to ${/c/if/null:/name}.
requirement-type: functional
skip-reasons: {}
test-action: |
  memcpy( &ctx->attr_before, &ctx->attr_obj, sizeof( ctx->attr_before ) );
  ctx->status = pthread_mutexattr_getprioceiling( ctx->attr, ctx->out );
