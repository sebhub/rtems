      ${../if/mutexattr-getprotocol:/params[0]/name} parameter is not an initialized
      ${../glossary/mutex:/term} attributes object.
  test-epilogue: null
  test-prologue: null
- name: StoredProtocol
  states:
  - name: None
    test-code: |
      ctx->attr_obj.protocol = PTHREAD_PRIO_NONE;
    text: |
      While the ${../glossary/mutex-protocol:/term} of the object referenced by the
      ${../if/mutexattr-getprotocol:/params[0]/name} parameter is
      ${../if/prio-none:/name}.
  - name: Inherit
    test-code: |
      ctx->attr_obj.protocol = PTHREAD_PRIO_INHERIT;
    text: |
      While the ${../glossary/mutex-protocol:/term} of the object referenced by the
      ${../if/mutexattr-getprotocol:/params[0]/name} parameter is
      ${../if/prio-inherit:/name}.
  - name: Protect
    test-code: |
      ctx->attr_obj.protocol = PTHREAD_PRIO_PROTECT;
    text: |
      While the ${../glossary/mutex-protocol:/term} of the object referenced by the
      ${../if/mutexattr-getprotocol:/params[0]/name} parameter is
      ${../if/prio-protect:/name}.
  test-epilogue: null
  test-prologue: null
- name: Protocol
  states:
  - name: Obj
    test-code: |
      ctx->protocol_obj = POISON;
      ctx->protocol = &ctx->protocol_obj;
    text: |
      While the ${../if/mutexattr-getprotocol:/params[1]/name} parameter references
