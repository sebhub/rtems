rationale: |
  ${/ref/std/posix-2024/pthread-mutexattr-getprotocol:/name} specifies that
  ${../if/mutexattr-getprotocol:/name} stores the
  ${../glossary/mutex-protocol:/term} in the object referenced by the
  ${../if/mutexattr-getprotocol:/params[1]/name} parameter. This gives
  post-condition Protocol. The states of pre-condition StoredProtocol are the
  values which RTEMS supports for this attribute.

  The standard does not define the behaviour where the
  ${../if/mutexattr-getprotocol:/params[1]/name} parameter is
  ${/c/if/null:/name}. The ${/c/if/null:/name} state of pre-condition Protocol
  specifies the behaviour of RTEMS which returns ${/c/errno/if/einval:/name}.

  The standard leaves the behaviour undefined where the
  ${../if/mutexattr-getprotocol:/params[0]/name} parameter references no
  initialized ${../glossary/mutex:/term} attributes object. It recommends
  ${/c/errno/if/einval:/name} for that case. State Null of pre-condition Attr and
  state No of pre-condition Initialized specify the behaviour of RTEMS which
  follows that recommendation.

  ${../if/mutexattr-getprotocol:/name} does not write the
  ${../glossary/mutex:/term} attributes object, which post-condition Attr
  specifies.
requirement-type: functional
