  - name: Inherit
    test-code: |
      T_eq_int( ctx->protocol_obj, PTHREAD_PRIO_INHERIT );
    text: |
      The object referenced by the ${../if/mutexattr-getprotocol:/params[1]/name}
      parameter shall be ${../if/prio-inherit:/name}.
  - name: Protect
    test-code: |
