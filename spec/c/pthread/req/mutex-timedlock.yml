text: |
  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Mutex:
          - 'Null'
          - Invalid
      then: Inval
    - if:
        pre-conditions:
          Ceiling: Violated
          Mutex: Init
          Protocol: Ceiling
      then: Inval
    - if:
        pre-conditions:
          Scheduler: Other
      then: Inval
    - if:
        and:
        - pre-conditions:
            Timeout:
            - Invalid
        - pre-conditions:
            Owner:
            - Other
      then: Inval
    - if:
        and:
        - pre-conditions:
            Timeout:
            - Past
        - pre-conditions:
            Owner:
            - Other
      then: TimedOut
    - else: Ok
    Action:
    - if:
      - and:
        - post-conditions:
            Status: Ok
        - pre-conditions:
            Protocol:
            - None
            Timeout:
            - Future
            Type:
            - Normal
      - and:
        - post-conditions:
            Status: Ok
        - pre-conditions:
            Mutex:
            - Static
            Protocol:
            - None
      then: MtxNone
    - if:
      - and:
        - post-conditions:
            Status: Ok
        - pre-conditions:
            Protocol:
            - None
            Timeout:
            - Future
            Type:
            - Recursive
      - and:
        - post-conditions:
            Status: Ok
        - pre-conditions:
            Mutex:
            - Static
            Protocol:
            - None
            Type:
            - Recursive
      then: MtxNoneRecursive
    - if:
      - and:
        - post-conditions:
            Status: Ok
        - pre-conditions:
            Protocol:
            - Inherit
            Timeout:
            - Future
            Type:
            - Normal
      - and:
        - post-conditions:
            Status: Ok
        - pre-conditions:
            Mutex:
            - Static
            Protocol:
            - Inherit
      then: MtxInherit
    - if:
      - and:
        - post-conditions:
            Status: Ok
        - pre-conditions:
            Protocol:
            - Inherit
            Timeout:
            - Future
            Type:
            - Recursive
      - and:
        - post-conditions:
            Status: Ok
        - pre-conditions:
            Mutex:
            - Static
            Protocol:
            - None
            Type:
            - Recursive
      then: MtxInheritRecursive
    - if:
      - and:
        - post-conditions:
            Status: Ok
        - pre-conditions:
            Protocol:
            - Ceiling
            Timeout:
            - Future
            Type:
            - Normal
      - and:
        - post-conditions:
            Status: Ok
        - pre-conditions:
            Mutex:
            - Static
            Protocol:
            - Ceiling
      then: MtxCeiling
    - if:
      - and:
        - post-conditions:
            Status: Ok
        - pre-conditions:
            Protocol:
            - Ceiling
            Timeout:
            - Future
            Type:
            - Recursive
      - and:
        - post-conditions:
            Status: Ok
        - pre-conditions:
            Mutex:
            - Static
            Protocol:
            - None
            Type:
            - Recursive
      then: MtxCeilingRecursive
    - else: N/A
  pre-conditions:
    Protocol: all
    Ceiling: all
    Type:
      applicable:
        pre-conditions:
          Mutex:
          - Init
    Mutex: all
    Timeout:
      applicable:
        pre-conditions:
          Ceiling:
          - Satisfied
          - None
