transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Mutex:
          - 'Null'
          - Invalid
      then: Inval
    - if:
        pre-conditions:
          Scheduler: Other
      then: Inval
    - if:
        pre-conditions:
          Owner: Other
          Timeout: Invalid
      then: Inval
    - if:
        pre-conditions:
          Owner: Other
          Timeout: Past
      then: TimedOut
    - if:
        pre-conditions:
          Timeout: Future
      then: N/A
    - else: Ok
    Owner:
    - if:
        pre-conditions:
          Mutex:
          - 'Null'
          - Invalid
      then: N/A
    - if:
        pre-conditions:
          Owner: Other
      then: Other
    - if:
        pre-conditions:
          Scheduler: Other
      then: None
    - if:
        pre-conditions:
          Timeout:
          - Past
          - Invalid
      then: Caller
    - else: N/A
    Action:
    - if:
        pre-conditions:
          Scheduler:
          - Home
          - N/A
          Timeout: Future
      then: MtxSeizeWait
    - else: N/A
  pre-conditions:
    Protocol:
      applicable:
        pre-conditions:
          Mutex: Init
    Type:
      applicable:
        pre-conditions:
          Mutex: Init
    Mutex: all
    Timeout:
      applicable:
        pre-conditions:
          Mutex:
          - Static
          - Init
    Owner:
      applicable:
        pre-conditions:
          Mutex:
          - Static
          - Init
          Timeout:
          - Past
          - Invalid
    Scheduler:
      applicable:
        pre-conditions:
          Mutex: Init
          Protocol: Protect
          Timeout: Future
- enabled-by: true
  post-conditions: NeedsSMP
  pre-conditions:
    Protocol:
    - Protect
    Type: all
    Mutex:
    - Init
    Timeout:
    - Future
    Owner: N/A
    Scheduler:
    - Other
- enabled-by: RTEMS_SMP
  post-conditions:
    Status: Inval
    Owner: None
    Action: N/A
  pre-conditions:
    Protocol:
    - Protect
    Type: all
    Mutex:
    - Init
    Timeout:
    - Future
    Owner: N/A
    Scheduler:
    - Other
