post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/mutex-timedlock:/name} shall be
      zero.
  - name: Inval
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/mutex-timedlock:/name} shall be
      ${/c/errno/if/einval:/name}.
  - name: TimedOut
    test-code: |
      T_eq_int( ctx->status, ETIMEDOUT );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/mutex-timedlock:/name} shall be
      ${/c/errno/if/etimedout:/name}.
  test-epilogue: null
  test-prologue: null
- name: Action
  states:
  - name: MtxNone
    test-code: |
      T_eq_int( pthread_mutex_unlock( ctx->mutex ), 0 );
      ctx->tq_mtx_ctx.base.thread_queue_object = ctx->mutex;
      ctx->tq_mtx_ctx.base.wait = TQ_WAIT_TIMED;
      ${/score/mtx/req/seize-wait:/test-run}( &ctx->tq_mtx_ctx );
    text: |
      The calling thread shall attempt to seize the mutex referenced by the
      ${../if/mutex-timedlock:/params[0]/name} parameter as specified by
      ${/score/mtx/req/seize-wait:/spec} where the mutex does not use a locking
      protocol, the thread queue of the mutex uses the FIFO discipline, a detected
      deadlock results in a return with a status code, and a recursive seize of the
      mutex results in a deadlock.
  - name: MtxNoneRecursive
    test-code: |
      T_eq_int( pthread_mutex_unlock( ctx->mutex ), 0 );
      ctx->tq_mtx_ctx.base.thread_queue_object = ctx->mutex;
      ctx->tq_mtx_ctx.base.wait = TQ_WAIT_TIMED;
      ${/score/mtx/req/seize-wait:/test-run}( &ctx->tq_mtx_ctx );
    text: |
      The calling thread shall attempt to seize the mutex referenced by the
      ${../if/mutex-timedlock:/params[0]/name} parameter as specified by
      ${/score/mtx/req/seize-wait:/spec} where the mutex does not use a locking
      protocol, the thread queue of the mutex uses the FIFO discipline, a detected
      deadlock results in a return with a status code, and a recursive seize of the
      mutex is allowed.
  - name: MtxInherit
    test-code: |
      T_eq_int( pthread_mutex_unlock( ctx->mutex ), 0 );
      ctx->tq_mtx_ctx.base.thread_queue_object = ctx->mutex;
      ctx->tq_mtx_ctx.base.wait = TQ_WAIT_TIMED;
      ${/score/mtx/req/seize-wait:/test-run}( &ctx->tq_mtx_ctx );
    text: |
      The calling thread shall attempt to seize the mutex referenced by the
      ${../if/mutex-timedlock:/params[0]/name} parameter as specified by
      ${/score/mtx/req/seize-wait:/spec} where the mutex uses the priority
      inheritance locking protocol, the thread queue of the mutex uses the priority
      discipline, a detected deadlock results in a return with a status code, and a
      recursive seize of the mutex results in a deadlock.
  - name: MtxInheritRecursive
    test-code: |
      T_eq_int( pthread_mutex_unlock( ctx->mutex ), 0 );
      ctx->tq_mtx_ctx.base.thread_queue_object = ctx->mutex;
      ctx->tq_mtx_ctx.base.wait = TQ_WAIT_TIMED;
      ${/score/mtx/req/seize-wait:/test-run}( &ctx->tq_mtx_ctx );
    text: |
      The calling thread shall attempt to seize the mutex referenced by the
      ${../if/mutex-timedlock:/params[0]/name} parameter as specified by
      ${/score/mtx/req/seize-wait:/spec} where the mutex uses the priority
      inheritance locking protocol, the thread queue of the mutex uses the priority
      discipline, a detected deadlock results in a return with a status code, and a
      recursive seize of the mutex is allowed.
  - name: MtxCeiling
    test-code: |
      T_eq_int( pthread_mutex_unlock( ctx->mutex ), 0 );
      ctx->tq_mtx_ctx.base.thread_queue_object = ctx->mutex;
      ctx->tq_mtx_ctx.base.wait = TQ_WAIT_TIMED;
      ${/score/mtx/req/seize-wait:/test-run}( &ctx->tq_mtx_ctx );
    text: |
      The calling thread shall attempt to seize the mutex referenced by the
      ${../if/mutex-timedlock:/params[0]/name} parameter as specified by
      ${/score/mtx/req/seize-wait:/spec} where the mutex uses the priority ceiling
      locking protocol, the thread queue of the mutex uses the priority discipline, a
      detected deadlock results in a return with a status code, and a recursive seize
      of the mutex results in a deadlock.
  - name: MtxCeilingRecursive
    test-code: |
      T_eq_int( pthread_mutex_unlock( ctx->mutex ), 0 );
      ctx->tq_mtx_ctx.base.thread_queue_object = ctx->mutex;
      ctx->tq_mtx_ctx.base.wait = TQ_WAIT_TIMED;
      ${/score/mtx/req/seize-wait:/test-run}( &ctx->tq_mtx_ctx );
    text: |
      The calling thread shall attempt to seize the mutex referenced by the
      ${../if/mutex-timedlock:/params[0]/name} parameter as specified by
      ${/score/mtx/req/seize-wait:/spec} where the mutex uses the priority ceiling
      locking protocol, the thread queue of the mutex uses the priority discipline, a
      detected deadlock results in a return with a status code, and a recursive seize
      of the mutex is allowed.
  - name: MtxStatic
    test-code: |
      T_eq_int( pthread_mutex_unlock( ctx->mutex ), 0 );
      ctx->tq_mtx_ctx.base.thread_queue_object = ctx->mutex;
      ctx->tq_mtx_ctx.base.wait = TQ_WAIT_TIMED;
      ${/score/mtx/req/seize-wait:/test-run}( &ctx->tq_mtx_ctx );
    text: |
      The calling thread shall attempt to seize the mutex referenced by the
      ${../if/mutex-timedlock:/params[0]/name} parameter as specified by
      ${/score/mtx/req/seize-wait:/spec} where the mutex does not use a locking
      protocol, the thread queue of the mutex uses the FIFO discipline, a detected
      deadlock results in a return with a status code, and a recursive seize of the
      mutex results in a deadlock.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Protocol
  states:
  - name: None
    test-code: |
      ctx->protocol = PTHREAD_PRIO_NONE;
      ctx->tq_mtx_ctx.protocol = TQ_MTX_NO_PROTOCOL;
      ctx->tq_mtx_ctx.priority_ceiling = PRIO_INVALID;
      ctx->tq_mtx_ctx.base.discipline = TQ_FIFO;
    text: |
      While the mutex uses no locking protocol.
  - name: Inherit
    test-code: |
      ctx->protocol = PTHREAD_PRIO_INHERIT;
      ctx->tq_mtx_ctx.protocol = TQ_MTX_PRIORITY_INHERIT;
      ctx->tq_mtx_ctx.priority_ceiling = PRIO_INVALID;
      ctx->tq_mtx_ctx.base.discipline = TQ_PRIORITY;
    text: |
      While the mutex uses the priority inheritance locking protocol.
  - name: Ceiling
    test-code: |
      ctx->protocol = PTHREAD_PRIO_PROTECT;
      ctx->tq_mtx_ctx.protocol = TQ_MTX_PRIORITY_CEILING;
      ctx->tq_mtx_ctx.priority_ceiling = PRIO_VERY_HIGH;
      ctx->tq_mtx_ctx.base.discipline = TQ_PRIORITY;
    text: |
      While the mutex uses the priority ceiling locking protocol.
  test-epilogue: null
  test-prologue: null
- name: Ceiling
  states:
  - name: Satisfied
    test-code: |
      if ( ctx->protocol != PTHREAD_PRIO_PROTECT ) {
        ${.:skip}
      }

      {
        const Scheduler_Control *scheduler;

        scheduler = _Thread_Scheduler_get_home( _Thread_Get_executing() );
        ctx->prio_ceiling = _POSIX_Priority_From_core(
          scheduler,
          _Scheduler_Map_priority( scheduler, PRIO_VERY_HIGH )
        );
      }
    text: |
      While the mutex uses the priority ceiling locking protocol, while the calling
      thread's ${/glossary/priority-current:/term} does not violate the priority
      ceiling of the mutex.
  - name: Violated
    test-code: |
      if ( ctx->protocol != PTHREAD_PRIO_PROTECT ) {
        ${.:skip}
      }

      ctx->prio_ceiling = GetPOSIXPriorityMinimum();
    text: |
      While the mutex uses the priority ceiling locking protocol, while the calling
      thread's ${/glossary/priority-current:/term} violates the priority ceiling of
      the mutex.
  - name: None
    test-code: |
      if ( ctx->protocol == PTHREAD_PRIO_PROTECT ) {
        ${.:skip}
      }
    text: |
      Where the mutex does not use the priority ceiling locking protocol.
  test-epilogue: null
  test-prologue: null
- name: Type
  states:
  - name: Normal
    test-code: |
      ctx->type = PTHREAD_MUTEX_DEFAULT;
      ctx->tq_mtx_ctx.recursive = TQ_MTX_RECURSIVE_DEADLOCK;
    text: |
      While the type of the mutex is not recursive.
  - name: Recursive
    test-code: |
      ctx->type = PTHREAD_MUTEX_RECURSIVE;
      ctx->tq_mtx_ctx.recursive = TQ_MTX_RECURSIVE_ALLOWED;
    text: |
      While the type of the mutex is recursive.
  test-epilogue: null
  test-prologue: null
- name: Mutex
  states:
  - name: 'Null'
    test-code: |
      ctx->mutex = NULL;
      ctx->mutex_initialized = false;
    text: |
      While the ${../if/mutex-timedlock:/params[0]/name} parameter is
      ${/c/if/null:/name}.
  - name: Invalid
    test-code: |
      T_eq_int( pthread_mutex_init( &ctx->mutex_storage, NULL ), 0 );
      T_eq_int( pthread_mutex_destroy( &ctx->mutex_storage ), 0 );
      ctx->mutex = &ctx->mutex_storage;
      ctx->mutex_initialized = false;
    text: |
      While the mutex referenced by the ${../if/mutex-timedlock:/params[0]/name}
      parameter is invalid.
  - name: Static
    test-code: |
      ctx->mutex_storage = (pthread_mutex_t) PTHREAD_MUTEX_INITIALIZER;
      ctx->mutex = &ctx->mutex_storage;
      ctx->mutex_initialized = true;

      ctx->tq_mtx_ctx.protocol = TQ_MTX_NO_PROTOCOL;
      ctx->tq_mtx_ctx.recursive = TQ_MTX_RECURSIVE_DEADLOCK;
      ctx->tq_mtx_ctx.priority_ceiling = PRIO_INVALID;
      ctx->tq_mtx_ctx.base.discipline = TQ_FIFO;
    text: |
      While the object referenced by the ${../if/mutex-timedlock:/params[0]/name}
      parameter is a statically initialized mutex.
  - name: Init
    test-code: |
      pthread_mutexattr_t attr;

      T_eq_int( pthread_mutexattr_init( &attr ), 0 );
      T_eq_int( pthread_mutexattr_settype( &attr, ctx->type ), 0 );
      T_eq_int( pthread_mutexattr_setprotocol( &attr, ctx->protocol ), 0 );

      if ( ctx->protocol == PTHREAD_PRIO_PROTECT ) {
        T_eq_int(
          pthread_mutexattr_setprioceiling( &attr, ctx->prio_ceiling ),
          0
        );
      }

      T_eq_int( pthread_mutex_init( &ctx->mutex_storage, &attr ), 0 );
      T_eq_int( pthread_mutexattr_destroy( &attr ), 0 );

      ctx->mutex = &ctx->mutex_storage;
      ctx->mutex_initialized = true;
    text: |
      While the object referenced by the ${../if/mutex-timedlock:/params[0]/name}
      parameter is an initialized mutex.
  test-epilogue: null
  test-prologue: null
- name: Timeout
  states:
  - name: Future
    test-code: |
      T_eq_int( clock_gettime( CLOCK_REALTIME, &ctx->abstime ), 0 );
      ctx->abstime.tv_sec += 3600;
    text: |
      While the ${../if/mutex-timedlock:/params[1]/name} parameter specifies a valid
      time point which is later than the current time of
      ${/c/time/if/clock-realtime:/name}.
  - name: Past
    test-code: |
      T_eq_int( clock_gettime( CLOCK_REALTIME, &ctx->abstime ), 0 );
      ctx->abstime.tv_sec -= 1;
      ctx->direct = true;
    text: |
      While the ${../if/mutex-timedlock:/params[1]/name} parameter specifies a valid
      time point which is not later than the current time of
      ${/c/time/if/clock-realtime:/name}.
  - name: Invalid
    test-code: |
      ctx->abstime.tv_sec = 0;
      ctx->abstime.tv_nsec = -1;
      ctx->direct = true;
    text: |
      While the ${../if/mutex-timedlock:/params[1]/name} parameter does not specify a
      valid time point.
  test-epilogue: null
  test-prologue: null
- name: Owner
  states:
  - name: None
    test-code: |
      ctx->owner_other = false;
    text: |
      While the mutex has no owner.
  - name: Other
    test-code: |
      ctx->tq_mtx_ctx.base.thread_queue_object = ctx->mutex;
      ctx->tq_mtx_ctx.base.wait = TQ_WAIT_FOREVER;
      ctx->owner_other = true;
      TQSend( &ctx->tq_mtx_ctx.base, TQ_BLOCKER_B, TQ_EVENT_ENQUEUE );
    text: |
      While the mutex is owned by another ${../glossary/thread:/term}.
  test-epilogue: null
  test-prologue: null
- name: Scheduler
  states:
  - name: Home
    test-code: |
      ctx->scheduler_other = false;
    text: |
      While the ${/glossary/schedulerinstance:/term} of the mutex is the
      ${/glossary/scheduler-home:/term} of the calling ${../glossary/thread:/term}.
  - name: Other
    test-code: |
      #if defined( RTEMS_SMP )
        SetSelfScheduler( SCHEDULER_B_ID, PRIO_VERY_LOW );
        ctx->scheduler_other = true;
      #else
        ${.:skip}
      #endif
    text: |
      While the ${/glossary/schedulerinstance:/term} of the mutex is not the
      ${/glossary/scheduler-home:/term} of the calling ${../glossary/thread:/term}.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/pthread-mutex-timedlock:/name} requires
  ${/c/errno/if/einval:/name} for a mutex with the priority ceiling protocol
  where the priority of the calling ${../glossary/thread:/term} is higher than
  the priority ceiling of the mutex. This gives the states of the pre-conditions
  Protocol and Ceiling. State Violated of pre-condition Ceiling specifies this
  error. The states of pre-condition Type cover a mutex whose recursive seize is
  allowed and one whose recursive seize results in a deadlock. Pre-condition Type
  applies to an initialized mutex only, because a statically initialized mutex is
  not recursive.

  The standard states that the function does not fail with a timeout if it can
  lock the mutex without waiting, and that it need not check the
  ${../if/mutex-timedlock:/params[1]/name} parameter in this case. It requires
  ${/c/errno/if/einval:/name} for a time point which is not valid and
  ${/c/errno/if/etimedout:/name} for a time point which is not later than the
  current time, if the mutex is owned by another ${../glossary/thread:/term}. The
  states Past and Invalid of pre-condition Timeout specify these cases, and the
  states of pre-condition Owner distinguish a mutex which another thread owns
  from a mutex which has no owner. The expiry of a time point which lies in the
  future is not specified by this item.

  The standard leaves the behaviour undefined for a mutex which is not
  initialized and for a ${../if/mutex-timedlock:/params[0]/name} parameter which
  is equal to ${/c/if/null:/name}. The states Invalid and Null of pre-condition
  Mutex specify that RTEMS returns ${/c/errno/if/einval:/name}. A statically
  initialized mutex (state Static) is initialized by the call.

  All other effects of a successful call with a time point in the future are
  specified by the thread queue requirement /score/mtx/req/seize-wait through
  post-condition Action. Each state of the post-condition names one state of
  every pre-condition of the thread queue requirement which selects a variant of
  the mutex: the locking protocol, the discipline of the thread queue, the result
  of a detected deadlock and the recursive seize. RTEMS does not use the MrsP
  protocol for a POSIX mutex.

  ${/c/errno/if/edeadlk:/name} is specified for a deadlock which RTEMS detects
  and for a recursive seize of a mutex which does not allow it. The states of
  post-condition Action select these variants of the thread queue requirement,
  which specifies the status of the deadlock. ${/c/errno/if/eagain:/name} is
  specified by POSIX for a recursive seize which exceeds the maximum number of
  recursive locks. RTEMS counts the recursive seizes of a mutex without a limit
  check and cannot return this value, so no state is specified for it.
requirement-type: functional
skip-reasons: {}
test-action: |
  ctx->status = pthread_mutex_timedlock( ctx->mutex, &ctx->abstime );
test-brief: null
test-cleanup: |
  if ( ctx->scheduler_other ) {
    SetSelfScheduler( SCHEDULER_A_ID, PRIO_VERY_LOW );
  }

  if ( ctx->mutex_initialized ) {
    if ( ctx->owner_other ) {
      TQSend( &ctx->tq_mtx_ctx.base, TQ_BLOCKER_B, TQ_EVENT_SURRENDER );
    } else if ( ctx->direct && ctx->status == 0 ) {
      T_eq_int( pthread_mutex_unlock( &ctx->mutex_storage ), 0 );
    }

    T_eq_int( pthread_mutex_destroy( &ctx->mutex_storage ), 0 );
  }

  ctx->mutex_initialized = false;
