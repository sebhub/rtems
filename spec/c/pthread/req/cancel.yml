post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/cancel:/name} shall be zero.
  - name: Srch
    test-code: |
      T_eq_int( ctx->status, ESRCH );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/cancel:/name} shall be
      ${/c/errno/if/esrch:/name}.
  test-epilogue: null
  test-prologue: null
- name: Return
  states:
  - name: 'Yes'
    test-code: |
      T_true( ctx->returned );
    text: |
      The ${../if/cancel:/name} call shall return to the caller.
  - name: 'No'
    test-code: |
      T_false( ctx->returned );
    text: |
      The ${../if/cancel:/name} call shall not return to the caller.
  test-epilogue: null
  test-prologue: null
- name: Wait
  states:
  - name: Nop
    test-code: |
      T_false( ctx->wait_returned_early );
    text: |
      The thread specified by the ${../if/cancel:/params[0]/name} parameter shall not
      be unblocked by the ${../if/cancel:/name} call.
  test-epilogue: null
  test-prologue: null
- name: Life
  states:
  - name: Terminate
    test-code: |
      JoinWorker( ctx );
      T_false( ctx->worker_continued );
      T_eq_u32( ctx->restarts, 0 );
    text: |
      The thread specified by the ${../if/cancel:/params[0]/name} parameter shall be
      terminated by a ${../glossary/thread-cancellation:/term}.
  - name: Nop
    test-code: |
      KickWorker( ctx );
      T_true( ctx->worker_continued );
      T_eq_u32( ctx->restarts, 0 );
    text: |
      The thread specified by the ${../if/cancel:/params[0]/name} parameter shall be
      neither terminated nor restarted by the ${../if/cancel:/name} call.
  test-epilogue: null
  test-prologue: null
- name: CancelState
  states:
  - name: Nop
    test-code: |
      T_eq_int( ctx->state_after, ctx->cancel_state );
    text: |
      The ${../glossary/thread-cancel-state:/term} of the thread specified by the
      ${../if/cancel:/params[0]/name} parameter shall not be modified by the
      ${../if/cancel:/name} call.
  test-epilogue: null
  test-prologue: null
- name: CancelType
  states:
  - name: Nop
    test-code: |
      T_eq_int( ctx->type_after, ctx->cancel_type );
    text: |
      The ${../glossary/thread-cancel-type:/term} of the thread specified by the
      ${../if/cancel:/params[0]/name} parameter shall not be modified by the
      ${../if/cancel:/name} call.
  test-epilogue: null
  test-prologue: null
- name: ExitValue
  states:
  - name: Canceled
    test-code: |
      T_eq_ptr( ctx->exit_value, PTHREAD_CANCELED );
    text: |
      The ${../glossary/thread-exit-value:/term} of the thread specified by the
      ${../if/cancel:/params[0]/name} parameter shall be ${../if/canceled:/name}.
  - name: Exited
    test-code: |
      JoinWorker( ctx );
      T_eq_ptr( ctx->exit_value, &exit_object );
    text: |
      The ${../glossary/thread-exit-value:/term} of the thread specified by the
      ${../if/cancel:/params[0]/name} parameter shall be the value which the thread
      passed at its termination.
  test-epilogue: null
  test-prologue: null
- name: Pending
  states:
  - name: 'Yes'
    test-code: |
      ctx->phase = PHASE_LATER;
      ResumeTask( ctx->worker_id );
      T_eq_int( pthread_join( ctx->worker_thread, &ctx->exit_value ), 0 );
      ctx->joined = true;
      T_eq_ptr( ctx->exit_value, PTHREAD_CANCELED );
      T_false( ctx->late_returned );
      T_eq_u32( ctx->restarts, 0 );
    text: |
      A ${../glossary/thread-cancel-request:/term} shall be pending for the thread
      specified by the ${../if/cancel:/params[0]/name} parameter.
  test-epilogue: null
  test-prologue: null
