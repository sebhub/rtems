    text: |
      While the ${../glossary/thread-cancel-type:/term} of the thread specified by
      the ${../if/cancel:/params[0]/name} parameter is
      ${../if/cancel-asynchronous:/name}.
  test-epilogue: null
  test-prologue: null
- name: CancelPending
  states:
  - name: 'Yes'
    test-code: |
      ctx->cancel_pending = true;
    text: |
      While a ${../glossary/thread-cancel-request:/term} is pending for the thread
      specified by the ${../if/cancel:/params[0]/name} parameter.
  - name: 'No'
    test-code: |
      ctx->cancel_pending = false;
    text: |
      While no ${../glossary/thread-cancel-request:/term} is pending for the thread
