rationale: |
  Dimension Thread covers the threads which the identifier can reach, 3 states.
  The interface item states ${/c/errno/if/esrch:/name} for an identifier which is
  associated with no thread.

  Dimension Terminated covers the termination of the thread before the call, 2
  states. ${/ref/std/posix-2024/pthread-cancel:/name} states that the
  cancellation of a zombie thread is no error. A terminated thread keeps the
  ${../glossary/thread-exit-value:/term} which it passed at its termination.

  Dimension CancelState covers the ${../glossary/thread-cancel-state:/term} of
  the thread, 2 states. Dimension CancelType covers its
  ${../glossary/thread-cancel-type:/term}, 2 states.
  ${/ref/std/posix-2024/pthread-cancel:/name} states that they decide when the
  cancellation takes effect. Section 2.9.5.1 defines both sets of states. The
  section ${/ref/rtems/c-user/task-life-states:/name} of the RTEMS Classic API
  Guide states that the protection and the deferred life changes block a
  termination request.

  Dimension CancelPending covers a pending
  ${../glossary/thread-cancel-request:/term} of the thread, 2 states. Dimension
  RestartPending covers a pending restart of the thread, 2 states. The item
  /rtems/task/req/restart states that a terminating task which restarts
  terminates.

  Dimension Blocked covers the scheduler state of a thread other than the calling
  thread, 2 states. ${/ref/std/posix-2024/cancellation-points:/name} states that
  an enabled thread which waits is awakened and acts upon the request.

  A thread with the enabled state and the asynchronous type acted upon each
  request when the request was made. The request is then never pending, so the
  map skips these variants. The detached state of the thread is no input of the
  call, and /c/pthread/req/detach states the reclaim of the thread.
requirement-type: functional
skip-reasons:
  ActedUpon: |
    A thread with the ${../if/cancel-enable:/name} state and the
    ${../if/cancel-asynchronous:/name} type acts upon a request when the request is
    made, so no request is pending.
test-action: |
  if ( ctx->thread_kind == THREAD_INVALID ) {
    ctx->status = pthread_cancel( INVALID_ID );
    ctx->returned = true;
  } else {
    ctx->worker_id = CreateTask( "WORK", PRIO_HIGH );
    StartTask( ctx->worker_id, Worker, ctx );

    if ( ctx->thread_kind == THREAD_OTHER ) {
      ctx->status = pthread_cancel( ctx->worker_thread );
      ctx->returned = true;
      ctx->wait_returned_early = ctx->wait_returned;
    }
  }
test-brief: null
test-cleanup: |
  if ( ctx->worker_id != RTEMS_ID_NONE && !ctx->joined ) {
    ctx->phase = PHASE_CLEANUP;
    KickWorker( ctx );
    (void) rtems_task_resume( ctx->worker_id );
    T_eq_int( pthread_join( ctx->worker_thread, NULL ), 0 );
  }
