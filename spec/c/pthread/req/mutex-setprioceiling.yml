post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/mutex-setprioceiling:/name} shall
      be zero.
  - name: Inval
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/mutex-setprioceiling:/name} shall
      be ${/c/errno/if/einval:/name}.
  - name: Deadlock
    test-code: |
      T_eq_int( ctx->status, EDEADLK );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/mutex-setprioceiling:/name} shall
      be ${/c/errno/if/edeadlk:/name}.
  test-epilogue: null
  test-prologue: null
- name: OldCeiling
  states:
  - name: Valid
    test-code: |
      T_eq_int( ctx->old_obj, ToPOSIXPriority( PRIO_VERY_HIGH ) );
    text: |
      The value of the object referenced by the
      ${../if/mutex-setprioceiling:/params[2]/name} parameter shall be the
      ${../glossary/mutex-priority-ceiling:/term} of the mutex before the call.
  - name: Maximum
    test-code: |
      T_eq_int( ctx->old_obj, GetPOSIXPriorityMaximum() );
    text: |
      The value of the object referenced by the
      ${../if/mutex-setprioceiling:/params[2]/name} parameter shall be the maximum
      ${../glossary/thread-priority:/term}.
  - name: Zero
    test-code: |
      T_eq_int( ctx->old_obj, 0 );
    text: |
      The value of the object referenced by the
      ${../if/mutex-setprioceiling:/params[2]/name} parameter shall be zero.
  test-epilogue: null
  test-prologue: null
- name: Ceiling
  states:
  - name: New
    test-code: |
      T_eq_int( GetCeiling( ctx ), ctx->new_ceiling );
    text: |
      The ${../glossary/mutex-priority-ceiling:/term} of the mutex shall be the value
      of the ${../if/mutex-setprioceiling:/params[1]/name} parameter.
  - name: Nop
    test-code: |
      T_eq_int( GetCeiling( ctx ), ctx->ceiling_before );
    text: |
      The ${../glossary/mutex-priority-ceiling:/term} of the mutex shall not be
      modified.
  test-epilogue: null
  test-prologue: null
- name: Owner
  states:
  - name: None
    test-code: |
      T_null( ctx->owner_after );
    text: |
      The mutex shall have no owner.
  - name: Caller
    test-code: |
      T_eq_ptr( ctx->owner_after, ctx->runner );
    text: |
      The owner of the mutex shall be the calling thread.
  test-epilogue: null
  test-prologue: null
- name: Wait
  states:
  - name: 'Yes'
    test-code: |
      T_true( ctx->blocked );
    text: |
      The calling thread shall wait until the other thread surrenders the mutex.
  - name: 'No'
    test-code: |
      T_false( ctx->blocked );
    text: |
      The calling thread shall not wait.
  test-epilogue: null
  test-prologue: null
- name: Priority
  states:
  - name: Ceiling
    test-code: |
      T_eq_u32( ctx->priority_after, PRIO_ULTRA_HIGH );
    text: |
      The ${/glossary/priority-current:/term} of the calling thread shall be the
      priority which corresponds to the value of the
      ${../if/mutex-setprioceiling:/params[1]/name} parameter.
  - name: Nop
    test-code: |
      T_eq_u32( ctx->priority_after, ctx->priority_before );
    text: |
      The ${/glossary/priority-current:/term} of the calling thread shall not be
      modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Mutex
  states:
  - name: Init
    test-code: |
      ctx->mutex = &ctx->mutex_obj;
      ctx->init = true;
    text: |
      While the ${../if/mutex-setprioceiling:/params[0]/name} parameter references an
      initialized mutex.
  - name: Static
    test-code: |
      static const pthread_mutex_t initializer = PTHREAD_MUTEX_INITIALIZER;

      ctx->mutex_obj = initializer;
      ctx->mutex = &ctx->mutex_obj;
    text: |
      While the object referenced by the
      ${../if/mutex-setprioceiling:/params[0]/name} parameter is equal to
      ${../if/mutex-initializer:/name}.
  - name: Corrupted
    test-code: |
      memset( &ctx->mutex_obj, 0xff, sizeof( ctx->mutex_obj ) );
      ctx->mutex = &ctx->mutex_obj;
    text: |
      While the ${../if/mutex-setprioceiling:/params[0]/name} parameter references an
      object which is not a mutex.
  - name: 'Null'
    test-code: |
      ctx->mutex = NULL;
    text: |
      While the ${../if/mutex-setprioceiling:/params[0]/name} parameter is equal to
      ${/c/if/null:/name}.
