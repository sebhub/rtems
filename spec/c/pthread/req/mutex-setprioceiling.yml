transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Old: 'Null'
      then: Inval
    - if:
        pre-conditions:
          Mutex:
          - Static
          - Corrupted
          - 'Null'
      then: Inval
    - if:
        pre-conditions:
          Protocol:
          - None
          - Inherit
      then: Inval
    - if:
        pre-conditions:
          New:
          - High
          - Low
      then: Inval
    - if:
        pre-conditions:
          Priority: Violated
      then: Inval
    - if:
        pre-conditions:
          Scheduler: Other
      then: Inval
    - if:
        pre-conditions:
          Owner: Caller
          Type:
          - Normal
          - Errorcheck
          - Default
      then: Deadlock
    - else: Ok
    OldCeiling:
    - if:
        pre-conditions:
          Old: 'Null'
      then: N/A
    - if:
        pre-conditions:
          Mutex: Init
          Protocol: Protect
      then-specified-by: Ceiling
    - else: Zero
    Ceiling:
    - if:
        pre-conditions:
          Protocol:
          - None
          - Inherit
      then: N/A
    - if:
        post-conditions:
          Status: Ok
      then: New
    - if:
        pre-conditions:
          Mutex: Init
      then: Nop
    - else: N/A
    Owner:
    - if:
        pre-conditions:
          Owner: Caller
      then: Caller
    - if:
        pre-conditions:
          Owner: Other
      then: None
    - if:
        pre-conditions:
          Mutex: Init
      then: None
    - else: N/A
    Wait:
    - if:
        pre-conditions:
          Owner: Other
      then: 'Yes'
    - else: 'No'
    Priority:
    - if:
        and:
        - post-conditions:
            Status: Ok
        - pre-conditions:
            Owner: Caller
      then: Ceiling
    - else: Nop
  pre-conditions:
