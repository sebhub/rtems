      While the ${../glossary/mutex-protocol:/term} of the mutex is
      ${../if/prio-none:/name}.
  - name: Inherit
    test-code: |
      T_eq_int(
        pthread_mutexattr_setprotocol( &ctx->attr_obj, PTHREAD_PRIO_INHERIT ),
        0
      );
    text: |
      While the ${../glossary/mutex-protocol:/term} of the mutex is
      ${../if/prio-inherit:/name}.
  - name: Protect
    test-code: |
      T_eq_int(
        pthread_mutexattr_setprotocol( &ctx->attr_obj, PTHREAD_PRIO_PROTECT ),
        0
      );
    text: |
      While the ${../glossary/mutex-protocol:/term} of the mutex is
      ${../if/prio-protect:/name}.
  test-epilogue: null
  test-prologue: null
- name: Ceiling
  states:
  - name: Valid
    test-code: |
      T_eq_int(
        pthread_mutexattr_setprioceiling(
          &ctx->attr_obj,
          ToPOSIXPriority( PRIO_VERY_HIGH )
        ),
        0
      );
    text: |
      While the ${../glossary/mutex-priority-ceiling:/term} of the mutex is a
      ${../glossary/thread-priority:/term} which is less than the maximum
      ${../glossary/thread-priority:/term}.
  - name: Maximum
    test-code: |
      T_eq_int( pthread_mutexattr_setprioceiling( &ctx->attr_obj, INT_MAX ), 0 );
    text: |
      While the ${../glossary/mutex-priority-ceiling:/term} of the mutex is the
      maximum ${../glossary/thread-priority:/term}.
  test-epilogue: null
  test-prologue: null
- name: Type
  states:
  - name: Normal
    test-code: |
      T_eq_int(
        pthread_mutexattr_settype( &ctx->attr_obj, PTHREAD_MUTEX_NORMAL ),
        0
      );
    text: |
      While the ${../glossary/mutex-type:/term} of the mutex is
      ${../if/mutex-normal:/name}.
  - name: Recursive
    test-code: |
      T_eq_int(
        pthread_mutexattr_settype( &ctx->attr_obj, PTHREAD_MUTEX_RECURSIVE ),
        0
      );
    text: |
      While the ${../glossary/mutex-type:/term} of the mutex is
      ${../if/mutex-recursive:/name}.
  - name: Errorcheck
    test-code: |
      T_eq_int(
        pthread_mutexattr_settype( &ctx->attr_obj, PTHREAD_MUTEX_ERRORCHECK ),
        0
      );
    text: |
      While the ${../glossary/mutex-type:/term} of the mutex is
      ${../if/mutex-errorcheck:/name}.
  - name: Default
    test-code: |
      T_eq_int(
        pthread_mutexattr_settype( &ctx->attr_obj, PTHREAD_MUTEX_DEFAULT ),
        0
      );
    text: |
      While the ${../glossary/mutex-type:/term} of the mutex is
      ${../if/mutex-default:/name}.
  test-epilogue: null
  test-prologue: null
- name: New
  states:
  - name: Valid
    test-code: |
      ctx->new_ceiling = ToPOSIXPriority( PRIO_ULTRA_HIGH );
    text: |
      While the ${../if/mutex-setprioceiling:/params[1]/name} parameter is a valid
      ${../glossary/thread-priority:/term} which differs from the
      ${../glossary/mutex-priority-ceiling:/term} of the mutex.
  - name: High
    test-code: |
      ctx->new_ceiling = GetPOSIXPriorityMaximum() + 1;
    text: |
      While the ${../if/mutex-setprioceiling:/params[1]/name} parameter is greater
      than the maximum ${../glossary/thread-priority:/term}.
  - name: Low
    test-code: |
      ctx->new_ceiling = GetPOSIXPriorityMinimum() - 1;
    text: |
      While the ${../if/mutex-setprioceiling:/params[1]/name} parameter is less than
      the minimum ${../glossary/thread-priority:/term}.
  test-epilogue: null
  test-prologue: null
- name: Old
  states:
  - name: Obj
    test-code: |
      ctx->old = &ctx->old_obj;
    text: |
      While the ${../if/mutex-setprioceiling:/params[2]/name} parameter references an
      object of type int.
  - name: 'Null'
    test-code: |
      ctx->old = NULL;
    text: |
      While the ${../if/mutex-setprioceiling:/params[2]/name} parameter is equal to
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Owner
  states:
  - name: None
    test-code: |
      ctx->owner = OWNER_NONE;
    text: |
      While the mutex has no owner.
  - name: Caller
    test-code: |
      ctx->owner = OWNER_CALLER;
    text: |
      While the owner of the mutex is the calling thread.
  - name: Other
    test-code: |
      ctx->owner = OWNER_OTHER;
    text: |
      While the owner of the mutex is a thread other than the calling thread.
  test-epilogue: null
  test-prologue: null
- name: Priority
  states:
  - name: Satisfied
    test-code: |
      ctx->priority_high = false;
    text: |
      While the ${/glossary/priority-current:/term} of the calling thread is not
      higher than the priority which corresponds to the
      ${../glossary/mutex-priority-ceiling:/term} of the mutex.
  - name: Violated
    test-code: |
      ctx->priority_high = true;
    text: |
      While the ${/glossary/priority-current:/term} of the calling thread is higher
      than the priority which corresponds to the
      ${../glossary/mutex-priority-ceiling:/term} of the mutex.
  test-epilogue: null
  test-prologue: null
- name: Scheduler
  states:
  - name: Home
    test-code: |
      ctx->scheduler_other = false;
    text: |
      While the ${/glossary/scheduler-home:/term} of the calling thread is the
      ${/glossary/schedulerinstance:/term} of the mutex.
  - name: Other
    test-code: |
      ctx->scheduler_other = true;
    text: |
      While the ${/glossary/scheduler-home:/term} of the calling thread is not the
      ${/glossary/schedulerinstance:/term} of the mutex.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/pthread-mutex-getprioceiling:/name} requires
  ${/c/errno/if/einval:/name} for a mutex with the ${../if/prio-none:/name}
  ${../glossary/mutex-protocol:/term}. A mutex with the
  ${../if/prio-inherit:/name} ${../glossary/mutex-protocol:/term} has no
  ${../glossary/mutex-priority-ceiling:/term} either, so RTEMS returns
  ${/c/errno/if/einval:/name} for it as well. RTEMS requires no privilege, so
  ${/c/errno/if/eperm:/name} has no state.

  The function validates its parameters before it locks the mutex. It locks the
  mutex as ${../if/mutex-lock:/name} does. The pre-conditions Type, Owner,
  Priority and Scheduler give the cases in which the lock waits or fails. The
  standard requires ${/c/errno/if/edeadlk:/name} for a mutex with the
  ${../if/mutex-errorcheck:/name} ${../glossary/mutex-type:/term} which the
  calling thread owns. RTEMS returns it for every type which is not
  ${../if/mutex-recursive:/name}.

  A calling thread which owns the mutex before the call owns it after the call
  and keeps the ${../glossary/mutex-priority-ceiling:/term} as its
  ${/glossary/priority-current:/term}, so post-condition Priority observes the
  new ceiling. The priority of the ceiling Valid corresponds to the task priority
  PRIO_VERY_HIGH of the test support. The worker which owns the mutex for state
  Other of pre-condition Owner has the task priority PRIO_HIGH. It surrenders the
  mutex when the calling thread blocks, so the mutex has no owner after the call.
  The task priority PRIO_ULTRA_HIGH is higher than the ceiling Valid. No task
  priority is higher than the ceiling Maximum, so pre-condition Priority applies
  to the ceiling Valid only.

  The standard leaves the behaviour undefined where the
  ${../if/mutex-setprioceiling:/params[0]/name} parameter references no
  initialized mutex. States Corrupted and Null of pre-condition Mutex specify
  that RTEMS returns ${/c/errno/if/einval:/name}. A statically initialized mutex
  has the ${../if/prio-none:/name} ${../glossary/mutex-protocol:/term}.

  The function stores a defined value in the object referenced by the
  ${../if/mutex-setprioceiling:/params[2]/name} parameter in every case in which
  this parameter is not ${/c/if/null:/name}. It stores zero before it examines
  the mutex. For a mutex with the ${../if/prio-protect:/name}
  ${../glossary/mutex-protocol:/term}, it stores the
  ${../glossary/mutex-priority-ceiling:/term} before it validates the
  ${../if/mutex-setprioceiling:/params[1]/name} parameter and again after it
  locked the mutex.
requirement-type: functional
skip-reasons:
  NeedsSMP: |
    Where the system is built with SMP support disabled, the system has exactly one
    scheduler instance.
test-action: |
  Action( ctx );
test-brief: null
test-cleanup: |
  if ( ctx->scheduler_other ) {
    SetSelfScheduler( SCHEDULER_A_ID, PRIO_NORMAL );
  }

  if ( ctx->owner == OWNER_CALLER ) {
    T_eq_int( pthread_mutex_unlock( ctx->mutex ), 0 );
  }

  if ( ctx->priority_high ) {
    SetSelfPriority( PRIO_NORMAL );
  }

  if ( ctx->init ) {
    T_eq_int( pthread_mutex_destroy( &ctx->mutex_obj ), 0 );
  }
