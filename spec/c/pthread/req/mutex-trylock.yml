  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Mutex:
          - 'Null'
          - Invalid
      then: Inval
    - if:
        pre-conditions:
          Scheduler: Other
      then: Inval
    - else: N/A
    Action:
    - if:
        pre-conditions:
          Mutex:
          - 'Null'
          - Invalid
      then: N/A
    - if:
        pre-conditions:
          Scheduler: Other
      then: N/A
    - else: MtxSeizeTry
  pre-conditions:
    Protocol:
      applicable:
        pre-conditions:
          Mutex: Init
    Type:
      applicable:
        pre-conditions:
          Mutex: Init
    Mutex: all
    Scheduler:
      applicable:
        pre-conditions:
          Mutex: Init
          Protocol: Protect
- enabled-by: true
  post-conditions: NeedsSMP
  pre-conditions:
    Protocol:
    - Protect
    Type: all
    Mutex:
    - Init
    Scheduler:
    - Other
- enabled-by: RTEMS_SMP
  post-conditions:
    Status: Inval
    Action: N/A
  pre-conditions:
    Protocol:
    - Protect
    Type: all
    Mutex:
    - Init
    Scheduler:
    - Other
type: requirement
