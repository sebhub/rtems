test-prepare: |
  ctx->joinable = true;
  ctx->terminated = false;
  ctx->joined = false;
  ctx->restarted = false;
  ctx->caller_started = false;
  ctx->target_started = false;
  ctx->joiner_id = 0;
  ctx->caller_exited = false;
  ctx->target_exited = false;
  ctx->joiner_exited = false;
