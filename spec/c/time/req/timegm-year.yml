    text: |
      While the year which the member ${../if/tm:/definition[5]/default/name} of the
      object referenced by the ${../if/timegm:/params[0]/name} parameter specifies is
      not divisible by four.
  - name: Leap4
    test-code: |
      ctx->leap_year = LEAP_YEAR_4;
    text: |
      While the year which the member ${../if/tm:/definition[5]/default/name} of the
      object referenced by the ${../if/timegm:/params[0]/name} parameter specifies is
      divisible by four and not divisible by 100.
  - name: Century
    test-code: |
      ctx->leap_year = LEAP_YEAR_CENTURY;
    text: |
      While the year which the member ${../if/tm:/definition[5]/default/name} of the
      object referenced by the ${../if/timegm:/params[0]/name} parameter specifies is
      divisible by 100 and not divisible by 400.
  - name: Leap400
    test-code: |
      ctx->leap_year = LEAP_YEAR_400;
    text: |
      While the year which the member ${../if/tm:/definition[5]/default/name} of the
      object referenced by the ${../if/timegm:/params[0]/name} parameter specifies is
      divisible by 400.
  test-epilogue: null
  test-prologue: null
- name: Carry
  states:
  - name: Back
    test-code: |
      ctx->carry = CARRY_BACK;
    text: |
      While the normalization of the members of the object referenced by the
      ${../if/timegm:/params[0]/name} parameter moves the year back by one year.
  - name: None
    test-code: |
      ctx->carry = CARRY_NONE;
    text: |
      While the normalization of the members of the object referenced by the
      ${../if/timegm:/params[0]/name} parameter keeps the year.
  - name: Forward
    test-code: |
      ctx->carry = CARRY_FORWARD;
    text: |
      While the normalization of the members of the object referenced by the
      ${../if/timegm:/params[0]/name} parameter moves the year forward by one year.
  test-epilogue: null
  test-prologue: null
