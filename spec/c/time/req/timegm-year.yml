test-action: |
  ctx->tm.tm_year = years[ ctx->year_state ][ ctx->leap_year ];
  ctx->tm.tm_mon = months[ ctx->carry ];
  ctx->tm.tm_mday = 15;
  ctx->tm.tm_hour = 12;
  ctx->tm.tm_min = 30;
  ctx->tm.tm_sec = 30;
  ctx->tm.tm_wday = WDAY_SENTINEL;
  ctx->tm.tm_yday = -1;
  ctx->tm.tm_isdst = dst[ ctx->dst ];
  ctx->tm.tm_gmtoff = -1;
  ctx->tm.tm_zone = NULL;
  GetExpected( ctx );
  errno = 0;
  ctx->result = timegm( &ctx->tm );
  ctx->errno_value = errno;
