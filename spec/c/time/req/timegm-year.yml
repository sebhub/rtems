  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension Year covers the member tm_year, 4 states. The first state is the
  least value of type int and the last state is the greatest value. The year of
  the Unix epoch separates the two states between.

  Dimension LeapYear covers the leap year rule of the proleptic Gregorian
  calendar, 4 states.

  Dimension Carry covers the move of the year by the normalization, 3 states. The
  test moves the year with the member tm_mon. The item ${timegm:/spec} drives
  each member to the least and the greatest value of type int.

  Dimension Dst covers the member tm_isdst, 3 states. C23 does not restrict the
  original value of the member. UTC has no daylight saving time.

  C23 returns minus one where an int cannot represent the year of the result. It
  also returns minus one where a time_t cannot represent the time. A time_t has
  64 bits, so the members of type int always specify a time which a time_t
  represents. C23 does not change the member tm_wday in this case. C23 leaves the
  other members unspecified. The description of the function in C23 documents no
  use of errno, so ${/ref/std/c23/errno-h:/name} allows the function to set
  errno. The item requires EOVERFLOW, which POSIX requires of mktime() and
  gmtime_r().

  The least and the greatest value of the member tm_year fix the leap year class.
  The item skips the other classes of these years.
requirement-type: functional
skip-reasons:
