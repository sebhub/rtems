test-context-support: |
  typedef enum {
    YEAR_MIN,
    YEAR_BEFORE_EPOCH,
    YEAR_AFTER_EPOCH,
    YEAR_MAX
  } YearState;

  typedef enum { CARRY_BACK, CARRY_NONE, CARRY_FORWARD } Carry;

  typedef enum { DST_NEGATIVE, DST_ZERO, DST_POSITIVE } Dst;

  typedef enum {
    LEAP_YEAR_COMMON,
    LEAP_YEAR_4,
    LEAP_YEAR_CENTURY,
    LEAP_YEAR_400
  } LeapYear;
