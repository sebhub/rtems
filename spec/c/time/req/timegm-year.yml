pre-conditions:
- name: Year
  states:
  - name: Min
    test-code: |
      ctx->year_state = YEAR_MIN;
    text: |
      While the member ${../if/tm:/definition[5]/default/name} of the object
      referenced by the ${../if/timegm:/params[0]/name} parameter is the least value
      of type int.
  - name: BeforeEpoch
    test-code: |
      ctx->year_state = YEAR_BEFORE_EPOCH;
    text: |
      While the member ${../if/tm:/definition[5]/default/name} of the object
      referenced by the ${../if/timegm:/params[0]/name} parameter is greater than the
      least value of type int and less than the year of the
      ${/glossary/unix-epoch:/term} minus 1900.
  - name: AfterEpoch
    test-code: |
      ctx->year_state = YEAR_AFTER_EPOCH;
    text: |
      While the member ${../if/tm:/definition[5]/default/name} of the object
      referenced by the ${../if/timegm:/params[0]/name} parameter is greater than or
      equal to the year of the ${/glossary/unix-epoch:/term} minus 1900 and less than
      the greatest value of type int.
  - name: Max
    test-code: |
      ctx->year_state = YEAR_MAX;
    text: |
      While the member ${../if/tm:/definition[5]/default/name} of the object
      referenced by the ${../if/timegm:/params[0]/name} parameter is the greatest
