rationale: |
  Dimension Year covers the year of the time in the proleptic Gregorian calendar,
  8 states. The member tm_year of type int represents the years from INT_MIN plus
  1900 to INT_MAX plus 1900. POSIX specifies the error EOVERFLOW for a result
  which the structure cannot represent.

  Dimension LeapYear covers the leap year rule of the proleptic Gregorian
  calendar, 4 states. The expression of POSIX for the seconds since the Epoch
  divides the year by four, 100 and 400.

  Dimension Month covers the month of the year, 4 states. The length of February
  depends on the leap year rule. January and December are the first and the last
  month.

  Dimension MonthDay covers the day of the month, 3 states.

  Dimension Hour covers the hour of the day, 3 states. Dimension Minute covers
  the minute of the hour, 3 states. Dimension Second covers the second of the
  minute, 3 states. POSIX accounts for each day by exactly 86400 seconds, so the
  second of the minute never reaches 60.

  The date fixes the day of the week and the day of the year, so no dimension
  arranges them. UTC has no daylight saving time.

  POSIX leaves the relationship undefined for a negative time and for a year
  before 1970. This item extends the relationship by the proleptic Gregorian
  calendar.

  POSIX specifies no value of errno after a successful call. POSIX leaves the
  content of the object referenced by the result parameter unspecified after an
  error.

  The least and the greatest value of type time_t fix every other pre-condition.
  The item skips the other combinations of these values.

  The first and the last year which the member tm_year can represent fix the leap
  year class. The item skips the other classes of these years.

  The test code derives the expected values with the independent algorithm of
  DaysFromCivil().
requirement-type: functional
skip-reasons:
  FixedClass: |
    The year fixes the leap year class.
  FixedTime: |
    The time fixes the other pre-conditions.
test-action: |
  ctx->year = years[ ctx->year_state ][ ctx->leap_year ];

  switch ( ctx->day_state ) {
    case DAY_FIRST:
      ctx->day = 1;
      break;
    case DAY_BETWEEN:
      ctx->day = 15;
      break;
    default:
      ctx->day = GetLastDayOfMonth( ctx->year, ctx->month );
      break;
  }

  ctx->days = DaysFromCivil( ctx->year, ctx->month, ctx->day );

  if ( ctx->year_state == YEAR_LEAST ) {
    ctx->timer = (time_t) INT64_MIN;
  } else if ( ctx->year_state == YEAR_GREATEST ) {
    ctx->timer = (time_t) INT64_MAX;
  } else {
    ctx->timer = (time_t) ctx->days * 86400 + ctx->hour * 3600 +
                 ctx->minute * 60 + ctx->second;
  }
  memset( &ctx->tm, 0xff, sizeof( ctx->tm ) );
  ctx->tm.tm_zone = NULL;
  errno = 0;
  ctx->result = gmtime_r( &ctx->timer, &ctx->tm );
  ctx->errno_value = errno;
