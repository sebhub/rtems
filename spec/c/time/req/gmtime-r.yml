test-context-support: |
  typedef enum {
    YEAR_LEAST,
    YEAR_UNDERFLOW,
    YEAR_FIRST,
    YEAR_BEFORE_EPOCH,
    YEAR_AFTER_EPOCH,
    YEAR_LAST,
    YEAR_OVERFLOW,
    YEAR_GREATEST
  } YearState;

  typedef enum {
    LEAP_YEAR_COMMON,
    LEAP_YEAR_4,
    LEAP_YEAR_CENTURY,
    LEAP_YEAR_400
  } LeapYear;

  typedef enum { DAY_FIRST, DAY_BETWEEN, DAY_LAST } DayState;
