test-support: |
  /*
   * The member tm_year of type int represents the years from INT_MIN + 1900 to
   * INT_MAX + 1900.  A zero marks a class which the year does not have.
   */
  static const int64_t years[ 8 ][ 4 ] = {
    { -292277022657, 0, 0, 0 },
    { -2147481749, -2147481752, -2147481800, -2147482000 },
    { 0, -2147481748, 0, 0 },
    { -1, -4, -100, -400 },
    { 1970, 2024, 2100, 2000 },
    { 2147485547, 0, 0, 0 },
    { 2147485549, 2147485548, 2147485700, 2147485600 },
    { 0, 292277026596, 0, 0 }
  };

  static int64_t GetLastDayOfMonth( int64_t year, unsigned int month )
  {
    if ( month == 12 ) {
      return 31;
    }

    return DaysFromCivil( year, month + 1, 1 ) - DaysFromCivil( year, month, 1 );
  }

  static int GetWeekDay( int64_t days )
  {
    int64_t weekday;

    /* The Epoch is a Thursday */
    weekday = ( days + 4 ) % 7;

    if ( weekday < 0 ) {
      weekday += 7;
    }

    return (int) weekday;
  }
