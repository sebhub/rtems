test-context-support: |
  typedef enum {
    STATE_MIN,
    STATE_NEGATIVE,
    STATE_FIRST,
    STATE_BETWEEN,
    STATE_LAST,
    STATE_ABOVE,
    STATE_MAX
  } MemberState;

  typedef enum {
    LEAP_YEAR_COMMON,
    LEAP_YEAR_4,
    LEAP_YEAR_CENTURY,
    LEAP_YEAR_400
  } LeapYear;
