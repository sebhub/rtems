rationale: |
  Dimension Second covers the member tm_sec, 7 states. Dimension Minute covers
  the member tm_min, 7 states. Dimension Hour covers the member tm_hour, 7
  states. Dimension MonthDay covers the member tm_mday, 7 states. Dimension Month
  covers the member tm_mon, 7 states. Each member dimension partitions the values
  of type int. Two states hold the least and the greatest value. Three states
  hold the first value, the values between and the last value of the normal
  range. Two states hold the values below and above the normal range. C23 does
  not restrict the original values of these members to the normal ranges.

  Dimension LeapYear covers the leap year rule of the proleptic Gregorian
  calendar, 4 states.

  The normal range of the member tm_mday ends with the last day of the month
  which the members tm_year and tm_mon specify. POSIX accounts for each day by
  exactly 86400 seconds, so the normal range of the member tm_sec ends with 59.

  The item ${timegm-year:/spec} states the range of the year. This item uses
  years in the middle of that range, so no variant exceeds it.

  C23 ignores the original values of the members tm_wday and tm_yday. The test
  sets them to values outside of their normal ranges. The test sets the member
  tm_isdst to zero. UTC has no daylight saving time.

  The test code derives the expected time with the independent algorithm of
  DaysFromCivil() and the expected members with gmtime_r().
requirement-type: functional
skip-reasons: {}
test-action: |
  ctx->tm.tm_year = (int) ( years[ ctx->leap_year ] - 1900 );
  ctx->tm.tm_mon = GetValue( ctx->month, 0, 11, 1, 13 );
  Normalize( ctx );
  ctx->tm.tm_mday = GetValue(
    ctx->month_day,
    1,
    (int) ctx->last_day,
    15,
    (int) ctx->last_day + 40
  );
  ctx->tm.tm_hour = GetValue( ctx->hour, 0, 23, 12, 25 );
  ctx->tm.tm_min = GetValue( ctx->minute, 0, 59, 30, 61 );
  ctx->tm.tm_sec = GetValue( ctx->second, 0, 59, 30, 61 );
  ctx->tm.tm_wday = WDAY_SENTINEL;
  ctx->tm.tm_yday = -1;
  ctx->tm.tm_isdst = 0;
  ctx->tm.tm_gmtoff = -1;
  ctx->tm.tm_zone = NULL;
  GetExpected( ctx );
  ctx->result = timegm( &ctx->tm );
