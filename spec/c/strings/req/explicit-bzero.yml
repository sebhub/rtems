enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/explicit-bzero
- path: man.cgi?query=explicit_bzero&sektion=3
  role: reference
  uid: /ref/man/freebsd
post-conditions:
- name: Memory
  states:
  - name: Nop
    test-code: |
      size_t i;

      for ( i = 0; i < sizeof( ctx->buf ); ++i ) {
        T_eq_int( (unsigned char) ctx->buf[ i ], 0xff );
      }
    text: |
      The memory area referenced by ${../if/explicit-bzero:/params[0]/name} shall not
      be modified.
  - name: Zeroed
    test-code: |
      size_t i;

      for ( i = 0; i < ctx->n; ++i ) {
        T_eq_int( ctx->buf[ i ], 0 );
      }

      for ( i = ctx->n; i < sizeof( ctx->buf ); ++i ) {
        T_eq_int( (unsigned char) ctx->buf[ i ], 0xff );
      }
    text: |
      The memory area referenced by ${../if/explicit-bzero:/params[0]/name} shall be
      filled with zeros up to the number of bytes specified by
      ${../if/explicit-bzero:/params[1]/name}.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Length
  states:
  - name: Zero
    test-code: |
      ctx->n = 0;
    text: |
      While the value specified by ${../if/explicit-bzero:/params[1]/name} is zero.
  - name: Positive
    test-code: |
      ctx->n = 3;
    text: |
      While the value specified by ${../if/explicit-bzero:/params[1]/name} is greater
      than zero.
  test-epilogue: null
  test-prologue: null
rationale: |
  The implementation of the pre-qualified library calls ${/c/if/memset:/name}
  with the value zero. An empty assembler statement with a memory clobber follows
  the call, so the compiler cannot remove the write. Dimension Length selects
  whether the call writes a byte.
