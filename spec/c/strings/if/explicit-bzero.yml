brief: |
  Erase the data in the memory area referenced by ${.:/params[0]/name} for the
  number of bytes specified by ${.:/params[1]/name} by writing zeros to that
  area.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - void *${.:/params[0]/name}
    - ${/c/if/size_t:/name} ${.:/params[1]/name}
    return: null
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- path: man.cgi?query=explicit_bzero&sektion=3
  role: reference
  uid: /ref/man/freebsd
name: explicit_bzero
notes: |
  See
  [FreeBSD Manual Pages, explicit_bzero()](https://man.freebsd.org/cgi/man.cgi?query=explicit_bzero&sektion=3).
params:
- description: |
    is the pointer to the object to be filled with zeros.
  dir: out
  name: s
- description: |
    is the number of bytes to zero.
  dir: null
  name: n
return:
  return: |
    None.
  return-values: []
type: interface
