post-conditions:
- name: Evaluation
  states:
  - name: Once
    test-code: |
      T_eq_sz( ctx->evaluations, 1 );
    text: |
      The ${../if/assert:/params[0]/name} parameter shall be evaluated exactly once.
  - name: None
    test-code: |
      T_eq_sz( ctx->evaluations, 0 );
    text: |
      The ${../if/assert:/params[0]/name} parameter shall not be evaluated.
  test-epilogue: null
  test-prologue: null
- name: Result
  states:
  - name: Return
    test-code: |
      T_true( ctx->returned );
      T_false( ctx->fatal );
    text: |
      The ${../if/assert:/name} macro expansion shall return to the caller.
  - name: Fatal
    test-code: |
      T_false( ctx->returned );
      T_true( ctx->fatal );
      T_eq_int( ctx->source, RTEMS_FATAL_SOURCE_ASSERT );
    text: |
      The ${../if/assert:/name} macro expansion shall terminate the system with the
      fatal source ${/score/interr/if/source-assert:/name} and a fatal code which
      references an object of type ${/rtems/fatal/if/assert-context:/name}.
  test-epilogue: null
  test-prologue: null
- name: File
  states:
  - name: Name
    test-code: |
      T_assert_not_null( ctx->assert_context.file );
      T_eq_str( ctx->assert_context.file, __FILE__ );
    text: |
      The value of the member
      ${/rtems/fatal/if/assert-context:/definition[0]/default/name} of the object
      referenced by the fatal code shall reference the presumed name of the source
      file of the ${../if/assert:/name} invocation.
  test-epilogue: null
  test-prologue: null
- name: Line
  states:
  - name: Number
    test-code: |
      T_eq_int( ctx->assert_context.line, ctx->line );
    text: |
      The value of the member
      ${/rtems/fatal/if/assert-context:/definition[1]/default/name} of the object
      referenced by the fatal code shall be the presumed line number of the
      ${../if/assert:/name} invocation.
  test-epilogue: null
  test-prologue: null
- name: Function
  states:
  - name: Name
    test-code: |
      T_assert_not_null( ctx->assert_context.function );
      T_eq_str( ctx->assert_context.function, ctx->function );
    text: |
      The value of the member
      ${/rtems/fatal/if/assert-context:/definition[2]/default/name} of the object
      referenced by the fatal code shall reference the name of the function which
      encloses the ${../if/assert:/name} invocation.
  - name: 'Null'
    test-code: |
      T_null( ctx->assert_context.function );
    text: |
      The value of the member
      ${/rtems/fatal/if/assert-context:/definition[2]/default/name} of the object
      referenced by the fatal code shall be ${/c/if/null:/name}.
  - name: String
    test-code: |
      T_eq_ptr( ctx->assert_context.function, assert_func_string );
    text: |
      The value of the member
      ${/rtems/fatal/if/assert-context:/definition[2]/default/name} of the object
      referenced by the fatal code shall be the value of ${../if/assert-func:/name}.
  test-epilogue: null
  test-prologue: null
- name: Expression
  states:
  - name: Text
    test-code: |
      T_assert_not_null( ctx->assert_context.failed_expression );
      T_eq_str( ctx->assert_context.failed_expression, "Evaluate( ctx )" );
    text: |
      The value of the member
      ${/rtems/fatal/if/assert-context:/definition[3]/default/name} of the object
      referenced by the fatal code shall reference the text of the
      ${../if/assert:/params[0]/name} parameter.
  test-epilogue: null
  test-prologue: null
- name: Output
  states:
  - name: Function
    test-code: |
      CheckOutput( ctx, true );
    text: |
      Before the system terminates, the ${../if/assert:/name} macro expansion shall
      output with ${/rtems/io/if/printk:/name} the characters `assertion "`, the text
      of the ${../if/assert:/params[0]/name} parameter, the characters
      `" failed: file "`, the presumed name of the source file of the
      ${../if/assert:/name} invocation, the characters `", line `, the presumed line
      number of the ${../if/assert:/name} invocation in decimal notation, the
      characters `, function: `, the string referenced by the member
      ${/rtems/fatal/if/assert-context:/definition[2]/default/name} of the object
      referenced by the fatal code, and a `NL` character in this order.
  - name: NoFunction
    test-code: |
      CheckOutput( ctx, false );
    text: |
      Before the system terminates, the ${../if/assert:/name} macro expansion shall
      output with ${/rtems/io/if/printk:/name} the characters `assertion "`, the text
      of the ${../if/assert:/params[0]/name} parameter, the characters
      `" failed: file "`, the presumed name of the source file of the
      ${../if/assert:/name} invocation, the characters `", line `, the presumed line
      number of the ${../if/assert:/name} invocation in decimal notation, and a `NL`
      character in this order.
  - name: None
    test-code: |
      T_eq_sz( ctx->output_count, 0 );
    text: |
      The ${../if/assert:/name} macro expansion shall output no character.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: NDEBUG
  states:
  - name: Defined
    test-code: |
      ctx->ndebug = true;
    text: |
      Where ${/user/if/ndebug:/name} is defined as a macro name at the point in the
      source file where ${../if/header:/path} is included.
  - name: Undefined
    test-code: |
      ctx->ndebug = false;
    text: |
      Where ${/user/if/ndebug:/name} is not defined as a macro name at the point in
      the source file where ${../if/header:/path} is included.
  test-epilogue: null
  test-prologue: null
- name: AssertFunc
  states:
  - name: Undefined
    test-code: |
      ctx->assert_func = ASSERT_FUNC_UNDEFINED;
    text: |
      Where ${../if/assert-func:/name} is not defined as a macro name at the point in
      the source file where ${../if/header:/path} is included.
  - name: 'Null'
    test-code: |
      ctx->assert_func = ASSERT_FUNC_NULL;
    text: |
      Where ${../if/assert-func:/name} is defined as a null pointer constant at the
      point in the source file where ${../if/header:/path} is included.
  - name: String
    test-code: |
      ctx->assert_func = ASSERT_FUNC_STRING;
    text: |
      Where ${../if/assert-func:/name} is defined as an expression which references a
      string at the point in the source file where ${../if/header:/path} is included.
  test-epilogue: null
  test-prologue: null
- name: Expression
  states:
  - name: 'True'
    test-code: |
      ctx->value = 1;
    text: |
      While the ${../if/assert:/params[0]/name} parameter compares unequal to 0.
  - name: 'False'
    test-code: |
      ctx->value = 0;
    text: |
      While the ${../if/assert:/params[0]/name} parameter compares equal to 0.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension NDEBUG covers the definition of ${/user/if/ndebug:/name} where
  ${../if/header:/path} is included, 2 states. ${/ref/std/c23/assert-h:/name}
  redefines the macro according to this definition each time that the header is
  included.

  Dimension AssertFunc covers the definition of ${../if/assert-func:/name} where
  ${../if/header:/path} is included, 3 states. The ${../if/header:/path} header
  of Newlib passes ${../if/assert-func:/name} as the function name. It defines
  ${../if/assert-func:/name} as `__func__` where no definition exists.

  Dimension Expression covers the value of the scalar expression, 2 states.
  ${/ref/std/c23/assert:/name} defines false as a value which compares equal to
  0\.

  ${/ref/std/c23/assert-h:/name} states that the macro acts as a function with
  one parameter where ${/user/if/ndebug:/name} is not defined. The macro
  therefore evaluates the expression exactly once.

  ${/ref/std/c23/assert:/name} lists the information which the macro writes. The
  presumed name of the source file and the presumed line number are the values of
  `__FILE__` and `__LINE__` of ${/ref/std/c23/mandatory-macros:/name}. The name
  of the enclosing function is the value of `__func__` of
  ${/ref/std/c23/predefined-identifiers:/name}. The standard leaves the format of
  the message to the implementation.

  The section ${/ref/rtems/c-user/fatal-error-sources:/name} of the RTEMS Classic
  API Guide states the fatal source and the fatal code which terminate the
  system.
requirement-type: functional
skip-reasons: {}
test-action: |
  ctx->evaluations = 0;
  ctx->returned = false;
  ctx->fatal = false;
  ctx->source = 0;
  ctx->output_count = 0;
  ctx->output[ 0 ] = '\0';
  memset( &ctx->assert_context, 0, sizeof( ctx->assert_context ) );
  SetFatalHandler( Fatal, ctx );
  ctx->output_char = BSP_output_char;
  BSP_output_char = OutputChar;

  if ( setjmp( ctx->before_fatal ) == 0 ) {
    ( *asserts[ ctx->ndebug ][ ctx->assert_func ] )( ctx );
    BSP_output_char = ctx->output_char;
    SetFatalHandler( NULL, NULL );
    ctx->returned = true;
  }
