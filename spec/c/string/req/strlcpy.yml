links:
- role: interface-function
  uid: ../if/strlcpy
- role: reference
  uid: /ref/std/posix-2024/strlcpy
post-conditions:
- name: Result
  states:
  - name: Truncated
    test-code: |
      T_ge_uint( ctx->retval, ctx->size );
      T_eq_uint( ctx->retval, strlen( ctx->src ) );
    text: |
      The return value of ${../if/strlcpy:/name} shall be greater than or equal to
      the size specified by ${../if/strlcpy:/params[2]/name}.
  - name: NotTruncated
    test-code: |
      T_lt_uint( ctx->retval, ctx->size );
      T_eq_uint( ctx->retval, strlen( ctx->src ) );
    text: |
      The return value of ${../if/strlcpy:/name} shall be less than the size
      specified by ${../if/strlcpy:/params[2]/name}.
  test-epilogue: null
  test-prologue: null
- name: DstArea
  states:
  - name: Unmodified
    test-code: |
      for ( size_t i = 0; i < sizeof( ctx->dst_buf ); ++i ) {
        T_quiet_eq_uint( ctx->dst_buf[ i ], 0xaa );
      }
    text: |
      The memory area referenced by ${../if/strlcpy:/params[0]/name} shall not be
      modified.
  - name: CopiedFull
    test-code: |
      size_t len = strlen( ctx->src );

      T_eq_nstr( ctx->dst, ctx->src, len + 1 );

      for ( size_t i = 0; i < ctx->offset; ++i ) {
        T_quiet_eq_uint( ctx->dst_buf[ i ], 0xaa );
      }

      for ( size_t i = ctx->offset + len + 1; i < sizeof( ctx->dst_buf ); ++i ) {
        T_quiet_eq_uint( ctx->dst_buf[ i ], 0xaa );
      }
    text: |
      Only the string referenced by ${../if/strlcpy:/params[1]/name}, including its
      terminating null character, shall be copied to the memory area referenced by
      ${../if/strlcpy:/params[0]/name}.
  - name: CopiedTruncated
    test-code: |
      T_eq_nstr( ctx->dst, ctx->src, ctx->size - 1 );
      T_eq_uint( ctx->dst[ ctx->size - 1 ], 0 );

      for ( size_t i = 0; i < ctx->offset; ++i ) {
        T_quiet_eq_uint( ctx->dst_buf[ i ], 0xaa );
      }

      for ( size_t i = ctx->offset + ctx->size; i < sizeof( ctx->dst_buf ); ++i ) {
        T_quiet_eq_uint( ctx->dst_buf[ i ], 0xaa );
      }
    text: |
      Only the first characters of the string referenced by
      ${../if/strlcpy:/params[1]/name}, up to one less than the size specified by
      ${../if/strlcpy:/params[2]/name}, followed by a terminating null character
      shall be copied to the memory area referenced by
      ${../if/strlcpy:/params[0]/name}.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: N
  states:
  - name: Zero
    test-code: |
      ctx->zero = true;
    text: |
      While the size specified by ${../if/strlcpy:/params[2]/name} is equal to zero.
  - name: Positive
    test-code: |
      /* The pre-conditions Fit and Length set the size. */
    text: |
      While the size specified by ${../if/strlcpy:/params[2]/name} is greater than
      zero.
  test-epilogue: null
  test-prologue: null
- name: Fit
  states:
  - name: Fits
    test-code: |
      ctx->fits = true;
    text: |
      While the length of the string referenced by ${../if/strlcpy:/params[1]/name}
      is less than the size specified by ${../if/strlcpy:/params[2]/name}.
  - name: Truncate
    test-code: |
      ctx->fits = false;
    text: |
      While the length of the string referenced by ${../if/strlcpy:/params[1]/name}
      is greater than or equal to the size specified by
      ${../if/strlcpy:/params[2]/name}.
  test-epilogue: null
  test-prologue: null
- name: Alignment
  states:
  - name: Aligned
    test-code: |
      ctx->src_offset = 0;
      ctx->offset = 0;
    text: |
      While the memory areas referenced by the ${../if/strlcpy:/params[0]/name} and
      ${../if/strlcpy:/params[1]/name} parameters start at addresses which are
      aligned to the size of type size_t.
  - name: Unaligned
    test-code: |
      ctx->src_offset = 1;
      ctx->offset = 1;
    text: |
      While the memory areas referenced by the ${../if/strlcpy:/params[0]/name} and
      ${../if/strlcpy:/params[1]/name} parameters start at addresses which are not
      aligned to the size of type size_t and which have the same remainder of the
      division by the size of type size_t.
  - name: Mismatch
    test-code: |
      ctx->src_offset = 1;
      ctx->offset = 2;
    text: |
      While the addresses of the memory areas referenced by the
      ${../if/strlcpy:/params[0]/name} and ${../if/strlcpy:/params[1]/name}
      parameters have different remainders of the division by the size of type
      size_t.
  test-epilogue: null
  test-prologue: null
- name: Length
  states:
  - name: Short
    test-code: |
      ctx->length = 0;
    text: |
      While the count of characters to copy is less than the size of type size_t
      minus one.
  - name: Medium
    test-code: |
      ctx->length = 1;
    text: |
      While the count of characters to copy is equal to the size of type size_t minus
      one.
  - name: Long
    test-code: |
      ctx->length = 2;
    text: |
      While the count of characters to copy is greater than or equal to two times the
      size of type size_t.
  test-epilogue: null
  test-prologue: null
rationale: |
  The implementation of the pre-qualified library returns the length of the
  source for a size of zero. Otherwise, it copies the bytes before the first
  aligned source address, if the source and the destination have the same
  alignment. It then copies one block of the size of type size_t at a time. The
  block loop ends before a block which contains a null character or which exceeds
  the size. A byte loop copies the rest. The return value adds the length of the
  source which was not copied. Dimension Alignment selects the prefix loop and
  the block loop. Dimension Length ends the copy in the prefix, at the end of the
  prefix or after two blocks. Dimension Fit decides whether the null character or
  the size ends the copy.
