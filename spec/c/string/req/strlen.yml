test-context-support: null
test-description: null
test-header: null
test-includes:
- string.h
test-local-includes: []
test-prepare: |
  ctx->retval = 0;
  ctx->offset = 0;
  ctx->position = 0;
test-setup: null
test-stop: null
test-support: |
  typedef ${.:/test-context-type} Context;

  static size_t AlignUp( size_t offset )
  {
    return ( offset + sizeof( long ) - 1 ) & ~( sizeof( long ) - 1 );
  }

  static void Arrange( Context *ctx )
  {
    char  *b;
    size_t i;

    b = (char *) ctx->buf;

    for ( i = 0; i < sizeof( ctx->buf ); ++i ) {
      b[ i ] = (char) ( 'A' + i % 26 );
    }

    b[ ctx->position ] = '\0';
    ctx->s = b + ctx->offset;
  }
test-target: testsuites/validation/tc-string-strlen.c
test-teardown: null
