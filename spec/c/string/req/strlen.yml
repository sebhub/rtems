enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/strlen
- role: reference
  uid: /ref/std/posix-2024/strlen
post-conditions:
- name: Result
  states:
  - name: Length
    test-code: |
      T_eq_sz( ctx->retval, ctx->position - ctx->offset );
    text: |
      The return value of ${../if/strlen:/name} shall be the count of characters
      which precede the terminating null character of the string referenced by the
      ${../if/strlen:/params[0]/name} parameter.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Alignment
  states:
  - name: Aligned
    test-code: |
      ctx->offset = 0;
    text: |
      While the string referenced by the ${../if/strlen:/params[0]/name} parameter
      starts at an address which is aligned to the size of type long.
  - name: Unaligned
    test-code: |
      ctx->offset = 1;
    text: |
      While the string referenced by the ${../if/strlen:/params[0]/name} parameter
      starts at an address which is not aligned to the size of type long.
  test-epilogue: null
  test-prologue: null
- name: Position
  states:
  - name: Prefix
    test-code: |
      ctx->position = ctx->offset + 1;
    text: |
      While the terminating null character of the string is located before the first
      address aligned to the size of type long.
  - name: FirstBlock
    test-code: |
      ctx->position = AlignUp( ctx->offset );
    text: |
      While the terminating null character of the string is located at the start of
      the first block of the size of type long which starts at an aligned address.
  - name: SecondBlock
    test-code: |
      ctx->position = AlignUp( ctx->offset ) + sizeof( long ) + 1;
    text: |
      While the terminating null character of the string is located in the second
      block of the size of type long which starts at an aligned address, but not at
      the start of this block.
  test-epilogue: null
  test-prologue: null
rationale: |
  The implementation of the pre-qualified library checks the bytes before the
  first aligned address, then one block of the size of type long at a time, then
  the bytes of the block which contains the null character. Dimension Alignment
  decides whether the string has an unaligned prefix. Dimension Position places
  the terminating null character in the prefix, at the start of the first block
  or after the start of the second block. The last two states select the two
  exits of the byte loop of the last block.
references: []
requirement-type: functional
skip-reasons:
  AlignedHasNoPrefix: |
    A string which starts at an aligned address has no prefix.
test-action: |
  Arrange( ctx );
  ctx->retval = strlen( ctx->s );
test-brief: null
test-cleanup: null
