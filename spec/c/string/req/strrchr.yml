post-conditions:
- name: Result
  states:
  - name: Last
    test-code: |
      T_eq_ptr( ctx->retval, ctx->expected );
      T_not_null( ctx->retval );
    text: |
      The return value of ${../if/strrchr:/name} shall be the address of the last
      character in the string referenced by the ${../if/strrchr:/params[0]/name}
      parameter which is equal to the ${../if/strrchr:/params[1]/name} parameter
      converted to char.
  - name: 'Null'
    test-code: |
      T_null( ctx->retval );
    text: |
      The return value of ${../if/strrchr:/name} shall be ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: C
  states:
  - name: Zero
    test-code: |
      ctx->c = 0x100;
    text: |
      While the ${../if/strrchr:/params[1]/name} parameter converted to char is equal
      to the null character.
  - name: NonZero
    test-code: |
      ctx->c = 0x185;
    text: |
      While the ${../if/strrchr:/params[1]/name} parameter converted to char is not
      equal to the null character.
  test-epilogue: null
  test-prologue: null
- name: Occurrences
  states:
  - name: None
    test-code: |
      ctx->count = 0;
    text: |
      While the string referenced by the ${../if/strrchr:/params[0]/name} parameter
      contains no character which is equal to the ${../if/strrchr:/params[1]/name}
      parameter converted to char.
  - name: One
    test-code: |
      ctx->count = 1;
    text: |
      While the string referenced by the ${../if/strrchr:/params[0]/name} parameter
      contains exactly one character which is equal to the
      ${../if/strrchr:/params[1]/name} parameter converted to char.
  - name: Several
    test-code: |
      ctx->count = 3;
    text: |
      While the string referenced by the ${../if/strrchr:/params[0]/name} parameter
      contains more than one character which is equal to the
      ${../if/strrchr:/params[1]/name} parameter converted to char.
  test-epilogue: null
  test-prologue: null
rationale: |
  The implementation of the pre-qualified library calls strlen() and then
  \_\_memrchr(). This function searches the string backwards from its terminating
  null character. The search ends at the first matching character or at the start
  of the string. Dimension Occurrences selects the two ends of the search and
  whether the last occurrence is found before an earlier one. The terminating
  null character is part of the string, so dimension Occurrences does not apply
  to the null character.
