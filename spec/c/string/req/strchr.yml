post-conditions:
- name: Result
  states:
  - name: Found
    test-code: |
      T_eq_ptr( ctx->retval, ctx->expected );
      T_not_null( ctx->retval );
    text: |
      The return value of ${../if/strchr:/name} shall be the address of the first
      character of the string referenced by ${../if/strchr:/params[0]/name} which is
      equal to the value of ${../if/strchr:/params[1]/name} converted to char.
  - name: 'Null'
    test-code: |
      T_null( ctx->retval );
    text: |
      The return value of ${../if/strchr:/name} shall be ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: C
  states:
  - name: Zero
    test-code: |
      ctx->c = 0x100;
    text: |
      While the value of the ${../if/strchr:/params[1]/name} parameter converted to
      char is the null character.
  - name: NonZero
    test-code: |
      ctx->c = 0x185;
    text: |
      While the value of the ${../if/strchr:/params[1]/name} parameter converted to
      char is not the null character.
  test-epilogue: null
  test-prologue: null
- name: Alignment
  states:
  - name: Aligned
    test-code: |
      ctx->offset = 0;
    text: |
      While the string referenced by the ${../if/strchr:/params[0]/name} parameter
      starts at an address which is aligned to the size of type size_t.
  - name: Unaligned
    test-code: |
      ctx->offset = 1;
    text: |
      While the string referenced by the ${../if/strchr:/params[0]/name} parameter
      starts at an address which is not aligned to the size of type size_t.
  test-epilogue: null
  test-prologue: null
- name: Match
  states:
  - name: Found
    test-code: |
      ctx->found = true;
    text: |
      While the string referenced by the ${../if/strchr:/params[0]/name} parameter
      contains a character which is equal to the value of the
      ${../if/strchr:/params[1]/name} parameter converted to char.
  - name: NotFound
    test-code: |
      ctx->found = false;
    text: |
      While the string referenced by the ${../if/strchr:/params[0]/name} parameter
      contains no character which is equal to the value of the
      ${../if/strchr:/params[1]/name} parameter converted to char.
  test-epilogue: null
  test-prologue: null
- name: Position
  states:
  - name: Prefix
    test-code: |
      ctx->position = ctx->offset;
    text: |
      While the first character of the string which is equal to the value of the
      ${../if/strchr:/params[1]/name} parameter converted to char, or else its
      terminating null character, is located before the first address aligned to the
      size of type size_t.
  - name: FirstBlock
    test-code: |
      ctx->position = AlignUp( ctx->offset );
    text: |
      While the first character of the string which is equal to the value of the
      ${../if/strchr:/params[1]/name} parameter converted to char, or else its
      terminating null character, is located in the first block of the size of type
      size_t which starts at an aligned address.
  - name: SecondBlock
    test-code: |
      ctx->position = AlignUp( ctx->offset ) + sizeof( size_t ) + 1;
    text: |
      While the first character of the string which is equal to the value of the
      ${../if/strchr:/params[1]/name} parameter converted to char, or else its
      terminating null character, is located in the second block of the size of type
      size_t which starts at an aligned address.
  test-epilogue: null
  test-prologue: null
rationale: |
  The implementation of the pre-qualified library calls \_\_strchrnul(). This
  function returns the address of the first character which is equal to the
  searched character or else of the terminating null character. For the null
  character, it calls strlen(). For any other character, it searches the bytes
  before the first aligned address, then one block of the size of type size_t at
  a time, then the bytes of the last block. Dimension Alignment decides whether
  the string has an unaligned prefix. Dimension Position places the character
  which ends the search in the prefix, at the start of the first block or in the
  second block. Dimension Match decides whether this character is the searched
  character or the terminating null character.
