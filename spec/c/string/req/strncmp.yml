post-conditions:
- name: Result
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->retval, 0 );
    text: |
      The return value of ${../if/strncmp:/name} shall be equal to zero.
  - name: Negative
    test-code: |
      T_lt_int( ctx->retval, 0 );
    text: |
      The return value of ${../if/strncmp:/name} shall be less than zero.
  - name: Positive
    test-code: |
      T_gt_int( ctx->retval, 0 );
    text: |
      The return value of ${../if/strncmp:/name} shall be greater than zero.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: N
  states:
  - name: Zero
    test-code: |
      ctx->n = 0;
      ctx->compare = 1;
      ctx->position = 0;
    text: |
      While the ${../if/strncmp:/params[2]/name} parameter is equal to zero.
  - name: Positive
    test-code: |
      ctx->n = 8;
    text: |
      While the ${../if/strncmp:/params[2]/name} parameter is greater than zero.
  test-epilogue: null
  test-prologue: null
- name: Compare
  states:
  - name: Equal
    test-code: |
      ctx->compare = 0;
    text: |
      While the first ${../if/strncmp:/params[2]/name} characters of the strings
      referenced by the ${../if/strncmp:/params[0]/name} and
      ${../if/strncmp:/params[1]/name} parameters are equal, where no character which
      follows a null character is compared.
  - name: Less
    test-code: |
      ctx->compare = -1;
    text: |
      While the first character which differs in the first
      ${../if/strncmp:/params[2]/name} characters of the strings referenced by the
      ${../if/strncmp:/params[0]/name} and ${../if/strncmp:/params[1]/name}
      parameters, interpreted as unsigned char, is less in the string referenced by
      the ${../if/strncmp:/params[0]/name} parameter.
  - name: Greater
    test-code: |
      ctx->compare = 1;
    text: |
      While the first character which differs in the first
      ${../if/strncmp:/params[2]/name} characters of the strings referenced by the
      ${../if/strncmp:/params[0]/name} and ${../if/strncmp:/params[1]/name}
      parameters, interpreted as unsigned char, is greater in the string referenced
      by the ${../if/strncmp:/params[0]/name} parameter.
  test-epilogue: null
  test-prologue: null
- name: EqualCause
  states:
  - name: Exhausted
    test-code: |
      ctx->exhausted = true;
    text: |
      While the first character which differs in the strings referenced by the
      ${../if/strncmp:/params[0]/name} and ${../if/strncmp:/params[1]/name}
      parameters follows the first ${../if/strncmp:/params[2]/name} characters.
  - name: Terminated
    test-code: |
      ctx->exhausted = false;
    text: |
      While the strings referenced by the ${../if/strncmp:/params[0]/name} and
      ${../if/strncmp:/params[1]/name} parameters end with a null character in the
      first ${../if/strncmp:/params[2]/name} characters.
  test-epilogue: null
  test-prologue: null
- name: Difference
  states:
  - name: Character
    test-code: |
      ctx->terminator = false;
    text: |
      While the first character which differs in the strings is no terminating null
      character.
  - name: Terminator
    test-code: |
      ctx->terminator = true;
    text: |
      While the first character which differs in the strings is the terminating null
      character of one of the strings.
  test-epilogue: null
  test-prologue: null
- name: Position
  states:
  - name: First
    test-code: |
      ctx->position = 0;
    text: |
      While the comparison ends at the first character of the strings.
  - name: Later
    test-code: |
      ctx->position = 3;
    text: |
      While the comparison ends after the first character of the strings.
  test-epilogue: null
  test-prologue: null
rationale: |
  The implementation of the pre-qualified library returns zero for a count of
  zero. Otherwise, it compares the strings one character at a time. The loop ends
  at the end of either string, at the end of the count or at a differing
  character. Dimension EqualCause selects the end of the count and the end of
  both strings. Dimension Difference selects a differing character and the end of
  one string. Dimension Position decides whether the first character ends the
  comparison, since the compiler handles the first iteration of the loop apart.
  For a count of zero, the strings differ in the first character, so a comparison
  of this character would give a nonzero result. The differing characters are
  0x01 and 0x81, so a comparison of signed characters would give the opposite
  sign.
