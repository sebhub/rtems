enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/strcmp
- role: reference
  uid: /ref/std/posix-2024/strcmp
post-conditions:
- name: Result
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->retval, 0 );
    text: |
      The return value of ${../if/strcmp:/name} shall be equal to zero.
  - name: Negative
    test-code: |
      T_lt_int( ctx->retval, 0 );
    text: |
      The return value of ${../if/strcmp:/name} shall be less than zero.
  - name: Positive
    test-code: |
      T_gt_int( ctx->retval, 0 );
    text: |
      The return value of ${../if/strcmp:/name} shall be greater than zero.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Compare
  states:
  - name: Equal
    test-code: |
      ctx->compare = 0;
    text: |
      While the string referenced by the ${../if/strcmp:/params[0]/name} parameter is
      equal to the string referenced by the ${../if/strcmp:/params[1]/name}
      parameter.
  - name: Less
    test-code: |
      ctx->compare = -1;
    text: |
      While the first character which differs in the strings referenced by the
      ${../if/strcmp:/params[0]/name} and ${../if/strcmp:/params[1]/name} parameters,
      interpreted as unsigned char, is less in the string referenced by the
      ${../if/strcmp:/params[0]/name} parameter.
  - name: Greater
    test-code: |
      ctx->compare = 1;
    text: |
      While the first character which differs in the strings referenced by the
      ${../if/strcmp:/params[0]/name} and ${../if/strcmp:/params[1]/name} parameters,
      interpreted as unsigned char, is greater in the string referenced by the
      ${../if/strcmp:/params[0]/name} parameter.
  test-epilogue: null
  test-prologue: null
- name: Difference
  states:
  - name: Character
    test-code: |
      ctx->terminator = false;
    text: |
      While the first character which differs in the strings is no terminating null
      character.
  - name: Terminator
    test-code: |
      ctx->terminator = true;
    text: |
      While the first character which differs in the strings is the terminating null
      character of one of the strings.
  test-epilogue: null
  test-prologue: null
- name: Position
  states:
  - name: First
    test-code: |
      ctx->position = 0;
    text: |
      While the comparison ends at the first character of the strings.
  - name: Later
    test-code: |
      ctx->position = 3;
    text: |
      While the comparison ends after the first character of the strings.
  test-epilogue: null
  test-prologue: null
rationale: |
  The implementation of the pre-qualified library compares the strings one
  character at a time until the characters differ or both strings end. Dimension
  Difference decides whether a character or the end of the shorter string ends
  the comparison. Dimension Position decides whether the first character ends the
  comparison, since the compiler handles the first iteration of the loop apart.
  The differing characters are 0x01 and 0x81, so a comparison of signed
  characters would give the opposite sign.
