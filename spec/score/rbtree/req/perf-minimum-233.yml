rationale: |
  The thread queues and the schedulers get the minimum node of red-black trees.
references: []
requirement-type: non-functional
test-body:
  brief: |
    Get the minimum node of each tree.
  code: |
    MinimumAll( ctx );
  description: null
test-cleanup: null
test-prepare:
  brief: |
    Prepare each tree with 233 nodes.
  code: |
    PrepareTree( ctx, 233, false );
  description: null
test-setup: null
test-teardown:
  brief: |
    Discard samples interrupted by a clock tick.
  code: |
    return tic == toc;
  description: null
text: |
  While the execution environment is ${.:/environment}, while each of
  ${../val/perf:/params/tree-count} red-black trees has exactly 233 nodes, while
  the measurement sample is the runtime of a search of the node with the minimum
  key in each of these trees, when exactly ${../val/perf:/params/sample-count}
  samples are collected, the ${.:/limit-kind} shall be ${.:/limit-condition}.
type: requirement
