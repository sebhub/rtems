enabled-by: RTEMS_SMP
links:
- role: requirement-refinement
  uid: perf-runtime
- role: runtime-measurement-request
  uid: ../val/perf
non-functional-type: performance-runtime
params: {}
rationale: |
  The thread queues replace nodes of red-black trees.
references: []
requirement-type: non-functional
test-body:
  brief: |
    Replace the node in each tree.
  code: |
    ReplaceAll( ctx, true );
  description: null
test-cleanup: null
test-prepare:
  brief: |
    Prepare each tree with 233 nodes.
  code: |
    PrepareTree( ctx, 233, false );
  description: null
test-setup:
  brief: |
    Select the node to replace in each tree.
  code: |
    SetupReplace( ctx );
  description: null
test-teardown:
  brief: |
    Replace the spare node by the node in each tree. Discard samples interrupted by
    a clock tick.
  code: |
    ReplaceAll( ctx, false );

    return tic == toc;
  description: null
text: |
  While the execution environment is ${.:/environment}, while each of
  ${../val/perf:/params/tree-count} red-black trees has exactly 233 nodes, while
  the measurement sample is the runtime of a replace of a node at a pseudo-random
  position in each of these trees, when exactly
  ${../val/perf:/params/sample-count} samples are collected, the ${.:/limit-kind}
  shall be ${.:/limit-condition}.
type: requirement
