enabled-by: true
links:
- role: requirement-refinement
  uid: perf-runtime
- role: runtime-measurement-request
  uid: ../val/perf
non-functional-type: performance-runtime
params: {}
rationale: |
  The thread queues, the schedulers and the watchdogs extract nodes from
  red-black trees.
references: []
requirement-type: non-functional
test-body:
  brief: |
    Extract the node from each tree.
  code: |
    ExtractAll( ctx );
  description: null
test-cleanup: null
test-prepare:
  brief: |
    Prepare each tree with 3 nodes.
  code: |
    PrepareTree( ctx, 3, false );
  description: null
test-setup:
  brief: |
    Select the node to extract in each tree.
  code: |
    SetupMinimumNode( ctx );
  description: null
test-teardown:
  brief: |
    Insert the nodes again. Discard samples interrupted by a clock tick.
  code: |
    InsertAll( ctx );

    return tic == toc;
  description: null
text: |
  While the execution environment is ${.:/environment}, while each of
  ${../val/perf:/params/tree-count} red-black trees has exactly 3 nodes, while
  the measurement sample is the runtime of an extract of the node with the
  minimum key in each of these trees, when exactly
  ${../val/perf:/params/sample-count} samples are collected, the ${.:/limit-kind}
  shall be ${.:/limit-condition}.
type: requirement
