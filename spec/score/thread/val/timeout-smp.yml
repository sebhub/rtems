enabled-by: RTEMS_SMP
links: []
test-actions:
- action-brief: |
    End the wait of a worker on the second processor while the timeout of that wait
    is in flight. Let the worker begin a second wait before the timeout carries on.
  action-code: |
    ArmOnFirstProcessor( ctx );
    SetFlag( &ctx->window_reached, 0 );
    SetFlag( &ctx->window_timed_out, 0 );
    SetFlag( &ctx->arm, 1 );

    FinalClockTick();
  checks:
  - brief: |
      Check that the timeout reached the window of the test.
    code: |
      T_true( GetFlag( &ctx->window_reached ) != 0 );
    links: []
  - brief: |
      Check that no wait of the window reached its bound.
    code: |
      T_false( GetFlag( &ctx->window_timed_out ) != 0 );
    links: []
  - brief: |
      Check that the event and not the timeout ended the first wait of the worker.
    code: |
      T_rsc_success( ctx->first_wait_status );
    links: []
  - brief: |
      Check that the timeout of the wait which ended does not end the second wait of
      the worker.
    code: |
      T_true( WaitsForEvent( ctx ) );
    links:
    - role: validation
      uid: ../req/stale-timeout
  links: []
test-brief: |
  Tests that a timeout of a wait which ended ends no other wait of the thread.
