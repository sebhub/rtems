enabled-by: RTEMS_SMP
links: []
test-actions:
- action-brief: |
    Validate a set affinity error case with an unsupported subset. This requires an
    affinity set with at least two processors. On a system with exactly two
    processors, this is the set of all online processors and the unsupported subset
    is infeasible since the scheduler would select an affinity to all processors.
    In this case, fake the set of online processors. On systems with three or more
    processors, unsupported subsets are possible to construct.
  action-code: |
    rtems_status_code sc;
    cpu_set_t         affinity;

    CPU_ZERO( &affinity );
    CPU_SET( 0, &affinity );
    CPU_SET( 1, &affinity );

    RemoveProcessor( SCHEDULER_B_ID, 1 );
    AddProcessor( SCHEDULER_A_ID, 1 );

    if ( rtems_scheduler_get_processor_maximum() < 3 ) {
      _Processor_mask_Set( &_SMP_Online_processors, 2 );
    }

    sc = rtems_task_set_affinity( RTEMS_SELF, sizeof( affinity ), &affinity );
    T_rsc( sc, RTEMS_INVALID_NUMBER );

    if ( rtems_scheduler_get_processor_maximum() < 3 ) {
      _Processor_mask_Clear( &_SMP_Online_processors, 2 );
    }

    RemoveProcessor( SCHEDULER_A_ID, 1 );
    AddProcessor( SCHEDULER_B_ID, 1 );
  checks: []
  links:
  - role: validation
    uid: ../req/set-affinity-unsupported-subset
- action-brief: |
    Start a rate monotonic period for the executing task. The period releases a job
    with a deadline. Get the current priority of the task with respect to the EDF
    SMP scheduler.
  action-code: |
    rtems_status_code   sc;
    rtems_id            period_id;
    rtems_task_priority priority;

    sc = rtems_rate_monotonic_create( OBJECT_NAME, &period_id );
    T_rsc_success( sc );

    sc = rtems_rate_monotonic_period( period_id, 2 );
    T_rsc_success( sc );

    priority = PRIO_INVALID;
    sc = rtems_task_get_priority( RTEMS_SELF, SCHEDULER_A_ID, &priority );
  checks:
  - brief: |
      Check that the current priority of the task is zero.
    code: |
      T_rsc_success( sc );
      T_eq_u32( priority, 0 );
    links:
    - role: validation
      uid: ../req/deadline-priority
  - brief: |
      Delete the period.
    code: |
      sc = rtems_rate_monotonic_delete( period_id );
      T_rsc_success( sc );
    links: []
  links: []
