requirement-type: functional
text: |
  While a thread is registered for help in its ${/glossary/scheduler-home:/term},
  while the thread is scheduled by another scheduler, while the thread is not
  sticky, when the home scheduler tries to schedule the thread, the thread shall
  be blocked with respect to the home scheduler.
type: requirement
