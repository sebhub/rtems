enabled-by: RTEMS_SMP
links: []
test-actions:
- action-brief: |
    Issue two jobs on the current processor with interrupts disabled. Wait for
    completion of the second job.
  action-code: |
    rtems_interrupt_level level;
    Per_CPU_Control      *cpu;

    rtems_interrupt_local_disable( level );
    cpu = _Per_CPU_Get();
    _Per_CPU_Add_job( cpu, &job_0 );
    _Per_CPU_Submit_job( cpu, &job_1 );
    rtems_interrupt_local_enable( level );

    _Per_CPU_Wait_for_job( cpu, &job_1 );
  checks:
  - brief: |
      Check that the first job was processed firstly.
    code: |
      T_step_eq_int( ${.:/step}, counter_0, 1 );
    links:
    - role: validation
      uid: ../req/per-cpu-jobs-order
  - brief: |
      Check that the second job was processed secondly.
    code: |
      T_step_eq_int( ${.:/step}, counter_1, 2 );
    links:
    - role: validation
      uid: ../req/per-cpu-jobs-order
  links: []
- action-brief: |
    Actions were performed by
    \_\_wrap\_\_SMP_Start_multitasking_on_secondary_processor().
  action-code: |
    /* Nothing to do */
  checks:
  - brief: |
      Check that the unicast action was performed while the worker processor is in
      the initial state. Check that the counter was incremented at least once by the
      boot processor while it is waiting for the other online processors to get ready
      for start multiprocessing.
    code: |
      T_step_eq_int( ${.:/step}, worker_state, PER_CPU_STATE_INITIAL );
      T_step_gt_uint(
        ${.:/step},
        _Atomic_Fetch_add_uint( &boot_counter, 0, ATOMIC_ORDER_RELAXED ),
        0
      );
    links:
    - role: validation
      uid: ../req/per-cpu-jobs-request-start-multitasking
  links: []
test-brief: |
  Tests the processing order of per-processor jobs.
