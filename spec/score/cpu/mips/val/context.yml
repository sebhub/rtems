test-brief: |
  Checks that the context switch saves and restores every call-saved register.
test-context: []
test-context-support: null
test-description: |
  The action calls the switch directly. A call through the operating system runs
  a chain of functions. A function of the chain can preserve a register on its
  own stack. This hides a defect of the switch in that register.

  The set of a ${/score/cpu/mips/glossary/call-saved-register:/term} holds 11
  registers and the action covers 10 of them. It loads a pattern into 16 to 23.
  For 30 it reads the value of the caller, because the compiler can hold a frame
  of its own in that register. A requirement of its own covers 29.

  No check covers 28. One value of the global pointer serves the whole program of
  this port. The size criterion of the small data area is zero, so the area is
  empty. A switch of the register would therefore observe nothing.

  The action reads the registers of its checks out of the exception frame, so
  each check also observes the save of the exception path.
