test-brief: |
  Checks that the exception resume restores the registers of the exception frame.
test-context: []
test-context-support: null
test-description: |
  The frame holds 64 registers which the interrupted context owns, and the action
  checks all 64. It writes no pattern into the stack pointer, which the resume
  computes from the address of the frame. It writes none into 26 and 27, which
  carry the state of the resume. It writes none into 0, which reads as zero. The
  cause and the bad virtual address report why the exception happened, and no
  write of the processor accepts them.
test-header: null
test-includes:
- rtems/score/cpuimpl.h
- rtems/score/percpu.h
- rtems/score/thread.h
- string.h
- stdint.h
test-local-includes:
- tx-support.h
test-setup: null
test-stop: null
test-support: |
  extern const char resume_trap1_label[];

  extern const char resume_trap2_label[];

  extern const char resume_done_label[];

  static CPU_Exception_frame resume_before;

  static CPU_Exception_frame resume_after;

  /* The address of the frame of each trap, which the handler receives. */
  static const CPU_Exception_frame *resume_frame[ 2 ];

  static int resume_trap;

  /*
   * The global pointer of the C code.  The resume installs a pattern in it,
   * so the stub between the two traps puts the true value back.  The first
   * word takes the pattern, the second holds the true value and the third
   * holds the value which $t0 carries into the second trap.
   */
  uint32_t resume_probe[ 3 ];

  /*
   * The rounding mode of the control and status register of coprocessor 1.
   * The value rounds toward minus infinity, which no other part of the test
   * selects.  The flush to zero flag keeps the setting of the port.
   */
  #define RESUME_FCSR 0x01000003

  void ResumeRun( void );

  /*
   * The two traps sit next to each other.  The compiler addresses a small
   * data object relative to the global pointer, so the C code of the handler
   * needs the true value of that register.
   */
  __asm__ (
    "  .text\n"
    "  .align 2\n"
    "  .globl ResumeRun\n"
    "  .set noreorder\n"
    "ResumeRun:\n"
    "  addiu $sp, $sp, -16\n"
    "  sw $ra, 8($sp)\n"
    "  .globl resume_trap1_label\n"
    "resume_trap1_label:\n"
    "  .word -1\n"
    "  .globl resume_trap2_label\n"
    "resume_trap2_label:\n"
    "  la $t0, resume_probe\n"
    "  sw $gp, 0($t0)\n"
    "  lw $gp, 4($t0)\n"
    "  lw $t0, 8($t0)\n"
    "  .word -1\n"
    "  .globl resume_done_label\n"
    "resume_done_label:\n"
    "  lw $ra, 8($sp)\n"
    "  jr $ra\n"
    "  addiu $sp, $sp, 16\n"
    "  .set reorder\n"
  );

  /*
   * The handler writes a new value into every register of the frame, then
   * resumes.  The second trap captures what the resume restored.
   */
  static void ResumeFatal(
    rtems_fatal_source source,
    rtems_fatal_code   code,
    void              *arg
  )
  {
    CPU_Exception_frame *frame;

    (void) arg;

    if ( source != RTEMS_FATAL_SOURCE_EXCEPTION ) {
      return;
    }

    frame = (CPU_Exception_frame *) code;
    ++resume_trap;
    resume_frame[ resume_trap - 1 ] = frame;

    if ( resume_trap == 1 ) {
      resume_before = *frame;

      frame->s0 = 0x41424344;
      frame->s1 = 0x42434445;
      frame->s2 = 0x43444546;
      frame->s3 = 0x44454647;
      frame->s4 = 0x45464748;
      frame->s5 = 0x46474849;
      frame->s6 = 0x4748494a;
      frame->s7 = 0x48494a4b;
      frame->at = 0x51525354;
      frame->v0 = 0x52535455;
      frame->v1 = 0x53545556;
      frame->a0 = 0x54555657;
      frame->a1 = 0x55565758;
      frame->a2 = 0x56575859;
      frame->a3 = 0x5758595a;
      frame->t0 = 0x58595a5b;
      frame->t1 = 0x595a5b5c;
      frame->t2 = 0x5a5b5c5d;
      frame->t3 = 0x5b5c5d5e;
      frame->t4 = 0x5c5d5e5f;
      frame->t5 = 0x5d5e5f60;
      frame->t6 = 0x5e5f6061;
      frame->t7 = 0x5f606162;
      frame->t8 = 0x60616263;
      frame->t9 = 0x61626364;
      frame->fp = 0x62636465;
      frame->ra = 0x63646566;
      frame->gp = 0x64656667;
      frame->mdlo = 0x71727374;
