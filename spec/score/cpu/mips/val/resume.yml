    Trap. Let the handler write a new value into every
    ${/score/cpu/mips/glossary/user-visible-register:/term} and every
    ${/score/cpu/mips/glossary/user-visible-floating-point-register:/term} of the
    frame. Resume, and trap again to capture what the resume restored.
  action-code: |
    const CPU_Exception_frame *after;

    after = ResumeRunTwoTraps();
