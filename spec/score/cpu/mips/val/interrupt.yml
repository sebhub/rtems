  /*
   * The handler writes zero into each call-used register.  An interrupt
   * wrapper which fails to restore one of them then shows that value.
   */
  static void InterruptHandler( void *arg )
  {
    (void) arg;
    ++interrupt_count;
    __asm__ volatile( "  .set push\n"
                      "  .set noat\n"
                      "  move $1, $0\n"
                      "  .set pop\n"
                      "  move $2, $0\n"
                      "  move $3, $0\n"
                      "  move $4, $0\n"
                      "  move $5, $0\n"
                      "  move $6, $0\n"
                      "  move $7, $0\n"
                      "  move $8, $0\n"
                      "  move $9, $0\n"
                      "  move $10, $0\n"
                      "  move $11, $0\n"
                      "  move $12, $0\n"
                      "  move $13, $0\n"
                      "  move $14, $0\n"
                      "  move $15, $0\n"
                      "  move $24, $0\n"
                      "  move $25, $0\n"
                      "  mtlo $0\n"
                      "  mthi $0\n"
  #if MIPS_HAS_FPU == 1
                      "  mtc1 $0, $f0\n"
                      "  mtc1 $0, $f1\n"
                      "  mtc1 $0, $f2\n"
                      "  mtc1 $0, $f3\n"
                      "  mtc1 $0, $f4\n"
