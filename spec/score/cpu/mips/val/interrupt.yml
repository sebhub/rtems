test-brief: |
  Checks that interrupt processing preserves the registers of the interrupted
  context.
test-context: []
test-context-support: null
test-description: |
  The action needs a BSP which supplies the TM27 support. A BSP without it raises
  no interrupt.

  The action reads every register of its checks out of the exception frame, so
  each check also observes the save of the exception path. The set of a
  ${/score/cpu/mips/glossary/wrapper-private-register:/term} is empty on this
  architecture, so no check covers one.
test-header: null
test-includes:
- rtems.h
- rtems/score/cpuimpl.h
- rtems/score/mips.h
- stdint.h
test-local-includes:
- tx-support.h
test-setup: null
test-stop: null
test-support: |
  #define _RTEMS_TMTEST27
  #include <tm27.h>

  extern const char interrupt_done_label[];

  static CPU_Exception_frame interrupt_frame;

  volatile int interrupt_count;

  uint32_t interrupt_saved_fp;

  static CallWithinISRRequest interrupt_request;

  static rtems_interrupt_level interrupt_level;

  /*
   * The rounding mode of the control and status register of coprocessor 1.
   * The value rounds toward minus infinity, which no other part of the test
   * selects.  The flush to zero flag keeps the setting of the port.
   */
  #define ISR_FCSR 0x01000003

  /*
   * The bit of the status register which carries the interrupt enable of the
   * interrupted context.  A MIPS I exception shifts the three-deep enable
   * stack of the register, so the previous bit holds the value.  A MIPS III
   * and a MIPS32 exception raise the exception level and leave the enable
   * alone.
   */
  #if __mips == 1
  #define ISR_SR_ENABLE SR_IEP
  #else
  #define ISR_SR_ENABLE SR_IE
  #endif

  #define ISR_LOAD \
    "li $2, 0x72737475\n" \
    "li $3, 0x73747576\n" \
    "li $4, 0x74757677\n" \
    "li $5, 0x75767778\n" \
    "li $6, 0x76777879\n" \
    "li $7, 0x7778797a\n" \
    "li $8, 0x78797a7b\n" \
    "li $9, 0x797a7b7c\n" \
    "li $10, 0x7a7b7c7d\n" \
    "li $11, 0x7b7c7d7e\n" \
    "li $12, 0x7c7d7e7f\n" \
    "li $13, 0x7d7e7f80\n" \
    "li $14, 0x7e7f8081\n" \
    "li $15, 0x7f808182\n" \
    "li $24, 0x80818283\n" \
    "li $25, 0x81828384\n" \
    "li $27, 0x82838485\n" \
    "mtlo $27\n" \
    "li $27, 0x83848586\n" \
    "mthi $27\n"

  /*
   * The frame pointer is call-saved.  The compiler may need it, so the block
   * saves it in memory and restores it after the trap.
   */
  #define ISR_SAVE_FP \
    "la $27, interrupt_saved_fp\n" \
    "sw $30, 0($27)\n"

  #define ISR_RESTORE_FP \
    "la $27, interrupt_saved_fp\n" \
    "lw $30, 0($27)\n"

  #define ISR_LOAD_SAVED \
    "li $16, 0x84858687\n" \
    "li $17, 0x85868788\n" \
    "li $18, 0x86878889\n" \
    "li $19, 0x8788898a\n" \
    "li $20, 0x88898a8b\n" \
    "li $21, 0x898a8b8c\n" \
    "li $22, 0x8a8b8c8d\n" \
    "li $23, 0x8b8c8d8e\n" \
    "li $30, 0x8c8d8e8f\n"

  #if MIPS_HAS_FPU == 1
  #define ISR_LOAD_FPU \
    "li $27, 0x91929394\n" "mtc1 $27, $f0\n" \
    "li $27, 0x91939495\n" "mtc1 $27, $f1\n" \
    "li $27, 0x91949596\n" "mtc1 $27, $f2\n" \
