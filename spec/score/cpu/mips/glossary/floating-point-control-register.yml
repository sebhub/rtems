term: MIPS floating-point control register
text: |
  The register which holds the floating-point environment. Coprocessor 1 provides
  one control and status register, fcr31. It holds the rounding mode, the trap
  enables and the sticky bits. The psABI fixes its initial value at every field
  zero and round to nearest.
