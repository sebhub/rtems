term: MIPS wrapper-private register
text: |
  A call-saved register which an interrupt or exception wrapper uses for its own
  bookkeeping. The set is empty on this architecture. \_ISR_Handler() carries its
  state in 26 and 27, which the psABI gives to the operating system and which no
  call of the ABI preserves.
