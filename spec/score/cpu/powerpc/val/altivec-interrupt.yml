    UINT64_C( 0xb1b2b3b441424344 ),
    UINT64_C( 0xb2b3b4b542434445 ),
    UINT64_C( 0xb3b4b5b643444546 ),
    UINT64_C( 0xb4b5b6b744454647 ),
