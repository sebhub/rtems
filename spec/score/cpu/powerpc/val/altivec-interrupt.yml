  static uint64_t altivec_interrupt_initial[ ISR_SOURCE_MAX ];

  /* The block loads each vector register from the row of its number. */
  uint64_t altivec_interrupt_vectors[ 32 ][ 2 ] RTEMS_ALIGNED( 16 );

  uint32_t altivec_interrupt_vscr_in[ 4 ] RTEMS_ALIGNED( 16 );

  uint32_t altivec_interrupt_vscr_out[ 4 ] RTEMS_ALIGNED( 16 );

  static void SetVector( int reg, uint64_t value )
  {
    altivec_interrupt_vectors[ reg ][ 0 ] = value;
    altivec_interrupt_vectors[ reg ][ 1 ] = value ^ LOW;
  }

  static uint32_t GetVSCR( void )
  {
    __asm__ volatile(
      "mfvscr 0\n"
      "stvx 0, 0, %0\n"
      :
      : "r"( altivec_interrupt_vscr_out )
      : "memory", "v0"
    );
    return altivec_interrupt_vscr_out[ 3 ];
  }

  /*
   * Records the high doubleword of a vector register in its slot and the low
   * doubleword in the slot which follows.
   */
  static void RecordVector(
    RegisterCheck *self,
    size_t         slot,
    const uint8_t *vector,
    uint64_t       expected
  )
  {
    uint64_t high;
    uint64_t low;

    memcpy( &high, vector, sizeof( high ) );
    memcpy( &low, vector + 8, sizeof( low ) );
    RegisterCheckRecord( self, slot, high, expected );
    RegisterCheckRecord( self, slot + 1, low ^ LOW, expected );
  }

  /*
   * The handler loads the value of a register exclusive-or this value.  It
   * differs from the pattern and from the inverted pattern of the register.
   */
  #define HANDLER UINT64_C( 0x00ff00ff00ff00ff )

  uint64_t altivec_interrupt_handler_vectors[ 20 ][ 2 ] RTEMS_ALIGNED( 16 );

  uint32_t altivec_interrupt_handler_vscr[ 4 ] RTEMS_ALIGNED( 16 ) = { 0, 0, 0, 1 };

  static CPU_Exception_frame altivec_interrupt_frame;

  static volatile uint32_t altivec_interrupt_count;

  static uint32_t altivec_interrupt_count_at_trap;

  static uint32_t altivec_interrupt_vscr;

  static CallWithinISRRequest altivec_interrupt_request;

  extern const char altivec_interrupt_done_label[];

  #define HANDLER_LOAD \
      "lis 12, altivec_interrupt_handler_vscr@ha\n" \
      "addi 12, 12, altivec_interrupt_handler_vscr@l\n" \
      "lvx 0, 0, 12\n" \
