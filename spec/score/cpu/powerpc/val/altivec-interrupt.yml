  /* These are NJ and SAT of VSCR. */
  #define VSCR_MASK UINT64_C( 0x00010001 )

  /*
   * These are the bits of VRSAVE for v0 to v19.  The bits for v20 to v31 stay
   * set, so the context switch saves these registers.
