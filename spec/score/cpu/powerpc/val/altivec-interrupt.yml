  /*
   * The handler overwrites each call-used vector register and VSCR, so an
   * interrupt which restores none of them fails the check.
   */
  static void AltivecInterruptHandler( void *arg )
  {
    (void) arg;
    ++altivec_interrupt_count;
    __asm__ volatile(
      HANDLER_LOAD
      :
      :
      : "memory", "r0", "r12",
        "v0", "v1", "v2", "v3", "v4", "v5", "v6", "v7", "v8", "v9", "v10",
        "v11", "v12", "v13", "v14", "v15", "v16", "v17", "v18", "v19", "vscr"
    );
  }

  static void AltivecInterruptFatal(
    rtems_fatal_source source,
    rtems_fatal_code   code,
    void              *arg
  )
  {
    CPU_Exception_frame *frame;

    (void) arg;

    if ( source != RTEMS_FATAL_SOURCE_EXCEPTION ) {
      return;
    }

    frame = (CPU_Exception_frame *) code;
    altivec_interrupt_frame = *frame;
    altivec_interrupt_count_at_trap = altivec_interrupt_count;
    SetFatalHandler( NULL, NULL );
    frame->VSCR = altivec_interrupt_vscr;
    frame->EXC_SRR0 = (uintptr_t) altivec_interrupt_done_label;
    _CPU_Exception_resume( frame );
  }

  /*
   * The interrupt is raised while it is masked, so no call happens after the
   * block loads the registers.  The block unmasks it.  The interrupt controller
   * delivers an IPI a few cycles later, so a run of no-operations follows.
   */
  static void AltivecInterruptRun( RegisterCheck *self, void *arg )
  {
    rtems_interrupt_level level;
    int                   i;

    (void) arg;

    for ( i = 0; i < 20; ++i ) {
      SetVector( i, altivec_interrupt_initial[ ISR_SOURCE_V0 + i ] );
      altivec_interrupt_handler_vectors[ i ][ 0 ] =
        altivec_interrupt_initial[ ISR_SOURCE_V0 + i ] ^ HANDLER;
      altivec_interrupt_handler_vectors[ i ][ 1 ] =
        altivec_interrupt_initial[ ISR_SOURCE_V0 + i ] ^ HANDLER ^ LOW;
    }

    altivec_interrupt_vscr_in[ 3 ] = (uint32_t) altivec_interrupt_initial[ ISR_SOURCE_VSCR ];
    memset( &altivec_interrupt_frame, 0, sizeof( altivec_interrupt_frame ) );
    altivec_interrupt_count = 0;
    altivec_interrupt_count_at_trap = 0;
    altivec_interrupt_vscr = GetVSCR();
    SetFatalHandler( AltivecInterruptFatal, NULL );
    rtems_interrupt_local_disable( level );
    CallWithinISRSubmit( &altivec_interrupt_request );
    __asm__ volatile(
      ISR_LOAD
      "wrteei 1\n"
      ".rept 256\n"
      "nop\n"
      ".endr\n"
      "trap\n"
      ".globl altivec_interrupt_done_label\n"
      "altivec_interrupt_done_label:\n"
      :
      :
      : "memory", "cr0", "cr1", "cr2", "cr3", "cr4", "cr5", "cr6", "cr7",
        "r0", "r3", "r4", "r5", "r6", "r7", "r8", "r9", "r10", "r11", "r12",
        "r14", "r15", "r16", "r17", "r18", "r19", "r20", "r21", "r22", "r23",
        "r24", "r25", "r26", "r27", "r28", "r29", "r30", "r31", "lr", "ctr",
        "xer",
        "v0", "v1", "v2", "v3", "v4", "v5", "v6", "v7", "v8", "v9", "v10",
        "v11", "v12", "v13", "v14", "v15", "v16", "v17", "v18", "v19",
        "vrsave", "vscr"
    );
    rtems_interrupt_local_enable( level );
    RecordVector(
      self,
      ISR_SLOT_V0_HI,
      altivec_interrupt_frame.V0,
      altivec_interrupt_patterns[ ISR_SOURCE_V0 ]
    );
    RecordVector(
      self,
      ISR_SLOT_V1_HI,
      altivec_interrupt_frame.V1,
      altivec_interrupt_patterns[ ISR_SOURCE_V1 ]
    );
    RecordVector(
      self,
      ISR_SLOT_V2_HI,
      altivec_interrupt_frame.V2,
      altivec_interrupt_patterns[ ISR_SOURCE_V2 ]
    );
    RecordVector(
      self,
      ISR_SLOT_V3_HI,
      altivec_interrupt_frame.V3,
      altivec_interrupt_patterns[ ISR_SOURCE_V3 ]
    );
    RecordVector(
      self,
      ISR_SLOT_V4_HI,
      altivec_interrupt_frame.V4,
      altivec_interrupt_patterns[ ISR_SOURCE_V4 ]
    );
    RecordVector(
      self,
      ISR_SLOT_V5_HI,
      altivec_interrupt_frame.V5,
      altivec_interrupt_patterns[ ISR_SOURCE_V5 ]
    );
    RecordVector(
      self,
      ISR_SLOT_V6_HI,
      altivec_interrupt_frame.V6,
      altivec_interrupt_patterns[ ISR_SOURCE_V6 ]
    );
    RecordVector(
      self,
      ISR_SLOT_V7_HI,
      altivec_interrupt_frame.V7,
      altivec_interrupt_patterns[ ISR_SOURCE_V7 ]
    );
    RecordVector(
      self,
      ISR_SLOT_V8_HI,
      altivec_interrupt_frame.V8,
      altivec_interrupt_patterns[ ISR_SOURCE_V8 ]
    );
    RecordVector(
      self,
      ISR_SLOT_V9_HI,
      altivec_interrupt_frame.V9,
      altivec_interrupt_patterns[ ISR_SOURCE_V9 ]
    );
    RecordVector(
      self,
      ISR_SLOT_V10_HI,
      altivec_interrupt_frame.V10,
      altivec_interrupt_patterns[ ISR_SOURCE_V10 ]
    );
    RecordVector(
      self,
      ISR_SLOT_V11_HI,
      altivec_interrupt_frame.V11,
      altivec_interrupt_patterns[ ISR_SOURCE_V11 ]
    );
    RecordVector(
      self,
      ISR_SLOT_V12_HI,
      altivec_interrupt_frame.V12,
      altivec_interrupt_patterns[ ISR_SOURCE_V12 ]
    );
    RecordVector(
      self,
      ISR_SLOT_V13_HI,
      altivec_interrupt_frame.V13,
      altivec_interrupt_patterns[ ISR_SOURCE_V13 ]
    );
    RecordVector(
      self,
      ISR_SLOT_V14_HI,
      altivec_interrupt_frame.V14,
      altivec_interrupt_patterns[ ISR_SOURCE_V14 ]
    );
    RecordVector(
      self,
      ISR_SLOT_V15_HI,
      altivec_interrupt_frame.V15,
      altivec_interrupt_patterns[ ISR_SOURCE_V15 ]
    );
    RecordVector(
      self,
      ISR_SLOT_V16_HI,
      altivec_interrupt_frame.V16,
      altivec_interrupt_patterns[ ISR_SOURCE_V16 ]
    );
    RecordVector(
      self,
      ISR_SLOT_V17_HI,
      altivec_interrupt_frame.V17,
      altivec_interrupt_patterns[ ISR_SOURCE_V17 ]
    );
    RecordVector(
      self,
      ISR_SLOT_V18_HI,
      altivec_interrupt_frame.V18,
      altivec_interrupt_patterns[ ISR_SOURCE_V18 ]
    );
    RecordVector(
      self,
      ISR_SLOT_V19_HI,
      altivec_interrupt_frame.V19,
      altivec_interrupt_patterns[ ISR_SOURCE_V19 ]
    );
    RegisterCheckRecord(
      self,
      ISR_SLOT_VSCR,
      altivec_interrupt_frame.VSCR & VSCR_MASK,
      altivec_interrupt_patterns[ ISR_SOURCE_VSCR ]
    );
    RegisterCheckRecord( self, ISR_SLOT_COUNT, altivec_interrupt_count_at_trap, 1 );
  }

  static RegisterCheck altivec_interrupt_check = {
    .sources = altivec_interrupt_sources,
    .source_count = ISR_SOURCE_MAX,
    .slots = altivec_interrupt_slots,
    .slot_count = ISR_SLOT_MAX,
    .initial = altivec_interrupt_initial,
    .run = AltivecInterruptRun
  };

  static void CheckSlot( IsrSlot slot )
  {
    RegisterCheckVerify( &altivec_interrupt_check, slot );
  }

  static void CheckVector( IsrSlot slot )
  {
    RegisterCheckVerify( &altivec_interrupt_check, slot );
    RegisterCheckVerify( &altivec_interrupt_check, slot + 1 );
  }
