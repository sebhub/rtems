test-actions:
- action-brief: |
    Load a distinct pattern into every call-used vector register and into VSCR, and
    mark every vector register in VRSAVE. Raise the interrupt. The handler
    overwrites each of these registers. Trap, so the frame captures every register.
    Run this once for each value with the pattern of that value inverted, then once
    unchanged.
  action-code: |
    #if defined( PPC_MULTILIB_ALTIVEC )
      memcpy(
        altivec_interrupt_initial,
        altivec_interrupt_patterns,
        sizeof( altivec_interrupt_initial )
      );
      altivec_interrupt_request.handler = AltivecInterruptHandler;
      altivec_interrupt_request.arg = NULL;
      RegisterCheckRun( &altivec_interrupt_check );
    #endif
  checks:
  - brief: |
      Check that the interrupt preserved the PowerPC vector register V0.
    code: |
      #if defined( PPC_MULTILIB_ALTIVEC )
        CheckVector( ISR_SLOT_V0_HI );
      #endif
    links:
    - role: validation
      uid: ../../req/isr-call-used-vector
