      "lfd 8, 64(3)\n" \
      "lfd 9, 72(3)\n" \
      "lfd 10, 80(3)\n" \
      "lfd 11, 88(3)\n" \
      "lfd 12, 96(3)\n" \
      "lfd 13, 104(3)\n" \
