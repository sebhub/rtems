test-actions:
- action-brief: |
    Trap, let the handler write a new value into v0 to v15 of the frame, resume,
    and trap again to capture what the resume restored. Run this once for each
    value with the value inverted, then once unchanged.
  action-code: |
    #if defined( PPC_MULTILIB_ALTIVEC )
      memcpy(
        altivec_resume_lo_initial,
        altivec_resume_lo_patterns,
        sizeof( altivec_resume_lo_initial )
      );
      RegisterCheckRun( &altivec_resume_lo_check );
    #endif
  checks:
  - brief: |
      Check that the resume restored the PowerPC vector register V0 of the frame.
    code: |
      #if defined( PPC_MULTILIB_ALTIVEC )
        CheckLoVector( LO_SLOT_V0_HI );
      #endif
    links:
    - role: validation
      uid: ../../req/resume-restore
  - brief: |
      Check that the resume restored the PowerPC vector register V1 of the frame.
    code: |
      #if defined( PPC_MULTILIB_ALTIVEC )
