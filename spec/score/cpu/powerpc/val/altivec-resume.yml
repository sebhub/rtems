  static const uint64_t altivec_resume_hi_patterns[ HI_SOURCE_MAX ] = {
    UINT64_C( 0xe1e2e3e451525354 ),
    UINT64_C( 0xe2e3e4e552535455 ),
    UINT64_C( 0xe3e4e5e653545556 ),
    UINT64_C( 0xe4e5e6e754555657 ),
    UINT64_C( 0xe5e6e7e855565758 ),
