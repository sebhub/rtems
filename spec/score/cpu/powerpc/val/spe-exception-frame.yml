test-actions:
- action-brief: |
    Load a distinct pattern into both halves of every register, into ACC and into
    SPEFSCR. Trap. Run this once for each value with the pattern of that value
    inverted, then once unchanged.
  action-code: |
    #if defined( __SPE__ )
      memcpy(
        spe_exception_initial,
        spe_exception_patterns,
        sizeof( spe_exception_initial )
      );
      RegisterCheckRun( &spe_exception_check );
    #endif
