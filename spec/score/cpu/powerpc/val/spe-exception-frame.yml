      spe_exception_patterns[ SOURCE_R14 ] & TOP
    );
    RegisterCheckRecord(
      self,
      SLOT_R15,
      spe_exception_frame.registers[ 15 ] & TOP,
      spe_exception_patterns[ SOURCE_R15 ] & TOP
    );
    RegisterCheckRecord(
