  static void SpeExceptionFatal(
    rtems_fatal_source source,
    rtems_fatal_code   code,
    void              *arg
  )
  {
    CPU_Exception_frame *frame;

    (void) arg;

    if ( source != RTEMS_FATAL_SOURCE_EXCEPTION ) {
      return;
    }

    frame = (CPU_Exception_frame *) code;
    spe_exception_frame = *frame;
    SetFatalHandler( NULL, NULL );
    frame->EXC_SPEFSCR = spe_exception_spefscr;
    frame->EXC_SRR0 = (uintptr_t) spe_exception_done_label;
    _CPU_Exception_resume( frame );
  }

  static void SpeExceptionRun( RegisterCheck *self, void *arg )
  {
    (void) arg;
    memset( &spe_exception_frame, 0, sizeof( spe_exception_frame ) );
    __asm__ volatile( "mfspr %0, 512" : "=r"( spe_exception_spefscr ) );
    SetFatalHandler( SpeExceptionFatal, NULL );
    __asm__ volatile(
      EXC_LOAD
      "trap\n"
      ".globl spe_exception_done_label\n"
      "spe_exception_done_label:\n"
      :
      :
      : "memory", "cr0", "cr1", "cr2", "cr3", "cr4", "cr5", "cr6", "cr7",
        "r0", "r3", "r4", "r5", "r6", "r7", "r8", "r9", "r10", "r11", "r12",
        "r14", "r15", "r16", "r17", "r18", "r19", "r20", "r21", "r22", "r23",
        "r24", "r25", "r26", "r27", "r28", "r29", "r30", "r31", "lr", "ctr",
        "xer"
    );
    RegisterCheckRecord(
      self,
      SLOT_R0,
      spe_exception_frame.registers[ 0 ] & TOP,
      spe_exception_patterns[ SOURCE_R0 ] & TOP
    );
    RegisterCheckRecord(
      self,
      SLOT_R3,
      spe_exception_frame.registers[ 3 ] & TOP,
      spe_exception_patterns[ SOURCE_R3 ] & TOP
    );
    RegisterCheckRecord(
      self,
      SLOT_R4,
      spe_exception_frame.registers[ 4 ] & TOP,
      spe_exception_patterns[ SOURCE_R4 ] & TOP
    );
    RegisterCheckRecord(
      self,
      SLOT_R5,
      spe_exception_frame.registers[ 5 ] & TOP,
      spe_exception_patterns[ SOURCE_R5 ] & TOP
    );
    RegisterCheckRecord(
      self,
      SLOT_R6,
      spe_exception_frame.registers[ 6 ] & TOP,
      spe_exception_patterns[ SOURCE_R6 ] & TOP
    );
    RegisterCheckRecord(
