  uint64_t spe_exception_initial[ SOURCE_MAX ] RTEMS_ALIGNED( 8 );

  static CPU_Exception_frame spe_exception_frame;

  static uint32_t spe_exception_spefscr;

  extern const char spe_exception_done_label[];

  #define EXC_LOAD \
      "lis 31, spe_exception_initial@ha\n" \
      "addi 31, 31, spe_exception_initial@l\n" \
      "lwz 0, 244(31)\n" \
      "mtspr 512, 0\n" \
      "evldd 0, 232(31)\n" \
      "evmra 0, 0\n" \
      "evldd 0, 0(31)\n" \
      "evldd 3, 8(31)\n" \
      "evldd 4, 16(31)\n" \
      "evldd 5, 24(31)\n" \
      "evldd 6, 32(31)\n" \
      "evldd 7, 40(31)\n" \
      "evldd 8, 48(31)\n" \
      "evldd 9, 56(31)\n" \
      "evldd 10, 64(31)\n" \
      "evldd 11, 72(31)\n" \
      "evldd 12, 80(31)\n" \
