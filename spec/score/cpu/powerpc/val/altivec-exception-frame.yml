  static void AltivecFrameFatal(
    rtems_fatal_source source,
    rtems_fatal_code   code,
    void              *arg
  )
  {
    CPU_Exception_frame *frame;

    (void) arg;

    if ( source != RTEMS_FATAL_SOURCE_EXCEPTION ) {
      return;
    }

    frame = (CPU_Exception_frame *) code;
    altivec_exception_frame = *frame;
    SetFatalHandler( NULL, NULL );
    frame->VSCR = altivec_exception_vscr;
    frame->VRSAVE = altivec_exception_vrsave;
    frame->EXC_SRR0 = (uintptr_t) altivec_exception_done;
    _CPU_Exception_resume( frame );
  }

  static void AltivecFramePrepare( void )
  {
    memset( &altivec_exception_frame, 0, sizeof( altivec_exception_frame ) );
    altivec_exception_vscr = GetVSCR();
    altivec_exception_vrsave = GetVRSAVE();
    SetFatalHandler( AltivecFrameFatal, NULL );
  }

