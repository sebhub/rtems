  static uint64_t altivec_exception_hi_initial[ HI_SOURCE_MAX ];

  /* The block loads each vector register from the row of its number. */
  uint64_t altivec_exception_vectors[ 32 ][ 2 ] RTEMS_ALIGNED( 16 );

  uint32_t altivec_exception_vscr_in[ 4 ] RTEMS_ALIGNED( 16 );

  uint32_t altivec_exception_vrsave_in;

  uint32_t altivec_exception_vscr_out[ 4 ] RTEMS_ALIGNED( 16 );

  static void SetVector( int reg, uint64_t value )
  {
    altivec_exception_vectors[ reg ][ 0 ] = value;
    altivec_exception_vectors[ reg ][ 1 ] = value ^ LOW;
  }

  static uint32_t GetVSCR( void )
  {
    __asm__ volatile(
      "mfvscr 0\n"
      "stvx 0, 0, %0\n"
      :
      : "r"( altivec_exception_vscr_out )
      : "memory", "v0"
    );
    return altivec_exception_vscr_out[ 3 ];
  }

  static uint32_t GetVRSAVE( void )
  {
    uint32_t value;

    __asm__ volatile( "mfvrsave %0" : "=r"( value ) );
    return value;
  }

  /*
   * Records the high doubleword of a vector register in its slot and the low
   * doubleword in the slot which follows.
   */
  static void RecordVector(
    RegisterCheck *self,
    size_t         slot,
    const uint8_t *vector,
    uint64_t       expected
  )
  {
    uint64_t high;
    uint64_t low;

    memcpy( &high, vector, sizeof( high ) );
    memcpy( &low, vector + 8, sizeof( low ) );
    RegisterCheckRecord( self, slot, high, expected );
    RegisterCheckRecord( self, slot + 1, low ^ LOW, expected );
  }

