test-actions:
- action-brief: |
    Load a distinct pattern into v0 to v15. Trap. Run this once for each value with
    the pattern of that value inverted, then once unchanged.
  action-code: |
    #if defined( PPC_MULTILIB_ALTIVEC )
      memcpy(
        altivec_exception_lo_initial,
        altivec_exception_lo_patterns,
        sizeof( altivec_exception_lo_initial )
      );
      RegisterCheckRun( &altivec_exception_lo_check );
    #endif
  checks:
  - brief: |
      Check that the exception frame holds the PowerPC vector register V0.
    code: |
      #if defined( PPC_MULTILIB_ALTIVEC )
        CheckLoVector( LO_SLOT_V0_HI );
      #endif
    links:
    - role: validation
      uid: ../../req/exc-vector-registers
