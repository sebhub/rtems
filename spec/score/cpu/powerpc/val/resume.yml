test-actions:
- action-brief: |
    Trap, let the handler write a new value into every register of the frame,
    resume, and trap again to capture what the resume restored. Run this once for
    each value with the value inverted, then once unchanged.
  action-code: |
    memcpy( resume_initial, resume_patterns, sizeof( resume_initial ) );
    RegisterCheckRun( &resume_check );
  checks:
