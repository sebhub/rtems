      resume_patterns[ SOURCE_R5 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_R6,
      (uint32_t) resume_frame.registers[ 6 ],
      resume_patterns[ SOURCE_R6 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_R7,
      (uint32_t) resume_frame.registers[ 7 ],
      resume_patterns[ SOURCE_R7 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_R8,
      (uint32_t) resume_frame.registers[ 8 ],
      resume_patterns[ SOURCE_R8 ]
    );
    RegisterCheckRecord(
