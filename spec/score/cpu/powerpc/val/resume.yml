  static uint64_t resume_initial[ SOURCE_MAX ];

  static CPU_Exception_frame resume_frame;

  static CPU_Exception_frame *resume_first_frame;

  static CPU_Exception_frame *resume_second_frame;

  static int resume_trap;

  static uintptr_t resume_sp_delta;

  static void ResumeFatal(
    rtems_fatal_source source,
    rtems_fatal_code   code,
    void              *arg
  )
  {
    CPU_Exception_frame *frame;

    (void) arg;

    if ( source != RTEMS_FATAL_SOURCE_EXCEPTION ) {
      return;
    }

    frame = (CPU_Exception_frame *) code;

    if ( resume_trap == 0 ) {
      ++resume_trap;
      resume_first_frame = frame;
      frame->registers[ 0 ] = (uint32_t) resume_initial[ SOURCE_R0 ];
      frame->registers[ 3 ] = (uint32_t) resume_initial[ SOURCE_R3 ];
      frame->registers[ 4 ] = (uint32_t) resume_initial[ SOURCE_R4 ];
      frame->registers[ 5 ] = (uint32_t) resume_initial[ SOURCE_R5 ];
      frame->registers[ 6 ] = (uint32_t) resume_initial[ SOURCE_R6 ];
      frame->registers[ 7 ] = (uint32_t) resume_initial[ SOURCE_R7 ];
      frame->registers[ 8 ] = (uint32_t) resume_initial[ SOURCE_R8 ];
      frame->registers[ 9 ] = (uint32_t) resume_initial[ SOURCE_R9 ];
      frame->registers[ 10 ] = (uint32_t) resume_initial[ SOURCE_R10 ];
      frame->registers[ 11 ] = (uint32_t) resume_initial[ SOURCE_R11 ];
      frame->registers[ 12 ] = (uint32_t) resume_initial[ SOURCE_R12 ];
      frame->registers[ 14 ] = (uint32_t) resume_initial[ SOURCE_R14 ];
      frame->registers[ 15 ] = (uint32_t) resume_initial[ SOURCE_R15 ];
      frame->registers[ 16 ] = (uint32_t) resume_initial[ SOURCE_R16 ];
      frame->registers[ 17 ] = (uint32_t) resume_initial[ SOURCE_R17 ];
      frame->registers[ 18 ] = (uint32_t) resume_initial[ SOURCE_R18 ];
      frame->registers[ 19 ] = (uint32_t) resume_initial[ SOURCE_R19 ];
      frame->registers[ 20 ] = (uint32_t) resume_initial[ SOURCE_R20 ];
      frame->registers[ 21 ] = (uint32_t) resume_initial[ SOURCE_R21 ];
      frame->registers[ 22 ] = (uint32_t) resume_initial[ SOURCE_R22 ];
      frame->registers[ 23 ] = (uint32_t) resume_initial[ SOURCE_R23 ];
      frame->registers[ 24 ] = (uint32_t) resume_initial[ SOURCE_R24 ];
      frame->registers[ 25 ] = (uint32_t) resume_initial[ SOURCE_R25 ];
      frame->registers[ 26 ] = (uint32_t) resume_initial[ SOURCE_R26 ];
      frame->registers[ 27 ] = (uint32_t) resume_initial[ SOURCE_R27 ];
      frame->registers[ 28 ] = (uint32_t) resume_initial[ SOURCE_R28 ];
      frame->registers[ 29 ] = (uint32_t) resume_initial[ SOURCE_R29 ];
      frame->registers[ 30 ] = (uint32_t) resume_initial[ SOURCE_R30 ];
      frame->registers[ 31 ] = (uint32_t) resume_initial[ SOURCE_R31 ];
      frame->EXC_CR = (uint32_t) resume_initial[ SOURCE_CR ];
      frame->EXC_XER = (uint32_t) resume_initial[ SOURCE_XER ];
      frame->EXC_CTR = (uint32_t) resume_initial[ SOURCE_CTR ];
      frame->EXC_LR = (uint32_t) resume_initial[ SOURCE_LR ];
      frame->EXC_SRR0 = (uintptr_t) resume_second_trap_label;
    } else {
      ++resume_trap;
      resume_second_frame = frame;
      resume_frame = *frame;
      SetFatalHandler( NULL, NULL );
      frame->EXC_SRR0 = (uintptr_t) resume_done_label;
    }

    _CPU_Exception_resume( frame );
  }

  static void ResumeRunOnce( void )
  {
    uintptr_t sp_before;
    uintptr_t sp_after;

    resume_trap = 0;
    resume_first_frame = NULL;
    resume_second_frame = NULL;
    memset( &resume_frame, 0, sizeof( resume_frame ) );
    SetFatalHandler( ResumeFatal, NULL );
    __asm__ volatile( "mr %0, 1" : "=r"( sp_before ) );

    /*
     * The block holds both traps, so the compiler keeps no value of its own in a
     * register which the first trap changes.
     */
    __asm__ volatile(
      "trap\n"
      ".globl resume_second_trap_label\n"
      "resume_second_trap_label:\n"
      "trap\n"
      ".globl resume_done_label\n"
      "resume_done_label:\n"
      :
      :
      : "memory", "cr0", "cr1", "cr2", "cr3", "cr4", "cr5", "cr6", "cr7",
        "r0", "r3", "r4", "r5", "r6", "r7", "r8", "r9", "r10", "r11", "r12",
        "r14", "r15", "r16", "r17", "r18", "r19", "r20", "r21", "r22", "r23",
        "r24", "r25", "r26", "r27", "r28", "r29", "r30", "r31", "lr", "ctr",
        "xer"
    );
    __asm__ volatile( "mr %0, 1" : "=r"( sp_after ) );
    resume_sp_delta = sp_after - sp_before;
  }

  static void ResumeRun( RegisterCheck *self, void *arg )
  {
    (void) arg;
    ResumeRunOnce();
    RegisterCheckRecord(
      self,
      SLOT_R0,
      (uint32_t) resume_frame.registers[ 0 ],
      resume_patterns[ SOURCE_R0 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_R3,
      (uint32_t) resume_frame.registers[ 3 ],
      resume_patterns[ SOURCE_R3 ]
    );
