  };

  static uint64_t fpu_resume_initial[ SOURCE_MAX ];

  static CPU_Exception_frame fpu_resume_frame;

  static int fpu_resume_trap;

  static uint64_t fpu_resume_fpscr;

  extern const char fpu_resume_second_trap_label[];

  extern const char fpu_resume_done_label[];

  static uint64_t Bits( double value )
  {
    uint64_t bits;

    memcpy( &bits, &value, sizeof( bits ) );
    return bits;
  }

  static uint64_t GetFPSCR( void )
  {
    double value;

    __asm__ volatile( "mffs %0" : "=f"( value ) );
    return Bits( value );
  }

  static double Value( uint64_t bits )
  {
    double value;

    memcpy( &value, &bits, sizeof( value ) );
    return value;
  }

  static void FpuResumeFatal(
    rtems_fatal_source source,
    rtems_fatal_code   code,
    void              *arg
  )
  {
    CPU_Exception_frame *frame;

    (void) arg;

    if ( source != RTEMS_FATAL_SOURCE_EXCEPTION ) {
      return;
    }

    frame = (CPU_Exception_frame *) code;

    if ( fpu_resume_trap == 0 ) {
      ++fpu_resume_trap;
      frame->F0 = Value( fpu_resume_initial[ SOURCE_F0 ] );
      frame->F1 = Value( fpu_resume_initial[ SOURCE_F1 ] );
      frame->F2 = Value( fpu_resume_initial[ SOURCE_F2 ] );
      frame->F3 = Value( fpu_resume_initial[ SOURCE_F3 ] );
      frame->F4 = Value( fpu_resume_initial[ SOURCE_F4 ] );
      frame->F5 = Value( fpu_resume_initial[ SOURCE_F5 ] );
      frame->F6 = Value( fpu_resume_initial[ SOURCE_F6 ] );
      frame->F7 = Value( fpu_resume_initial[ SOURCE_F7 ] );
      frame->F8 = Value( fpu_resume_initial[ SOURCE_F8 ] );
      frame->F9 = Value( fpu_resume_initial[ SOURCE_F9 ] );
      frame->F10 = Value( fpu_resume_initial[ SOURCE_F10 ] );
      frame->F11 = Value( fpu_resume_initial[ SOURCE_F11 ] );
      frame->F12 = Value( fpu_resume_initial[ SOURCE_F12 ] );
      frame->F13 = Value( fpu_resume_initial[ SOURCE_F13 ] );
      frame->F14 = Value( fpu_resume_initial[ SOURCE_F14 ] );
      frame->F15 = Value( fpu_resume_initial[ SOURCE_F15 ] );
      frame->F16 = Value( fpu_resume_initial[ SOURCE_F16 ] );
      frame->F17 = Value( fpu_resume_initial[ SOURCE_F17 ] );
      frame->F18 = Value( fpu_resume_initial[ SOURCE_F18 ] );
      frame->F19 = Value( fpu_resume_initial[ SOURCE_F19 ] );
      frame->F20 = Value( fpu_resume_initial[ SOURCE_F20 ] );
      frame->F21 = Value( fpu_resume_initial[ SOURCE_F21 ] );
      frame->F22 = Value( fpu_resume_initial[ SOURCE_F22 ] );
      frame->F23 = Value( fpu_resume_initial[ SOURCE_F23 ] );
      frame->F24 = Value( fpu_resume_initial[ SOURCE_F24 ] );
      frame->F25 = Value( fpu_resume_initial[ SOURCE_F25 ] );
      frame->F26 = Value( fpu_resume_initial[ SOURCE_F26 ] );
      frame->F27 = Value( fpu_resume_initial[ SOURCE_F27 ] );
      frame->F28 = Value( fpu_resume_initial[ SOURCE_F28 ] );
      frame->F29 = Value( fpu_resume_initial[ SOURCE_F29 ] );
      frame->F30 = Value( fpu_resume_initial[ SOURCE_F30 ] );
      frame->F31 = Value( fpu_resume_initial[ SOURCE_F31 ] );
      frame->FPSCR = fpu_resume_initial[ SOURCE_FPSCR ];
      frame->EXC_SRR0 = (uintptr_t) fpu_resume_second_trap_label;
    } else {
      ++fpu_resume_trap;
      fpu_resume_frame = *frame;
      SetFatalHandler( NULL, NULL );
      frame->FPSCR = fpu_resume_fpscr;
      frame->EXC_SRR0 = (uintptr_t) fpu_resume_done_label;
    }

    _CPU_Exception_resume( frame );
  }

  static void FpuResumeRun( RegisterCheck *self, void *arg )
  {
    (void) arg;
    fpu_resume_trap = 0;
    memset( &fpu_resume_frame, 0, sizeof( fpu_resume_frame ) );
    fpu_resume_fpscr = GetFPSCR();
    SetFatalHandler( FpuResumeFatal, NULL );

    /*
     * The block holds both traps, so the compiler keeps no value of its own in a
     * register which the first trap changes.
     */
    __asm__ volatile(
      "trap\n"
      ".globl fpu_resume_second_trap_label\n"
      "fpu_resume_second_trap_label:\n"
      "trap\n"
      ".globl fpu_resume_done_label\n"
      "fpu_resume_done_label:\n"
      :
      :
      : "memory", "cr0", "cr1", "cr2", "cr3", "cr4", "cr5", "cr6", "cr7",
