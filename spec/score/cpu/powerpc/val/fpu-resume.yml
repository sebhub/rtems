test-actions:
- action-brief: |
    Trap, let the handler write a new value into every floating-point register and
    into FPSCR of the frame, resume, and trap again to capture what the resume
    restored. Run this once for each value with the value inverted, then once
    unchanged.
  action-code: |
    #if defined( PPC_MULTILIB_FPU )
      memcpy(
        fpu_resume_initial,
        fpu_resume_patterns,
        sizeof( fpu_resume_initial )
      );
      RegisterCheckRun( &fpu_resume_check );
    #endif
  checks:
  - brief: |
      Check that the resume restored the PowerPC floating-point register F0 of the
      frame.
    code: |
      #if defined( PPC_MULTILIB_FPU )
        CheckSlot( SLOT_F0 );
      #endif
    links:
    - role: validation
      uid: ../../req/resume-restore
