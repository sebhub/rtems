test-actions:
- action-brief: |
    Load a distinct pattern into every call-used floating-point register and into
    FPSCR. Raise the interrupt. The handler overwrites each of these registers.
    Trap, so the frame captures every register. Run this once for each value with
    the pattern of that value inverted, then once unchanged.
  action-code: |
    #if defined( PPC_MULTILIB_FPU )
      memcpy(
        fpu_interrupt_initial,
        fpu_interrupt_patterns,
        sizeof( fpu_interrupt_initial )
      );
      fpu_interrupt_request.handler = FpuInterruptHandler;
      fpu_interrupt_request.arg = NULL;
      RegisterCheckRun( &fpu_interrupt_check );
    #endif
  checks:
  - brief: |
