  uint64_t exception_initial[ SOURCE_MAX ];

  static CPU_Exception_frame exception_frame;

  static rtems_fatal_source exception_source;

  static rtems_fatal_code exception_code;

  static uint32_t exception_msr_bits;

  /*
   * The block uses r31 as the address of the table and loads r31 last.  It
   * loads CR, XER, CTR and LR through r0 first.
   */
  #define EXC_LOAD \
      "lis 31, exception_initial@ha\n" \
      "addi 31, 31, exception_initial@l\n" \
      "lwz 0, 236(31)\n" \
      "mtcr 0\n" \
      "lwz 0, 244(31)\n" \
      "mtxer 0\n" \
      GPR_LOAD "0, 248+" GPR_OFFSET "(31)\n" \
      "mtctr 0\n" \
      GPR_LOAD "0, 256+" GPR_OFFSET "(31)\n" \
      "mtlr 0\n" \
      GPR_LOAD "0, 0+" GPR_OFFSET "(31)\n" \
      GPR_LOAD "3, 8+" GPR_OFFSET "(31)\n" \
      GPR_LOAD "4, 16+" GPR_OFFSET "(31)\n" \
      GPR_LOAD "5, 24+" GPR_OFFSET "(31)\n" \
      GPR_LOAD "6, 32+" GPR_OFFSET "(31)\n" \
      GPR_LOAD "7, 40+" GPR_OFFSET "(31)\n" \
      GPR_LOAD "8, 48+" GPR_OFFSET "(31)\n" \
      GPR_LOAD "9, 56+" GPR_OFFSET "(31)\n" \
      GPR_LOAD "10, 64+" GPR_OFFSET "(31)\n" \
      GPR_LOAD "11, 72+" GPR_OFFSET "(31)\n" \
      GPR_LOAD "12, 80+" GPR_OFFSET "(31)\n" \
      GPR_LOAD "14, 88+" GPR_OFFSET "(31)\n" \
      GPR_LOAD "15, 96+" GPR_OFFSET "(31)\n" \
      GPR_LOAD "16, 104+" GPR_OFFSET "(31)\n" \
      GPR_LOAD "17, 112+" GPR_OFFSET "(31)\n" \
      GPR_LOAD "18, 120+" GPR_OFFSET "(31)\n" \
      GPR_LOAD "19, 128+" GPR_OFFSET "(31)\n" \
      GPR_LOAD "20, 136+" GPR_OFFSET "(31)\n" \
      GPR_LOAD "21, 144+" GPR_OFFSET "(31)\n" \
      GPR_LOAD "22, 152+" GPR_OFFSET "(31)\n" \
      GPR_LOAD "23, 160+" GPR_OFFSET "(31)\n" \
      GPR_LOAD "24, 168+" GPR_OFFSET "(31)\n" \
      GPR_LOAD "25, 176+" GPR_OFFSET "(31)\n" \
      GPR_LOAD "26, 184+" GPR_OFFSET "(31)\n" \
      GPR_LOAD "27, 192+" GPR_OFFSET "(31)\n" \
      GPR_LOAD "28, 200+" GPR_OFFSET "(31)\n" \
      GPR_LOAD "29, 208+" GPR_OFFSET "(31)\n" \
      GPR_LOAD "30, 216+" GPR_OFFSET "(31)\n" \
      GPR_LOAD "31, 224+" GPR_OFFSET "(31)\n"

  static void ExceptionFatal(
    rtems_fatal_source source,
    rtems_fatal_code   code,
    void              *arg
  )
  {
    CPU_Exception_frame *frame;

    (void) arg;
    exception_source = source;
    exception_code = code;

    if ( source != RTEMS_FATAL_SOURCE_EXCEPTION ) {
      return;
    }

    frame = (CPU_Exception_frame *) code;
    exception_frame = *frame;
    SetFatalHandler( NULL, NULL );
    frame->EXC_SRR1 = ( frame->EXC_SRR1 & ~MSR_BITS ) | exception_msr_bits;
    frame->EXC_SRR0 = (uintptr_t) exception_done_label;
    _CPU_Exception_resume( frame );
  }

  static uintptr_t ExceptionRaise( void )
  {
    uintptr_t sp;
    uint32_t  msr;

    memset( &exception_frame, 0, sizeof( exception_frame ) );
    exception_source = 0;
    exception_code = 0;
    SetFatalHandler( ExceptionFatal, NULL );
    __asm__ volatile( "mfmsr %0" : "=r"( msr ) );
    exception_msr_bits = msr & MSR_BITS;
    msr = ( msr & ~MSR_BITS ) |
          ( (uint32_t) exception_initial[ SOURCE_MSR ] & MSR_BITS );
    __asm__ volatile( "mtmsr %0" : : "r"( msr ) );
    __asm__ volatile( "mr %0, 1" : "=r"( sp ) );
    __asm__ volatile(
      EXC_LOAD
      ".globl exception_trap_label\n"
      "exception_trap_label:\n"
      "trap\n"
      ".globl exception_done_label\n"
      "exception_done_label:\n"
      :
      :
      : "memory", "cr0", "cr1", "cr2", "cr3", "cr4", "cr5", "cr6", "cr7",
        "r0", "r3", "r4", "r5", "r6", "r7", "r8", "r9", "r10", "r11", "r12",
        "r14", "r15", "r16", "r17", "r18", "r19", "r20", "r21", "r22", "r23",
        "r24", "r25", "r26", "r27", "r28", "r29", "r30", "r31", "lr", "ctr",
        "xer"
    );

    return sp;
  }

  static void ExceptionRun( RegisterCheck *self, void *arg )
  {
    uintptr_t sp;

    (void) arg;
    sp = ExceptionRaise();
    RegisterCheckRecord(
      self,
      SLOT_R0,
      exception_frame.registers[ 0 ],
      exception_patterns[ SOURCE_R0 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_R3,
      exception_frame.registers[ 3 ],
      exception_patterns[ SOURCE_R3 ]
    );
