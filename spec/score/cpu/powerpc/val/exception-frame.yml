  uint64_t exception_initial[ SOURCE_MAX ];

  static CPU_Exception_frame exception_frame;

  static rtems_fatal_source exception_source;

  static rtems_fatal_code exception_code;

  /*
   * The block uses r31 as the address of the table and loads r31 last.  It
   * loads CR, XER, CTR and LR through r0 first.
   */
  #define EXC_LOAD \
      "lis 31, exception_initial@ha\n" \
      "addi 31, 31, exception_initial@l\n" \
      "lwz 0, 236(31)\n" \
      "mtcr 0\n" \
      "lwz 0, 244(31)\n" \
      "mtxer 0\n" \
      "lwz 0, 252(31)\n" \
      "mtctr 0\n" \
      "lwz 0, 260(31)\n" \
      "mtlr 0\n" \
      "lwz 0, 4(31)\n" \
      "lwz 3, 12(31)\n" \
      "lwz 4, 20(31)\n" \
      "lwz 5, 28(31)\n" \
      "lwz 6, 36(31)\n" \
      "lwz 7, 44(31)\n" \
      "lwz 8, 52(31)\n" \
      "lwz 9, 60(31)\n" \
      "lwz 10, 68(31)\n" \
      "lwz 11, 76(31)\n" \
      "lwz 12, 84(31)\n" \
      "lwz 14, 92(31)\n" \
      "lwz 15, 100(31)\n" \
      "lwz 16, 108(31)\n" \
      "lwz 17, 116(31)\n" \
      "lwz 18, 124(31)\n" \
      "lwz 19, 132(31)\n" \
      "lwz 20, 140(31)\n" \
      "lwz 21, 148(31)\n" \
      "lwz 22, 156(31)\n" \
      "lwz 23, 164(31)\n" \
      "lwz 24, 172(31)\n" \
      "lwz 25, 180(31)\n" \
      "lwz 26, 188(31)\n" \
      "lwz 27, 196(31)\n" \
      "lwz 28, 204(31)\n" \
      "lwz 29, 212(31)\n" \
      "lwz 30, 220(31)\n" \
      "lwz 31, 228(31)\n"

  static void ExceptionFatal(
    rtems_fatal_source source,
    rtems_fatal_code   code,
    void              *arg
  )
  {
    CPU_Exception_frame *frame;

    (void) arg;
    exception_source = source;
    exception_code = code;

    if ( source != RTEMS_FATAL_SOURCE_EXCEPTION ) {
      return;
    }

    frame = (CPU_Exception_frame *) code;
    exception_frame = *frame;
    SetFatalHandler( NULL, NULL );
    frame->EXC_SRR0 = (uintptr_t) exception_done_label;
    _CPU_Exception_resume( frame );
  }

  static uintptr_t ExceptionRaise( void )
  {
    uintptr_t sp;

    memset( &exception_frame, 0, sizeof( exception_frame ) );
    exception_source = 0;
    exception_code = 0;
    SetFatalHandler( ExceptionFatal, NULL );
    __asm__ volatile( "mr %0, 1" : "=r"( sp ) );
    __asm__ volatile(
      EXC_LOAD
      ".globl exception_trap_label\n"
      "exception_trap_label:\n"
      "trap\n"
      ".globl exception_done_label\n"
      "exception_done_label:\n"
      :
      :
      : "memory", "cr0", "cr1", "cr2", "cr3", "cr4", "cr5", "cr6", "cr7",
        "r0", "r3", "r4", "r5", "r6", "r7", "r8", "r9", "r10", "r11", "r12",
        "r14", "r15", "r16", "r17", "r18", "r19", "r20", "r21", "r22", "r23",
        "r24", "r25", "r26", "r27", "r28", "r29", "r30", "r31", "lr", "ctr",
        "xer"
    );

    return sp;
  }

  static void ExceptionRun( RegisterCheck *self, void *arg )
  {
    uintptr_t sp;

    (void) arg;
    sp = ExceptionRaise();
    RegisterCheckRecord(
      self,
      SLOT_R0,
      (uint32_t) exception_frame.registers[ 0 ],
      exception_patterns[ SOURCE_R0 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_R3,
      (uint32_t) exception_frame.registers[ 3 ],
      exception_patterns[ SOURCE_R3 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_R4,
      (uint32_t) exception_frame.registers[ 4 ],
      exception_patterns[ SOURCE_R4 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_R5,
      (uint32_t) exception_frame.registers[ 5 ],
      exception_patterns[ SOURCE_R5 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_R6,
      (uint32_t) exception_frame.registers[ 6 ],
      exception_patterns[ SOURCE_R6 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_R7,
