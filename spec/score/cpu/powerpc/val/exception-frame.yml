      exception_patterns[ SOURCE_R11 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_R12,
      (uint32_t) exception_frame.registers[ 12 ],
      exception_patterns[ SOURCE_R12 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_R14,
