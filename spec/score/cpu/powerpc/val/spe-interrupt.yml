test-actions:
- action-brief: |
    Load a distinct pattern into both halves of every register the interrupt has to
    preserve, into ACC and into SPEFSCR. Raise the interrupt. Trap, so the frame
    captures every register. Run this once for each value with the pattern of that
    value inverted, then once unchanged.
  action-code: |
    #if defined( __SPE__ )
      memcpy(
        spe_interrupt_initial,
        spe_interrupt_patterns,
        sizeof( spe_interrupt_initial )
      );
      spe_interrupt_request.handler = SpeInterruptHandler;
      spe_interrupt_request.arg = NULL;
      RegisterCheckRun( &spe_interrupt_check );
    #endif
  checks:
  - brief: |
      Check that the interrupt preserved the top 32 bits of the PowerPC register R0.
    code: |
      #if defined( __SPE__ )
        CheckSlot( SLOT_R0 );
      #endif
    links:
    - role: validation
      uid: ../../req/isr-call-used-floating-point
