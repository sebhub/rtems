test-actions:
- action-brief: |
    Load a distinct pattern into every register the interrupt has to preserve.
    Raise the interrupt. Trap, so the frame captures every register. Run this once
    for each register with the pattern of that register inverted, then once
    unchanged.
  action-code: |
    memcpy( interrupt_initial, interrupt_patterns, sizeof( interrupt_initial ) );
    interrupt_request.handler = InterruptHandler;
    interrupt_request.arg = NULL;
    RegisterCheckRun( &interrupt_check );
  checks:
  - brief: |
      Check that the interrupt preserved the bottom 32 bits of the PowerPC call-used
      register R0.
    code: |
      CheckSlot( SLOT_R0 );
    links:
    - role: validation
      uid: ../../req/isr-call-used
  - brief: |
      Check that the interrupt preserved the bottom 32 bits of the PowerPC call-used
      register R3.
    code: |
      CheckSlot( SLOT_R3 );
    links:
    - role: validation
      uid: ../../req/isr-call-used
  - brief: |
      Check that the interrupt preserved the bottom 32 bits of the PowerPC call-used
      register R4.
    code: |
      CheckSlot( SLOT_R4 );
    links:
    - role: validation
      uid: ../../req/isr-call-used
  - brief: |
      Check that the interrupt preserved the bottom 32 bits of the PowerPC call-used
      register R5.
    code: |
      CheckSlot( SLOT_R5 );
    links:
    - role: validation
      uid: ../../req/isr-call-used
  - brief: |
      Check that the interrupt preserved the bottom 32 bits of the PowerPC call-used
      register R6.
    code: |
      CheckSlot( SLOT_R6 );
    links:
    - role: validation
      uid: ../../req/isr-call-used
  - brief: |
      Check that the interrupt preserved the bottom 32 bits of the PowerPC call-used
      register R7.
    code: |
      CheckSlot( SLOT_R7 );
    links:
    - role: validation
      uid: ../../req/isr-call-used
  - brief: |
      Check that the interrupt preserved the bottom 32 bits of the PowerPC call-used
      register R8.
    code: |
      CheckSlot( SLOT_R8 );
    links:
    - role: validation
      uid: ../../req/isr-call-used
  - brief: |
      Check that the interrupt preserved the bottom 32 bits of the PowerPC call-used
      register R9.
    code: |
      CheckSlot( SLOT_R9 );
    links:
    - role: validation
      uid: ../../req/isr-call-used
  - brief: |
      Check that the interrupt preserved the bottom 32 bits of the PowerPC call-used
      register R10.
    code: |
      CheckSlot( SLOT_R10 );
    links:
    - role: validation
      uid: ../../req/isr-call-used
  - brief: |
      Check that the interrupt preserved the bottom 32 bits of the PowerPC call-used
      register R11.
    code: |
