  static const uint64_t interrupt_patterns[ SOURCE_MAX ] = {
    UINT64_C( 0x9f8f7f6f01020304 ),
    UINT64_C( 0x8f9f6f7f11121314 ),
    UINT64_C( 0xbfaf5f4f21222324 ),
    UINT64_C( 0xafbf4f5f31323334 ),
    UINT64_C( 0xdfcf3f2f41424344 ),
    UINT64_C( 0xcfdf2f3f51525354 ),
    UINT64_C( 0xffef1f0f61626364 ),
    UINT64_C( 0xefff0f1f71727374 ),
    UINT64_C( 0x1f0fffef81828384 ),
    UINT64_C( 0x0f1fefff91929394 ),
    UINT64_C( 0x3f2fdfcfa1a2a3a4 ),
    UINT64_C( 0x2f3fcfdfb1b2b3b4 ),
    UINT64_C( 0x5a5a5a5a ),
    UINT64_C( 0x40000015 ),
