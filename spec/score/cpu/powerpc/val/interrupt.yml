    code: |
      CheckSlot( SLOT_R14 );
    links:
    - role: validation
      uid: ../req/isr-wrapper-private-set
  - brief: |
      Check that the interrupt preserved the bottom 32 bits of the PowerPC call-used
      register R12.
    code: |
      CheckSlot( SLOT_R12 );
    links:
    - role: validation
      uid: ../../req/isr-call-used
  - brief: |
      Check that the interrupt preserved CR.
    code: |
      CheckSlot( SLOT_CR );
    links:
    - role: validation
      uid: ../../req/isr-status
  - brief: |
      Check that the interrupt preserved XER.
    code: |
      CheckSlot( SLOT_XER );
    links:
    - role: validation
      uid: ../../req/isr-status
  - brief: |
