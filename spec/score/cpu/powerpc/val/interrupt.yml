  uint64_t interrupt_initial[ SOURCE_MAX ];

  static CPU_Exception_frame interrupt_frame;

  static volatile uint32_t interrupt_count;

  static uint32_t interrupt_count_at_trap;

  static CallWithinISRRequest interrupt_request;

  uint64_t interrupt_handler_values[ SOURCE_MAX ];

  static uint32_t interrupt_msr_bits;

  /*
   * The block uses r12 as the address of the table and loads r12 last.  It
   * loads CR, XER, CTR and LR through r0 first.
   */
  #define ISR_LOAD \
      "lis 12, interrupt_initial@ha\n" \
      "addi 12, 12, interrupt_initial@l\n" \
      "lwz 0, 100(12)\n" \
      "mtcr 0\n" \
      "lwz 0, 108(12)\n" \
      "mtxer 0\n" \
      GPR_LOAD "0, 112+" GPR_OFFSET "(12)\n" \
      "mtctr 0\n" \
      GPR_LOAD "0, 120+" GPR_OFFSET "(12)\n" \
      "mtlr 0\n" \
      GPR_LOAD "0, 0+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "3, 8+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "4, 16+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "5, 24+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "6, 32+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "7, 40+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "8, 48+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "9, 56+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "10, 64+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "11, 72+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "14, 80+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "15, 136+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "16, 144+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "17, 152+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "18, 160+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "19, 168+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "20, 176+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "21, 184+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "22, 192+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "23, 200+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "24, 208+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "25, 216+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "26, 224+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "27, 232+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "28, 240+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "29, 248+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "30, 256+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "31, 264+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "12, 88+" GPR_OFFSET "(12)\n"

  /*
   * The block uses r12 as the address of the table and loads r12 last.  It
   * loads CR, XER, CTR and LR through r0 first.
   */
  #define HANDLER_LOAD \
      "lis 12, interrupt_handler_values@ha\n" \
      "addi 12, 12, interrupt_handler_values@l\n" \
      "lwz 0, 100(12)\n" \
      "mtcr 0\n" \
      "lwz 0, 108(12)\n" \
      "mtxer 0\n" \
      GPR_LOAD "0, 112+" GPR_OFFSET "(12)\n" \
      "mtctr 0\n" \
      GPR_LOAD "0, 120+" GPR_OFFSET "(12)\n" \
      "mtlr 0\n" \
      GPR_LOAD "0, 0+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "3, 8+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "4, 16+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "5, 24+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "6, 32+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "7, 40+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "8, 48+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "9, 56+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "10, 64+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "11, 72+" GPR_OFFSET "(12)\n" \
      GPR_LOAD "12, 88+" GPR_OFFSET "(12)\n"

  /*
   * The handler overwrites each call-used register, the call-used fields of CR,
   * XER, CTR and LR, so an interrupt which restores none of them fails the
   * check.
   */
  static void InterruptHandler( void *arg )
  {
    (void) arg;
    ++interrupt_count;
    __asm__ volatile(
      HANDLER_LOAD
      :
      :
      : "memory", "cr0", "cr1", "cr2", "cr3", "cr4", "cr5", "cr6", "cr7",
        "r0", "r3", "r4", "r5", "r6", "r7", "r8", "r9", "r10", "r11", "r12",
        "lr", "ctr", "xer"
    );
  }

  static void InterruptFatal(
    rtems_fatal_source source,
    rtems_fatal_code   code,
    void              *arg
  )
  {
    CPU_Exception_frame *frame;

    (void) arg;

    if ( source != RTEMS_FATAL_SOURCE_EXCEPTION ) {
      return;
    }

    frame = (CPU_Exception_frame *) code;
    interrupt_frame = *frame;
    interrupt_count_at_trap = interrupt_count;
    SetFatalHandler( NULL, NULL );
    frame->EXC_SRR1 = ( frame->EXC_SRR1 & ~MSR_BITS ) | interrupt_msr_bits;
    frame->EXC_SRR0 = (uintptr_t) interrupt_done_label;
    _CPU_Exception_resume( frame );
  }

  /*
   * The interrupt is raised while it is masked, so no call happens after the
   * block loads the registers.  Every general-purpose register which the block
   * loads is under test.  The block therefore unmasks the interrupt with a
   * return from interrupt, which takes the MSR from SRR1 and the address of the
   * next instruction from SRR0.  The interrupt controller delivers an IPI a few
   * cycles later, so a run of no-operations follows.
   */
  static void InterruptRaise( void )
  {
    rtems_interrupt_level level;
    uint32_t              msr;
    size_t                i;

    for ( i = 0; i < SOURCE_MAX; ++i ) {
      interrupt_handler_values[ i ] = interrupt_initial[ i ] ^ HANDLER;
    }

    memset( &interrupt_frame, 0, sizeof( interrupt_frame ) );
    interrupt_count = 0;
    interrupt_count_at_trap = 0;
    SetFatalHandler( InterruptFatal, NULL );
    rtems_interrupt_local_disable( level );
    __asm__ volatile( "mfmsr %0" : "=r"( msr ) );
    interrupt_msr_bits = msr & MSR_BITS;
    msr = ( msr & ~MSR_BITS ) |
          ( (uint32_t) interrupt_initial[ SOURCE_MSR ] & MSR_BITS );
    __asm__ volatile( "mtmsr %0" : : "r"( msr ) );
    CallWithinISRSubmit( &interrupt_request );
    __asm__ volatile(
      "mtsrr0 %0\n"
      "mtsrr1 %1\n"
      :
      : "r"( interrupt_enable_label ), "r"( msr | MSR_EE )
    );
    __asm__ volatile(
      ISR_LOAD
      "rfi\n"
      ".globl interrupt_enable_label\n"
      "interrupt_enable_label:\n"
      ".rept 256\n"
      "nop\n"
      ".endr\n"
      ".globl interrupt_trap_label\n"
      "interrupt_trap_label:\n"
      "trap\n"
      ".globl interrupt_done_label\n"
      "interrupt_done_label:\n"
      :
      :
      : "memory", "cr0", "cr1", "cr2", "cr3", "cr4", "cr5", "cr6", "cr7",
        "r0", "r3", "r4", "r5", "r6", "r7", "r8", "r9", "r10", "r11", "r12",
        "r14", "r15", "r16", "r17", "r18", "r19", "r20", "r21", "r22", "r23",
        "r24", "r25", "r26", "r27", "r28", "r29", "r30", "r31", "lr", "ctr",
        "xer"
    );
    rtems_interrupt_local_enable( level );
  }

