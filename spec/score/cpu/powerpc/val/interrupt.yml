    UINT64_C( 0x8192a3b4d8d9dadb ),
    UINT64_C( 0x8293a4b5d9dadbdc ),
    UINT64_C( 0x8394a5b6dadbdcdd ),
    UINT64_C( 0x8495a6b7dbdcddde ),
    UINT64_C( 0x8596a7b8dcdddedf ),
    UINT64_C( 0x8697a8b9dddedfe0 ),
    UINT64_C( 0x8798a9badedfe0e1 ),
