test-support: |
  extern const char context_return_label[];

  extern const char context_done_label[];

  #define WORD UINT64_C( 0xffffffff )

  /*
   * A general-purpose register holds 64 bits in 64-bit code and 32 bits
   * otherwise.  The table holds a doubleword for each register.  The load takes
   * the whole doubleword in 64-bit code and its bottom word otherwise.
   */
  #if defined( __powerpc64__ )
  #define GPR UINT64_MAX
  #define GPR_LOAD "ld "
  #define GPR_OFFSET "0"
  #else
  #define GPR WORD
  #define GPR_LOAD "lwz "
  #define GPR_OFFSET "4"
  #endif

  /* The thread pointer is r2 in 32-bit code and r13 in 64-bit code. */
  #if defined( __powerpc64__ )
  #define CTX_TP "13"
  #else
  #define CTX_TP "2"
  #endif

  /* These are the fields CR2 to CR4, which a called function preserves. */
  #define CR_MASK UINT64_C( 0x000fff00 )

  typedef enum {
    SOURCE_R14,
    SOURCE_R15,
    SOURCE_R16,
    SOURCE_R17,
    SOURCE_R18,
    SOURCE_R19,
    SOURCE_R20,
    SOURCE_R21,
    SOURCE_R22,
    SOURCE_R23,
    SOURCE_R24,
    SOURCE_R25,
    SOURCE_R26,
    SOURCE_R27,
    SOURCE_R28,
    SOURCE_R29,
    SOURCE_R30,
    SOURCE_R31,
    SOURCE_CR,
    SOURCE_TRAP,
    SOURCE_HEIR_TP,
    SOURCE_LR,
    SOURCE_SP,
    SOURCE_EXEC_TP,
    SOURCE_MAX
  } Source;

  typedef enum {
    SLOT_FRAME_R14,
    SLOT_FRAME_R15,
    SLOT_FRAME_R16,
    SLOT_FRAME_R17,
    SLOT_FRAME_R18,
    SLOT_FRAME_R19,
    SLOT_FRAME_R20,
    SLOT_FRAME_R21,
    SLOT_FRAME_R22,
    SLOT_FRAME_R23,
    SLOT_FRAME_R24,
    SLOT_FRAME_R25,
    SLOT_FRAME_R26,
    SLOT_FRAME_R27,
    SLOT_FRAME_R28,
    SLOT_FRAME_R29,
    SLOT_FRAME_R30,
    SLOT_FRAME_R31,
    SLOT_SAVED_R14,
    SLOT_SAVED_R15,
    SLOT_SAVED_R16,
    SLOT_SAVED_R17,
    SLOT_SAVED_R18,
    SLOT_SAVED_R19,
    SLOT_SAVED_R20,
    SLOT_SAVED_R21,
    SLOT_SAVED_R22,
    SLOT_SAVED_R23,
    SLOT_SAVED_R24,
    SLOT_SAVED_R25,
    SLOT_SAVED_R26,
    SLOT_SAVED_R27,
    SLOT_SAVED_R28,
    SLOT_SAVED_R29,
    SLOT_SAVED_R30,
    SLOT_SAVED_R31,
    SLOT_FRAME_CR,
    SLOT_SAVED_CR,
    SLOT_TRAP,
    SLOT_SAVED_LR,
    SLOT_SAVED_SP,
    SLOT_FRAME_SP,
    SLOT_HEIR_TP,
    SLOT_EXEC_TP,
    SLOT_MAX
  } Slot;

  /*
   * The block loads each register from the doubleword at eight times its
   * source.
   */
  RTEMS_STATIC_ASSERT( SOURCE_R31 == 17, source_r31 );
  RTEMS_STATIC_ASSERT( SOURCE_CR == 18, source_cr );

  static const RegisterCheckSource context_sources[ SOURCE_MAX ] = {
    { "r14", REGISTER_CHECK_INITIAL, GPR },
    { "r15", REGISTER_CHECK_INITIAL, GPR },
    { "r16", REGISTER_CHECK_INITIAL, GPR },
    { "r17", REGISTER_CHECK_INITIAL, GPR },
    { "r18", REGISTER_CHECK_INITIAL, GPR },
    { "r19", REGISTER_CHECK_INITIAL, GPR },
    { "r20", REGISTER_CHECK_INITIAL, GPR },
    { "r21", REGISTER_CHECK_INITIAL, GPR },
    { "r22", REGISTER_CHECK_INITIAL, GPR },
    { "r23", REGISTER_CHECK_INITIAL, GPR },
    { "r24", REGISTER_CHECK_INITIAL, GPR },
    { "r25", REGISTER_CHECK_INITIAL, GPR },
    { "r26", REGISTER_CHECK_INITIAL, GPR },
    { "r27", REGISTER_CHECK_INITIAL, GPR },
    { "r28", REGISTER_CHECK_INITIAL, GPR },
    { "r29", REGISTER_CHECK_INITIAL, GPR },
    { "r30", REGISTER_CHECK_INITIAL, GPR },
    { "r31", REGISTER_CHECK_INITIAL, GPR },
    { "cr", REGISTER_CHECK_INITIAL, CR_MASK },
    { "trap", REGISTER_CHECK_EXPECTED, WORD },
    { "heir tp", REGISTER_CHECK_INITIAL, WORD },
    { "lr", REGISTER_CHECK_EXPECTED, WORD },
    { "sp", REGISTER_CHECK_EXPECTED, WORD },
    { "exec tp", REGISTER_CHECK_EXPECTED, WORD }
  };

  static const RegisterCheckSlot context_slots[ SLOT_MAX ] = {
    { "frame r14", SOURCE_R14, GPR },
    { "frame r15", SOURCE_R15, GPR },
    { "frame r16", SOURCE_R16, GPR },
    { "frame r17", SOURCE_R17, GPR },
    { "frame r18", SOURCE_R18, GPR },
    { "frame r19", SOURCE_R19, GPR },
    { "frame r20", SOURCE_R20, GPR },
    { "frame r21", SOURCE_R21, GPR },
    { "frame r22", SOURCE_R22, GPR },
    { "frame r23", SOURCE_R23, GPR },
    { "frame r24", SOURCE_R24, GPR },
    { "frame r25", SOURCE_R25, GPR },
    { "frame r26", SOURCE_R26, GPR },
    { "frame r27", SOURCE_R27, GPR },
    { "frame r28", SOURCE_R28, GPR },
    { "frame r29", SOURCE_R29, GPR },
    { "frame r30", SOURCE_R30, GPR },
    { "frame r31", SOURCE_R31, GPR },
    { "saved r14", SOURCE_R14, GPR },
    { "saved r15", SOURCE_R15, GPR },
    { "saved r16", SOURCE_R16, GPR },
    { "saved r17", SOURCE_R17, GPR },
    { "saved r18", SOURCE_R18, GPR },
    { "saved r19", SOURCE_R19, GPR },
    { "saved r20", SOURCE_R20, GPR },
    { "saved r21", SOURCE_R21, GPR },
    { "saved r22", SOURCE_R22, GPR },
    { "saved r23", SOURCE_R23, GPR },
    { "saved r24", SOURCE_R24, GPR },
    { "saved r25", SOURCE_R25, GPR },
    { "saved r26", SOURCE_R26, GPR },
    { "saved r27", SOURCE_R27, GPR },
    { "saved r28", SOURCE_R28, GPR },
    { "saved r29", SOURCE_R29, GPR },
    { "saved r30", SOURCE_R30, GPR },
    { "saved r31", SOURCE_R31, GPR },
    { "frame cr", SOURCE_CR, CR_MASK },
    { "saved cr", SOURCE_CR, CR_MASK },
    { "trap", SOURCE_TRAP, WORD },
    { "saved lr", SOURCE_LR, WORD },
    { "saved sp", SOURCE_SP, WORD },
    { "frame sp", SOURCE_SP, WORD },
    { "heir tp", SOURCE_HEIR_TP, WORD },
    { "exec tp", SOURCE_EXEC_TP, WORD }
  };

  static const uint64_t context_patterns[ SOURCE_MAX ] = {
    UINT64_C( 0x8f9f6f7f11121314 ),
    UINT64_C( 0x8c9e687e12131415 ),
    UINT64_C( 0x8d99697d13141516 ),
    UINT64_C( 0x8a986a7c14151617 ),
    UINT64_C( 0x8b9b6b7315161718 ),
    UINT64_C( 0x889a647216171819 ),
    UINT64_C( 0x899565711718191a ),
    UINT64_C( 0x8694667018191a1b ),
    UINT64_C( 0x87976777191a1b1c ),
    UINT64_C( 0x849660761a1b1c1d ),
    UINT64_C( 0x859161751b1c1d1e ),
    UINT64_C( 0x829062741c1d1e1f ),
    UINT64_C( 0x8393634b1d1e1f20 ),
    UINT64_C( 0x80925c4a1e1f2021 ),
    UINT64_C( 0x81ad5d491f202122 ),
    UINT64_C( 0xbeac5e4820212223 ),
    UINT64_C( 0xbfaf5f4f21222324 ),
    UINT64_C( 0xbcae584e22232425 ),
    UINT64_C( 0x00a5a000 ),
    1,
    UINT64_C( 0x71727374 ),
    1,
    1,
    1
  };

  uint64_t context_initial[ SOURCE_MAX ];

  static CPU_Exception_frame context_frame;

  static volatile int context_trap;

  Context_Control context_executing;

  Context_Control context_heir;

  uint32_t context_heir_tp;

  static uintptr_t context_sp;

  static uintptr_t context_exec_tp;

  static uint64_t context_heir_stack[ 512 ] RTEMS_ALIGNED( CPU_STACK_ALIGNMENT );

  /*
   * The block loads r3 with the address of the table and loads CR first, so that
   * r0 is free afterwards.
   */
  #define CTX_LOAD \
      "lis 3, context_initial@ha\n" \
      "addi 3, 3, context_initial@l\n" \
      "lwz 0, 148(3)\n" \
      "mtcr 0\n" \
      GPR_LOAD "14, 0+" GPR_OFFSET "(3)\n" \
      GPR_LOAD "15, 8+" GPR_OFFSET "(3)\n" \
      GPR_LOAD "16, 16+" GPR_OFFSET "(3)\n" \
      GPR_LOAD "17, 24+" GPR_OFFSET "(3)\n" \
      GPR_LOAD "18, 32+" GPR_OFFSET "(3)\n" \
      GPR_LOAD "19, 40+" GPR_OFFSET "(3)\n" \
      GPR_LOAD "20, 48+" GPR_OFFSET "(3)\n" \
      GPR_LOAD "21, 56+" GPR_OFFSET "(3)\n" \
      GPR_LOAD "22, 64+" GPR_OFFSET "(3)\n" \
      GPR_LOAD "23, 72+" GPR_OFFSET "(3)\n" \
      GPR_LOAD "24, 80+" GPR_OFFSET "(3)\n" \
      GPR_LOAD "25, 88+" GPR_OFFSET "(3)\n" \
      GPR_LOAD "26, 96+" GPR_OFFSET "(3)\n" \
      GPR_LOAD "27, 104+" GPR_OFFSET "(3)\n" \
      GPR_LOAD "28, 112+" GPR_OFFSET "(3)\n" \
      GPR_LOAD "29, 120+" GPR_OFFSET "(3)\n" \
      GPR_LOAD "30, 128+" GPR_OFFSET "(3)\n" \
      GPR_LOAD "31, 136+" GPR_OFFSET "(3)\n" \


  static void ContextFatal(
    rtems_fatal_source source,
    rtems_fatal_code   code,
    void              *arg
  )
  {
    CPU_Exception_frame *frame;

    (void) arg;

    if ( source != RTEMS_FATAL_SOURCE_EXCEPTION ) {
      return;
    }

    frame = (CPU_Exception_frame *) code;
    context_frame = *frame;
    ++context_trap;
    SetFatalHandler( NULL, NULL );
    frame->EXC_SRR0 = (uintptr_t) context_done_label;
    _CPU_Exception_resume( frame );
  }

  /*
   * The heir records its thread pointer and switches straight back.  It is
   * assembly, so no prologue saves a register of the context under test.
   */
  void ContextHeirEntry( void );

  __asm__ (
    "  .globl ContextHeirEntry\n"
    "  .type ContextHeirEntry, @function\n"
    "ContextHeirEntry:\n"
    "  lis 5, context_heir_tp@ha\n"
    "  stw " CTX_TP ", context_heir_tp@l(5)\n"
    "  lis 3, context_heir@ha\n"
    "  addi 3, 3, context_heir@l\n"
    "  lis 4, context_executing@ha\n"
    "  addi 4, 4, context_executing@l\n"
    "  b _CPU_Context_switch\n"
  );

  /*
   * The switch is called directly, so the patterns are in the registers when it
   * saves them.  Nothing spills them to a stack frame first.
   */
  static void ContextRunSwitch( void )
  {
    context_trap = 0;
    memset( &context_frame, 0, sizeof( context_frame ) );
    memset( &context_executing, 0, sizeof( context_executing ) );

    /*
     * The switch restores the thread pointer and never saves it, so the context
     * which resumes has to carry the one of the running thread.
     */
    ppc_get_context( &context_executing )->tp =
      ppc_get_context( &GetExecuting()->Registers )->tp;
    _CPU_Context_Initialize(
      &context_heir,
      context_heir_stack,
      sizeof( context_heir_stack ),
      0,
      ContextHeirEntry,
      false,
      NULL
    );
    ppc_get_context( &context_heir )->tp =
      (uintptr_t) context_initial[ SOURCE_HEIR_TP ];
    SetFatalHandler( ContextFatal, NULL );
    __asm__ volatile( "mr %0, 1" : "=r"( context_sp ) );

    __asm__ volatile(
      CTX_LOAD
      "lis 3, context_executing@ha\n"
      "addi 3, 3, context_executing@l\n"
      "lis 4, context_heir@ha\n"
      "addi 4, 4, context_heir@l\n"
      "bl _CPU_Context_switch\n"
      ".globl context_return_label\n"
      "context_return_label:\n"
      "trap\n"
      ".globl context_done_label\n"
      "context_done_label:\n"
      :
      :
      : "memory", "cr0", "cr1", "cr2", "cr3", "cr4", "cr5", "cr6", "cr7",
        "r0", "r3", "r4", "r5", "r6", "r7", "r8", "r9", "r10", "r11", "r12",
        "r14", "r15", "r16", "r17", "r18", "r19", "r20", "r21", "r22", "r23",
        "r24", "r25", "r26", "r27", "r28", "r29", "r30", "r31", "lr", "ctr"
    );
    __asm__ volatile( "mr %0, " CTX_TP : "=r"( context_exec_tp ) );
  }

  static void ContextRun( RegisterCheck *self, void *arg )
  {
    const ppc_context *ctx;

    (void) arg;
    ContextRunSwitch();
    ctx = ppc_get_context( &context_executing );
    RegisterCheckRecord(
