term: PowerPC call-saved vector register
text: |
  A vector register which the ABI requires a called function to preserve. Where
  the multilib provides AltiVec, these are v20 to v31 and VRSAVE. Where the
  multilib uses VRSAVE, a register of v20 to v31 holds a value only if VRSAVE
  marks it.
