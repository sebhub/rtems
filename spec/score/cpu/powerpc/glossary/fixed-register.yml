term: PowerPC fixed register
text: |
  A register with a fixed role. In the 32-bit ABI, these are r1 as the stack
  pointer, r2 as the thread pointer and r13 as the small data area pointer. In
  the 64-bit ABI, these are r1 as the stack pointer, r2 as the TOC pointer and
  r13 as the thread pointer.
