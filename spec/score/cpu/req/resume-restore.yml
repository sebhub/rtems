- role: requirement-refinement
  uid: registers
rationale: |
  The exception frame also holds registers which the processor owns. A cause and
  a bad virtual address report why the exception happened, and no write of the
  processor accepts them.
requirement-type: functional
text: |
  The exception resume shall restore every register of the exception frame which
  the interrupted context owns.
type: requirement
