  uid: resume-frame-release
rationale: |
  The address of the frame observes the release. A frame which the resume leaves
  on the stack moves the next frame away from the address of the first one.
requirement-type: functional
text: |
  A second exception shall place its exception frame at the address of the frame
  of the first exception.
