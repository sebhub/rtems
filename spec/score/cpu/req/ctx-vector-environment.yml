links:
- role: requirement-refinement
  uid: registers
rationale: |
  The vector environment controls the treatment of denormalised values and
  records saturation. No ABI of this bundle makes the register which holds it
  call-saved. The context switch is therefore the only place which can preserve
  it.
requirement-type: functional
text: |
  The ${/glossary/contextswitch:/term} shall preserve the vector environment of
  the thread.
type: requirement
