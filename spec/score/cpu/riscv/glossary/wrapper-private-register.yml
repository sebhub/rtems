term: RISC-V wrapper-private register
text: |
  A call-saved register which an interrupt or exception wrapper uses for its own
  bookkeeping. These are s0 and s1. The interrupt wrapper holds the per-processor
  control in s0 and the stack pointer of the interrupted context in s1.
