term: RISC-V status register
text: |
  The register which holds the condition flags and the execution state. RISC-V
  defines no condition flags. mstatus holds the interrupt enable and the
  privilege state, and fcsr holds the floating-point state. sstatus takes the
  place of mstatus in supervisor mode.
