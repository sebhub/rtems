test-actions:
- action-brief: |
    Load a distinct pattern into every call-saved register, into fcsr and into the
    thread pointer of the context. Call the context switch directly. The heir
    records its thread pointer and its stack pointer and switches back. Record the
    registers after the switch back. Run this once for each value with the pattern
    of that value inverted, then once unchanged.
  action-code: |
    ContextPrepare();
    RegisterCheckRun( &context_check );
  checks:
  - brief: |
      Check that the switch saved the RISC-V register s0.
    code: |
      RegisterCheckVerify( &context_check, SLOT_SAVED_S0 );
    links:
    - role: validation
      uid: ../../req/ctx-call-saved
  - brief: |
      Check that the switch restored the RISC-V register s0.
    code: |
      RegisterCheckVerify( &context_check, SLOT_AFTER_S0 );
    links:
    - role: validation
      uid: ../../req/ctx-call-saved
  - brief: |
      Check that the switch saved the RISC-V register s1.
    code: |
      RegisterCheckVerify( &context_check, SLOT_SAVED_S1 );
