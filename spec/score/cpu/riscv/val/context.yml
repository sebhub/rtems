  #if __riscv_flen > 0
  static uint64_t GetFloat( const RISCV_Float *value )
  {
  #if __riscv_flen == 64
    uint64_t bits;
  #else
    uint32_t bits;
  #endif

    memcpy( &bits, value, sizeof( bits ) );
    return bits;
  }
  #endif

  static void ContextRun( RegisterCheck *self, void *arg )
  {
    rtems_interrupt_level level;

    (void) arg;
    memset( context_after, 0, sizeof( context_after ) );
    memset( context_heir_seen, 0, sizeof( context_heir_seen ) );
    memset( &context_executing, 0, sizeof( context_executing ) );
    memset( &context_heir, 0, sizeof( context_heir ) );
    context_executing.tp = (uintptr_t) context_initial[ SOURCE_EXEC_TP ];
    context_heir.ra = (uintptr_t) ContextHeirEntry;
    context_heir.sp = (uintptr_t) &context_heir_stack[ CONTEXT_HEIR_STACK_WORDS ];
    context_heir.tp = (uintptr_t) context_initial[ SOURCE_HEIR_TP ];

    /*
     * The sp and the tp hold values of the test until the runner loads the
     * registers of its caller, so no interrupt may arrive in between.
     */
    rtems_interrupt_local_disable( level );
    ContextRunSwitch();
    rtems_interrupt_local_enable( level );

    RegisterCheckRecord( self, SLOT_SAVED_S0, context_executing.s0, GetPattern( SOURCE_S0 ) );
    RegisterCheckRecord( self, SLOT_AFTER_S0, context_after[ SOURCE_S0 ], GetPattern( SOURCE_S0 ) );
    RegisterCheckRecord( self, SLOT_SAVED_S1, context_executing.s1, GetPattern( SOURCE_S1 ) );
    RegisterCheckRecord( self, SLOT_AFTER_S1, context_after[ SOURCE_S1 ], GetPattern( SOURCE_S1 ) );
    RegisterCheckRecord( self, SLOT_SAVED_S2, context_executing.s2, GetPattern( SOURCE_S2 ) );
    RegisterCheckRecord( self, SLOT_AFTER_S2, context_after[ SOURCE_S2 ], GetPattern( SOURCE_S2 ) );
    RegisterCheckRecord( self, SLOT_SAVED_S3, context_executing.s3, GetPattern( SOURCE_S3 ) );
    RegisterCheckRecord( self, SLOT_AFTER_S3, context_after[ SOURCE_S3 ], GetPattern( SOURCE_S3 ) );
    RegisterCheckRecord( self, SLOT_SAVED_S4, context_executing.s4, GetPattern( SOURCE_S4 ) );
    RegisterCheckRecord( self, SLOT_AFTER_S4, context_after[ SOURCE_S4 ], GetPattern( SOURCE_S4 ) );
    RegisterCheckRecord( self, SLOT_SAVED_S5, context_executing.s5, GetPattern( SOURCE_S5 ) );
    RegisterCheckRecord( self, SLOT_AFTER_S5, context_after[ SOURCE_S5 ], GetPattern( SOURCE_S5 ) );
    RegisterCheckRecord( self, SLOT_SAVED_S6, context_executing.s6, GetPattern( SOURCE_S6 ) );
    RegisterCheckRecord( self, SLOT_AFTER_S6, context_after[ SOURCE_S6 ], GetPattern( SOURCE_S6 ) );
    RegisterCheckRecord( self, SLOT_SAVED_S7, context_executing.s7, GetPattern( SOURCE_S7 ) );
    RegisterCheckRecord( self, SLOT_AFTER_S7, context_after[ SOURCE_S7 ], GetPattern( SOURCE_S7 ) );
    RegisterCheckRecord( self, SLOT_SAVED_S8, context_executing.s8, GetPattern( SOURCE_S8 ) );
    RegisterCheckRecord( self, SLOT_AFTER_S8, context_after[ SOURCE_S8 ], GetPattern( SOURCE_S8 ) );
    RegisterCheckRecord( self, SLOT_SAVED_S9, context_executing.s9, GetPattern( SOURCE_S9 ) );
    RegisterCheckRecord( self, SLOT_AFTER_S9, context_after[ SOURCE_S9 ], GetPattern( SOURCE_S9 ) );
    RegisterCheckRecord( self, SLOT_SAVED_S10, context_executing.s10, GetPattern( SOURCE_S10 ) );
    RegisterCheckRecord( self, SLOT_AFTER_S10, context_after[ SOURCE_S10 ], GetPattern( SOURCE_S10 ) );
    RegisterCheckRecord( self, SLOT_SAVED_S11, context_executing.s11, GetPattern( SOURCE_S11 ) );
    RegisterCheckRecord( self, SLOT_AFTER_S11, context_after[ SOURCE_S11 ], GetPattern( SOURCE_S11 ) );
    RegisterCheckRecord( self, SLOT_SAVED_SP, context_executing.sp, GetPattern( SOURCE_SP ) );
    RegisterCheckRecord( self, SLOT_AFTER_SP, context_after[ SOURCE_SP ], GetPattern( SOURCE_SP ) );
    RegisterCheckRecord( self, SLOT_HEIR_SP, context_heir_seen[ 1 ], (uintptr_t) &context_heir_stack[ CONTEXT_HEIR_STACK_WORDS ] );
    RegisterCheckRecord( self, SLOT_SAVED_RA, context_executing.ra, (uintptr_t) context_return_label );
    RegisterCheckRecord( self, SLOT_AFTER_RA, context_after[ CONTEXT_RA_INDEX ], (uintptr_t) context_return_label );
    RegisterCheckRecord( self, SLOT_EXEC_TP, context_after[ SOURCE_EXEC_TP ], GetPattern( SOURCE_EXEC_TP ) );
    RegisterCheckRecord( self, SLOT_HEIR_TP, context_heir_seen[ 0 ], GetPattern( SOURCE_HEIR_TP ) );
  #if __riscv_flen > 0
    RegisterCheckRecord( self, SLOT_SAVED_FS0, GetFloat( &context_executing.fs0 ), GetPattern( SOURCE_FS0 ) );
    RegisterCheckRecord( self, SLOT_AFTER_FS0, context_after[ SOURCE_FS0 ], GetPattern( SOURCE_FS0 ) );
    RegisterCheckRecord( self, SLOT_SAVED_FS1, GetFloat( &context_executing.fs1 ), GetPattern( SOURCE_FS1 ) );
    RegisterCheckRecord( self, SLOT_AFTER_FS1, context_after[ SOURCE_FS1 ], GetPattern( SOURCE_FS1 ) );
    RegisterCheckRecord( self, SLOT_SAVED_FS2, GetFloat( &context_executing.fs2 ), GetPattern( SOURCE_FS2 ) );
    RegisterCheckRecord( self, SLOT_AFTER_FS2, context_after[ SOURCE_FS2 ], GetPattern( SOURCE_FS2 ) );
    RegisterCheckRecord( self, SLOT_SAVED_FS3, GetFloat( &context_executing.fs3 ), GetPattern( SOURCE_FS3 ) );
    RegisterCheckRecord( self, SLOT_AFTER_FS3, context_after[ SOURCE_FS3 ], GetPattern( SOURCE_FS3 ) );
    RegisterCheckRecord( self, SLOT_SAVED_FS4, GetFloat( &context_executing.fs4 ), GetPattern( SOURCE_FS4 ) );
