    RegisterCheckRecord( self, SLOT_SAVED_FS5, GetFloat( &context_executing.fs5 ), GetPattern( SOURCE_FS5 ) );
    RegisterCheckRecord( self, SLOT_AFTER_FS5, context_after[ SOURCE_FS5 ], GetPattern( SOURCE_FS5 ) );
    RegisterCheckRecord( self, SLOT_SAVED_FS6, GetFloat( &context_executing.fs6 ), GetPattern( SOURCE_FS6 ) );
    RegisterCheckRecord( self, SLOT_AFTER_FS6, context_after[ SOURCE_FS6 ], GetPattern( SOURCE_FS6 ) );
    RegisterCheckRecord( self, SLOT_SAVED_FS7, GetFloat( &context_executing.fs7 ), GetPattern( SOURCE_FS7 ) );
    RegisterCheckRecord( self, SLOT_AFTER_FS7, context_after[ SOURCE_FS7 ], GetPattern( SOURCE_FS7 ) );
    RegisterCheckRecord( self, SLOT_SAVED_FS8, GetFloat( &context_executing.fs8 ), GetPattern( SOURCE_FS8 ) );
    RegisterCheckRecord( self, SLOT_AFTER_FS8, context_after[ SOURCE_FS8 ], GetPattern( SOURCE_FS8 ) );
    RegisterCheckRecord( self, SLOT_SAVED_FS9, GetFloat( &context_executing.fs9 ), GetPattern( SOURCE_FS9 ) );
    RegisterCheckRecord( self, SLOT_AFTER_FS9, context_after[ SOURCE_FS9 ], GetPattern( SOURCE_FS9 ) );
    RegisterCheckRecord( self, SLOT_SAVED_FS10, GetFloat( &context_executing.fs10 ), GetPattern( SOURCE_FS10 ) );
    RegisterCheckRecord( self, SLOT_AFTER_FS10, context_after[ SOURCE_FS10 ], GetPattern( SOURCE_FS10 ) );
    RegisterCheckRecord( self, SLOT_SAVED_FS11, GetFloat( &context_executing.fs11 ), GetPattern( SOURCE_FS11 ) );
    RegisterCheckRecord( self, SLOT_AFTER_FS11, context_after[ SOURCE_FS11 ], GetPattern( SOURCE_FS11 ) );
    RegisterCheckRecord( self, SLOT_SAVED_FCSR, context_executing.fcsr, GetPattern( SOURCE_FCSR ) );
    RegisterCheckRecord( self, SLOT_AFTER_FCSR, context_after[ SOURCE_FCSR ], GetPattern( SOURCE_FCSR ) );
  #endif
  }

  static RegisterCheck context_check = {
    .sources = context_sources,
    .source_count = SOURCE_MAX,
    .slots = context_slots,
    .slot_count = SLOT_MAX,
    .initial = context_initial,
    .run = ContextRun
  };

  static void ContextPrepare( void )
  {
    size_t i;

    for ( i = 0; i < SOURCE_MAX; ++i ) {
      context_initial[ i ] = GetPattern( i );
    }
  }

  #if __riscv_flen > 0
  static Context_Control context_initialized[ 2 ];

  static void WriteFCSR( uint32_t fcsr )
  {
    /* clang-format off */
    __asm__ volatile ( "fscsr %0" : : "r" ( fcsr ) );
    /* clang-format on */
  }

  static void ContextInitialize( Context_Control *context, uint32_t fcsr )
  {
    WriteFCSR( fcsr );
    _CPU_Context_Initialize(
      context,
      context_heir_stack,
      sizeof( context_heir_stack ),
      0,
      ContextHeirEntry,
      true,
      NULL
    );
  }

  static void ContextInitializeTwice( void )
  {
    uint32_t fcsr;

    fcsr = _RISCV_Read_FCSR();
    ContextInitialize( &context_initialized[ 0 ], 0x75 );
    ContextInitialize( &context_initialized[ 1 ], 0x8a );
    WriteFCSR( fcsr );
  }
  #endif
