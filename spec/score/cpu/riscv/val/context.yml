- action-brief: |
    Set fcsr to a pattern and initialize a context. Set fcsr to the inverted
    pattern and initialize a second context. Restore fcsr.
  action-code: |
    #if __riscv_flen > 0
      ContextInitializeTwice();
    #endif
  checks:
  - brief: |
      Check that the first context received the pattern in fcsr.
    code: |
      #if __riscv_flen > 0
        T_eq_u32( context_initialized[ 0 ].fcsr & 0xff, 0x75 );
      #endif
    links:
    - role: validation
      uid: ../req/ctx-initial-fcsr
  - brief: |
      Check that the second context received the inverted pattern in fcsr.
    code: |
      #if __riscv_flen > 0
        T_eq_u32( context_initialized[ 1 ].fcsr & 0xff, 0x8a );
      #endif
    links:
    - role: validation
      uid: ../req/ctx-initial-fcsr
  links: []
test-brief: |
  Checks that the context switch saves and restores every call-saved register,
  the floating-point environment, the return address and the thread pointer.
  Checks the initial floating-point environment of a context.
test-context: []
test-context-support: null
test-description: |
  The action calls the switch directly. A call through the operating system runs
  a chain of functions. A function of the chain may preserve a register on its
  own stack. This hides a defect of the switch in that register.
test-header: null
test-includes:
- rtems.h
- rtems/score/cpuimpl.h
- stdint.h
- string.h
test-local-includes:
- tx-register-check.h
- tx-support.h
test-setup: null
test-stop: null
test-support: |
  #define WORD ( (uint64_t) UINTPTR_MAX )

  #if __riscv_flen == 64
  #define FWORD UINT64_MAX
  #define FLOAD "fld"
  #define FSTORE "fsd"
  #elif __riscv_flen == 32
  #define FWORD UINT64_C( 0xffffffff )
  #define FLOAD "flw"
  #define FSTORE "fsw"
  #endif

  /*
   * The mask covers the rounding mode and the exception flags of fcsr.  The
   * pattern sets the rounding mode three, and the inverted pattern sets the
   * rounding mode four.  Both are valid.
   */
  #define FCSR_MASK UINT64_C( 0xff )

  /* The runner stores ra behind the values of every source */
  #define CONTEXT_RA_INDEX 28

  #if __riscv_xlen == 64
  #define LREG "ld"
  #define SREG "sd"
  #else
  #define LREG "lw"
  #define SREG "sw"
  #endif

  typedef enum {
    SOURCE_S0,
    SOURCE_S1,
    SOURCE_S2,
    SOURCE_S3,
    SOURCE_S4,
    SOURCE_S5,
    SOURCE_S6,
    SOURCE_S7,
    SOURCE_S8,
    SOURCE_S9,
    SOURCE_S10,
    SOURCE_S11,
    SOURCE_SP,
    SOURCE_EXEC_TP,
    SOURCE_HEIR_TP,
  #if __riscv_flen > 0
    SOURCE_FS0,
    SOURCE_FS1,
    SOURCE_FS2,
    SOURCE_FS3,
    SOURCE_FS4,
    SOURCE_FS5,
    SOURCE_FS6,
    SOURCE_FS7,
    SOURCE_FS8,
    SOURCE_FS9,
    SOURCE_FS10,
    SOURCE_FS11,
    SOURCE_FCSR,
  #endif
    SOURCE_RA,
    SOURCE_HEIR_SP,
    SOURCE_MAX
  } Source;

  typedef enum {
    SLOT_SAVED_S0,
    SLOT_AFTER_S0,
    SLOT_SAVED_S1,
    SLOT_AFTER_S1,
    SLOT_SAVED_S2,
    SLOT_AFTER_S2,
