    SLOT_AFTER_S11,
    SLOT_SAVED_SP,
    SLOT_AFTER_SP,
    SLOT_HEIR_SP,
    SLOT_SAVED_RA,
    SLOT_AFTER_RA,
    SLOT_EXEC_TP,
    SLOT_HEIR_TP,
  #if __riscv_flen > 0
    SLOT_SAVED_FS0,
    SLOT_AFTER_FS0,
    SLOT_SAVED_FS1,
    SLOT_AFTER_FS1,
    SLOT_SAVED_FS2,
    SLOT_AFTER_FS2,
    SLOT_SAVED_FS3,
    SLOT_AFTER_FS3,
    SLOT_SAVED_FS4,
    SLOT_AFTER_FS4,
    SLOT_SAVED_FS5,
    SLOT_AFTER_FS5,
    SLOT_SAVED_FS6,
    SLOT_AFTER_FS6,
    SLOT_SAVED_FS7,
    SLOT_AFTER_FS7,
    SLOT_SAVED_FS8,
    SLOT_AFTER_FS8,
    SLOT_SAVED_FS9,
    SLOT_AFTER_FS9,
    SLOT_SAVED_FS10,
    SLOT_AFTER_FS10,
    SLOT_SAVED_FS11,
    SLOT_AFTER_FS11,
    SLOT_SAVED_FCSR,
    SLOT_AFTER_FCSR,
  #endif
    SLOT_MAX
  } Slot;

  /*
   * The runner loads each value from the byte offset eight times its source.
   * It stores the registers after the switch at the same offsets.
   */
  RTEMS_STATIC_ASSERT( SOURCE_S0 == 0, source_s0 );
  RTEMS_STATIC_ASSERT( SOURCE_SP == 12, source_sp );
  RTEMS_STATIC_ASSERT( SOURCE_EXEC_TP == 13, source_exec_tp );

  #if __riscv_flen > 0
  RTEMS_STATIC_ASSERT( SOURCE_FS0 == 15, source_fs0 );
  RTEMS_STATIC_ASSERT( SOURCE_FCSR == 27, source_fcsr );
  #endif

