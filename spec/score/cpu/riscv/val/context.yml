  void ContextHeirEntry( void );

  void ContextRunSwitch( void );

  /*
   * The heir switches straight back.  It is assembly, so no prologue saves a
   * register of the context under test.
   */
  /* clang-format off */
  __asm__ (
    "  .globl ContextHeirEntry\n"
    "ContextHeirEntry:\n"
    "  la t0, context_heir_seen\n"
    "  " SREG " tp, 0(t0)\n"
    "  " SREG " sp, 8(t0)\n"
    "  la a0, context_heir\n"
    "  la a1, context_executing\n"
    "  call _CPU_Context_switch\n"
    "  unimp\n"
  );
  /* clang-format on */

  /*
   * The runner saves the registers of its caller.  It loads each value from the
   * table of initial values and calls the switch directly.  The heir switches
   * back, and the runner stores the registers after the switch.  It then loads
   * the registers of its caller.  The switch back loads tp from the context, so
   * the runner loads no tp before the switch.
   */
  /* clang-format off */
  __asm__ (
    "  .globl ContextRunSwitch\n"
    "ContextRunSwitch:\n"
    "  la t0, context_saved\n"
    "  " SREG " s0, 0(t0)\n"
    "  " SREG " s1, 8(t0)\n"
    "  " SREG " s2, 16(t0)\n"
    "  " SREG " s3, 24(t0)\n"
    "  " SREG " s4, 32(t0)\n"
    "  " SREG " s5, 40(t0)\n"
    "  " SREG " s6, 48(t0)\n"
    "  " SREG " s7, 56(t0)\n"
    "  " SREG " s8, 64(t0)\n"
    "  " SREG " s9, 72(t0)\n"
    "  " SREG " s10, 80(t0)\n"
    "  " SREG " s11, 88(t0)\n"
    "  " SREG " sp, 96(t0)\n"
    "  " SREG " tp, 104(t0)\n"
    "  " SREG " ra, 224(t0)\n"
  #if __riscv_flen > 0
    "  " FSTORE " fs0, 120(t0)\n"
    "  " FSTORE " fs1, 128(t0)\n"
    "  " FSTORE " fs2, 136(t0)\n"
    "  " FSTORE " fs3, 144(t0)\n"
    "  " FSTORE " fs4, 152(t0)\n"
    "  " FSTORE " fs5, 160(t0)\n"
    "  " FSTORE " fs6, 168(t0)\n"
    "  " FSTORE " fs7, 176(t0)\n"
    "  " FSTORE " fs8, 184(t0)\n"
    "  " FSTORE " fs9, 192(t0)\n"
    "  " FSTORE " fs10, 200(t0)\n"
    "  " FSTORE " fs11, 208(t0)\n"
    "  frcsr t1\n"
    "  sw t1, 216(t0)\n"
  #endif
    "  la t0, context_initial\n"
  #if __riscv_flen > 0
    "  " FLOAD " fs0, 120(t0)\n"
    "  " FLOAD " fs1, 128(t0)\n"
    "  " FLOAD " fs2, 136(t0)\n"
    "  " FLOAD " fs3, 144(t0)\n"
    "  " FLOAD " fs4, 152(t0)\n"
    "  " FLOAD " fs5, 160(t0)\n"
    "  " FLOAD " fs6, 168(t0)\n"
    "  " FLOAD " fs7, 176(t0)\n"
    "  " FLOAD " fs8, 184(t0)\n"
    "  " FLOAD " fs9, 192(t0)\n"
    "  " FLOAD " fs10, 200(t0)\n"
    "  " FLOAD " fs11, 208(t0)\n"
    "  lw t1, 216(t0)\n"
    "  fscsr t1\n"
  #endif
    "  " LREG " s0, 0(t0)\n"
    "  " LREG " s1, 8(t0)\n"
    "  " LREG " s2, 16(t0)\n"
    "  " LREG " s3, 24(t0)\n"
    "  " LREG " s4, 32(t0)\n"
    "  " LREG " s5, 40(t0)\n"
    "  " LREG " s6, 48(t0)\n"
