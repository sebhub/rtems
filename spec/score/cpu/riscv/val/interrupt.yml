test-brief: |
  Checks that the interrupt processing preserves the registers of the interrupted
  context.
test-context: []
test-context-support: null
test-description: |
  The interrupt comes from the TM27 support of the BSP. The handler overwrites
  the call-used registers, since a handler of an application may do the same. The
  interrupt wrapper uses s0 and s1 for its own bookkeeping.
test-header: null
test-includes:
- rtems.h
- rtems/score/cpuimpl.h
- rtems/score/riscv-utility.h
- stddef.h
- stdint.h
- string.h
test-local-includes:
- tx-register-check.h
- tx-support.h
test-setup: null
test-stop: null
test-support: |
  #define _RTEMS_TMTEST27
  #include <tm27.h>

  #define WORD ( (uint64_t) UINTPTR_MAX )

  #if __riscv_flen == 64
  #define FWORD UINT64_MAX
  #define FLOAD "fld"
  #elif __riscv_flen == 32
  #define FWORD UINT64_C( 0xffffffff )
  #define FLOAD "flw"
  #endif

  /*
   * The mask covers the rounding mode and the exception flags of fcsr.  The
   * pattern sets the rounding mode three, and the inverted pattern sets the
   * rounding mode four.  Both are valid.  The handler writes zero.
   */
  #define FCSR_MASK UINT64_C( 0xff )

  #define FCSR_PATTERN UINT64_C( 0x75 )

  #if defined( RISCV_USE_S_MODE )
  #define STATUS_IE "2"
  #define STATUS_TEST_MASK ( SSTATUS_SPIE | SSTATUS_SPP )
  #define STATUS_REGISTER "sstatus"
  #else
  #define STATUS_IE "8"
  #define STATUS_TEST_MASK ( MSTATUS_MPIE | MSTATUS_MPP )
  #define STATUS_REGISTER "mstatus"
  #endif

  #if __riscv_xlen == 64
  #define LREG "ld"
  #define SREG "sd"
  #else
  #define LREG "lw"
  #define SREG "sw"
  #endif

  typedef enum {
    SOURCE_RA,
    SOURCE_T0,
    SOURCE_T1,
    SOURCE_T2,
    SOURCE_S0,
    SOURCE_S1,
    SOURCE_A0,
    SOURCE_A1,
    SOURCE_A2,
    SOURCE_A3,
    SOURCE_A4,
    SOURCE_A5,
    SOURCE_A6,
    SOURCE_A7,
    SOURCE_T3,
    SOURCE_T4,
    SOURCE_T5,
    SOURCE_T6,
    SOURCE_SP,
    SOURCE_STATUS,
    SOURCE_EPC,
    SOURCE_COUNT,
  #if __riscv_flen > 0
    SOURCE_FT0,
    SOURCE_FT1,
    SOURCE_FT2,
    SOURCE_FT3,
    SOURCE_FT4,
    SOURCE_FT5,
    SOURCE_FT6,
    SOURCE_FT7,
    SOURCE_FA0,
    SOURCE_FA1,
    SOURCE_FA2,
    SOURCE_FA3,
    SOURCE_FA4,
    SOURCE_FA5,
    SOURCE_FA6,
    SOURCE_FA7,
    SOURCE_FT8,
    SOURCE_FT9,
    SOURCE_FT10,
    SOURCE_FT11,
    SOURCE_FCSR,
  #endif
    SOURCE_MAX
  } Source;

  /* Each source feeds one slot of the same index */
  typedef enum {
    SLOT_RA,
    SLOT_T0,
    SLOT_T1,
    SLOT_T2,
    SLOT_S0,
    SLOT_S1,
    SLOT_A0,
    SLOT_A1,
    SLOT_A2,
    SLOT_A3,
    SLOT_A4,
    SLOT_A5,
    SLOT_A6,
    SLOT_A7,
