term: AArch64 wrapper-private register
text: |
  A call-saved register which the interrupt wrapper uses for its own bookkeeping.
  These are x19, x20 and x21. aarch64-exception-interrupt.S names x19
  SELF_CPU_CONTROL and x20 NON_VOLATILE_SCRATCH, and keeps the link register in
  x21.
type: glossary
