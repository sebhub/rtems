test-actions:
- action-brief: |
    Load a distinct pattern into every call-saved register. Call the context switch
    directly. The heir switches back. Trap, so the frame reports every register.
    Run this once for each register with the pattern of that register inverted,
    then once unchanged.
  action-code: |
    memcpy( context_initial, context_patterns, sizeof( context_initial ) );
    RegisterCheckRun( &context_check );
  checks:
