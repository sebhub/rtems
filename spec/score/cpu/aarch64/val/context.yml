    SLOT_MAX
  } Slot;

  /* The block loads each register from the byte offset eight times its source. */
  RTEMS_STATIC_ASSERT( SOURCE_FP == 10, source_fp );
  #ifdef AARCH64_MULTILIB_VFP
  RTEMS_STATIC_ASSERT( SOURCE_D8 == 11, source_d8 );
  #endif

