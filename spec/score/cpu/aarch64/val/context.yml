  /* The block loads x0 last, because x0 holds the address of the table. */
  #define CTX_LOAD \
      "adrp x0, context_initial\n" \
      "add x0, x0, :lo12:context_initial\n" \
      "ldr x19, [x0, #0]\n" \
      "ldr x20, [x0, #8]\n" \
      "ldr x21, [x0, #16]\n" \
      "ldr x22, [x0, #24]\n" \
