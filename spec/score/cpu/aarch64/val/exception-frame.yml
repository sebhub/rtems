      "ldr x1, [x0, #0]\n" \
      "msr nzcv, x1\n" \
      "ldr x1, [x0, #8]\n" \
      "msr fpsr, x1\n" \
      "ldr x1, [x0, #16]\n" \
      "msr fpcr, x1\n" \
      "adrp x0, exception_vector_image\n" \
