      floating-point register V31 from the frame.
    code: |
      CheckSimd( SIMD_V31_LO );
    links:
    - role: validation
      uid: ../../req/resume-restore
  - brief: |
      Check that the resume restored the top 64 bits of the AArch64 SIMD and
      floating-point register V31 from the frame.
    code: |
      CheckSimd( SIMD_V31_HI );
    links:
    - role: validation
      uid: ../../req/resume-restore
  - brief: |
      Check that each run with a changed value flagged exactly the checks of that
      value, and that each run recorded every check.
    code: |
      RegisterCheckReport( &resume_simd_check );
    links:
    - role: validation
      uid: ../../req/resume-restore
  links: []
