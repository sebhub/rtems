        simd[ SIMD_V25_LO ];
      frame->vector_registers[ 26 ] = ( (uint128_t) simd[ SIMD_V26_HI ] << 64 ) |
        simd[ SIMD_V26_LO ];
      frame->vector_registers[ 27 ] = ( (uint128_t) simd[ SIMD_V27_HI ] << 64 ) |
        simd[ SIMD_V27_LO ];
      frame->vector_registers[ 28 ] = ( (uint128_t) simd[ SIMD_V28_HI ] << 64 ) |
        simd[ SIMD_V28_LO ];
      frame->vector_registers[ 29 ] = ( (uint128_t) simd[ SIMD_V29_HI ] << 64 ) |
        simd[ SIMD_V29_LO ];
      frame->vector_registers[ 30 ] = ( (uint128_t) simd[ SIMD_V30_HI ] << 64 ) |
        simd[ SIMD_V30_LO ];
      frame->vector_registers[ 31 ] = ( (uint128_t) simd[ SIMD_V31_HI ] << 64 ) |
        simd[ SIMD_V31_LO ];
      frame->register_cpsr = ( frame->register_cpsr & ~NZCV_MASK ) |
        gpr[ GPR_NZCV ];
      frame->register_fpsr = gpr[ GPR_FPSR ];
      frame->register_fpcr = gpr[ GPR_FPCR ];
      frame->register_pc = (void *) resume_second_trap_label;
    } else {
      ++resume_trap;
      resume_second_frame = frame;
      resume_frame = *frame;
      SetFatalHandler( NULL, NULL );
      frame->register_fp = resume_fp;
      frame->register_sp = resume_sp;
      frame->register_fpcr = resume_fpcr;
      frame->register_pc = (void *) resume_done_label;
    }

    _CPU_Exception_resume( frame );
  }

  static void ResumeRunOnce( void )
  {
    uintptr_t sp_before;
    uintptr_t sp_after;

    resume_trap = 0;
    resume_first_frame = NULL;
    resume_second_frame = NULL;
    memset( &resume_frame, 0, sizeof( resume_frame ) );
    SetFatalHandler( ResumeFatal, NULL );

    /*
     * The block holds both traps, so the compiler keeps no value of its own in a
     * register which the first trap changes.
     */
    __asm__ volatile( "mov %0, sp" : "=r"( sp_before ) );
    __asm__ volatile(
      "brk #0\n"
      ".globl resume_second_trap_label\n"
      "resume_second_trap_label:\n"
      "brk #0\n"
      ".globl resume_done_label\n"
      "resume_done_label:\n"
      :
      :
      : "memory", "cc", "x0", "x1", "x2", "x3", "x4", "x5", "x6", "x7", "x8",
        "x9", "x10", "x11", "x12", "x13", "x14", "x15", "x16", "x17", "x18",
        "x19", "x20", "x21", "x22", "x23", "x24", "x25", "x26", "x27", "x28",
        "x30", "v0", "v1", "v2", "v3", "v4", "v5", "v6", "v7", "v8", "v9", "v10",
        "v11", "v12", "v13", "v14", "v15", "v16", "v17", "v18", "v19", "v20",
        "v21", "v22", "v23", "v24", "v25", "v26", "v27", "v28", "v29", "v30",
        "v31"
    );
    __asm__ volatile( "mov %0, sp" : "=r"( sp_after ) );
    resume_sp_delta = sp_after - sp_before;
  }

