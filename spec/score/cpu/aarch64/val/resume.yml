test-actions:
- action-brief: |
    Trap, let the handler write a new value into every register of the frame,
    resume, and trap again to capture what the resume restored. Run this once for
    each value with the value inverted, then once unchanged.
  action-code: |
    memcpy(
      resume_gpr_initial,
      resume_gpr_patterns,
      sizeof( resume_gpr_initial )
    );
    memcpy(
      resume_simd_initial,
      resume_simd_patterns,
      sizeof( resume_simd_initial )
    );
    RegisterCheckRun( &resume_gpr_check );
    RegisterCheckRun( &resume_simd_check );
  checks:
  - brief: |
      Check that the resume restored the AArch64 register X0 from the frame.
    code: |
      CheckGpr( GPR_X0 );
    links:
    - role: validation
      uid: ../../req/resume-restore
  - brief: |
      Check that the resume restored the AArch64 register X1 from the frame.
