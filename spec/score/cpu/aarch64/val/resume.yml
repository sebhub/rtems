  static void ResumeFatal(
    rtems_fatal_source source,
    rtems_fatal_code   code,
    void              *arg
  )
  {
    CPU_Exception_frame *frame;

    (void) arg;

    if ( source != RTEMS_FATAL_SOURCE_EXCEPTION ) {
      return;
    }

    frame = (CPU_Exception_frame *) code;

    if ( resume_trap == 0 ) {
      const uint64_t *gpr;
      const uint64_t *simd;

      ++resume_trap;
      resume_first_frame = frame;
      resume_fp = frame->register_fp;
      resume_sp = frame->register_sp;
      resume_fpcr = frame->register_fpcr;
      gpr = resume_gpr_initial;
      simd = resume_simd_initial;
      frame->registers[ 0 ] = gpr[ GPR_X0 ];
      frame->registers[ 1 ] = gpr[ GPR_X1 ];
      frame->registers[ 2 ] = gpr[ GPR_X2 ];
      frame->registers[ 3 ] = gpr[ GPR_X3 ];
      frame->registers[ 4 ] = gpr[ GPR_X4 ];
      frame->registers[ 5 ] = gpr[ GPR_X5 ];
      frame->registers[ 6 ] = gpr[ GPR_X6 ];
      frame->registers[ 7 ] = gpr[ GPR_X7 ];
      frame->registers[ 8 ] = gpr[ GPR_X8 ];
      frame->registers[ 9 ] = gpr[ GPR_X9 ];
      frame->registers[ 10 ] = gpr[ GPR_X10 ];
      frame->registers[ 11 ] = gpr[ GPR_X11 ];
      frame->registers[ 12 ] = gpr[ GPR_X12 ];
      frame->registers[ 13 ] = gpr[ GPR_X13 ];
      frame->registers[ 14 ] = gpr[ GPR_X14 ];
      frame->registers[ 15 ] = gpr[ GPR_X15 ];
      frame->registers[ 16 ] = gpr[ GPR_X16 ];
      frame->registers[ 17 ] = gpr[ GPR_X17 ];
      frame->registers[ 18 ] = gpr[ GPR_X18 ];
      frame->registers[ 19 ] = gpr[ GPR_X19 ];
      frame->registers[ 20 ] = gpr[ GPR_X20 ];
      frame->registers[ 21 ] = gpr[ GPR_X21 ];
      frame->registers[ 22 ] = gpr[ GPR_X22 ];
      frame->registers[ 23 ] = gpr[ GPR_X23 ];
      frame->registers[ 24 ] = gpr[ GPR_X24 ];
      frame->registers[ 25 ] = gpr[ GPR_X25 ];
      frame->registers[ 26 ] = gpr[ GPR_X26 ];
      frame->registers[ 27 ] = gpr[ GPR_X27 ];
      frame->registers[ 28 ] = gpr[ GPR_X28 ];
      frame->registers[ 29 ] = gpr[ GPR_X29 ];
      frame->registers[ 30 ] = gpr[ GPR_X30 ];
      frame->vector_registers[ 0 ] = ( (uint128_t) simd[ SIMD_V0_HI ] << 64 ) |
        simd[ SIMD_V0_LO ];
