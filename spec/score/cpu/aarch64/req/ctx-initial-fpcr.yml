rationale: |
  An FPCR of zero rounds to nearest, enables no trap and keeps subnormal results
  as IEEE 754 defines them. Linux and FreeBSD give a new program the same FPCR.
references: []
requirement-type: functional
text: |
  Where the multilib provides a floating-point unit, the context initialization
  shall give the context an FPCR of zero and an FPSR of zero.
