definition:
- default:
    brief: |
      This member provides the minimum stack frame. A window overflow handler and a
      window underflow handler write to it.
    definition: SPARC_Minimum_stack_frame ${.:name}
    description: null
    kind: member
    name: Stack_frame
  variants: []
- default:
    brief: |
      This member contains the PSR of the interrupted context.
    definition: ${/c/if/uint32_t:/name} ${.:name}
    description: null
    kind: member
    name: psr
  variants: []
- default:
    brief: |
      This member contains the program counter of the interrupted context.
    definition: ${/c/if/uint32_t:/name} ${.:name}
    description: null
    kind: member
    name: pc
  variants: []
