      interrupt_frame.output[ 2 ],
      patterns[ SOURCE_O2 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_O3,
      interrupt_frame.output[ 3 ],
      patterns[ SOURCE_O3 ]
    );
    RegisterCheckRecord(
      self,
