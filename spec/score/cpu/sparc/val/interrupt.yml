      patterns[ SOURCE_O7 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_L0,
      interrupt_frame.windows[ 0 ].local[ 0 ],
      patterns[ SOURCE_L0 ]
    );
    RegisterCheckRecord(
