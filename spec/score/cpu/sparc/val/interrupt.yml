test-brief: |
  Checks that interrupt processing preserves the registers of the interrupted
  context.
test-context: []
test-context-support: null
test-description: |
  The action needs a BSP which supplies the TM27 support. A BSP without it raises
  no interrupt. The wrapper works in a window of its own, so the register window
  preserves the local and the input registers. The local register L7 holds the
  PSR which unmasks the interrupt, so the test checks no value of it.
test-header: null
