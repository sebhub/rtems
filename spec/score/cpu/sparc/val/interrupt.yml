  /*
   * The block enters a new register window.  It loads each value from the
   * table of initial values.  A value of one word sits at the byte offset eight
   * times its source plus four, since SPARC is big-endian.  A pair of
   * floating-point registers sits at the byte offset eight times its source.
   * It loads g1 last, because g1 holds the address of the table.  The local
   * register l7 holds the PSR which unmasks the interrupt.
   */
  #if SPARC_HAS_FPU == 1
  #define ISR_LOAD_FPU \
    "ldd [%%g1 + 232], %%f0\n" \
    "ldd [%%g1 + 240], %%f2\n" \
    "ldd [%%g1 + 248], %%f4\n" \
    "ldd [%%g1 + 256], %%f6\n" \
    "ldd [%%g1 + 264], %%f8\n" \
    "ldd [%%g1 + 272], %%f10\n" \
    "ldd [%%g1 + 280], %%f12\n" \
    "ldd [%%g1 + 288], %%f14\n" \
    "ldd [%%g1 + 296], %%f16\n" \
    "ldd [%%g1 + 304], %%f18\n" \
    "ldd [%%g1 + 312], %%f20\n" \
    "ldd [%%g1 + 320], %%f22\n" \
    "ldd [%%g1 + 328], %%f24\n" \
    "ldd [%%g1 + 336], %%f26\n" \
    "ldd [%%g1 + 344], %%f28\n" \
    "ldd [%%g1 + 352], %%f30\n" \
    "ld [%%g1 + 228], %%fsr\n"

  #define ISR_CLOBBER_FPU , "f0", "f1", "f2", "f3", "f4", "f5", "f6", "f7", \
    "f8", "f9", "f10", "f11", "f12", "f13", "f14", "f15", "f16", "f17", \
    "f18", "f19", "f20", "f21", "f22", "f23", "f24", "f25", "f26", "f27", \
    "f28", "f29", "f30", "f31"
  #else
  #define ISR_LOAD_FPU

  #define ISR_CLOBBER_FPU
  #endif

  #define ISR_LOAD \
    "save %%sp, -96, %%sp\n" \
    "set interrupt_expected, %%g1\n" \
    "st %%sp, [%%g1 + 0]\n" \
    "st %%fp, [%%g1 + 4]\n" \
    "set interrupt_initial, %%g1\n" \
    ISR_LOAD_FPU \
    "ld [%%g1 + 212], %%l7\n" \
    "wr %%l7, 0, %%y\n" \
    "rd %%psr, %%l7\n" \
    "set " RTEMS_XSTRING( PSR_ICC_MASK ) ", %%g2\n" \
    "andn %%l7, %%g2, %%l7\n" \
    "ld [%%g1 + 220], %%g3\n" \
    "and %%g3, %%g2, %%g3\n" \
    "or %%l7, %%g3, %%l7\n" \
    "andn %%l7, 0xf00, %%l7\n" \
    "ld [%%g1 + 100], %%l0\n" \
    "ld [%%g1 + 108], %%l1\n" \
    "ld [%%g1 + 116], %%l2\n" \
    "ld [%%g1 + 124], %%l3\n" \
    "ld [%%g1 + 132], %%l4\n" \
    "ld [%%g1 + 140], %%l5\n" \
    "ld [%%g1 + 148], %%l6\n" \
    "ld [%%g1 + 156], %%i0\n" \
    "ld [%%g1 + 164], %%i1\n" \
    "ld [%%g1 + 172], %%i2\n" \
    "ld [%%g1 + 180], %%i3\n" \
    "ld [%%g1 + 188], %%i4\n" \
    "ld [%%g1 + 196], %%i5\n" \
    "ld [%%g1 + 204], %%i7\n" \
    "ld [%%g1 + 44], %%o0\n" \
    "ld [%%g1 + 52], %%o1\n" \
    "ld [%%g1 + 60], %%o2\n" \
    "ld [%%g1 + 68], %%o3\n" \
    "ld [%%g1 + 76], %%o4\n" \
    "ld [%%g1 + 84], %%o5\n" \
    "ld [%%g1 + 92], %%o7\n" \
    "ld [%%g1 + 12], %%g2\n" \
    "ld [%%g1 + 20], %%g3\n" \
    "ld [%%g1 + 28], %%g4\n" \
    "ld [%%g1 + 36], %%g5\n" \
    "ld [%%g1 + 4], %%g1\n"

  extern const char interrupt_trap_label[];

  extern const char interrupt_done_label[];

  uint64_t interrupt_initial[ SOURCE_MAX ];

  /* The stack pointer and the frame pointer of the new window */
  uint32_t interrupt_expected[ 2 ];

  static CPU_Exception_frame interrupt_frame;

  static volatile int interrupt_count;

  static int interrupt_count_at_trap;

  static uint32_t interrupt_handler_psr;

  static uint32_t interrupt_handler_processor;

  static uint32_t interrupt_g7;

  static const Per_CPU_Control *interrupt_cpu;

  static uint32_t interrupt_trap_processor;

  static CallWithinISRRequest interrupt_request;

  static void InterruptHandler( void *arg )
  {
    uint32_t psr;

    (void) arg;
    __asm__ volatile ( "rd %%psr, %0" : "=r" ( psr ) );
    interrupt_handler_psr = psr;
    interrupt_handler_processor = rtems_scheduler_get_processor();
    ++interrupt_count;
  }

  /*
   * The trap after the interrupt captures every register.  The frame is the
   * store-out, so no register under test addresses it.
   */
  static void InterruptFatal(
    rtems_fatal_source source,
    rtems_fatal_code   code,
    void              *arg
  )
  {
    CPU_Exception_frame *frame;

    (void) arg;

    if ( source != RTEMS_FATAL_SOURCE_EXCEPTION ) {
      return;
    }

    frame = (CPU_Exception_frame *) code;
    /* The handler runs on the processor which takes the trap */
    interrupt_cpu = _Per_CPU_Get_snapshot();
    interrupt_trap_processor = _Per_CPU_Get_index( interrupt_cpu );
    interrupt_frame = *frame;
    interrupt_count_at_trap = interrupt_count;
    SetFatalHandler( NULL, NULL );
    frame->pc = (uint32_t) interrupt_done_label;
    frame->npc = frame->pc + 4;
    _CPU_Exception_resume( frame );
  }

  static void InterruptRun( RegisterCheck *self, void *arg )
  {
    rtems_interrupt_level level;
    const uint64_t       *patterns;
  #if SPARC_HAS_FPU == 1
    uint32_t              fsr;
  #endif

    (void) arg;
    memset( &interrupt_frame, 0xff, sizeof( interrupt_frame ) );
    interrupt_count = 0;
    interrupt_count_at_trap = 0;
    interrupt_handler_psr = 0xffffffff;
    interrupt_handler_processor = 0xffffffff;
    interrupt_cpu = NULL;
    interrupt_trap_processor = 0xfffffffe;
    __asm__ volatile ( "mov %%g7, %0" : "=r" ( interrupt_g7 ) );
  #if SPARC_HAS_FPU == 1
    __asm__ volatile ( "st %%fsr, %0" : "=m" ( fsr ) );
  #endif
    SetFatalHandler( InterruptFatal, NULL );

    /*
     * The interrupt is raised while it is masked, so no call happens after
     * the block loads the registers.  The write to the PSR unmasks it and
     * takes effect within three instructions, so the interrupt arrives before
     * the trap.
     */
    rtems_interrupt_local_disable( level );
    CallWithinISRSubmit( &interrupt_request );
    __asm__ volatile (
      ISR_LOAD
      "wr %%l7, 0, %%psr\n"
      "nop\n"
      "nop\n"
      "nop\n"
      ".globl interrupt_trap_label\n"
      "interrupt_trap_label:\n"
      "unimp 0\n"
      ".globl interrupt_done_label\n"
      "interrupt_done_label:\n"
      "restore\n"
      :
      :
      : "memory", "cc", "g1", "g2", "g3", "g4", "g5", "o0", "o1", "o2", "o3",
        "o4", "o5", "o7" ISR_CLOBBER_FPU
    );
    rtems_interrupt_local_enable( level );
  #if SPARC_HAS_FPU == 1
    __asm__ volatile ( "ld %0, %%fsr\nnop\nnop\nnop" : : "m" ( fsr ) );
  #endif

    patterns = interrupt_patterns;
    RegisterCheckRecord(
      self,
      SLOT_G1,
      interrupt_frame.global[ 1 ],
      patterns[ SOURCE_G1 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_G2,
      interrupt_frame.global[ 2 ],
      patterns[ SOURCE_G2 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_G3,
      interrupt_frame.global[ 3 ],
      patterns[ SOURCE_G3 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_G4,
      interrupt_frame.global[ 4 ],
      patterns[ SOURCE_G4 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_G5,
      interrupt_frame.global[ 5 ],
      patterns[ SOURCE_G5 ]
    );
    RegisterCheckRecord(
