requirement-type: functional
text: |
  In uniprocessor configurations, while the executing thread is no floating-point
  thread, when it executes a floating-point instruction, the floating-point
  disabled trap handler shall terminate the system with the fatal source
  ${/score/interr/if/internal-error-core:/name} and the fatal code
  ${/score/interr/if/illegal-use-of-floating-point-unit:/name}.
type: requirement
