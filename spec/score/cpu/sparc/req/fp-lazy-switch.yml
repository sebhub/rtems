requirement-type: functional
text: |
  In uniprocessor configurations, the floating-point disabled trap handler shall
  save the floating-point context of the owner of the floating-point unit. It
  shall restore the floating-point context of the executing floating-point thread
  and enable the floating-point unit.
type: requirement
