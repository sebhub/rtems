links:
- role: requirement-refinement
  uid: isr-floating-point-off
rationale: null
references: []
requirement-type: functional
text: |
  In uniprocessor configurations, while an interrupt handler executes, when it
  executes a floating-point instruction, the floating-point disabled trap handler
  shall terminate the system with the fatal source
  ${/score/interr/if/internal-error-core:/name} and the fatal code
  ${/score/interr/if/illegal-use-of-floating-point-unit:/name}.
type: requirement
