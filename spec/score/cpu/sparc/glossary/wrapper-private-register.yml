term: SPARC wrapper-private register
text: |
  A register which the interrupt wrapper uses for its own bookkeeping. These are
  l0 to l7 of the trap window. A trap moves the current window pointer, so the
  wrapper receives eight local registers which the interrupted context does not
  use.
