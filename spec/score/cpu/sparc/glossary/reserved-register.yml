term: SPARC reserved register
text: |
  A register which the ABI reserves and marks neither preserved nor destroyed.
  g2, g3 and g4 belong to the application. g5, g6 and g7 belong to the system.
  RTEMS gives g6 the per-CPU control and g7 the thread pointer.
