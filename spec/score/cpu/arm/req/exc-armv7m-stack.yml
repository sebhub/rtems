  uid: ../../req/exc-stack
rationale: |
  The processor uses the main stack in Handler mode. The start code sets the main
  stack pointer to the end of the interrupt stack area. The threads run on the
  process stack.
references: []
requirement-type: functional
text: |
  On ARMv7-M, the default exception handler shall use the interrupt stack of the
  processor.
