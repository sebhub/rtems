test-actions:
- action-brief: |
    Initialize the exception frame and VFP context. Prepare register values.
    Trigger an FIQ exception. Save the exception frame. Return to the action. Run
    this through the register check, once for each value inverted, then once
    unchanged.
  action-code: |
    #ifdef TM27_INTERRUPT_VECTOR_FAST
      _TM27_Prepare_fast( &fiq_trigger_address, &fiq_trigger_value );
      T_not_null( fiq_trigger_address );

      if ( fiq_trigger_address != NULL ) {
        ${exception-frame:/test-run}(
          FiqScenario,
          ( UINT32_C( 1 ) << 13 ) | ( UINT32_C( 1 ) << 14 ),
          ARM_EXCEPTION_FIQ
        );
      }
    #else
      T_true( false );
    #endif
  checks:
  - brief: |
      Check that the exception frame has the expected vector number.
    code: |
      ExceptionFrameCheckVector();
    links:
    - role: validation
      uid: ../req/exception-type-fiq
  links: []
test-brief: |
  Tests the default FIQ exception handling.
test-context: []
