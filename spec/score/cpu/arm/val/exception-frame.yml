    Run the scenario of the caller through the register check, once for each value
    with the value inverted, then once unchanged.
  action-code: |
    exception_frame_scenario = ctx->scenario;
    ExceptionFrameSetup( ctx->overrides, ctx->vector );
    RegisterCheckRun( &exception_frame_check );
