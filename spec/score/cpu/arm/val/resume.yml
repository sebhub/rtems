  static const uint64_t resume_patterns[ SOURCE_MAX ] = {
    0x51525354,
    0x52535455,
    0x53545556,
    0x54555657,
    0x55565758,
    0x56575859,
    0x5758595a,
    0x58595a5b,
    0x595a5b5c,
    0x5a5b5c5d,
    0x5b5c5d5e,
    0x5c5d5e5f,
    0x5d5e5f60,
    0x5e5f6061,
    0x50000000,
  #ifdef ARM_MULTILIB_VFP
    0x6162636465666768,
    0x6263646566676869,
    0x636465666768696a,
    0x6465666768696a6b,
    0x65666768696a6b6c,
    0x666768696a6b6c6d,
    0x6768696a6b6c6d6e,
    0x68696a6b6c6d6e6f,
    0x696a6b6c6d6e6f70,
    0x6a6b6c6d6e6f7071,
    0x6b6c6d6e6f707172,
    0x6c6d6e6f70717273,
    0x6d6e6f7071727374,
    0x6e6f707172737475,
    0x6f70717273747576,
    0x7071727374757677,
  #ifdef ARM_MULTILIB_VFP_D32
    0x7172737475767778,
    0x7273747576777879,
    0x737475767778797a,
    0x7475767778797a7b,
    0x75767778797a7b7c,
    0x767778797a7b7c7d,
