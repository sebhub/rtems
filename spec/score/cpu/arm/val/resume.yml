    0x7a7b7c7d7e7f8081,
    0x7b7c7d7e7f808182,
    0x7c7d7e7f80818283,
    0x7d7e7f8081828384,
    0x7e7f808182838485,
    0x7f80818283848586,
    0x8081828384858687,
  #endif
  #endif
  #if defined(ARM_MULTILIB_ARCH_V7M)
    RESUME_BASEPRI_TRAP_2,
  #endif
