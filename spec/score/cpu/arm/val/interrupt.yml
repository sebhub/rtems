test-actions:
- action-brief: |
    Load a distinct pattern into every register the interrupt has to preserve.
    Raise the interrupt. Trap, so the frame captures every register. Run this once
    for each register with the pattern of that register inverted, then once
    unchanged.
  action-code: |
    memcpy( interrupt_initial, interrupt_patterns, sizeof( interrupt_initial ) );
    interrupt_request.handler = InterruptHandler;
    interrupt_request.arg = NULL;

    #ifdef TM27_INTERRUPT_VECTOR_DEFAULT
    RegisterCheckRun( &interrupt_check );
    #endif
  checks:
  - brief: |
      Check that the interrupt preserved the ARM core register R0.
    code: |
      CheckSlot( SLOT_R0 );
    links:
    - role: validation
      uid: ../../req/isr-call-used
  - brief: |
      Check that the interrupt preserved the ARM core register R1.
    code: |
      CheckSlot( SLOT_R1 );
    links:
    - role: validation
      uid: ../../req/isr-call-used
  - brief: |
      Check that the interrupt preserved the ARM core register R2.
    code: |
      CheckSlot( SLOT_R2 );
    links:
    - role: validation
      uid: ../../req/isr-call-used
  - brief: |
      Check that the interrupt preserved the ARM core register R3.
    code: |
      CheckSlot( SLOT_R3 );
    links:
    - role: validation
      uid: ../../req/isr-call-used
  - brief: |
      Check that the interrupt preserved the ARM core register R12.
    code: |
      CheckSlot( SLOT_R12 );
    links:
    - role: validation
      uid: ../../req/isr-call-used
  - brief: |
      Check that the interrupt preserved the wrapper-private ARM core register R7.
    code: |
      CheckSlot( SLOT_R7 );
    links:
    - role: validation
      uid: ../req/isr-wrapper-private-set
  - brief: |
      Check that the interrupt preserved the wrapper-private ARM core register R9.
