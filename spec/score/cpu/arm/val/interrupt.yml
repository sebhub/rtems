test-support: |
  #define _RTEMS_TMTEST27
  #include <tm27.h>

  extern const char interrupt_trap_label[];

  extern const char interrupt_done_label[];

  /*
   * On ARMv4, the frame of an undefined instruction holds the address of the
   * next instruction.  On ARMv7-M, it holds the address of the trap.
   */
  #if defined(ARM_MULTILIB_ARCH_V7M)
  #define ISR_TRAP_PC_OFFSET 0
  #elif defined(__thumb__)
  #define ISR_TRAP_PC_OFFSET 2
  #else
  #define ISR_TRAP_PC_OFFSET 4
  #endif

  #if defined(ARM_MULTILIB_ARCH_V4) && __ARM_ARCH >= 6
  /* These are the condition flags, the Q flag and the GE flags. */
  #define ISR_STATUS UINT64_C( 0xf80f0000 )
  #define ISR_STATUS_BITS UINT64_C( 0xa8050000 )
  #define ISR_STATUS_WRITE "msr APSR_nzcvqg, r1\n"
  #else
  /* These are the condition flags and the Q flag. */
  #define ISR_STATUS UINT64_C( 0xf8000000 )
  #define ISR_STATUS_BITS UINT64_C( 0xa8000000 )
  #define ISR_STATUS_WRITE "msr APSR_nzcvq, r1\n"
  #endif

  /*
   * These are the condition flags, AHP, DN, FZ, the rounding mode and the
   * cumulative exception flags of FPSCR.  An Advanced SIMD unit adds QC.  The
   * mask covers no trap enable, no vector length and no vector stride.
   */
  #if defined( __ARM_NEON )
  #define FPSCR UINT64_C( 0xffc0009f )
  #else
  #define FPSCR UINT64_C( 0xf7c0009f )
  #endif

  typedef enum {
    SOURCE_R0,
    SOURCE_R1,
    SOURCE_R2,
    SOURCE_R3,
    SOURCE_R12,
    SOURCE_R7,
    SOURCE_R9,
    SOURCE_STATUS,
  #ifdef ARM_MULTILIB_VFP
    SOURCE_FPSCR,
    SOURCE_D0,
    SOURCE_D1,
    SOURCE_D2,
    SOURCE_D3,
    SOURCE_D4,
    SOURCE_D5,
    SOURCE_D6,
    SOURCE_D7,
  #ifdef ARM_MULTILIB_VFP_D32
    SOURCE_D16,
    SOURCE_D17,
    SOURCE_D18,
    SOURCE_D19,
    SOURCE_D20,
    SOURCE_D21,
    SOURCE_D22,
    SOURCE_D23,
    SOURCE_D24,
    SOURCE_D25,
    SOURCE_D26,
    SOURCE_D27,
    SOURCE_D28,
    SOURCE_D29,
    SOURCE_D30,
    SOURCE_D31,
  #endif
  #endif
    SOURCE_R4,
    SOURCE_R5,
    SOURCE_R6,
    SOURCE_R8,
    SOURCE_R10,
    SOURCE_R11,
    SOURCE_COUNT_AT_TRAP,
    SOURCE_PC,
    SOURCE_MAX
  } Source;

  typedef enum {
    SLOT_R0,
    SLOT_R1,
    SLOT_R2,
    SLOT_R3,
    SLOT_R12,
    SLOT_R7,
    SLOT_R9,
    SLOT_STATUS,
  #ifdef ARM_MULTILIB_VFP
    SLOT_FPSCR,
    SLOT_D0,
    SLOT_D1,
    SLOT_D2,
    SLOT_D3,
    SLOT_D4,
    SLOT_D5,
    SLOT_D6,
    SLOT_D7,
  #ifdef ARM_MULTILIB_VFP_D32
    SLOT_D16,
    SLOT_D17,
    SLOT_D18,
    SLOT_D19,
    SLOT_D20,
    SLOT_D21,
    SLOT_D22,
    SLOT_D23,
    SLOT_D24,
    SLOT_D25,
    SLOT_D26,
    SLOT_D27,
    SLOT_D28,
    SLOT_D29,
    SLOT_D30,
    SLOT_D31,
  #endif
  #endif
    SLOT_R4,
    SLOT_R5,
    SLOT_R6,
    SLOT_R8,
    SLOT_R10,
    SLOT_R11,
    SLOT_COUNT_AT_TRAP,
    SLOT_PC,
    SLOT_MAX
  } Slot;

  /* The block loads each register from the byte offset eight times its source. */
  RTEMS_STATIC_ASSERT( SOURCE_R9 == 6, source_r9 );
  RTEMS_STATIC_ASSERT( SOURCE_STATUS == 7, source_status );
  #ifdef ARM_MULTILIB_VFP
  RTEMS_STATIC_ASSERT( SOURCE_FPSCR == 8, source_fpscr );
  RTEMS_STATIC_ASSERT( SOURCE_D0 == 9, source_d0 );
  #ifdef ARM_MULTILIB_VFP_D32
  RTEMS_STATIC_ASSERT( SOURCE_D16 == 17, source_d16 );
  #endif
  #endif

