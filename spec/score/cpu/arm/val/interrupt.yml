      ISR_LOAD_VFP_D32
  #else
  #define ISR_LOAD_VFP
  #endif

  #ifdef ARM_MULTILIB_VFP
  #ifdef ARM_MULTILIB_VFP_D32
  #define ISR_CLOBBER_VFP , "d0", "d1", "d2", "d3", "d4", "d5", "d6", "d7", \
    "d16", "d17", "d18", "d19", "d20", "d21", "d22", "d23", "d24", "d25", \
    "d26", "d27", "d28", "d29", "d30", "d31"
