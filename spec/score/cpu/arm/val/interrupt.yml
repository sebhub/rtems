  /*
   * The resume keeps the patterns in the registers.  The fatal handler puts
   * back the call-saved registers, because r7 or r11 may be the frame pointer.
   */
  #define ISR_CLOBBER "r0", "r1", "r2", "r3", "r12", "lr" ISR_CLOBBER_VFP

  #ifdef ARM_MULTILIB_VFP_D32
  #define ISR_CHANGE_VFP_D32 \
      "vmov d16, r0, r0\n" \
      "vmov d17, r0, r0\n" \
      "vmov d18, r0, r0\n" \
      "vmov d19, r0, r0\n" \
      "vmov d20, r0, r0\n" \
      "vmov d21, r0, r0\n" \
      "vmov d22, r0, r0\n" \
