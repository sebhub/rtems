  /*
   * The handler writes zero to each call-used register under test, to the
   * status flags and to FPSCR.  A value which the interrupt processing does
   * not restore then fails its check.
   */
  static void InterruptHandler( void *arg )
  {
    (void) arg;
    ++interrupt_count;
    __asm__ volatile( "mov r0, #0\n"
                      "mov r1, #0\n"
                      "mov r2, #0\n"
                      "mov r3, #0\n"
                      "mov r12, #0\n" ISR_STATUS_WRITE ISR_CHANGE_VFP
                      :
                      :
                      : "cc", "r0", "r1", "r2", "r3", "r12" ISR_CLOBBER_VFP );
  }

  #if defined(ARM_MULTILIB_ARCH_V7M)
  /*
   * The interrupt level of rtems_interrupt_local_disable() is a BASEPRI
   * value.  It masks the interrupt of the test.
   */
  #define ISR_UNMASK_LEVEL "mov lr, #0\n" "msr basepri, lr\n"
  #else
  #define ISR_UNMASK_LEVEL "cpsie i\n"
  #endif

  /* The synchronization takes the pending interrupt before the trap. */
  #ifdef ARM_MULTILIB_HAS_BARRIER_INSTRUCTIONS
  #define ISR_UNMASK ISR_UNMASK_LEVEL "isb\n"
  #else
  #define ISR_UNMASK ISR_UNMASK_LEVEL
  #endif

  #define ISR_SAVE \
    "ldr r0, =interrupt_restore_r7\n" \
    "str r7, [r0]\n" \
    "ldr r0, =interrupt_restore_r9\n" \
    "str r9, [r0]\n" \
    "ldr r0, =interrupt_restore_r4\n" \
    "str r4, [r0]\n" \
    "ldr r0, =interrupt_restore_r5\n" \
    "str r5, [r0]\n" \
    "ldr r0, =interrupt_restore_r6\n" \
    "str r6, [r0]\n" \
    "ldr r0, =interrupt_restore_r8\n" \
    "str r8, [r0]\n" \
    "ldr r0, =interrupt_restore_r10\n" \
    "str r10, [r0]\n" \
    "ldr r0, =interrupt_restore_r11\n" \
    "str r11, [r0]\n"

  /* The block loads r0 last, because r0 holds the address of the table. */
  #define ISR_LOAD \
    ISR_SAVE \
    "ldr r0, =interrupt_initial\n" \
    ISR_LOAD_VFP \
    "ldr r1, [r0, #56]\n" \
    ISR_STATUS_WRITE \
    "ldr r1, [r0, #8]\n" \
    "ldr r2, [r0, #16]\n" \
    "ldr r3, [r0, #24]\n" \
    "ldr r12, [r0, #32]\n" \
    "ldr r7, [r0, #40]\n" \
    "ldr r9, [r0, #48]\n" \
    "ldr r4, [r0, %[r4]]\n" \
    "ldr r5, [r0, %[r5]]\n" \
    "ldr r6, [r0, %[r6]]\n" \
    "ldr r8, [r0, %[r8]]\n" \
    "ldr r10, [r0, %[r10]]\n" \
    "ldr r11, [r0, %[r11]]\n" \
    "ldr r0, [r0, #0]\n"

  /*
   * The trap after the interrupt captures every register.  The frame is the
   * store-out, so no register under test addresses it.
   */
  static void InterruptFatal(
    rtems_fatal_source source,
    rtems_fatal_code   code,
    void              *arg
  )
  {
    CPU_Exception_frame *frame;

    (void) arg;

    if ( source != RTEMS_FATAL_SOURCE_EXCEPTION ) {
      return;
    }

    frame = (CPU_Exception_frame *) code;
    interrupt_frame = *frame;
  #ifdef ARM_MULTILIB_VFP
    interrupt_vfp_context = *frame->vfp_context;
    ( (ARM_VFP_context *) frame->vfp_context )->register_fpscr = interrupt_fpscr;
  #endif
    interrupt_count_at_trap = interrupt_count;
    SetFatalHandler( NULL, NULL );
    frame->register_r7 = interrupt_restore_r7;
    frame->register_r9 = interrupt_restore_r9;
    frame->register_r4 = interrupt_restore_r4;
    frame->register_r5 = interrupt_restore_r5;
    frame->register_r6 = interrupt_restore_r6;
    frame->register_r8 = interrupt_restore_r8;
    frame->register_r10 = interrupt_restore_r10;
    frame->register_r11 = interrupt_restore_r11;
    frame->register_pc = (void *) interrupt_done_label;
    _CPU_Exception_resume( frame );
  }

  static void InterruptRun( RegisterCheck *self, void *arg )
  {
    rtems_interrupt_level level;
    const uint64_t       *patterns;

    (void) arg;
    memset( &interrupt_frame, 0, sizeof( interrupt_frame ) );
  #ifdef ARM_MULTILIB_VFP
    memset( &interrupt_vfp_context, 0, sizeof( interrupt_vfp_context ) );
  #endif
    interrupt_count = 0;
    interrupt_count_at_trap = 0;
  #ifdef ARM_MULTILIB_VFP
    __asm__ volatile( "vmrs %0, FPSCR" : "=r"( interrupt_fpscr ) );
  #endif
    SetFatalHandler( InterruptFatal, NULL );

    /*
     * The interrupt is raised while it is masked, so no call happens after
     * the block loads the registers.  The block unmasks it, and the
     * interrupt is taken there.
     */
    rtems_interrupt_local_disable( level );
    CallWithinISRSubmit( &interrupt_request );
    __asm__ volatile( ISR_LOAD ISR_UNMASK
                      ".globl interrupt_trap_label\n"
                      "interrupt_trap_label:\n"
                      "udf #0\n"
                      ".globl interrupt_done_label\n"
                      "interrupt_done_label:\n"
                      :
                      : [r4] "i"( 8 * SOURCE_R4 ),
                        [r5] "i"( 8 * SOURCE_R5 ),
                        [r6] "i"( 8 * SOURCE_R6 ),
                        [r8] "i"( 8 * SOURCE_R8 ),
                        [r10] "i"( 8 * SOURCE_R10 ),
                        [r11] "i"( 8 * SOURCE_R11 )
                      : "memory", "cc", ISR_CLOBBER );
    rtems_interrupt_local_enable( level );

    patterns = interrupt_patterns;
    RegisterCheckRecord(
      self,
      SLOT_R0,
      interrupt_frame.register_r0,
      patterns[ SOURCE_R0 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_R1,
      interrupt_frame.register_r1,
      patterns[ SOURCE_R1 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_R2,
      interrupt_frame.register_r2,
      patterns[ SOURCE_R2 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_R3,
      interrupt_frame.register_r3,
      patterns[ SOURCE_R3 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_R12,
      interrupt_frame.register_r12,
      patterns[ SOURCE_R12 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_R7,
      interrupt_frame.register_r7,
      patterns[ SOURCE_R7 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_R9,
      interrupt_frame.register_r9,
      patterns[ SOURCE_R9 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_R4,
      interrupt_frame.register_r4,
      patterns[ SOURCE_R4 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_R5,
      interrupt_frame.register_r5,
      patterns[ SOURCE_R5 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_R6,
      interrupt_frame.register_r6,
      patterns[ SOURCE_R6 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_R8,
      interrupt_frame.register_r8,
      patterns[ SOURCE_R8 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_R10,
      interrupt_frame.register_r10,
      patterns[ SOURCE_R10 ]
    );
    RegisterCheckRecord(
      self,
      SLOT_R11,
      interrupt_frame.register_r11,
      patterns[ SOURCE_R11 ]
    );
  #if defined(ARM_MULTILIB_ARCH_V7M)
    RegisterCheckRecord(
      self,
      SLOT_STATUS,
      interrupt_frame.register_xpsr,
      patterns[ SOURCE_STATUS ]
    );
  #else
    RegisterCheckRecord(
      self,
      SLOT_STATUS,
      interrupt_frame.register_cpsr,
      patterns[ SOURCE_STATUS ]
    );
  #endif
  #ifdef ARM_MULTILIB_VFP
    RegisterCheckRecord(
      self,
      SLOT_FPSCR,
      interrupt_vfp_context.register_fpscr,
      patterns[ SOURCE_FPSCR ]
    );
  #endif

  #ifdef ARM_MULTILIB_VFP
    {
      const uint64_t *d;
      size_t          i;

      d = &interrupt_vfp_context.register_d0;

      for ( i = 0; i < 8; ++i ) {
        RegisterCheckRecord(
          self,
          SLOT_D0 + i,
          d[ i ],
          patterns[ SOURCE_D0 + i ]
        );
      }

  #ifdef ARM_MULTILIB_VFP_D32
      d = &interrupt_vfp_context.register_d16;

      for ( i = 0; i < 16; ++i ) {
        RegisterCheckRecord(
          self,
          SLOT_D16 + i,
          d[ i ],
          patterns[ SOURCE_D16 + i ]
        );
      }
  #endif
    }
  #endif

    RegisterCheckRecord(
      self,
      SLOT_COUNT_AT_TRAP,
      (uint64_t) interrupt_count_at_trap,
      1
    );

    RegisterCheckRecord(
      self,
      SLOT_PC,
      (uintptr_t) interrupt_frame.register_pc ==
        (uintptr_t) interrupt_trap_label + ISR_TRAP_PC_OFFSET,
      1
    );
  }

  static RegisterCheck interrupt_check = {
    .sources = interrupt_sources,
    .source_count = SOURCE_MAX,
    .slots = interrupt_slots,
    .slot_count = SLOT_MAX,
    .initial = interrupt_initial,
    .run = InterruptRun
  };

  static void CheckSlot( Slot slot )
  {
    RegisterCheckVerify( &interrupt_check, slot );
  }
