    SLOT_SAVED_R7,
    SLOT_SAVED_R8,
    SLOT_SAVED_R9,
    SLOT_SAVED_R10,
    SLOT_SAVED_R11,
  #ifdef ARM_MULTILIB_VFP
    SLOT_FRAME_D8,
    SLOT_FRAME_D9,
    SLOT_FRAME_D10,
    SLOT_FRAME_D11,
    SLOT_FRAME_D12,
    SLOT_FRAME_D13,
    SLOT_FRAME_D14,
    SLOT_FRAME_D15,
    SLOT_SAVED_D8,
    SLOT_SAVED_D9,
    SLOT_SAVED_D10,
    SLOT_SAVED_D11,
    SLOT_SAVED_D12,
    SLOT_SAVED_D13,
    SLOT_SAVED_D14,
    SLOT_SAVED_D15,
  #endif
