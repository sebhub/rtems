- tx-support.h
test-setup: null
test-stop: null
test-support: |
  extern const char context_done_label[];

  extern const char context_return_label[];

  /*
   * These are the condition flags, AHP, DN, FZ, the rounding mode and the
   * cumulative exception flags of FPSCR.  An Advanced SIMD unit adds QC.  The
   * mask covers no trap enable, no vector length and no vector stride.
   */
  #if defined( __ARM_NEON )
  #define FPSCR UINT64_C( 0xffc0009f )
  #else
  #define FPSCR UINT64_C( 0xf7c0009f )
  #endif

  typedef enum {
    SOURCE_R4,
    SOURCE_R5,
    SOURCE_R6,
    SOURCE_R7,
    SOURCE_R8,
    SOURCE_R9,
    SOURCE_R10,
    SOURCE_R11,
  #ifdef ARM_MULTILIB_VFP
    SOURCE_D8,
    SOURCE_D9,
    SOURCE_D10,
    SOURCE_D11,
    SOURCE_D12,
    SOURCE_D13,
    SOURCE_D14,
    SOURCE_D15,
  #endif
    SOURCE_TRAP,
    SOURCE_LR,
    SOURCE_SP,
  #ifdef ARM_MULTILIB_HAS_THREAD_ID_REGISTER
    SOURCE_HEIR_TP,
    SOURCE_EXEC_TP,
  #endif
  #ifdef ARM_MULTILIB_VFP
    SOURCE_FPSCR,
    SOURCE_HEIR_FPSCR,
    SOURCE_INIT,
  #endif
    SOURCE_MAX
  } Source;

  typedef enum {
    SLOT_FRAME_R4,
    SLOT_FRAME_R5,
