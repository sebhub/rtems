test-actions:
- action-brief: |
    Load a distinct pattern into every call-saved register and into FPSCR. Give the
    heir its own thread pointer and FPSCR. Call the context switch directly. The
    heir switches back. Trap, so the frame reports every register. Run this once
    for each register with the pattern of that register inverted, then once
    unchanged.
  action-code: |
    memcpy( context_initial, context_patterns, sizeof( context_initial ) );
    RegisterCheckRun( &context_check );
  checks:
  - brief: |
      Check that the switch restored the ARM core register R4.
    code: |
      CheckSlot( SLOT_FRAME_R4 );
    links:
    - role: validation
      uid: ../../req/ctx-call-saved
  - brief: |
      Check that the switch restored the ARM core register R5.
