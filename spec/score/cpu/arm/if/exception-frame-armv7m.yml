- default:
    brief: |
      This member contains the XPSR.
    definition: ${/c/if/uint32_t:/name} ${.:name}
    description: null
    kind: member
    name: register_xpsr
  variants: []
- default:
    brief: |
      This member contains the exception vector number.
    definition: ${/c/if/uint32_t:/name} ${.:name}
    description: null
    kind: member
    name: vector
  variants: []
- default:
    brief: |
      This member points to the VFP context of the exception.
    definition: const ARM_VFP_context *${.:name}
    description: null
    kind: member
    name: vfp_context
  variants: []
- default:
    brief: |
      This member contains the BASEPRI register of the interrupted context.
    definition: ${/c/if/uint32_t:/name} ${.:name}
    description: null
    kind: member
    name: register_basepri
  variants: []
- default:
    brief: |
      This member contains the EXC_RETURN value of the exception.
    definition: ${/c/if/uint32_t:/name} ${.:name}
    description: |
      The value selects the mode, the stack and the frame type of the exception
      return.
    kind: member
    name: exc_return
  variants: []
- default:
    brief: |
      This member aligns the frame to eight bytes.
    definition: ${/c/if/uint32_t:/name} ${.:name}
    description: null
    kind: member
    name: reserved_for_stack_alignment
  variants: []
