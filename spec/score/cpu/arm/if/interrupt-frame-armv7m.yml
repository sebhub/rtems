definition-kind: typedef-only
description: |
  The processor stacks the frame on the entry of an exception, as section B1.5.6
  of the ARMv7-M Architecture Reference Manual defines it. The members from d0 on
  hold the floating-point context. The processor stacks it only if CONTROL.FPCA
  is set at the exception entry. With the lazy state preservation of FPCCR.LSPEN,
  the processor reserves the space and writes it at the first floating-point
  instruction of the handler.
