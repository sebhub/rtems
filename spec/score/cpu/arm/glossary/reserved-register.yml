term: ARM reserved register
text: |
  A register which the ABI reserves and marks neither preserved nor destroyed.
  This is r9. aapcs32 leaves its role to a platform standard. A variant
  designates it v6 as a call-saved register, SB as a static base or TR as a
  thread register.
