term: ARM wrapper-private register
text: |
  A call-saved register which the interrupt wrapper uses for its own bookkeeping.
  These are r7 and r9. arm_exc_interrupt.S names them STACK_POINTER_ADJUST and
  NON_VOLATILE_SCRATCH.
