    - Forever
    Nest: all
- enabled-by: true
  post-conditions:
    OwnerDuringCall: None
    WaitStateDuringCall: Condition
    OwnerAfterCall: Caller
    NestAfterCall: Same
    Status: Ok
  pre-conditions:
    Recursive: all
