test-actions:
- action-brief: |
    Submit an ISR request during system initialization. Check the stack of the
    interrupted context while the ISR request is serviced. Store the result of the
    check in interrupted_stack_at_multitasking_start_is_valid.
  action-code: |
    /*
     * The actions are performed during system initialization and the
     * multitasking start.
     */
  checks:
  - brief: |
      Check that stack of the interrupted context was valid when an interrupt was
      serviced during the multitasking start.
    code: |
      T_true(
        interrupted_stack_at_multitasking_start_is_valid,
        "the stack of the interrupted context was not the stack of the running"
        " thread; a zero means that the interrupt dispatch of this architecture"
        " has no wrapper in this test and the address was never taken"
      );
    links:
    - role: validation
      uid: ../req/stack-at-start-multitasking-heir
    - role: validation
      uid: ../req/stack-at-start-multitasking-per-cpu
  links: []
test-brief: |
  Tests general interrupt support behaviour.
test-context: []
test-context-support: null
test-description: null
test-header: null
test-includes:
- rtems.h
- rtems/sysinit.h
- rtems/score/thread.h
- rtems/score/percpu.h
test-local-includes:
- tx-support.h
test-setup: null
test-stop: null
test-support: |
  static uintptr_t interrupted_stack_at_multitasking_start;

  static bool interrupted_stack_at_multitasking_start_is_valid;

  #if defined(__aarch64__)
  void __real_bsp_interrupt_dispatch( void );

  void __wrap_bsp_interrupt_dispatch( void );

  void __wrap_bsp_interrupt_dispatch( void )
  {
    if ( interrupted_stack_at_multitasking_start == 0 ) {
      uintptr_t             sp;
      rtems_interrupt_level level;

      rtems_interrupt_local_disable( level );
      __asm__ volatile (
        "msr spsel, #1\n"
        "mov %0, sp\n"
        "msr spsel, #0"
        : "=r" ( sp )
      );
      rtems_interrupt_local_enable( level );

      interrupted_stack_at_multitasking_start = sp;
    }

    __real_bsp_interrupt_dispatch();
  }
  #endif

  #if defined(ARM_MULTILIB_ARCH_V4)
  void __real_bsp_interrupt_dispatch( void );

  void __wrap_bsp_interrupt_dispatch( void );

  void __wrap_bsp_interrupt_dispatch( void )
  {
    register uintptr_t sp __asm__( "9" );

    if ( interrupted_stack_at_multitasking_start == 0 ) {
      interrupted_stack_at_multitasking_start = sp;
    }

    __real_bsp_interrupt_dispatch();
  }
  #endif

  #if defined(__or1k__)
  void __real_bsp_interrupt_dispatch(
    uint32_t             vector,
    CPU_Exception_frame *frame
  );

  void __wrap_bsp_interrupt_dispatch(
    uint32_t             vector,
    CPU_Exception_frame *frame
  );

  void __wrap_bsp_interrupt_dispatch(
    uint32_t             vector,
    CPU_Exception_frame *frame
  )
  {
    if ( interrupted_stack_at_multitasking_start == 0 ) {
      /*
       * The exception prologue builds the frame on the stack of the interrupted
       * context and switches to the interrupt stack afterwards, so the address
       * of the frame is an address within the interrupted stack.
       */
      interrupted_stack_at_multitasking_start = (uintptr_t) frame;
    }

    __real_bsp_interrupt_dispatch( vector, frame );
  }
  #endif

  #if defined(__microblaze__)
  void __real_bsp_interrupt_dispatch( uint32_t source );

  void __wrap_bsp_interrupt_dispatch( uint32_t source );

  void __wrap_bsp_interrupt_dispatch( uint32_t source )
  {
    if ( interrupted_stack_at_multitasking_start == 0 ) {
      const Per_CPU_Control *cpu_self;
      const uintptr_t       *frame;

      /*
       * The dispatch runs on the interrupt stack.  The frame at the top of that
       * stack holds the stack pointer of the interrupted context.
       */
      cpu_self = _Per_CPU_Get();
      frame = (const uintptr_t *) ( (uintptr_t) cpu_self->interrupt_stack_high -
        CPU_INTERRUPT_FRAME_SIZE + MICROBLAZE_ISR_STACK_FRAME_SP );
      interrupted_stack_at_multitasking_start = *frame;
    }

    __real_bsp_interrupt_dispatch( source );
  }
  #endif

  #if defined(__PPC__) || defined(__powerpc64__)
  void __real_bsp_interrupt_dispatch( void );

  void __wrap_bsp_interrupt_dispatch( void );

  void __wrap_bsp_interrupt_dispatch( void )
  {
    register uintptr_t sp __asm__( "14" );

    if ( interrupted_stack_at_multitasking_start == 0 ) {
      interrupted_stack_at_multitasking_start = sp;
    }

    __real_bsp_interrupt_dispatch();
  }
  #endif

  #if defined(__riscv)
  void __real__RISCV_Interrupt_dispatch(
    uintptr_t        mcause,
    Per_CPU_Control *cpu_self
  );

  void __wrap__RISCV_Interrupt_dispatch(
    uintptr_t        mcause,
    Per_CPU_Control *cpu_self
  );

  void __wrap__RISCV_Interrupt_dispatch(
    uintptr_t        mcause,
    Per_CPU_Control *cpu_self
  )
  {
    register uintptr_t sp __asm__( "s1" );

    if ( interrupted_stack_at_multitasking_start == 0 ) {
      interrupted_stack_at_multitasking_start = sp;
    }

    __real__RISCV_Interrupt_dispatch( mcause, cpu_self );
  }
  #endif

  #if defined(__sparc__)
  void __real__SPARC_Interrupt_dispatch( uint32_t irq );

  static RTEMS_USED void InterruptDispatch( uint32_t irq, uintptr_t sp )
  {
    if ( interrupted_stack_at_multitasking_start == 0 ) {
      interrupted_stack_at_multitasking_start = sp;
    }

    __real__SPARC_Interrupt_dispatch( irq );
  }

  __asm__ (
    "\t.section\t\".text\"\n"
    "\t.align\t4\n"
    "\t.globl\t__wrap__SPARC_Interrupt_dispatch\n"
    "\t.type\t__wrap__SPARC_Interrupt_dispatch, #function\n"
    "__wrap__SPARC_Interrupt_dispatch:\n"
    "\tmov\t%fp, %o1\n"
    "\tor\t%o7, %g0, %g1\n"
    "\tcall\tInterruptDispatch, 0\n"
    "\t or\t%g1, %g0, %o7\n"
    "\t.previous\n"
  );
  #endif

  /*
   * The interrupt prologue of these two ports leaves the frame base of the
   * interrupted context in the frame pointer register and may then switch to
   * the interrupt stack, so the value has to be taken before the compiler
   * establishes a frame of its own.  A register variable cannot do that.
   */
  #if defined(__i386__)
  void __real_BSP_dispatch_isr( int vector );

  static RTEMS_USED void InterruptDispatch( int vector, uintptr_t sp )
  {
    if ( interrupted_stack_at_multitasking_start == 0 ) {
      interrupted_stack_at_multitasking_start = sp;
    }

    __real_BSP_dispatch_isr( vector );
  }

  __asm__ (
    "\t.section\t\".text\"\n"
    "\t.align\t4\n"
    "\t.globl\t__wrap_BSP_dispatch_isr\n"
    "\t.type\t__wrap_BSP_dispatch_isr, @function\n"
    "__wrap_BSP_dispatch_isr:\n"
    "\tpushl\t%ebp\n"
    "\tpushl\t8(%esp)\n"
    "\tcall\tInterruptDispatch\n"
    "\taddl\t$8, %esp\n"
    "\tret\n"
    "\t.previous\n"
  );
  #endif

  #if defined(__x86_64__)
  void __real_amd64_dispatch_isr( rtems_vector_number vector );

  static RTEMS_USED void InterruptDispatch(
    rtems_vector_number vector,
    uintptr_t           sp
  )
  {
    if ( interrupted_stack_at_multitasking_start == 0 ) {
      interrupted_stack_at_multitasking_start = sp;
    }

    __real_amd64_dispatch_isr( vector );
  }

  __asm__ (
    "\t.section\t\".text\"\n"
    "\t.align\t8\n"
    "\t.globl\t__wrap_amd64_dispatch_isr\n"
    "\t.type\t__wrap_amd64_dispatch_isr, @function\n"
    "__wrap_amd64_dispatch_isr:\n"
    "\tmovq\t%rbp, %rsi\n"
    "\tjmp\tInterruptDispatch\n"
    "\t.previous\n"
  );
  #endif

  #if defined(__mips__)
  void __real_mips_vector_isr_handlers( CPU_Interrupt_frame *frame );

  void __wrap_mips_vector_isr_handlers( CPU_Interrupt_frame *frame );

  void __wrap_mips_vector_isr_handlers( CPU_Interrupt_frame *frame )
  {
    if ( interrupted_stack_at_multitasking_start == 0 ) {
      /*
       * The frame is built on the stack of the interrupted context, so its own
       * address is an address within that stack.  The stack pointer member of
       * the frame is not used: the interrupt path never fills it, only the path
       * which the debugger stub takes does.
       */
      interrupted_stack_at_multitasking_start = (uintptr_t) frame;
    }

    __real_mips_vector_isr_handlers( frame );
  }
  #endif

  static void ISRHandler( void *arg )
  {
    uintptr_t begin;
    uintptr_t end;

    (void) arg;

  #if defined(RTEMS_SMP) && !(defined(__PPC__) || (__powerpc64__))
    Per_CPU_Control *cpu_self;

    cpu_self = _Per_CPU_Get();
    begin = (uintptr_t) &cpu_self->Interrupt_frame;
    end = begin + sizeof( cpu_self->Interrupt_frame );
  #else
    Thread_Control *executing;

    executing = GetExecuting();
    begin = (uintptr_t) executing->Start.Initial_stack.area;
    end = begin + executing->Start.Initial_stack.size;
  #endif

    interrupted_stack_at_multitasking_start_is_valid =
      ( begin <= interrupted_stack_at_multitasking_start &&
        interrupted_stack_at_multitasking_start < end );
  }

  static CallWithinISRRequest isr_request = {
    .handler = ISRHandler
  };

  static void SubmitISRRequest( void )
  {
    CallWithinISRSubmit( &isr_request );
  }

  RTEMS_SYSINIT_ITEM(
    SubmitISRRequest,
    RTEMS_SYSINIT_DEVICE_DRIVERS,
    RTEMS_SYSINIT_ORDER_LAST
  );
test-target: testsuites/validation/tc-score-isr.c
