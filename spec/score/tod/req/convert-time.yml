test-support: |
  static uint32_t GetValue( TODTimeState state, uint32_t last )
  {
    switch ( state ) {
      case STATE_FIRST:
        return 0;
      case STATE_BETWEEN:
        return last / 2;
      case STATE_LAST:
        return last;
      case STATE_ABOVE:
        return last + 1;
      default:
        return UINT32_MAX;
    }
  }
