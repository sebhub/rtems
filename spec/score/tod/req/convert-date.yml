post-conditions:
- name: Result
  states:
  - name: Accept
    test-code: |
      T_true( ctx->accepted );
    text: |
      The directive call shall accept the time of day referenced by the `time_of_day`
      parameter.
  - name: Reject
    test-code: |
      T_false( ctx->accepted );
    text: |
      The directive call shall reject the time of day referenced by the `time_of_day`
      parameter.
  test-epilogue: null
  test-prologue: null
- name: Effect
  states:
  - name: Seconds
    test-code: |
      T_eq_i64( ctx->seconds, ctx->expected );
    text: |
      The directive call shall use the seconds since the
      ${/glossary/unix-epoch:/term} of the date and the time of the object referenced
      by the `time_of_day` parameter.
  - name: Nop
    test-code: |
      T_eq_i64( ctx->seconds, TOD_NO_EFFECT );
    text: |
      The directive call shall have no effect.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Year
  states:
  - name: Zero
    test-code: |
      ctx->year = YEAR_ZERO;
    text: |
      While the year of the object referenced by the `time_of_day` parameter is zero.
  - name: TooEarly
    test-code: |
      ctx->year = YEAR_TOO_EARLY;
    text: |
      While the year of the object referenced by the `time_of_day` parameter is
      greater than zero and less than 1988.
  - name: Earliest
    test-code: |
      ctx->year = YEAR_EARLIEST;
    text: |
      While the year of the object referenced by the `time_of_day` parameter is 1988.
  - name: Valid
    test-code: |
      ctx->year = YEAR_VALID;
    text: |
      While the year of the object referenced by the `time_of_day` parameter is
      greater than 1988 and less than 2400.
  - name: Latest
    test-code: |
      ctx->year = YEAR_LATEST;
    text: |
      While the year of the object referenced by the `time_of_day` parameter is 2400.
  - name: TooLate
    test-code: |
      ctx->year = YEAR_TOO_LATE;
    text: |
      While the year of the object referenced by the `time_of_day` parameter is
      greater than 2400 and less than the greatest value of type uint32_t.
  - name: Max
    test-code: |
      ctx->year = YEAR_MAX;
    text: |
      While the year of the object referenced by the `time_of_day` parameter is the
      greatest value of type uint32_t.
  test-epilogue: null
  test-prologue: null
- name: LeapYear
  states:
  - name: Common
    test-code: |
      ctx->leap_year = LEAP_YEAR_COMMON;
    text: |
      While the year of the object referenced by the `time_of_day` parameter is not
      divisible by four.
  - name: Leap4
    test-code: |
      ctx->leap_year = LEAP_YEAR_4;
    text: |
      While the year of the object referenced by the `time_of_day` parameter is
      divisible by four and not divisible by 100.
  - name: Century
    test-code: |
      ctx->leap_year = LEAP_YEAR_CENTURY;
    text: |
      While the year of the object referenced by the `time_of_day` parameter is
      divisible by 100 and not divisible by 400.
  - name: Leap400
    test-code: |
      ctx->leap_year = LEAP_YEAR_400;
    text: |
      While the year of the object referenced by the `time_of_day` parameter is
      divisible by 400.
  test-epilogue: null
  test-prologue: null
- name: Month
  states:
  - name: Zero
    test-code: |
      ctx->month = 0;
    text: |
      While the month of the object referenced by the `time_of_day` parameter is
      zero.
  - name: January
    test-code: |
      ctx->month = 1;
    text: |
      While the month of the object referenced by the `time_of_day` parameter is
      January.
  - name: February
    test-code: |
      ctx->month = 2;
    text: |
      While the month of the object referenced by the `time_of_day` parameter is
      February.
  - name: Between
    test-code: |
      ctx->month = 4;
    text: |
      While the month of the object referenced by the `time_of_day` parameter is
      after February and before December.
  - name: December
    test-code: |
      ctx->month = 12;
    text: |
      While the month of the object referenced by the `time_of_day` parameter is
      December.
  - name: Above
    test-code: |
      ctx->month = 13;
    text: |
      While the month of the object referenced by the `time_of_day` parameter is
      greater than 12 and less than the greatest value of type uint32_t.
  - name: Max
    test-code: |
      ctx->month = UINT32_MAX;
    text: |
      While the month of the object referenced by the `time_of_day` parameter is the
      greatest value of type uint32_t.
  test-epilogue: null
  test-prologue: null
- name: Day
  states:
  - name: Zero
    test-code: |
      ctx->day = DAY_ZERO;
    text: |
      While the day of the object referenced by the `time_of_day` parameter is zero.
  - name: First
    test-code: |
      ctx->day = DAY_FIRST;
    text: |
      While the day of the object referenced by the `time_of_day` parameter is one.
  - name: Between
    test-code: |
      ctx->day = DAY_BETWEEN;
    text: |
      While the day of the object referenced by the `time_of_day` parameter is
      greater than one and less than the last day of the month.
  - name: Last
    test-code: |
      ctx->day = DAY_LAST;
    text: |
      While the day of the object referenced by the `time_of_day` parameter is the
      last day of the month.
  - name: Above
    test-code: |
      ctx->day = DAY_ABOVE;
    text: |
      While the day of the object referenced by the `time_of_day` parameter is
      greater than the last day of the month and less than the greatest value of type
      uint32_t.
  - name: Max
    test-code: |
      ctx->day = DAY_MAX;
    text: |
      While the day of the object referenced by the `time_of_day` parameter is the
      greatest value of type uint32_t.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension Year covers the member year, 7 states. Dimension LeapYear covers the
  leap year rule of the proleptic Gregorian calendar, 4 states. Dimension Month
  covers the member month, 7 states. Dimension Day covers the member day, 6
  states. The documentation of rtems_time_of_day and of rtems_clock_set() gives
  the valid ranges. The latest time of day which rtems_clock_set() accepts is in
  the year 2400.

  Each dimension partitions the values of type uint32_t. Two states hold the
  least and the greatest value. Three states hold the first valid value, the
  values between and the last valid value. The other states hold the invalid
  values between the valid range and the greatest value. February is a state of
  its own, since its length depends on the leap year rule. The state Between of
  the month arranges April, a month of 30 days.

  The last day of the month depends on a valid month. The item skips the states
  of the day which refer to it, where the month is invalid. Some years fix the
  leap year class, so the item skips the other classes of these years.

  The item ${convert-time:/spec} states the time of the day. This item arranges a
  valid time of the day. The expected seconds derive from DaysFromCivil(), which
  implements an algorithm independent of RTEMS and of the C library.
requirement-type: functional
skip-reasons:
  NoMonth: |
    The month is invalid, so the month has no last day.
  YearClass: |
    The year fixes the leap year class.
test-action: |
  ctx->tod.year = GetYear( ctx->year, ctx->leap_year );
  ctx->tod.month = ctx->month;
  ctx->tod.day = GetDay( ctx->tod.year, ctx->month, ctx->day );
  ctx->tod.hour = 12;
  ctx->tod.minute = 30;
  ctx->tod.second = 30;
  ctx->tod.ticks = 0;
  ctx->expected = DaysFromCivil( ctx->tod.year, ctx->tod.month, ctx->tod.day ) *
                    86400 +
                  (int64_t) ctx->tod.hour * 3600 +
                  (int64_t) ctx->tod.minute * 60 + ctx->tod.second;
  ctx->seconds = TOD_NO_EFFECT;
  ctx->accepted = ( *ctx->call )( ctx->arg, &ctx->tod, &ctx->seconds );
