test-support: |
  /* A zero marks a class which the year does not have. */
  static const uint32_t years[ 7 ][ 4 ] = {
    { 0, 0, 0, 1 },
    { 1987, 1984, 1900, 1600 },
    { 0, 1988, 0, 0 },
    { 2023, 2096, 2100, 2000 },
    { 0, 0, 0, 2400 },
    { 2401, 2404, 2500, 2800 },
    { UINT32_MAX, 0, 0, 0 }
  };

  static uint32_t GetYear( TODDateYear year, TODDateLeapYear leap_year )
  {
    if ( year == YEAR_ZERO ) {
      return 0;
    }

    return years[ year ][ leap_year ];
  }

  static uint32_t GetDay( uint32_t year, uint32_t month, TODDateDay day )
  {
    uint32_t last;

    if ( day == DAY_ZERO ) {
      return 0;
    }

    if ( day == DAY_FIRST ) {
      return 1;
    }

    if ( day == DAY_MAX ) {
      return UINT32_MAX;
    }

    if ( month == 12 ) {
      last = 31;
    } else {
      last = (uint32_t) ( DaysFromCivil( year, month + 1, 1 ) -
                          DaysFromCivil( year, month, 1 ) );
    }

    if ( day == DAY_BETWEEN ) {
      return 15;
    }

    if ( day == DAY_LAST ) {
      return last;
    }

    return last + 1;
  }
test-target: testsuites/validation/tr-tod-convert-date.c
