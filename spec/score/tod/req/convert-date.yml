test-context-support: |
  typedef enum {
    YEAR_ZERO,
    YEAR_TOO_EARLY,
    YEAR_EARLIEST,
    YEAR_VALID,
    YEAR_LATEST,
    YEAR_TOO_LATE,
    YEAR_MAX
  } TODDateYear;

  typedef enum {
    LEAP_YEAR_COMMON,
    LEAP_YEAR_4,
    LEAP_YEAR_CENTURY,
    LEAP_YEAR_400
  } TODDateLeapYear;

  typedef enum {
    DAY_ZERO,
    DAY_FIRST,
    DAY_BETWEEN,
    DAY_LAST,
    DAY_ABOVE,
    DAY_MAX
  } TODDateDay;
