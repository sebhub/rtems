default:
- enabled-by: riscv/gr765
  value: true
- enabled-by: true
  value: false
description: |
  If set to true, then the CPU counter and the clock driver read the time CSR.
  Set it only if the processor executes a read of the time CSR without a trap
  and if all harts read the same value.  If set to false, then in machine mode
  the CPU counter and the clock driver read the mtime register of the CLINT.
enabled-by: riscv
format: '{}'
links: []
name: RISCV_USE_TIME_CSR
type: build
