non-functional-type: design
rationale: |
  A real-time operating system needs operations with a bounded runtime. An
  operation with a runtime of at most O(log n) keeps the bound low for a large
  element count.
references: []
requirement-type: non-functional
text: |
  A data structure of the super core with a variable count of totally ordered
  elements shall provide an operation to get the minimum element with a runtime
  of at most O(log n), where n is the element count.
type: requirement
