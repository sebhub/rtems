copyrights:
- Copyright (C) 1988, 2008 On-Line Applications Research Corporation (OAR)
default-value: 0
description: |
  The value of this configuration option defines the maximum number of Classic
  API Semaphore that can be concurrently active.
enabled-by: true
index-entries: []
interface-type: appl-config-option
links:
- role: interface-placement
  uid: domain
- role: interface-ingroup
  uid: group-classic
- role: constraint
  uid: ../constraint/min-zero
- role: constraint
  uid: ../constraint/max-obj
- role: constraint
  uid: ../constraint/memory-size
- role: constraint
  uid: ../constraint/unlimited
- role: reference
  uid: /ref/rtems/c-user/config-unlimited-objects
- role: reference
  uid: /ref/rtems/c-user/config-scheduler-table
- role: reference
  uid: /ref/rtems/c-user/mrsp
name: CONFIGURE_MAXIMUM_SEMAPHORES
notes: |
  This object class can be configured in unlimited allocation mode, see
  ${/ref/rtems/c-user/config-unlimited-objects:/name}.

  In SMP configurations, the size of a Semaphore Control Block depends on the
  scheduler count (see ${/ref/rtems/c-user/config-scheduler-table:/name}).  The semaphores
  using the ${/ref/rtems/c-user/mrsp:/name} need a ceiling priority per scheduler.
type: interface
