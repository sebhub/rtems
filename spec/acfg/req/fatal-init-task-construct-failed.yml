  uid: /score/interr/if/internal-error-core
- role: interface-function
  uid: /score/interr/if/init-task-construct-failed
- role: validation
  uid: init-task-priority
rationale: null
requirement-type: functional
test-brief: |
  This validation test suite contains a test case which triggers the fatal error
  of the ${/score/interr/if/internal-error-core:/name} fatal source with the
  ${/score/interr/if/init-task-construct-failed:/name} fatal code during system
  initialization.
test-case-code: |
  T_eq_int( source, INTERNAL_ERROR_CORE );
  T_eq_ulong( code, INTERNAL_ERROR_RTEMS_INIT_TASK_CONSTRUCT_FAILED );

  /*
   * Check that the ${../if/init-task-priority:/name} application configuration
   * option resulted in the expected system setting.
   */
  T_eq_u32( _RTEMS_tasks_User_task_config.config.initial_priority, 0 );
test-description: |
  The application configuration defines the priority of the Classic API
  initialization task as zero. Zero is no valid task priority, so the task
  construction fails. The test ends with a failure if the initialization task
  starts.
test-includes:
- rtems.h
- rtems/rtems/tasksdata.h
test-local-includes: []
test-support: |
  static void Init( rtems_task_argument arg )
  {
    (void) arg;
    ExitWithFailure( "the initialization task started" );
  }

  #define CONFIGURE_APPLICATION_DOES_NOT_NEED_CLOCK_DRIVER

  #define CONFIGURE_MAXIMUM_TASKS 1

  #define CONFIGURE_MINIMUM_TASKS_WITH_USER_PROVIDED_STORAGE 1

  #define CONFIGURE_INIT_TASK_PRIORITY 0

  #define CONFIGURE_INIT_TASK_CONSTRUCT_STORAGE_SIZE RTEMS_MINIMUM_STACK_SIZE

  #define CONFIGURE_RTEMS_INIT_TASKS_TABLE

  #define CONFIGURE_STACK_CHECKER_ENABLED

  #define CONFIGURE_IDLE_TASK_STORAGE_SIZE RTEMS_MINIMUM_STACK_SIZE
test-target: testsuites/validation/ts-fatal-init-task-construct-failed.c
text: |
  Where the application was configured to construct the RTEMS initialization task
  using ${../if/init-task-construct-storage-size:/name}, while the system is
  initialized, if the task construction fails, then the system shall terminate
  with the ${/score/interr/if/internal-error-core:/name} fatal source and the
  ${/score/interr/if/init-task-construct-failed:/name} fatal code.
type: requirement
