test-actions:
- action-brief: |
    Set the name of the calling thread to strings of the length of the maximum
    thread name size and of the length of the maximum thread name size minus one.
  action-code: |
    size_t    size;
    char      name[ 64 ];
    pthread_t self;
    int       eno_size;
    int       eno_size_minus_one;

    size = _Thread_Maximum_name_size;
    T_assert_lt_sz( size, sizeof( name ) );
    self = pthread_self();

    memset( name, 'n', size );
    name[ size ] = '\0';
    eno_size = pthread_setname_np( self, name );

    if ( size > 0 ) {
      name[ size - 1 ] = '\0';
      eno_size_minus_one = pthread_setname_np( self, name );
    } else {
      eno_size_minus_one = 0;
    }

    (void) pthread_setname_np( self, "" );
  checks:
  - brief: |
      Check that a name of the length of the maximum thread name size does not fit.
    code: |
      T_eq_int( eno_size, ERANGE );
    links:
    - role: validation
      uid: ../req/max-thread-name-size
  - brief: |
      Check that a name of the length of the maximum thread name size minus one fits,
      where the maximum thread name size is greater than zero.
    code: |
      if ( size > 0 ) {
        T_eq_int( eno_size_minus_one, 0 );
      }
    links:
    - role: validation
      uid: ../req/max-thread-name-size
  links: []
test-brief: |
  Tests the maximum thread name size which the
  ${/acfg/if/max-thread-name-size:/name} application configuration option
  defines.
