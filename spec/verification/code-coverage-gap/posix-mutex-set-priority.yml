text: |
  The uncovered code handles a mutex without an owner. The only caller of
  \_POSIX_Mutex_Set_priority() is pthread_mutex_setprioceiling(). It locks the
  mutex before the call, so the calling thread owns the mutex and the owner is
  never NULL. See ${/c/pthread/req/mutex-setprioceiling:/spec}.
