# Themis exports all items of an eb/qual commit with the tools which the
# commit pins.  The inspection of a pull request restores the result for its
# base.  The inspection itself exports only the items of the change set, so
# it misses a generated file which a commit of the base left stale.
#
# A commit determines its result.  The key holds the commit and the format
# version of the result, and no entry replaces another.
name: Themis
on:
  push:
    branches:
    - eb/qual
  workflow_dispatch:
    inputs:
      commit:
        description: The eb/qual commit to export, the tip by default
        required: false
        default: ""
concurrency:
  # Each commit needs its own entry, so no run cancels another.
  group: ${{ github.workflow }}-${{ inputs.commit || github.sha }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  themis:
    name: Themis
    # A pull request restores only the entries of the branch it targets.
    if: ${{ github.ref == 'refs/heads/eb/qual' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Resolve the commit
      id: commit
      # The export runs the tools which the commit pins.  Only a commit of
      # eb/qual pins trusted tools.
      env:
        COMMIT: ${{ inputs.commit || github.sha }}
      run: |
        sha="$(git rev-parse --verify --end-of-options "${COMMIT}^{commit}")"
        if ! git merge-base --is-ancestor "${sha}" HEAD; then
          echo "::error::The commit ${sha} is not in eb/qual."
          exit 1
        fi
        echo "sha=${sha}" >>"${GITHUB_OUTPUT}"
    - name: Restore the export result
      id: restore
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: tmp/inspect-changes/export-v1-${{ steps.commit.outputs.sha }}.json
        key: inspect-export-v1-${{ steps.commit.outputs.sha }}
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.12"
    - name: Set up uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        enable-cache: true
        save-cache: false
        version: 0.11.9
    - name: Install the tools
      run: uv sync --frozen
    - name: Export all items
      id: export
      # A dirty tree gets its entry too, so this step records the verdict and
      # the last step fails.
      env:
        SHA: ${{ steps.commit.outputs.sha }}
      run: |
        if uv run --frozen python3 .github/inspect_changes.py \
          --export-only="${SHA}"; then
          echo "clean=true" >>"${GITHUB_OUTPUT}"
        else
          echo "clean=false" >>"${GITHUB_OUTPUT}"
        fi
    - name: Save the export result
      if: ${{ steps.restore.outputs.cache-hit != 'true' && hashFiles(format('tmp/inspect-changes/export-v1-{0}.json', steps.commit.outputs.sha)) != '' }}
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: tmp/inspect-changes/export-v1-${{ steps.commit.outputs.sha }}.json
        key: inspect-export-v1-${{ steps.commit.outputs.sha }}
    - name: Check the export result
      if: ${{ steps.export.outputs.clean != 'true' }}
      run: |
        echo "::error::The export does not reproduce the tree.  See the step which exports all items."
        exit 1
