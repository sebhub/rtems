SPDX-License-Identifier: CC-BY-SA-4.0 OR BSD-2-Clause
command:
- ${../deployment/sis:/directory}/bin/sis
- -gr765rv
- -dumbio
- -r
- enabled-by: RTEMS_SMP
  value:
  - -m
  - '8'
- ${.:/test-executable}
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
default-timeout-in-seconds: 180.0
description: |
  Run the tests of the gr765 BSP on the ${/glossary/sis:/term}.  The
  -gr765rv mode of SIS models the GR765 in NOEL-V mode.  An SMP test runs on
  the eight processors of the chip.
discard-patterns: []
do-not-run: []
enabled-by: riscv/gr765
links:
- role: proxy-member
  uid: simulator
- role: weak-package-build-dependency
  uid: ../deployment/sis
max-process-count: 1
max-retry-count-per-executable: 1
min-timeout-in-seconds: 20.0
name: SPARC/RISCV Instruction Simulator [-gr765rv]
params: {}
pkg-type: test-runner
test-runner-type: subprocess
timeout-scaler: 4.0
type: pkg
